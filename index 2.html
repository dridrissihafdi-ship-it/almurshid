  paintRun()}
function togglePause(){if(!run||run.done)return;run.paused=!run.paused;run.last=Date.now();if(!run.paused)audio();render()}
function stopRun(){clearInterval(runTimer);run=null;keepAwake(false)}
const fmtMs=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function paintRun(){const r=document.getElementById('dr-ring'),t=document.getElementById('dr-time'),tt=document.getElementById('dr-total');if(!r||!run)return;
  const cur=run.list[run.i],left=cur.ms-run.el,C=2*Math.PI*96;r.style.strokeDashoffset=C*(left/cur.ms);t.textContent=fmtMs(left);
  const totalLeft=run.list.slice(run.i+1).reduce((a,d)=>a+d.ms,0)+left;tt.innerHTML=Tx('المتبقي من المجموعة')+' <span dir="ltr">'+fmtMs(totalLeft)+'</span>'}
function viewDhikrRun(){
  if(!run)return `<section class="box pad"><p class="muted">لا توجد جلسة ذكر جارية.</p><div class="btns"><button class="btn ok" data-dstart="1">ابدأ الذكر الشخصي</button><button class="btn" data-go="aamal">رجوع</button></div></section>`;
  if(run.done){const ok=dayLog().awrad.includes('dhikr');
    return `<section class="dr dr-done"><div class="dr-check">✓</div><h2>تمّت مجموعة الذكر</h2><p>${ar2(run.list.length)} ${run.list.length>2&&run.list.length<11?'أذكار':'ذكر'} · ${ar2(Math.max(1,Math.round(run.list.reduce((a,d)=>a+d.ms,0)/60000)))} دقيقة</p>
     ${ok?'<p class="logged" style="color:#bfe6d2">✓ أكّدت الذكر الشخصي اليوم، وقلبك مستنير ٢٤ ساعة</p>':'<button class="btn big dr-confirm" data-dconfirm="1">أكّدت الذكر الشخصي</button>'}
     <div class="btns" style="justify-content:center"><button class="btn small" data-dend="1">رجوع إلى الأعمال</button></div></section>`}
  const cur=run.list[run.i],nx=run.list[run.i+1],C=2*Math.PI*96;
  return `<section class="dr${run.paused?' paused':''}" data-drpad="1">
   <div class="dr-step">الذكر ${ar2(run.i+1)} من ${ar2(run.list.length)}</div>
   <div class="dr-dots">${run.list.map((d,k)=>`<i class="${k<run.i?'d':k===run.i?'c':''}"></i>`).join('')}</div>
   <p class="dr-text" dir="auto">${esc(cur.text)}</p>
   <div class="dr-ringbox"><svg viewBox="0 0 220 220" aria-hidden="true"><circle cx="110" cy="110" r="96" class="dr-bg"/><circle id="dr-ring" cx="110" cy="110" r="96" class="dr-fg" stroke-dasharray="${C}" stroke-dashoffset="${C*((cur.ms-run.el)/cur.ms)}"/></svg>
    <div class="dr-center"><b id="dr-time">${fmtMs(cur.ms-run.el)}</b><span>${run.paused?'متوقف':'جارٍ'}</span></div></div>
   <p class="dr-hint">${run.paused?'المس الشاشة للمتابعة':'المس الشاشة لإيقاف العدّاد'}</p>
   <p class="dr-total" id="dr-total"></p>
   ${nx?`<p class="dr-next"><span>التالي:</span> <span class="notr" dir="auto">${esc(nx.text)}</span></p>`:'<p class="dr-next">هذا آخر ذكر في المجموعة</p>'}
   ${run.paused?`<div class="btns dr-btns"><button class="btn small" data-dskip="1">انتقل إلى التالي</button><button class="btn small" data-dend="1">إنهاء الجلسة</button></div>`:''}
  </section>`;
}
document.addEventListener('pointerdown',e=>{if(screen!=='dhikr_run'||!run||run.done)return;if(e.target.closest('button'))return;if(!e.target.closest('.dr,#app'))return;e.preventDefault();togglePause()});
document.addEventListener('toggle',e=>{if(e.target.classList&&e.target.classList.contains('dl-det'))dlOpen=e.target.open},true);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&run&&!run.done){if(!run.paused)tick();if(screen==='dhikr_run')keepAwake(true)}});
const VIEWS={method:viewMethod,tazkiya:viewTazkiya,muraqabat:viewMuraqabat,sura:viewSura,aamal:viewAamal,dhikr_run:viewDhikrRun,adh_sabah:()=>viewAdhkar('sabah'),adh_masa:()=>viewAdhkar('masa'),install:viewInstall,notif:viewNotif,profile:viewProfile};
function render(){
  const app=document.getElementById('app');
  app.innerHTML=screen==='home'?viewHome():heroSub(screen)+`<main class="sheet">${VIEWS[screen]()}</main>`;
  const navKey=screen.startsWith('adh_')||screen==='dhikr_run'?'aamal':['home','notif','aamal','profile'].includes(screen)?screen:'home';
  document.querySelectorAll('[data-nav]').forEach(b=>b.toggleAttribute('aria-current',b.dataset.nav===navKey)||b.dataset.nav===navKey&&b.setAttribute('aria-current','page'));
  document.querySelectorAll('[data-nav]').forEach(b=>{if(b.dataset.nav===navKey)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  const rtl=LANG==='ar',nav=document.querySelector('nav.tabs');
  [app,nav].forEach(el=>{el.dir=rtl?'rtl':'ltr';el.lang=LANG});document.documentElement.lang=LANG;document.documentElement.dir=rtl?'rtl':'ltr';
  document.title=['المرشد','Al-Murshid','Al-Murshid','Al-Murshid','Аль-Муршид'][rtl?0:LIDX[LANG]+1];
  nav.querySelectorAll('[data-nav]').forEach(b=>{b.dataset.al=b.dataset.al||b.getAttribute('aria-label');b.setAttribute('aria-label',b.dataset.al)});
  i18nApply(app);i18nApply(nav);
  nav.hidden=screen==='dhikr_run';
  if(screen==='dhikr_run')paintRun();
  document.getElementById('badge').hidden=!(pendingOrgans().length||!lights().halo);
}
function go(s){if(s!=='dhikr_run'&&run&&!run.done&&screen==='dhikr_run'){/* keep running in background */}screen=s;lightConfirm=null;confirmFor=null;confirmReset=false;redoFor=null;render();window.scrollTo(0,0)}
function logOrgan(id,ok,reason){
  const o=S.organs[id];o.broken=false;
  if(ok){if(o.days===0&&(!o.attemptStart||o.attemptStart>TODAY))o.attemptStart=TODAY;
    o.days++;if(o.days>=30){if(o.phase==='tathir'){o.phase='tanwir';o.days=0;o.attempt=1;o.attemptStart=addDays(TODAY,1)}else{o.phase='done';o.days=30}}}
  else{o.slips.push({date:TODAY,phase:o.phase,day:o.days,reason:(reason||'').trim()});o.days=0;o.resets++;o.attempt++;o.attemptStart=addDays(TODAY,1)}
  o.last=TODAY;o.today=ok?'ok':'slip';confirmFor=null;save();render();
}
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;const d=t.dataset;
  if(d.lang){LANG=d.lang;S.lang=LANG;save();computeHijri();return render()}
  if(d.nav)return go(d.nav);
  if(d.adhkar){e.preventDefault();return go('adh_'+d.adhkar)}
  if(d.pray){e.preventDefault();setPrayer(d.pray);const y=window.scrollY;render();window.scrollTo(0,y);return}
  if(d.go)return go(d.go);
  if(d.ok)return logOrgan(d.ok,true);
  if(d.slip){confirmFor=d.slip;return render()}
  if(d.slipyes){const n=document.getElementById('slipnote-'+d.slipyes);return logOrgan(d.slipyes,false,n?n.value:'')}
  if(d.slipno){confirmFor=null;return render()}
  if(d.start){Object.assign(S.organs[d.start],{phase:'tathir',days:0,last:null,today:null,attempt:1,attemptStart:TODAY});save();return render()}
  if(d.redo){redoFor={id:d.redo,kind:d.kind};confirmFor=null;return render()}
  if(d.redono){redoFor=null;return render()}
  if(d.redoyes){const o=S.organs[d.redoyes],n=document.getElementById('redonote-'+d.redoyes),k=redoFor.kind;
    (o.history=o.history||[]).push({date:TODAY,kind:k,from:o.phase,day:o.days,reason:n?n.value.trim():''});
    Object.assign(o,{phase:k,days:0,last:null,today:null,broken:false,attempt:1,attemptStart:TODAY,cycle:(o.cycle||1)+1});
    redoFor=null;save();return render()}
  if(d.adh!==undefined&&screen.startsWith('adh_')){const k=screen.slice(4),st=adhState(k),a=adhList(k)[+d.adh];
    if(st[+d.adh]<a.n){st[+d.adh]++;save();const y=window.scrollY;render();window.scrollTo(0,y);
      if(st[+d.adh]>=a.n){const nx=document.querySelector('.adh:not(.full)');if(nx&&nx.getBoundingClientRect().top>window.innerHeight*.6)nx.scrollIntoView({behavior:'smooth',block:'center'})}}return}
  if(d.adhsize){adhSize=Math.max(16,Math.min(30,adhSize+2*(+d.adhsize)));try{localStorage.setItem('murshid-adh-size',adhSize)}catch(x){};const y=window.scrollY;render();window.scrollTo(0,y);return}
  if(d.adhreset){const k=screen.slice(4);dayLog().ad[k]=adhList(k).map(()=>0);save();return render()}
  if(d.adhconfirm!==undefined){const k=screen.slice(4);applyWird(k,d.adhconfirm==='1');const y=window.scrollY;render();window.scrollTo(0,y);return}
  if(d.dstart){if(run&&!run.done)return go('dhikr_run');return startRun()}
  if(d.dskip){run.i++;run.el=0;run.last=Date.now();run.paused=false;if(run.i>=run.list.length){run.done=true;run.i=run.list.length-1;run.el=run.list[run.i].ms;clearInterval(runTimer);soundEnd();keepAwake(false)}else soundStep();return render()}
  if(d.dend){stopRun();return go('aamal')}
  if(d.dconfirm){applyWird('dhikr',true);return render()}
  if(d.dladd){dlOpen=true;dlList().push({text:'',min:10});save();render();const n=document.querySelectorAll('[data-dlt]');n[n.length-1]&&n[n.length-1].focus();return}
  if(d.dldel!==undefined){dlList().splice(+d.dldel,1);save();return render()}
  if(d.dlup!==undefined||d.dldown!==undefined){const l=dlList(),i=+(d.dlup??d.dldown),j=d.dlup!==undefined?i-1:i+1;if(j<0||j>=l.length)return;[l[i],l[j]]=[l[j],l[i]];save();return render()}
  if(d.light)return setLight(d.light,true);
  if(d.unlight)return setLight(d.unlight,false);
  if(d.lightask){lightConfirm=d.lightask;return render()}
  if(d.lightno){lightConfirm=null;return render()}
  if(d.install&&installEvt){installEvt.prompt();installEvt.userChoice.finally(()=>{installEvt=null;render()});return}
  if(d.export){const code=JSON.stringify(S);
    navigator.clipboard.writeText(code).then(()=>{transferMsg='نُسخ رمز بياناتك. الصقه الآن في التطبيق المثبّت.';render()})
      .catch(()=>{const t=document.getElementById('importCode');t.value=code;t.select();transferMsg='!لم يُسمح بالنسخ التلقائي. الرمز محدّد في الخانة: انسخه يدويًا.';
        const m=document.createElement('p');m.className='logged bad';m.textContent=transferMsg.slice(1);t.after(m)});return}
  if(d.import){const t=document.getElementById('importCode');
    try{const v=JSON.parse(t.value.trim());if(!v||!v.organs||!v.log)throw 0;S=v;
      ORGANS.forEach(g=>{if(!S.organs[g.id])S.organs[g.id]=blankOrgan()});if(!S.marks)S.marks=emptyMarks();
      save();transferMsg='استُورِدت بياناتك بنجاح.'}catch(e){transferMsg='!الرمز غير صالح. انسخه كاملًا من النسخة الأخرى ثم أعد المحاولة.'}
    return render()}
  if(d.khundo){S.marks.khalwa.pop();save();return render()}
  if(d.lightyes){S.marks.khalwa.push({ts:Date.now(),type:d.lightyes});lightConfirm=null;save();return render()}
  if(d.heart){dayLog().heart=+d.heart;save();return render()}
  if(d.reset){confirmReset=true;return render()}
  if(d.resetno){confirmReset=false;return render()}
  if(d.resetyes){S=freshState(S.name);confirmReset=false;save();return render()}
});
function applyWird(w,on){
  const L=dayLog();
  L.awrad=on?[...new Set([...L.awrad,w])]:L.awrad.filter(x=>x!==w);
  const p=period(),M=S.marks;
  if((w==='sabah'||w==='masa')&&p.kind===w&&(p.key===nowStr()||w==='masa')){if(on)M[w][p.key]=Date.now();else delete M[w][p.key]}
  if(w==='quran'||w==='dhikr'){M[w]=M[w].filter(x=>ds(new Date(x))!==nowStr());if(on)M[w].push(Date.now())}
  save();
}
document.addEventListener('change',e=>{
  const w=e.target.dataset&&e.target.dataset.wird;if(!w)return;const L=dayLog();
  if(w==='salat')L.prayers=e.target.checked?FIVE.map(f=>f[0]):[];
  applyWird(w,e.target.checked);
  if(screen==='aamal')return render();
  const c=document.getElementById('wcount');if(c)c.textContent=AWRAD.filter(a=>L.awrad.includes(a.id)).length+' / '+AWRAD.length;
});
document.addEventListener('input',e=>{
  if(e.target.id==='dhikrText'){S.marks.dhikrText=e.target.value;save()}
  if(e.target.dataset.dlt!==undefined){dlList()[+e.target.dataset.dlt].text=e.target.value;save()}
  if(e.target.dataset.dlm!==undefined){const v=Math.max(0,Math.min(180,parseFloat(e.target.value)||0));dlList()[+e.target.dataset.dlm].min=v;save();const h=document.querySelector('.dl-tot');if(h)h.textContent=ar2(dlTotal())}
  if(e.target.id==='note'){dayLog().note=e.target.value;save()}
  if(e.target.id==='pname'){S.name=e.target.value;save()}
});
let lastSig='';setInterval(()=>{if(screen!=='muraqabat'||document.activeElement&&document.activeElement.id==='dhikrText')return;const l=lights(),sig=[l.p.key,l.p.kind,l.halo,l.head,l.heart,l.body].join();if(lastSig&&sig!==lastSig)render();lastSig=sig},30000);
setInterval(()=>{const c=document.getElementById('clock');if(c){const n=new Date();c.textContent=pad(n.getHours())+':'+pad(n.getMinutes())}},15000);
render();
</script>
