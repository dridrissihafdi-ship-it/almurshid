<div class="tq-head">
 <h2>La Vía muhammadiana</h2>
 <p class="tq-sub">Seguir al Profeta ﷺ en lo exterior y lo interior: definición, fundamentos, capítulos y cómo realizarla</p>
 <p class="tq-src">Las normas detalladas y los puntos de divergencia se consultan con la gente de conocimiento.</p>
</div>

<div class="tq-map" aria-label="Mapa de la vía">
 <span>Seguimiento y moderación</span><i>→</i><span>Creencia correcta</span><i>→</i><span>Conocimiento del propio estado</span><i>→</i><span>Taqwa</span><i>→</i><span>Purificar corazón y órganos</span><i>→</i><span>Rectitud y complacencia de Dios</span>
</div>

<details open><summary>1. Definición y fin de la Vía muhammadiana</summary>
 <p><b>La Vía muhammadiana</b> es seguir al Mensajero de Dios ﷺ en la creencia, las palabras, el carácter y los actos, y tomar su guía como la balanza con la que el caminante corrige lo exterior y lo interior de sus obras.</p>
 <ul>
  <li><b>Su fin:</b> la complacencia de Dios Altísimo y el éxito en la otra vida.</li>
  <li><b>Sus medios:</b> el conocimiento, la acción, la taqwa (conciencia de Dios) y la purificación del alma.</li>
  <li><b>Su propósito:</b> que cada caminante contraste sus obras con el camino del Profeta y distinga así lo correcto de lo erróneo.</li>
 </ul>
 <h4>Dos males que trata la vía</h4>
 <ul>
  <li><b>El devoto sin conocimiento:</b> se esfuerza en la adoración ignorando las normas de la religión, y así sobrepasa sus límites.</li>
  <li><b>El sabio sin práctica:</b> conoce la norma pero descuida actuar según ella.</li>
 </ul>
 <p>Por eso la vía une tres cosas: <b>conocimiento correcto, voluntad sincera y conducta recta</b>.</p>
 <h4>El sentido de la purificación</h4>
 <ul>
  <li><b>Vaciar (takhliya):</b> liberar el corazón de los rasgos censurables.</li>
  <li><b>Adornar (tahliya):</b> embellecerlo con rasgos loables.</li>
  <li><b>Guardar los órganos:</b> preservar los miembros del pecado hasta que la rectitud sea una disposición firme.</li>
 </ul>
 <p class="tq-note">El dhikr y la adoración son medios que fortalecen la rectitud; nunca se separan de la honradez en el trato ni del respeto a los derechos de los demás.</p>
</details>

<details><summary>2. Los tres fundamentos que obligan al caminante</summary>
 <p>Lo que incumbe al caminante se resume en tres: <b>la creencia correcta, el conocimiento del propio estado y la taqwa</b>. Son los fundamentos y pilares prácticos de la vía.</p>
 <h4>Primer fundamento: la creencia correcta</h4>
 <p>Conocer la perfección que corresponde a Dios y la imperfección de la que está exento; creer en el mensaje, la revelación, el Último Día y el decreto; y corregir las ideas religiosas. No se pretende consenso donde los sabios difieren.</p>
 <h4>Segundo fundamento: el conocimiento del propio estado</h4>
 <p>Aprender lo que el caminante necesita para establecer su religión en su realidad:</p>
 <ul>
  <li>La purificación, la oración y el ayuno, y el zakat y el hayy cuando son obligatorios.</li>
  <li>Las normas de su oficio, su comercio y su familia, según su situación.</li>
  <li>Conocer las enfermedades de su corazón y sus remedios.</li>
 </ul>
 <p class="tq-note">El conocimiento necesario no se sustituye acumulando información que no cambia la práctica.</p>
 <h4>Tercer fundamento: la taqwa</h4>
 <p>Obedecer lo ordenado y evitar lo prohibido, por dentro y por fuera. Incluye dejar lo prohibido y cumplir lo obligatorio, pues abandonar una obligación es en sí una transgresión. Los tres fundamentos vuelven todos a la taqwa, que abarca el conocimiento necesario, la creencia correcta y la acción.</p>
</details>

<details><summary>3. Capítulo primero: el seguimiento y la moderación</summary>
 <h4>Sección 1: Aferrarse al Corán y a la Sunna</h4>
 <p>El Corán y la Sunna son la referencia de la creencia, la adoración y la conducta. La recitación va unida a la reflexión y la práctica, y el amor al Profeta ﷺ va unido a seguirle. El consenso y la analogía remiten a estas dos fuentes: volver a la revelación no significa anular el fiqh ni prescindir de sus sabios.</p>
 <p><b>En la práctica:</b></p>
 <ul>
  <li>Aprende las obligaciones y Sunnas que necesitas.</li>
  <li>Verifica las normas de tus prácticas de adoración.</li>
  <li>Pregunta a la gente de conocimiento cuando algo no esté claro.</li>
  <li>Somete tus palabras y tus sentimientos espirituales a la Ley.</li>
 </ul>
 <p class="tq-note">Nunca tomes un sueño, una revelación interior o el estado de un maestro como argumento para dejar una obligación o cometer algo prohibido.</p>

 <h4>Sección 2: Guardarse de las innovaciones y las malas costumbres</h4>
 <p>Se distingue el sentido lingüístico de la innovación (bid'a) de su sentido legal, y las costumbres de los actos de adoración. No todo medio nuevo de vida es una adoración inventada. Las revelaciones interiores, los prodigios y la visión de los profetas nunca justifican contradecir la Ley, y los maestros de la vía coinciden en la necesidad del seguimiento.</p>
 <p><b>En la práctica:</b></p>
 <ul>
  <li>Examina el origen y el contenido de una práctica, y la obligación o el mérito especial que se le atribuye.</li>
  <li>Distingue un medio organizativo de un acto de adoración.</li>
  <li>Verifica antes de generalizar normas en cuestiones de iytihad.</li>
 </ul>
 <p class="tq-note">El criterio es que el acto sea legítimo, no solo habitual o conmovedor.</p>

 <h4>Sección 3: La moderación en las obras</h4>
 <p>Ni exceso ni descuido. La adoración tiene en cuenta la capacidad, la constancia y los derechos de uno mismo, la familia y los demás. Lo que se narra de los grandes esfuerzos de algunos antiguos cede ante lo establecido de la guía profética, y un relato no verificado no sirve para imponer su dureza a todos.</p>
 <p><b>En la práctica:</b></p>
 <ul>
  <li>Pon las obligaciones primero.</li>
  <li>Elige obras voluntarias que puedas mantener.</li>
  <li>Revisa el efecto de tu programa en tus deberes, tu salud y tu trabajo.</li>
 </ul>
 <p class="tq-note">El cansancio no es un fin en sí mismo, y la adoración nunca debe hacerte descuidar otro deber.</p>
</details>

<details><summary>4. Capítulo segundo: la creencia y el conocimiento</summary>
 <p>Los asuntos importantes de la Ley muhammadiana son tres: la creencia, las ciencias y la taqwa, a la que se dedican las dos partes siguientes.</p>
 <h4>Sección 1: La creencia correcta</h4>
 <p>Abarca las siguientes cuestiones:</p>
 <ul>
  <li>La unicidad divina y los atributos de Dios, el Corán y la profecía.</li>
  <li>Los actos de los siervos y su libre elección; el decreto, el plazo de la vida y el sustento.</li>
  <li>El barzaj, la Resurrección, la recompensa y el castigo.</li>
  <li>El Viaje Nocturno y la Ascensión, y los signos de la Hora.</li>
  <li>Los pecados y el rango de los Compañeros.</li>
  <li>Cuestiones relacionadas con la comunidad musulmana y las normas religiosas.</li>
 </ul>
 <p><b>Cómo realizarlo:</b></p>
 <ul>
  <li>Aprende la fe de fuentes fiables.</li>
  <li>Une reverencia, amor, temor y esperanza.</li>
  <li>Busca aumentar la certeza.</li>
  <li>Evita debates para los que no tienes herramientas.</li>
 </ul>
 <p class="tq-note">No conviertas estas cuestiones en juicios sobre la fe de personas concretas.</p>

 <h4>Sección 2: Las ciencias buscadas para otros fines</h4>
 <p>Las ciencias son de tres clases:</p>
 <ul>
  <li><b>Ordenadas:</b> las obligaciones individuales ligadas a la situación de cada uno, y las obligaciones colectivas que la comunidad necesita.</li>
  <li><b>Prohibidas:</b> como la magia, lo que lleva al extravío o al daño, y la polémica artificiosa. La crítica de la teología especulativa, la astrología y ciertas ciencias se entiende en su contexto, y no se extiende a las ciencias útiles ni a los estudios modernos por un simple nombre.</li>
  <li><b>Recomendadas:</b> la ampliación útil del conocimiento, conocer las Sunnas, las virtudes y los buenos modales, y completar lo que la comunidad ya cubre.</li>
 </ul>
 <p><b>Cómo realizarlo:</b></p>
 <ul>
  <li>Determina lo que te incumbe ahora y apréndelo de quienes lo dominan.</li>
  <li>Actúa según lo que has aprendido.</li>
  <li>Después amplía hacia lo que es útil.</li>
  <li>Corrige tu intención al aprender y enseñar: el fin no es ganar discusiones, ni la fama, ni el rango ante la gente.</li>
 </ul>
</details>

<details><summary>5. La taqwa (1): reformar el corazón</summary>
 <p>La taqwa es el fundamento más completo; tiene su mérito, su significado y sus cauces. <b>La taqwa</b> es proteger el alma de lo que le daña en la otra vida, y se logra tanto haciendo como absteniéndose.</p>
 <p>Sus cauces prácticos:</p>
 <ul>
  <li>Guardar el corazón.</li>
  <li>Guardar la lengua, los oídos, los ojos, las manos, el vientre, las partes íntimas y los pies.</li>
  <li>Guardar el cuerpo en general.</li>
 </ul>
 <p class="tq-note">Son los órganos que trabajas en purificar en la sección «Purificación».</p>
 <p>El corazón dirige los órganos, por eso recibe el mayor cuidado. <b>El carácter</b> es una disposición de la que los actos brotan con facilidad, y puede cambiar mediante la educación y la repetición. El alma tiene tres facultades: la percepción, la ira y el deseo. Las raíces de las virtudes son cuatro:</p>
 <table class="tq-t">
  <tr><th>Raíz</th><th>Su sentido educativo</th></tr>
  <tr><td>La sabiduría</td><td>Percibir lo correcto y orientar bien el conocimiento</td></tr>
  <tr><td>El valor</td><td>Dominar la ira, y atreverse cuando corresponde sin temeridad ni cobardía</td></tr>
  <tr><td>La castidad</td><td>Dominar el deseo según la Ley, sin avidez y sin suprimir lo debido</td></tr>
  <tr><td>La justicia</td><td>La armonía de las facultades y las virtudes, y dar a cada derecho lo suyo sin injusticia</td></tr>
 </table>
 <h4>El método general de tratamiento</h4>
 <ol>
  <li>Conoce la enfermedad: su realidad, su daño y sus causas, y la virtud opuesta con sus beneficios.</li>
  <li>Búscala en ti, sin justificar siempre tu conducta.</li>
  <li>Aprovecha a un amigo sincero que te avise, y la crítica válida aunque venga de quien no te quiere.</li>
  <li>Haz del trato de la gente contigo un espejo que revele los defectos de tu conducta.</li>
  <li>Identifica la causa y elimínala, luego ejercita la conducta opuesta al vicio.</li>
  <li>Repite hasta que arraigue, y después protégela con la buena compañía, el conocimiento y la práctica.</li>
  <li>Cuida el equilibrio, para no pasar de un vicio a su extremo opuesto igualmente censurable.</li>
 </ol>
 <p class="tq-note">En los ejercicios espirituales y el examen de uno mismo rige la moderación: nunca deben convertirse en hambre, privación o daño a uno mismo.</p>
 <h4>Ejemplos concretos de tratamiento</h4>
 <table class="tq-t">
  <tr><th>Enfermedad</th><th>Remedio y práctica</th></tr>
  <tr><td>La ostentación y el amor al elogio</td><td><b>La sinceridad:</b> examinar el motivo, fortalecer las obras ocultas, dejar de buscar rango con la adoración</td></tr>
  <tr><td>La soberbia</td><td><b>La humildad:</b> aceptar la verdad de quien la traiga y dejar de despreciar a la gente</td></tr>
  <tr><td>La vanidad</td><td>Recordar el favor de Dios, la necesidad de Él y las propias faltas</td></tr>
  <tr><td>La envidia</td><td><b>El buen consejo y la emulación lícita:</b> rechazar el deseo de que desaparezca una gracia y hacer el bien a su dueño</td></tr>
  <tr><td>El rencor y la ira</td><td><b>Un corazón limpio y la paciencia:</b> controlar la reacción, no transgredir, buscar la reconciliación</td></tr>
  <tr><td>La avaricia y el derroche</td><td><b>La generosidad y la mesura:</b> cumplir los derechos y gastar con medida</td></tr>
  <tr><td>La codicia, el amor al mundo, las largas esperanzas</td><td><b>El contentamiento, el desapego, el recuerdo de la muerte:</b> usar el dinero sin ser su esclavo</td></tr>
  <tr><td>La mala opinión</td><td><b>La verificación y la buena opinión,</b> sin ignorar las pruebas evidentes</td></tr>
  <tr><td>La impaciencia, el descontento, la ingratitud</td><td><b>La paciencia, la conformidad y la gratitud,</b> procurando lícitamente cambiar la situación</td></tr>
  <tr><td>Sentirse a salvo del designio de Dios y desesperar de Su misericordia</td><td>Unir temor y esperanza, sin engaño ni desesperación</td></tr>
  <tr><td>La pereza, la postergación, la prisa</td><td>El esfuerzo, la prontitud y la calma, cada cual en su lugar</td></tr>
  <tr><td>El fraude, la traición, la perfidia</td><td>La veracidad, la honradez, la fidelidad y devolver los derechos</td></tr>
  <tr><td>Persistir en el pecado</td><td>El arrepentimiento, cortar las causas y renovar el examen de uno mismo</td></tr>
 </table>
 <h4>Los siete vicios destructores</h4>
 <p>Los vicios más peligrosos son siete: <b>la incredulidad, la innovación, la ostentación, la soberbia, la envidia, la avaricia y el derroche</b>, siendo los cuatro primeros los más graves.</p>
 <p class="tq-note">El sentido de estos términos y los límites de aplicar sus normas dependen del detalle jurídico. Las listas de enfermedades son una herramienta para examinarse uno mismo, no para juzgar precipitadamente a los demás.</p>
</details>

<details><summary>6. La taqwa (2): guardar la lengua y los demás órganos</summary>
 <h4>Guardar la lengua</h4>
 <p>Reformar la lengua no se limita a evitar la murmuración. Abarca hablar de la creencia, la veracidad, el honor de la gente, las discrepancias, los contratos, la enseñanza, la exhortación, el dhikr y la súplica, y también el silencio. Sus temas son seis:</p>
 <ol>
  <li>El habla prohibida en principio.</li>
  <li>Los hábitos del habla: bromas, elogios, poesía, prosa rimada y charla ociosa.</li>
  <li>El habla en las transacciones.</li>
  <li>La adoración que beneficia a otros: enseñar y recordar.</li>
  <li>La adoración personal: recitación, dhikr y súplica.</li>
  <li>Los defectos de callar ante un deber.</li>
 </ol>
 <p><b>Cómo realizarlo:</b> antes de hablar, hazte cuatro preguntas:</p>
 <ul>
  <li>¿Es verdad?</li>
  <li>¿Es útil?</li>
  <li>¿Es el momento adecuado?</li>
  <li>¿Respeta los derechos de los demás?</li>
 </ul>
 <p>Después:</p>
 <ul>
  <li>Abandona la mentira, la murmuración, el chisme, la burla, el insulto, el falso testimonio y la revelación de secretos.</li>
  <li>Corrige tus palabras cuando estés enfadado.</li>
  <li>Aprende las normas de los contratos que firmas.</li>
  <li>Aconseja con conocimiento y suavidad.</li>
 </ul>
 <p class="tq-note">No uses el silencio como excusa para callar un testimonio, una enseñanza o un consejo que te corresponde.</p>

 <h4>Los demás órganos</h4>
 <div class="tq-organs">
  <div><b>Los oídos</b><span class="neg">Vaciar</span>Guardarse de escuchar deliberadamente lo que no está permitido, como la murmuración y el chisme.<span class="pos">Equilibrio</span>Distinguir el oír casual del escuchar intencionado, teniendo en cuenta la necesidad y las excepciones.</div>
  <div><b>Los ojos</b><span class="neg">Vaciar</span>Bajar la mirada y respetar la intimidad y la desnudez ajenas.<span class="pos">Equilibrio</span>Ceñirse a los límites de la necesidad en el tratamiento médico, el testimonio y similares.</div>
  <div><b>Las manos</b><span class="neg">Vaciar</span>Impedir el daño, la agresión, el robo y lo tomado injustamente.<span class="pos">Adornar</span>Devolver los depósitos, hacer el bien y respetar los derechos de personas y animales.</div>
  <div><b>El vientre</b><span class="neg">Vaciar</span>Dejar lo prohibido y el exceso dañino.<span class="pos">Adornar</span>Buscar lo lícito en el sustento y la comida, y cuidar los modales al comer y beber.</div>
  <div><b>Las partes íntimas</b><span class="neg">Vaciar</span>Proteger las relaciones y respetar sus límites.<span class="pos">Adornar</span>La castidad, y respetar las normas de la vida conyugal, la purificación y las necesidades naturales.</div>
  <div><b>Los pies</b><span class="neg">Vaciar</span>No caminar hacia el pecado y la injusticia, y respetar los bienes y lo sagrado.<span class="pos">Adornar</span>Caminar hacia el deber y el bien.</div>
  <div><b>El cuerpo en general</b><span class="neg">Vaciar</span>Dejar la injusticia, la usurpación y la desobediencia a los padres.<span class="pos">Adornar</span>Cubrir la desnudez, respetar las normas del vestido y la vivienda, honrar a los padres y cumplir derechos y deberes.</div>
 </div>
 <p class="tq-note">La taqwa concluye insistiendo en los derechos de las personas y los animales. El trato, la honradez y la misericordia son la prueba de la purificación, no un añadido ajeno a la vía.</p>
</details>

<details><summary>7. Capítulo tercero: lo que se confunde con piedad y escrúpulo</summary>
 <h4>Sección 1: El escrúpulo excesivo sobre la pureza y la impureza</h4>
 <p>Formas de rigor censurable:</p>
 <ul>
  <li>Verter demasiada agua y repetir el lavado más allá del límite.</li>
  <li>Lavar lo puro por imaginación e inspeccionar sin indicio.</li>
  <li>Reservar utensilios que el obsesivo no acepta sustituir.</li>
  <li>La pérdida resultante de la oración en grupo, la propia oración, el dhikr y los derechos ajenos.</li>
 </ul>
 <p>El tratamiento se basa en cuatro puntos:</p>
 <ol>
  <li>Este rigor contradice la guía profética.</li>
  <li>La censura de la obsesión (waswasa) y sus males.</li>
  <li>Su remedio.</li>
  <li>Las divergencias de los juristas y los principios de la pureza y la impureza.</li>
 </ol>
 <p>Entre los principios: <b>las cosas son puras en origen, y la certeza no se elimina con la duda</b>. Al obsesivo se le orienta hacia la amplitud reconocida hasta que desaparezcan sus dudas.</p>
 <p><b>Cómo realizarlo:</b> aprende la norma, realiza la adoración según ella, no la repitas por una simple duda y no prolongues la inspección.</p>
 <p class="tq-note">No hagas de la limpieza exterior una excusa para descuidar la purificación del corazón de la ostentación y la soberbia, ni una causa para perder un deber.</p>

 <h4>Sección 2: El escrúpulo con el dinero y la comida sin imaginación</h4>
 <p>Se critica a quien rechaza la comida de los que cobran de fundaciones piadosas o del tesoro público por una duda general, mientras es laxo en otras transacciones. La norma depende de la validez del derecho, la transacción y las condiciones, no de la impresión sobre el dueño del dinero. Generalizar la duda sobre el dinero y las transacciones lleva a la dificultad.</p>
 <p class="tq-note">Lo que importa aquí es la idea educativa; las normas de casos antiguos no se aplican mecánicamente a todo salario o ingreso moderno.</p>
 <p><b>Cómo realizarlo:</b></p>
 <ul>
  <li>Evita lo que sabes que es prohibido.</li>
  <li>Verifica con indicios claros.</li>
  <li>Aprende las normas de tus ingresos y contratos.</li>
  <li>No declares prohibido un bien basándote en la imaginación.</li>
  <li>Respeta los derechos y no te eleves sobre la gente con una apariencia de escrúpulo sin base de conocimiento.</li>
 </ul>

 <h4>Sección 3: Obras tomadas como actos de devoción sin verificación</h4>
 <p>Por ejemplo:</p>
 <ul>
  <li>Algunas fundaciones piadosas y legados.</li>
  <li>El pago por la recitación y el dhikr, y el regalo de la recompensa.</li>
  <li>Las comidas ofrecidas tras un fallecimiento.</li>
  <li>Imponer pasar la noche junto a una tumba, y construir sobre las tumbas.</li>
 </ul>
 <p>La balanza es la validez de la obra y de la intención, guardándose de hacer de la adoración un medio para lo mundano.</p>
 <p><b>Cómo realizarlo:</b> verifica el origen, la norma y las condiciones de la obra, corrige tu intención y no conviertas una costumbre en obligación religiosa solo porque esté extendida.</p>
 <p class="tq-note">Las cuestiones del pago, las fundaciones y el regalo de la recompensa tienen detalles y divergencias; no se presentan como normas unánimes, ni se equiparan sus distintas formas.</p>
</details>

<details><summary>8. Cómo realizar la vía: el programa del caminante</summary>
 <p>Este orden se extrae de la vía; no es un wird obligatorio:</p>
 <ol>
  <li><b>Corrige tu orientación:</b> busca la complacencia de Dios y revisa tu intención en la adoración, el estudio y el servicio.</li>
  <li><b>Aprende lo que te incumbe:</b> conoce las normas de tu adoración, tu trabajo y tu familia, y aplícalas antes de ampliar sin necesidad.</li>
  <li><b>Arrepiéntete de la transgresión:</b> déjala, lamenta haberla cometido, decide no volver a ella y devuelve los derechos ajenos según el caso.</li>
  <li><b>Cumple las obligaciones:</b> fijar prioridades va antes que añadir obras voluntarias.</li>
  <li><b>Elige una enfermedad visible para tratarla:</b> comprende su causa, anota las situaciones en que aparece y ejercita su contrario.</li>
  <li><b>Guarda los órganos:</b> localiza dónde está el fallo — en el habla, la mirada, el oído o el trato — y corta sus causas.</li>
  <li><b>Fortalece tu vínculo con Dios:</b> con el Corán, la oración, el dhikr, la súplica y la reflexión, respetando la Sunna, tu capacidad y la constancia.</li>
  <li><b>Mantén la vigilancia (murabata):</b>
   <ul>
    <li><b>El compromiso</b> al inicio del día.</li>
    <li><b>La vigilancia</b> durante la acción.</li>
    <li><b>El examen</b> después.</li>
    <li><b>El reproche y la corrección</b> cuando falles.</li>
   </ul>
   También se menciona <b>la sanción de uno mismo</b>, cuyas aplicaciones se mantienen en lo que no causa daño ni crea una carga ilegítima.</li>
  <li><b>Busca una compañía sincera:</b> acepta que te avisen, verifica la crítica y sigue la verdad sin partidismo hacia las personas.</li>
  <li><b>Revisa el fruto:</b> más veracidad, mayor honradez, menos ira, derechos respetados, adoración más firme, más humildad y misericordia.</li>
 </ol>
 <h4>Preguntas del examen diario</h4>
 <ul>
  <li>¿Qué deber cumplí o descuidé?</li>
  <li>¿Qué enfermedad apareció en mi corazón?</li>
  <li>¿A quién herí de palabra o de obra?</li>
  <li>¿Qué derecho debo devolver?</li>
  <li>¿Qué corrección concreta haré mañana?</li>
 </ul>
 <p class="tq-note">Puedes anotar tus respuestas en la «nota del día» y registrar la guarda de tus órganos en la sección «Purificación».</p>
</details>

<details><summary>9. La vía en un párrafo</summary>
 <p>La Vía muhammadiana es seguir al Mensajero de Dios ﷺ en la creencia, la adoración, el carácter y el trato, y tomar el Corán y la Sunna como la balanza que reforma lo exterior y lo interior del ser humano.</p>
 <p>Se apoya en tres fundamentos: la creencia correcta, aprender las normas de la religión que uno necesita, y realizar la taqwa cumpliendo las obligaciones y evitando lo prohibido.</p>
 <p>Su purificación se realiza de dos maneras:</p>
 <ul>
  <li>Vaciar el corazón de la ostentación, la soberbia, la vanidad, la envidia y sus demás enfermedades, y adornarlo con sinceridad, humildad, gratitud, paciencia, misericordia y veracidad.</li>
  <li>Guardar la lengua y los órganos, y cumplir los derechos de los demás.</li>
 </ul>
 <p>Quien la sigue avanza con conocimiento y práctica, vigilancia y examen, y con una adoración moderada y constante, lejos del extremismo, la obsesión y el escrúpulo basado en la imaginación. Su fruto se ve en una adoración firme, buen carácter, honradez, justicia y misericordia.</p>
</details>

 </ol>
 <h4>Los defectos del silencio</h4>
 <p>Dejar de aprender lo necesario, callar una palabra obligatoria y descuidar el consejo, ordenar el bien y prohibir el mal cuando se cumplen sus condiciones. La salud de la lengua no es la abstención constante de hablar, sino poner el habla y el silencio cada uno en su lugar.</p>
</details>

<details open><summary>1. Определение и цель Мухаммадова пути</summary>
 <p><b>Мухаммадов путь</b> — это следование Посланнику Бога ﷺ в вере, словах, нраве и делах, и принятие его руководства как меры, по которой путник исправляет внешнюю и внутреннюю сторону своих дел.</p>
 <ul>
  <li><b>Его цель:</b> довольство Всевышнего Бога и успех в вечной жизни.</li>
  <li><b>Его средства:</b> знание, действие, богобоязненность (таква) и очищение души.</li>
  <li><b>Его назначение:</b> чтобы каждый путник сверял свои дела с путём Пророка и отличал верное от ошибочного.</li>
 </ul>
 <h4>Два недуга, которые лечит путь</h4>
 <ul>
  <li><b>Поклоняющийся без знания:</b> усердствует в поклонении, не зная положений религии, и потому переступает её границы.</li>
  <li><b>Знающий без дела:</b> знает положение, но пренебрегает его исполнением.</li>
 </ul>
 <p>Поэтому путь соединяет три вещи: <b>верное знание, искреннее стремление и праведное поведение</b>.</p>
 <h4>Смысл очищения</h4>
 <ul>
  <li><b>Освобождение:</b> очищение сердца от порицаемых качеств.</li>
  <li><b>Украшение:</b> украшение его похвальными качествами.</li>
  <li><b>Хранение органов:</b> оберегание членов тела от греха, пока стойкость не станет прочным качеством.</li>
 </ul>
 <p class="tq-note">Зикр и поклонение — средства, укрепляющие стойкость; они неотделимы от честности в отношениях и соблюдения прав людей.</p>
</details>

<details><summary>2. Три основы, обязательные для путника</summary>
 <p>Обязанности путника сводятся к трём: <b>правильная вера, знание своего состояния и таква</b>. Это основы и практические столпы пути.</p>
 <h4>Первая основа: правильная вера</h4>
 <p>Знать совершенство, присущее Богу, и несовершенство, от которого Он свободен; верить в посланничество, откровение, Последний день и предопределение; исправлять свои религиозные представления. Не утверждается единогласие там, где учёные расходятся.</p>
 <h4>Вторая основа: знание своего состояния</h4>
 <p>Изучать то, что нужно путнику, чтобы соблюдать религию в своей жизни:</p>
 <ul>
  <li>Очищение, молитву и пост, а также закят и хадж, когда они становятся обязательными.</li>
  <li>Положения своей профессии, торговли и семьи, по своему положению.</li>
  <li>Знание болезней своего сердца и способов их лечения.</li>
 </ul>
 <p class="tq-note">Необходимое знание не заменяется накоплением сведений, которые ничего не меняют в делах.</p>
 <h4>Третья основа: таква</h4>
 <p>Исполнение повелённого и избегание запретного внутренне и внешне. Она включает оставление запретного и исполнение обязательного, ведь оставление обязанности само по себе — нарушение. Все три основы восходят к такве, так как она охватывает обязательное знание, правильную веру и дело.</p>
</details>

<details><summary>3. Глава первая: следование и умеренность</summary>
 <h4>Раздел 1: Держаться Корана и Сунны</h4>
 <p>Коран и Сунна — ориентир в вере, поклонении и поведении. Чтение сочетается с размышлением и делом, а любовь к Пророку ﷺ — со следованием ему. Единогласие и аналогия восходят к этим двум источникам, поэтому обращение к откровению не означает отмены фикха или отказа от его учёных.</p>
 <p><b>На практике:</b></p>
 <ul>
  <li>Изучайте нужные вам обязанности и сунны.</li>
  <li>Проверяйте положения своих практик поклонения.</li>
  <li>Спрашивайте знающих, когда что-то неясно.</li>
  <li>Сверяйте свои слова и духовные переживания с Шариатом.</li>
 </ul>
 <p class="tq-note">Никогда не делайте сон, откровение или состояние шейха доводом для оставления обязанности или совершения запретного.</p>

 <h4>Раздел 2: Остерегаться нововведений и дурных обычаев</h4>
 <p>Различают языковое и шариатское значение нововведения (бид'а), а также обычаи и акты поклонения. Не всякое новое средство жизни является выдуманным поклонением. Откровения, чудеса и видение пророков никогда не оправдывают противоречия Шариату, и наставники пути единодушны в необходимости следования.</p>
 <p><b>На практике:</b></p>
 <ul>
  <li>Изучайте происхождение и содержание практики, а также приписываемую ей обязательность или особую заслугу.</li>
  <li>Отличайте организационное средство от поклонения.</li>
  <li>Проверяйте, прежде чем обобщать положения в вопросах иджтихада.</li>
 </ul>
 <p class="tq-note">Мерило — чтобы дело было законным, а не просто привычным или трогательным.</p>

 <h4>Раздел 3: Умеренность в делах</h4>
 <p>Ни крайности, ни небрежения. В поклонении учитываются возможности, постоянство и права самого себя, семьи и людей. Рассказы о суровых подвигах некоторых праведных предков уступают установленному из руководства Пророка, а непроверенное сообщение не служит основанием возлагать тяготы на всех.</p>
 <p><b>На практике:</b></p>
 <ul>
  <li>Ставьте обязанности на первое место.</li>
  <li>Выбирайте добровольные дела, которые сможете продолжать.</li>
  <li>Проверяйте, как ваша программа сказывается на обязанностях, здоровье и работе.</li>
 </ul>
 <p class="tq-note">Усталость не цель сама по себе, и поклонение не должно становиться причиной пренебрежения другой обязанностью.</p>
</details>

<details><summary>4. Глава вторая: вера и знание</summary>
 <p>Важные вопросы Мухаммадова Шариата — три: вера, науки и таква, которой посвящены две следующие части.</p>
 <h4>Раздел 1: Правильная вера</h4>
 <p>Охватывает следующие вопросы:</p>
 <ul>
  <li>Единобожие и атрибуты Бога, Коран и пророчество.</li>
  <li>Дела людей и их свободный выбор; предопределение, срок жизни и удел.</li>
  <li>Барзах, Воскресение, награда и наказание.</li>
  <li>Ночное путешествие и Вознесение, признаки Часа.</li>
  <li>Грехи и положение сподвижников.</li>
  <li>Вопросы, связанные с мусульманской общиной и положениями религии.</li>
 </ul>
 <p><b>Как осуществить:</b></p>
 <ul>
  <li>Изучайте веру по надёжным источникам.</li>
  <li>Соединяйте благоговение, любовь, страх и надежду.</li>
  <li>Стремитесь к умножению убеждённости.</li>
  <li>Избегайте споров, для которых у вас нет инструментов.</li>
 </ul>
 <p class="tq-note">Не превращайте эти вопросы в суждения о вере конкретных людей.</p>

 <h4>Раздел 2: Науки, изучаемые ради другого</h4>
 <p>Науки бывают трёх видов:</p>
 <ul>
  <li><b>Повелённые:</b> личные обязанности, связанные с положением человека, и коллективные обязанности, нужные общине.</li>
  <li><b>Запретные:</b> например магия, то, что ведёт к заблуждению или вреду, и надуманные споры. Критика спекулятивного богословия, астрологии и некоторых наук понимается в своём контексте и не распространяется на полезные науки или современные исследования из-за одного названия.</li>
  <li><b>Желательные:</b> полезное расширение знаний, изучение сунн, добродетелей и этикета, восполнение того, что община уже обеспечивает.</li>
 </ul>
 <p><b>Как осуществить:</b></p>
 <ul>
  <li>Определите, что нужно вам сейчас, и изучите это у знающих.</li>
  <li>Действуйте по изученному.</li>
  <li>Затем расширяйте знания в полезном.</li>
  <li>Исправьте намерение в учёбе и преподавании: цель не победа в спорах, не слава и не положение среди людей.</li>
 </ul>
</details>

<details><summary>5. Таква (1): исправление сердца</summary>
 <p>Таква — самая всеобъемлющая основа; у неё есть достоинство, смысл и пути. <b>Таква</b> — это оберегание души от того, что вредит ей в вечной жизни, и она достигается и действием, и воздержанием.</p>
 <p>Её практические пути:</p>
 <ul>
  <li>Хранение сердца.</li>
  <li>Хранение языка, ушей, глаз, рук, живота, срамных мест и ног.</li>
  <li>Хранение тела в целом.</li>
 </ul>
 <p class="tq-note">Это те органы, над очищением которых вы работаете в разделе «Очищение».</p>
 <p>Сердце управляет органами, поэтому ему уделяется наибольшее внимание. <b>Нрав</b> — это качество, из которого поступки исходят легко, и он может меняться через воспитание и повторение. У души три силы: восприятие, гнев и влечение. Корни добродетелей — четыре:</p>
 <table class="tq-t">
  <tr><th>Корень</th><th>Его воспитательный смысл</th></tr>
  <tr><td>Мудрость</td><td>Постижение верного и правильное направление знания</td></tr>
  <tr><td>Мужество</td><td>Обуздание гнева и смелость к месту, без безрассудства и трусости</td></tr>
  <tr><td>Целомудрие</td><td>Обуздание влечения по Шариату, без жадности и без подавления должного</td></tr>
  <tr><td>Справедливость</td><td>Гармония сил и добродетелей, соблюдение прав без несправедливости</td></tr>
 </table>
 <h4>Общий метод лечения</h4>
 <ol>
  <li>Познайте болезнь: её суть, вред и причины, а также противоположную добродетель и её пользу.</li>
  <li>Ищите её в себе и не оправдывайте постоянно своё поведение.</li>
  <li>Пользуйтесь искренним другом, который предостерегает, и справедливой критикой, даже от того, кто вас не любит.</li>
  <li>Пусть отношение людей к вам будет зеркалом, показывающим недостатки вашего поведения.</li>
  <li>Найдите причину и устраните её, затем упражняйтесь в поведении, противоположном пороку.</li>
  <li>Повторяйте, пока не укоренится, затем храните это хорошим окружением, знанием и делом.</li>
  <li>Следите за равновесием, чтобы не перейти от порока к его порицаемой противоположности.</li>
 </ol>
 <p class="tq-note">В духовных упражнениях и самоотчёте действует правило умеренности: они не должны превращаться в голодание, лишения или вред себе.</p>
 <h4>Конкретные примеры лечения</h4>
 <table class="tq-t">
  <tr><th>Болезнь</th><th>Лекарство и практика</th></tr>
  <tr><td>Показуха и любовь к похвале</td><td><b>Искренность:</b> проверять побуждение, укреплять скрытые дела, не искать положения через поклонение</td></tr>

  <tr><td>Злоба и гнев</td><td><b>Чистое сердце и сдержанность:</b> контролировать реакцию, не преступать, стремиться к примирению</td></tr>

 </table>
 <h4>Семь губительных пороков</h4>
 <p>Самые опасные пороки — семь: <b>неверие, нововведение, показуха, высокомерие, зависть, скупость и расточительство</b>, из них тяжелейшие — первые четыре.</p>
 <p class="tq-note">Значения этих терминов и границы применения их положений зависят от подробностей фикха. Списки болезней — инструмент самопроверки, а не поспешного суждения о других.</p>
</details>

<details><summary>6. Таква (2): хранение языка и остальных органов</summary>
 <h4>Хранение языка</h4>
 <p>Исправление языка не ограничивается отказом от злословия. Оно охватывает речь о вере, правдивость, честь людей, разногласия, договоры, обучение, наставление, зикр и мольбу, а также молчание. Его тем — шесть:</p>
 <ol>
  <li>Речь, запретная в своей основе.</li>
  <li>Речевые привычки: шутки, похвала, поэзия, рифмованная проза и пустословие.</li>
  <li>Речь в сделках.</li>
  <li>Поклонение, приносящее пользу другим: обучение и напоминание.</li>
  <li>Личное поклонение: чтение Корана, зикр и мольба.</li>
  <li>Пороки молчания об обязательном.</li>
 </ol>
 <p><b>Как осуществить:</b> прежде чем говорить, задайте себе четыре вопроса:</p>
 <ul>
  <li>Это правда?</li>
  <li>Это полезно?</li>
  <li>Это уместно?</li>
  <li>Соблюдаются ли права других?</li>
 </ul>
 <p>Затем:</p>
 <ul>
  <li>Оставьте ложь, злословие, сплетни, насмешки, брань, лжесвидетельство и разглашение тайн.</li>
  <li>Исправляйте речь в гневе.</li>
  <li>Изучите положения договоров, которые заключаете.</li>
  <li>Советуйте со знанием и мягкостью.</li>
 </ul>
 <p class="tq-note">Не делайте молчание предлогом для отказа от свидетельства, обучения или совета, которые на вас лежат.</p>

 <h4>Остальные органы</h4>
 <div class="tq-organs">
  <div><b>Уши</b><span class="neg">Освобождение</span>Остерегаться намеренно слушать недозволенное — злословие, сплетни и подобное.<span class="pos">Равновесие</span>Отличать случайное услышанное от намеренного слушания, учитывая необходимость и исключения.</div>
  <div><b>Глаза</b><span class="neg">Освобождение</span>Опускать взгляд, уважать частную жизнь и наготу.<span class="pos">Равновесие</span>Соблюдать пределы необходимости при лечении, свидетельстве и подобном.</div>
  <div><b>Руки</b><span class="neg">Освобождение</span>Не допускать вреда, нападения, кражи и неправедного присвоения.<span class="pos">Украшение</span>Возвращать доверенное, творить добро, соблюдать права людей и животных.</div>
  <div><b>Живот</b><span class="neg">Освобождение</span>Оставлять запретное и вредные излишества.<span class="pos">Украшение</span>Искать дозволенное в заработке и пище, соблюдать этикет еды и питья.</div>
  <div><b>Срамные места</b><span class="neg">Освобождение</span>Оберегать отношения и соблюдать их границы.<span class="pos">Украшение</span>Целомудрие, соблюдение положений супружеской жизни, очищения и естественных нужд.</div>
  <div><b>Ноги</b><span class="neg">Освобождение</span>Не идти к греху и несправедливости, уважать имущество и святыни.<span class="pos">Украшение</span>Идти к обязанности и добру.</div>
  <div><b>Тело в целом</b><span class="neg">Освобождение</span>Оставлять несправедливость, присвоение чужого и непочтение к родителям.<span class="pos">Украшение</span>Покрывать наготу, соблюдать положения одежды и жилья, почитать родителей, исполнять права и обязанности.</div>
 </div>
 <p class="tq-note">Таква завершается подчёркиванием прав людей и животных. Отношения, честность и милосердие — испытание очищения, а не дополнение вне пути.</p>
</details>

<details><summary>7. Глава третья: то, что ошибочно считают благочестием и осторожностью</summary>
 <h4>Раздел 1: Чрезмерная дотошность в чистоте и нечистоте</h4>
 <p>Формы порицаемой строгости:</p>
 <ul>
  <li>Лить слишком много воды и повторять омовение сверх меры.</li>
  <li>Мыть чистое из-за мнительности и проверять без признаков.</li>
  <li>Держать особую посуду, замену которой одержимый не принимает.</li>
  <li>Как следствие — потеря коллективной молитвы, самой молитвы, зикра и прав других.</li>
 </ul>
 <p>Лечение основано на четырёх пунктах:</p>
 <ol>
  <li>Такая строгость противоречит руководству Пророка.</li>
  <li>Порицание навязчивых сомнений (васваса) и их вред.</li>
  <li>Их лечение.</li>
  <li>Разногласия правоведов и принципы чистоты и нечистоты.</li>
 </ol>
 <p>Среди принципов: <b>вещи изначально чисты, а уверенность не отменяется сомнением</b>. Одержимому советуют брать признанное облегчение, пока сомнения не уйдут.</p>
 <p><b>Как осуществить:</b> изучите положение, совершайте поклонение согласно ему, не повторяйте его из-за одного сомнения и не продолжайте проверки.</p>
 <p class="tq-note">Пусть внешняя чистота не станет предлогом пренебрегать очищением сердца от показухи и высокомерия или причиной упустить обязанность.</p>

 <h4>Раздел 2: Осторожность в имуществе и пище без мнительности</h4>
 <p>Порицается тот, кто отказывается от пищи людей, получающих содержание из вакфов или казны, из-за общего сомнения, но при этом небрежен в других сделках. Положение зависит от законности права, сделки и условий, а не от впечатления о владельце. Обобщение сомнений в имуществе и сделках ведёт к стеснению.</p>
 <p class="tq-note">Здесь важна воспитательная мысль; положения о прежних случаях не переносятся механически на любую современную зарплату или доход.</p>
 <p><b>Как осуществить:</b></p>
 <ul>
  <li>Избегайте заведомо запретного.</li>
  <li>Проверяйте по явным признакам.</li>
  <li>Изучите положения своего заработка и договоров.</li>
  <li>Не объявляйте имущество запретным на основании мнительности.</li>
  <li>Соблюдайте права и не возвышайтесь над людьми показной осторожностью, не основанной на знании.</li>
 </ul>

 <h4>Раздел 3: Дела, принимаемые за поклонение без проверки</h4>
 <p>Например:</p>
 <ul>
  <li>Некоторые вакфы и завещания.</li>
  <li>Плата за чтение Корана и зикр, дарение награды.</li>
  <li>Угощения по случаю смерти.</li>
  <li>Обязывание ночевать у могилы и строительство над могилами.</li>
 </ul>
 <p>Мерило — правильность дела и намерения, с осторожностью, чтобы поклонение не стало средством для мирского.</p>
 <p><b>Как осуществить:</b> проверьте происхождение, положение и условия дела, исправьте намерение и не превращайте обычай в религиозную обязанность только из-за его распространённости.</p>
 <p class="tq-note">Вопросы платы, вакфа и дарения награды содержат подробности и разногласия; они не преподносятся как единогласные положения, и их разные формы не приравниваются.</p>
</details>

<details><summary>8. Как осуществить путь: программа путника</summary>
 <p>Этот порядок выведен из пути; это не обязательный вирд:</p>
 <ol>
  <li><b>Исправьте направление:</b> стремитесь к довольству Бога и проверяйте намерение в поклонении, учёбе и служении.</li>
  <li><b>Изучите необходимое:</b> знайте положения своего поклонения, работы и семьи и исполняйте их, прежде чем расширять без нужды.</li>
  <li><b>Покайтесь в нарушении:</b> оставьте его, сожалейте о нём, решите не возвращаться и верните права людей по обстоятельствам.</li>
  <li><b>Исполняйте обязанности:</b> расстановка приоритетов предшествует увеличению добровольных дел.</li>
  <li><b>Выберите одну явную болезнь для лечения:</b> поймите её причину, записывайте ситуации, где она проявляется, и упражняйтесь в противоположном.</li>
  <li><b>Храните органы:</b> определите, где изъян — в речи, взгляде, слухе или отношениях, — и устраните его причины.</li>
  <li><b>Укрепляйте связь с Богом:</b> Кораном, молитвой, зикром, мольбой и размышлением, соблюдая Сунну, свои возможности и постоянство.</li>
  <li><b>Держитесь бдительности (мурабата):</b>
   <ul>
    <li><b>Уговор с собой</b> в начале дня.</li>
    <li><b>Бдительность</b> во время дела.</li>
    <li><b>Самоотчёт</b> после него.</li>
    <li><b>Упрёк себе и исправление</b> при упущении.</li>
   </ul>
   С ними упоминается и <b>наказание себя</b>; его применение ограничено тем, что не причиняет вреда и не создаёт незаконного бремени.</li>
  <li><b>Ищите искреннее окружение:</b> принимайте предостережения, проверяйте критику и следуйте истине без пристрастия к людям.</li>
  <li><b>Оценивайте плоды:</b> больше правдивости, честности, меньше гнева, соблюдённые права, устойчивое поклонение, больше смирения и милосердия.</li>
 </ol>
 <h4>Вопросы ежедневного самоотчёта</h4>
 <ul>
  <li>Какую обязанность я исполнил или упустил?</li>
  <li>Какая болезнь проявилась в моём сердце?</li>
  <li>Кого я обидел словом или делом?</li>
  <li>Какое право нужно вернуть?</li>
  <li>Какое конкретное исправление я сделаю завтра?</li>
 </ul>
 <p class="tq-note">Ответы на эти вопросы можно записывать в «Заметке дня», а хранение органов отмечать в разделе «Очищение».</p>
</details>

<details><summary>9. Путь в одном абзаце</summary>
 <p>Мухаммадов путь — это следование Посланнику Бога ﷺ в вере, поклонении, нраве и отношениях, и принятие Корана и Сунны как меры для исправления внешнего и внутреннего в человеке.</p>
 <p>Он стоит на трёх основах: правильная вера, изучение необходимых положений религии и осуществление таквы через исполнение обязанностей и избегание запретного.</p>
 <p>Его очищение достигается двумя путями:</p>
 <ul>
  <li>Освобождение сердца от показухи, высокомерия, самолюбования, зависти и прочих болезней и украшение его искренностью, смирением, благодарностью, терпением, милосердием и правдивостью.</li>
  <li>Хранение языка и органов и исполнение прав людей.</li>
 </ul>
 <p>Идущий по нему движется знанием и делом, бдительностью и самоотчётом, умеренным и постоянным поклонением, вдали от крайностей, навязчивых сомнений и осторожности, основанной на мнительности. Его плоды видны в устойчивом поклонении, благом нраве, честности, справедливости и милосердии.</p>
</details>

  for(let i=0;i<n;i++){const t=i/sr;let x=0;if(!silent)freqs.forEach((f,k)=>{const u=t-k*gap;if(u<0||u>len)return;const env=Math.min(1,u/.01)*Math.exp(-u*5/len);[1,2.01,3.02].forEach((h,j)=>{x+=Math.sin(2*Math.PI*f*h*u)*env*vol/(j*2+1)})});
    v.setInt16(44+i*2,Math.max(-1,Math.min(1,x*.8))*32767,true)}
  return URL.createObjectURL(new Blob([b],{type:'audio/wav'}))}
