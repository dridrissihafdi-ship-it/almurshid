const TARIQA_T={en:`<section class="tq" dir="ltr" lang="en">
<div class="tq-head">
 <h2>The Muhammadan Path</h2>
 <p class="tq-sub">Following the Prophet ﷺ outwardly and inwardly: definition, foundations, chapters and how to realise it</p>
 <p class="tq-src">Detailed rulings and points of scholarly disagreement should be reviewed with people of knowledge.</p>
</div>

<div class="tq-map" aria-label="Map of the path">
 <span>Following and moderation</span><i>→</i><span>Sound belief</span><i>→</i><span>Knowledge of one's state</span><i>→</i><span>God-consciousness</span><i>→</i><span>Purifying heart and organs</span><i>→</i><span>Uprightness and God's pleasure</span>
</div>

<details open><summary>1. Definition and aim of the Muhammadan Path</summary>
 <p><b>The Muhammadan Path</b> is following the Messenger of God ﷺ in belief, speech, character and action, and taking his guidance as the scale by which the seeker corrects the outer and inner side of his deeds.</p>
 <ul>
  <li><b>Its aim:</b> the pleasure of God Most High and success in the Hereafter.</li>
  <li><b>Its means:</b> knowledge, action, God-consciousness (taqwa) and purification of the soul.</li>
  <li><b>Its purpose:</b> that every seeker measures his deeds against the Prophet's way, and so tells right from wrong.</li>
 </ul>
 <h4>Two ailments the path treats</h4>
 <ul>
  <li><b>The worshipper without knowledge:</b> strives in worship while ignorant of the rulings of religion, and so oversteps its limits.</li>
  <li><b>The scholar without practice:</b> knows the ruling but neglects acting on it.</li>
 </ul>
 <p>So the path joins three things: <b>sound knowledge, sincere will and upright conduct</b>.</p>
 <h4>What purification means here</h4>
 <ul>
  <li><b>Emptying (takhliya):</b> clearing the heart of blameworthy traits.</li>
  <li><b>Adorning (tahliya):</b> beautifying it with praiseworthy traits.</li>
  <li><b>Guarding the organs:</b> keeping the limbs from sin until uprightness becomes a firm disposition.</li>
 </ul>
 <p class="tq-note">Remembrance and worship are means that strengthen uprightness; they are never separate from honest dealings and respecting the rights of people.</p>
</details>

<details><summary>2. The three foundations binding on the seeker</summary>
 <p>What the seeker must hold to comes down to three: <b>sound belief, knowledge of one's state, and God-consciousness</b>. These are the foundations and practical pillars of the path.</p>
 <h4>First foundation: sound belief</h4>
 <p>Knowing the perfection that belongs to God and the imperfection He is far above; believing in the message, revelation, the Last Day and divine decree; and correcting one's religious ideas. Consensus is not claimed where scholars differ.</p>
 <h4>Second foundation: knowledge of one's state</h4>
 <p>Learning what the seeker needs to establish his religion in his own life:</p>
 <ul>
  <li>Purification, prayer and fasting, and zakat and Hajj when they become due.</li>
  <li>The rulings of his profession, his trade and his family, according to his situation.</li>
  <li>Knowing the illnesses of his heart and how to treat them.</li>
 </ul>
 <p class="tq-note">Necessary knowledge is not replaced by piling up information that changes nothing in practice.</p>
 <h4>Third foundation: God-consciousness (taqwa)</h4>
 <p>Obeying what is commanded and avoiding what is forbidden, inwardly and outwardly. It includes leaving the forbidden and fulfilling the obligatory, since abandoning an obligation is itself a violation. All three foundations go back to taqwa, as it embraces necessary knowledge, sound belief and action.</p>
</details>

<details><summary>3. Chapter one: following and moderation</summary>
 <h4>Section 1: Holding fast to the Qur'an and the Sunnah</h4>
 <p>The Qur'an and the Sunnah are the reference for belief, worship and conduct. Recitation goes with reflection and practice, and love of the Prophet ﷺ goes with following him. Consensus and analogy go back to these two sources, so returning to revelation does not mean discarding jurisprudence or doing without its scholars.</p>
 <p><b>In practice:</b></p>
 <ul>
  <li>Learn the obligations and Sunnahs you need.</li>
  <li>Verify the rulings of your acts of worship.</li>
  <li>Ask people of knowledge when something is unclear.</li>
  <li>Weigh your words and spiritual feelings against the Sacred Law.</li>
 </ul>
 <p class="tq-note">Never take a dream, an unveiling or a shaykh's state as grounds for skipping an obligation or committing something forbidden.</p>

 <h4>Section 2: Guarding against innovations and bad customs</h4>
 <p>A distinction is made between the linguistic and legal meanings of innovation (bid'a), and between customs and acts of worship. Not every new means of life is an invented act of worship. Unveilings, wonders and seeing the prophets are never a justification for opposing the Sacred Law, and the masters of the spiritual path agree on the necessity of following.</p>
 <p><b>In practice:</b></p>
 <ul>
  <li>Examine the origin and content of a practice, and any obligation or special merit attributed to it.</li>
  <li>Distinguish an organisational means from an act of worship.</li>
  <li>Be careful before generalising rulings on matters of scholarly judgement.</li>
 </ul>
 <p class="tq-note">The criterion is that an act be legitimate, not merely familiar or moving.</p>

 <h4>Section 3: Moderation in practice</h4>
 <p>Neither excess nor neglect. Worship takes into account ability, consistency and the rights of oneself, one's family and others. What is reported of the intense spiritual struggles of some early Muslims gives way to what is established of the Prophet's guidance, and an unverified report is not used to impose hardship on everyone.</p>
 <p><b>In practice:</b></p>
 <ul>
  <li>Put the obligations first.</li>
  <li>Choose voluntary acts you can keep up.</li>
  <li>Review how your programme affects your duties, health and work.</li>
 </ul>
 <p class="tq-note">Exhaustion is not a goal in itself, and worship must never become a reason to neglect another duty.</p>
</details>

<details><summary>4. Chapter two: belief and knowledge</summary>
 <p>The important matters of the Muhammadan Sacred Law are three: belief, the sciences, then taqwa, to which the next two parts are devoted.</p>
 <h4>Section 1: Sound belief</h4>
 <p>It covers the following questions:</p>
 <ul>
  <li>Divine oneness and the attributes of God, the Qur'an, and prophethood.</li>
  <li>The actions and free choice of human beings; decree, life span and provision.</li>
  <li>The intermediate realm (barzakh), the Resurrection, reward and punishment.</li>
  <li>The Night Journey and Ascension, and the signs of the Hour.</li>
  <li>Sins, and the standing of the Companions.</li>
  <li>Questions related to the Muslim community and religious rulings.</li>
 </ul>
 <p><b>How to realise it:</b></p>
 <ul>
  <li>Learn faith from reliable sources.</li>
  <li>Combine reverence, love, fear and hope.</li>
  <li>Seek increase in certainty.</li>
  <li>Avoid debates you lack the tools for.</li>
 </ul>
 <p class="tq-note">Do not turn these questions into judgements on the faith of particular individuals.</p>

 <h4>Section 2: The sciences sought for other ends</h4>
 <p>The sciences are of three kinds:</p>
 <ul>
  <li><b>Commanded:</b> personal obligations connected to one's situation, and communal obligations the community needs.</li>
  <li><b>Forbidden:</b> such as magic, whatever leads to misguidance or harm, and contrived disputation. Criticism of speculative theology, astrology and certain sciences is understood in its context, and is not extended to beneficial sciences or modern studies merely because of a name.</li>
  <li><b>Recommended:</b> beneficial broadening of knowledge, learning the Sunnahs, virtues and manners, and completing what the community already covers.</li>
 </ul>
 <p><b>How to realise it:</b></p>
 <ul>
  <li>Determine what you need now, and learn it from its people.</li>
  <li>Act on what you have learned.</li>
  <li>Then broaden into what is beneficial.</li>
  <li>Correct your intention in learning and teaching: the goal is not winning arguments, fame or status among people.</li>
 </ul>
</details>

<details><summary>5. Taqwa (1): reforming the heart</summary>
 <p>Taqwa is the most comprehensive foundation; it has its merit, its meaning and its channels. <b>Taqwa</b> is protecting the soul from what harms it in the Hereafter, and it is achieved both by doing and by refraining.</p>
 <p>Its practical channels:</p>
 <ul>
  <li>Guarding the heart.</li>
  <li>Guarding the tongue, ears, eyes, hands, stomach, private parts and feet.</li>
  <li>Guarding the body in general.</li>
 </ul>
 <p class="tq-note">These are the organs you work on purifying in the “Purification” section.</p>
 <p>The heart steers the organs, so it receives the greatest care. <b>Character</b> is a disposition from which actions flow easily, and it can change through training and repetition. The soul has three faculties: perception, anger and desire. The roots of virtue are four:</p>
 <table class="tq-t">
  <tr><th>Root</th><th>Its educational meaning</th></tr>
  <tr><td>Wisdom</td><td>Perceiving what is right and directing knowledge well</td></tr>
  <tr><td>Courage</td><td>Mastering anger, and boldness in its place without recklessness or cowardice</td></tr>
  <tr><td>Chastity</td><td>Mastering desire according to the Sacred Law, without greed and without suppressing what is due</td></tr>
  <tr><td>Justice</td><td>Harmony of the faculties and virtues, and giving every right its due without wrongdoing</td></tr>
 </table>
 <h4>The general method of treatment</h4>
 <ol>
  <li>Know the illness: its reality, harm and causes, and the opposite virtue and its benefits.</li>
  <li>Look for it in yourself, and do not always justify your behaviour.</li>
  <li>Benefit from a sincere friend who alerts you, and from valid criticism even from someone who dislikes you.</li>
  <li>Let people's dealings with you be a mirror that reveals the faults in your conduct.</li>
  <li>Identify the cause and remove it, then practise the behaviour opposite to the vice.</li>
  <li>Repeat it until it takes root, then protect it with good company, knowledge and practice.</li>
  <li>Watch for balance, so you do not move from one vice to its blameworthy opposite.</li>
 </ol>
 <p class="tq-note">In spiritual exercises and self-review the rule of moderation applies: they must never turn into starving, deprivation or harming oneself.</p>
 <h4>Focused examples of treatment</h4>
 <table class="tq-t">
  <tr><th>Illness</th><th>Remedy and practice</th></tr>
  <tr><td>Showing off and love of praise</td><td><b>Sincerity:</b> examine your motive, strengthen hidden deeds, stop seeking status through worship</td></tr>
  <tr><td>Arrogance</td><td><b>Humility:</b> accept the truth from whoever brings it, and stop looking down on people</td></tr>
  <tr><td>Self-admiration</td><td>Remember God's favour, your need of Him, and your shortcomings</td></tr>
  <tr><td>Envy</td><td><b>Goodwill and lawful emulation:</b> dislike wishing a blessing away, and do good to its owner</td></tr>
  <tr><td>Rancour and anger</td><td><b>A clear heart and forbearance:</b> control your reaction, avoid transgression, seek reconciliation</td></tr>
  <tr><td>Miserliness and extravagance</td><td><b>Generosity and moderation:</b> fulfil rights and spend with measure</td></tr>
  <tr><td>Greed, love of the world, long hopes</td><td><b>Contentment, detachment, remembering death:</b> use wealth without being its slave</td></tr>
  <tr><td>Suspicion</td><td><b>Verification and good opinion,</b> without ignoring clear evidence</td></tr>
  <tr><td>Impatience, discontent, ingratitude</td><td><b>Patience, contentment and gratitude,</b> while striving lawfully to change one's situation</td></tr>
  <tr><td>Feeling safe from God's plan and despairing of His mercy</td><td>Combine fear and hope, without self-deception or despair</td></tr>
  <tr><td>Laziness, procrastination, haste</td><td>Effort, promptness and deliberation, each in its place</td></tr>
  <tr><td>Cheating, betrayal, treachery</td><td>Truthfulness, trustworthiness, loyalty and returning rights</td></tr>
  <tr><td>Persisting in sin</td><td>Repentance, cutting off the causes, renewing self-review</td></tr>
 </table>
 <h4>The seven ruinous vices</h4>
 <p>The most dangerous vices are seven: <b>disbelief, innovation, showing off, arrogance, envy, miserliness and extravagance</b>, the first four being the gravest.</p>
 <p class="tq-note">The meanings of these terms and the limits of applying their rulings depend on jurisprudential detail. Lists of illnesses are a tool for examining oneself, not for hasty judgement of others.</p>
</details>

<details><summary>6. Taqwa (2): guarding the tongue and the other organs</summary>
 <h4>Guarding the tongue</h4>
 <p>Reforming the tongue is not limited to avoiding backbiting. It covers speech about belief, truthfulness, people's honour, disagreement, contracts, teaching, exhortation, remembrance and supplication, and silence too. Its topics are six:</p>
 <ol>
  <li>Speech that is forbidden in principle.</li>
  <li>Speech habits: joking, praise, poetry, rhymed prose and idle talk.</li>
  <li>Speech in dealings and transactions.</li>
  <li>Worship that benefits others: teaching and reminding.</li>
  <li>Personal worship: recitation, remembrance and supplication.</li>
  <li>The faults of keeping silent about a duty.</li>
 </ol>
 <p><b>How to realise it:</b> before speaking, ask yourself four questions:</p>
 <ul>
  <li>Is it true?</li>
  <li>Is it beneficial?</li>
  <li>Is it the right place for it?</li>
  <li>Does it respect the rights of others?</li>
 </ul>
 <p>Then:</p>
 <ul>
  <li>Give up lying, backbiting, gossip, mockery, insults, false testimony and revealing secrets.</li>
  <li>Mend your speech when angry.</li>
  <li>Learn the rulings of the contracts you make.</li>
  <li>Advise with knowledge and gentleness.</li>
 </ul>
 <p class="tq-note">Do not use silence as an excuse to withhold testimony, teaching or advice that is due from you.</p>

 <h4>The other organs</h4>
 <div class="tq-organs">
  <div><b>Ears</b><span class="neg">Emptying</span>Beware of deliberately listening to what is not permitted, such as backbiting and gossip.<span class="pos">Balance</span>Distinguish incidental hearing from intentional listening, taking necessity and exceptions into account.</div>
  <div><b>Eyes</b><span class="neg">Emptying</span>Lowering the gaze, and respecting privacy and nakedness.<span class="pos">Balance</span>Keeping to the limits of need in medical treatment, testimony and the like.</div>
  <div><b>Hands</b><span class="neg">Emptying</span>Preventing harm, aggression, theft and wrongful taking.<span class="pos">Adorning</span>Fulfilling trusts, doing good, and respecting the rights of people and animals.</div>
  <div><b>Stomach</b><span class="neg">Emptying</span>Leaving the forbidden and harmful excess.<span class="pos">Adorning</span>Seeking the lawful in earnings and food, and observing the manners of eating and drinking.</div>
  <div><b>Private parts</b><span class="neg">Emptying</span>Protecting relationships and keeping their limits.<span class="pos">Adorning</span>Chastity, and keeping the rulings of married life, purification and relieving oneself.</div>
  <div><b>Feet</b><span class="neg">Emptying</span>Not walking towards sin and wrongdoing, and respecting property and sanctities.<span class="pos">Adorning</span>Walking towards duty and good.</div>
  <div><b>The body in general</b><span class="neg">Emptying</span>Leaving injustice, usurpation and disobedience to parents.<span class="pos">Adorning</span>Covering one's nakedness, observing the rulings of clothing and dwelling, honouring parents, and fulfilling rights and duties.</div>
 </div>
 <p class="tq-note">Taqwa ends with an emphasis on the rights of people and animals. Dealings, trustworthiness and mercy are the test of purification, not something added outside the path.</p>
</details>

<details><summary>7. Chapter three: things mistaken for piety and scrupulousness</summary>
 <h4>Section 1: Excessive scrupulousness about purity and impurity</h4>
 <p>Forms of blameworthy rigour include:</p>
 <ul>
  <li>Pouring too much water, and repeating washing beyond the limit.</li>
  <li>Washing what is pure out of imagination, and inspecting without any sign.</li>
  <li>Reserving utensils that the obsessive will not accept any substitute for.</li>
  <li>The resulting loss of congregational prayer, prayer itself, remembrance and others' rights.</li>
 </ul>
 <p>The treatment rests on four points:</p>
 <ol>
  <li>This rigour goes against the Prophet's guidance.</li>
  <li>The blame of obsessive doubt (waswasa) and its harms.</li>
  <li>Its cure.</li>
  <li>The differences among jurists, and the principles of purity and impurity.</li>
 </ol>
 <p>Among the principles: <b>things are pure by default, and certainty is not removed by doubt</b>. The obsessive is directed to take the recognised latitude until the doubts go away.</p>
 <p><b>How to realise it:</b> learn the ruling, perform the worship accordingly, do not repeat it merely because of doubt, and do not keep on inspecting.</p>
 <p class="tq-note">Do not let outward cleanliness become an excuse for neglecting to purify the heart of showing off and arrogance, or a reason to lose a duty.</p>

 <h4>Section 2: Scrupulousness about wealth and food without imagination</h4>
 <p>Criticised is the one who refuses the food of those paid from endowments or the public treasury on grounds of general doubt, yet is lax in other dealings. The ruling depends on the validity of entitlement, transaction and conditions, not on one's impression of the owner. Generalising doubt about wealth and dealings leads to hardship.</p>
 <p class="tq-note">What is meant here is the educational idea; rulings on old cases are not mechanically applied to every modern salary or income.</p>
 <p><b>How to realise it:</b></p>
 <ul>
  <li>Avoid what is known to be forbidden.</li>
  <li>Verify through clear signs.</li>
  <li>Learn the rulings of your earnings and contracts.</li>
  <li>Do not declare wealth forbidden on the basis of imagination.</li>
  <li>Respect rights, and do not look down on people with a show of scrupulousness that is not based on knowledge.</li>
 </ul>

 <h4>Section 3: Deeds taken as acts of devotion without verification</h4>
 <p>Examples include:</p>
 <ul>
  <li>Certain endowments and bequests.</li>
  <li>Payment for recitation and remembrance, and gifting the reward.</li>
  <li>Hospitality gatherings after a death.</li>
  <li>Requiring people to spend the night at a grave, and building over graves.</li>
 </ul>
 <p>The scale is the soundness of the deed and the intention, while beware of making worship a means to worldly gain.</p>
 <p><b>How to realise it:</b> verify the origin, ruling and conditions of a deed, correct your intention, and do not turn a custom into a religious obligation just because it is widespread.</p>
 <p class="tq-note">Questions of payment, endowment and gifting reward involve detail and disagreement; they are not presented as agreed rulings, and their different forms are not treated alike.</p>
</details>

<details><summary>8. How to realise the path: the seeker's programme</summary>
 <p>This order is drawn from the path; it is not an obligatory litany:</p>
 <ol>
  <li><b>Correct your direction:</b> seek God's pleasure, and review your intention in worship, learning and service.</li>
  <li><b>Learn what you need:</b> know the rulings of your worship, work and family, and act on them before unnecessary broadening.</li>
  <li><b>Repent of wrongdoing:</b> leave it, regret it, resolve not to return, and restore people's rights accordingly.</li>
  <li><b>Establish the obligations:</b> setting priorities comes before adding voluntary acts.</li>
  <li><b>Choose one visible illness to treat:</b> understand its cause, note the situations where it appears, and practise its opposite.</li>
  <li><b>Guard the organs:</b> identify where the flaw lies — in speech, sight, hearing or dealings — and cut off its causes.</li>
  <li><b>Strengthen your bond with God:</b> through the Qur'an, prayer, remembrance, supplication and reflection, keeping to the Sunnah, your ability and consistency.</li>
  <li><b>Keep spiritual vigilance (murabata):</b>
   <ul>
    <li><b>Setting conditions</b> at the start of the day.</li>
    <li><b>Watchfulness</b> while acting.</li>
    <li><b>Self-reckoning</b> afterwards.</li>
    <li><b>Self-reproach and correction</b> when falling short.</li>
   </ul>
   <b>Self-discipline</b> is also mentioned with them; its applications are kept within what causes no harm and creates no unlawful burden.</li>
  <li><b>Seek sincere company:</b> accept being alerted, verify criticism, and follow the truth without partisanship for individuals.</li>
  <li><b>Review the fruit:</b> more truthfulness, greater trustworthiness, less anger, rights respected, steadier worship, more humility and mercy.</li>
 </ol>
 <h4>Daily self-review questions</h4>
 <ul>
  <li>Which duty did I fulfil or neglect?</li>
  <li>Which illness appeared in my heart?</li>
  <li>Whom did I hurt by word or deed?</li>
  <li>Which right needs to be returned?</li>
  <li>What specific correction will I make tomorrow?</li>
 </ul>
 <p class="tq-note">You can note your answers to these questions in “Today's note”, and log the guarding of your organs in the “Purification” section.</p>
</details>

<details><summary>9. The path in one paragraph</summary>
 <p>The Muhammadan Path is following the Messenger of God ﷺ in belief, worship, character and dealings, and taking the Qur'an and the Sunnah as the scale for reforming a person's outer and inner self.</p>
 <p>It rests on three foundations: sound belief, learning the rulings of religion one needs, and realising taqwa by fulfilling obligations and avoiding the forbidden.</p>
 <p>Its purification is achieved in two ways:</p>
 <ul>
  <li>Emptying the heart of showing off, arrogance, self-admiration, envy and its other illnesses, and adorning it with sincerity, humility, gratitude, patience, mercy and truthfulness.</li>
  <li>Guarding the tongue and the organs, and fulfilling the rights of people.</li>
 </ul>
 <p>Its follower walks with knowledge and practice, watchfulness and self-reckoning, and moderate, constant worship, far from extremism, obsessive doubt and scrupulousness built on imagination. Its fruit shows in steady worship, good character, trustworthiness, justice and mercy.</p>
</details>

 <h4>Branches of the roots of virtue</h4>
 <ul>
  <li><b>Wisdom:</b> clarity of mind, good understanding, learning and memory.</li>
  <li><b>Courage:</b> patience, forbearance, pardon and endurance.</li>
  <li><b>Chastity:</b> modesty, contentment, dignity and generosity.</li>
  <li><b>Justice:</b> loyalty, good partnership, keeping family ties, reconciliation and worship.</li>
 </ul>
</details>

<details><summary>Appendix 3: The sixty faults of the tongue</summary>
 <p class="tq-note">These are headings for review, not an absolute list of prohibitions. The ruling of each form varies between forbidden, disliked and mistaken according to intention, situation and exceptions, and some are matters of scholarly disagreement. Rulings on speaking with non-mahram persons, supplication, greeting and obedience are not derived from the heading alone.</p>
 <ol>
  <li>Words of disbelief</li><li>What risks leading to disbelief</li><li>Error</li><li>Lying, including slander, false testimony and fabrication</li><li>Insinuation</li><li>Backbiting</li><li>Gossip</li><li>Mockery</li><li>Cursing</li><li>Insulting</li><li>Obscenity</li><li>Defamation and reproach</li><li>Wailing</li><li>Quarrelling</li><li>Blameworthy disputation</li><li>Blameworthy hostility</li><li>Singing and what relates to it, with detail</li><li>Revealing secrets</li><li>Indulging in falsehood</li><li>Asking for money or worldly benefit from someone with no obligation</li><li>Laypeople asking about the essence of God</li><li>Questions meant to trip up or embarrass</li><li>Errors in expression and its subtleties</li><li>Verbal hypocrisy</li><li>Being two-tongued</li><li>Wrongful intercession</li><li>Enjoining evil and forbidding good</li><li>Harsh speech, violence and violating honour</li><li>Searching for people's faults</li><li>An ignorant person opening speech before a scholar in a way contrary to the manners of learning</li><li>Talking during the call to prayer and the iqama, other than responding</li><li>Talking in prayer other than the Qur'an and transmitted remembrances</li><li>Talking during the sermon</li><li>Worldly talk from dawn until the prayer, and before sunrise</li><li>Talking in the toilet and while relieving oneself</li><li>Talking during intercourse</li><li>Cursing a Muslim, with detail in cases of injustice and not exceeding limits</li><li>Praying for a disbeliever or oppressor in words implying approval of disbelief or injustice, as opposed to praying for their guidance</li><li>Talking while the Qur'an is being recited</li><li>Worldly talk in mosques without excuse</li><li>Giving a Muslim a bad nickname</li><li>The false oath (yamin ghamus)</li><li>Swearing by other than God</li><li>Swearing often, even truthfully</li><li>Asking for leadership or judgeship</li><li>Asking to be put in charge of endowments</li><li>Seeking guardianship</li><li>Praying against oneself and wishing for death</li><li>Rejecting a brother's excuse</li><li>Interpreting the Qur'an by blameworthy opinion without knowledge</li><li>Frightening a believer without fault, and forcing him into what he dislikes</li><li>Interrupting others without necessity</li><li>A follower contradicting the one he follows in specific cases — this does not mean refusing the truth or obeying in sin</li><li>Obsessive questioning about lawfulness, purity and ownership without any sign</li><li>Two people whispering apart from a third</li><li>Speaking with an unrelated young woman, with detail — the heading does not forbid all lawful communication</li><li>Greeting a non-Muslim protected citizen without need — a matter of detail and disagreement</li><li>Greeting someone relieving himself</li><li>Guiding someone who intends sin to what helps him</li><li>Permitting and authorising what is sinful</li>
 </ol>
 <h4>The faults of silence</h4>
 <p>Failing to learn what is necessary, failing to say what is obligatory, and neglecting advice and enjoining good and forbidding evil when its conditions are met. The soundness of the tongue is not constant abstention from speech, but putting both speech and silence in their proper place.</p>
</details>

<div class="tq-head">
 <h2>La Voie muhammadienne</h2>
 <p class="tq-sub">Suivre le Prophète ﷺ extérieurement et intérieurement : définition, fondements, chapitres et mise en pratique</p>
 <p class="tq-src">Les règles détaillées et les points de divergence se vérifient auprès des gens de science.</p>
</div>

<div class="tq-map" aria-label="Carte de la voie">
 <span>Suivi et juste milieu</span><i>→</i><span>Croyance correcte</span><i>→</i><span>Science de son état</span><i>→</i><span>Piété (taqwa)</span><i>→</i><span>Purifier le cœur et les organes</span><i>→</i><span>Droiture et agrément de Dieu</span>
</div>

<details open><summary>1. Définition et but de la Voie muhammadienne</summary>
 <p><b>La Voie muhammadienne</b> consiste à suivre le Messager de Dieu ﷺ dans la croyance, la parole, le caractère et les actes, et à faire de sa guidance la balance par laquelle le cheminant corrige l'extérieur et l'intérieur de ses œuvres.</p>
 <ul>
  <li><b>Son but :</b> l'agrément de Dieu le Très-Haut et le succès dans l'au-delà.</li>
  <li><b>Ses moyens :</b> la science, l'action, la piété (taqwa) et la purification de l'âme.</li>
  <li><b>Sa finalité :</b> que chaque cheminant confronte ses œuvres à la voie du Prophète, et distingue ainsi le juste de l'erroné.</li>
 </ul>
 <h4>Deux maux que la voie soigne</h4>
 <ul>
  <li><b>L'adorateur sans science :</b> il s'efforce dans l'adoration en ignorant les règles de la religion, et dépasse ainsi ses limites.</li>
  <li><b>Le savant sans pratique :</b> il connaît la règle mais néglige de l'appliquer.</li>
 </ul>
 <p>La voie réunit donc trois choses : <b>une connaissance juste, une volonté sincère et une conduite droite</b>.</p>
 <h4>Le sens de la purification</h4>
 <ul>
  <li><b>Le vidage (takhliya) :</b> débarrasser le cœur des traits blâmables.</li>
  <li><b>L'ornement (tahliya) :</b> l'embellir de traits louables.</li>
  <li><b>La garde des organes :</b> préserver les membres du péché jusqu'à ce que la droiture devienne une disposition ancrée.</li>
 </ul>
 <p class="tq-note">Les invocations et les adorations sont des moyens qui renforcent la droiture ; elles ne se séparent jamais de l'honnêteté dans les rapports et du respect des droits d'autrui.</p>
</details>

<details><summary>2. Les trois fondements qui engagent le cheminant</summary>
 <p>Ce qui incombe au cheminant se résume en trois : <b>la croyance correcte, la science de son état, et la piété</b>. Ce sont les fondements et les piliers pratiques de la voie.</p>
 <h4>Premier fondement : la croyance correcte</h4>
 <p>Connaître la perfection qui revient à Dieu et l'imperfection dont Il est exempt ; croire au message, à la révélation, au Jour dernier et au décret ; et corriger ses représentations religieuses. On ne prétend pas au consensus là où les savants divergent.</p>
 <h4>Deuxième fondement : la science de son état</h4>
 <p>Apprendre ce dont le cheminant a besoin pour établir sa religion dans sa réalité :</p>
 <ul>
  <li>La purification, la prière et le jeûne, ainsi que la zakat et le hajj lorsqu'ils deviennent obligatoires.</li>
  <li>Les règles de son métier, de son commerce et de sa famille, selon sa situation.</li>
  <li>Connaître les maladies de son cœur et leurs remèdes.</li>
 </ul>
 <p class="tq-note">La science nécessaire ne se remplace pas par l'accumulation d'informations qui ne changent rien à la pratique.</p>
 <h4>Troisième fondement : la piété (taqwa)</h4>
 <p>Obéir à ce qui est ordonné et éviter ce qui est interdit, intérieurement et extérieurement. Elle comprend l'abandon de l'interdit et l'accomplissement de l'obligatoire, car délaisser une obligation est en soi une transgression. Les trois fondements reviennent tous à la taqwa, qui englobe la science requise, la croyance correcte et l'action.</p>
</details>

<details><summary>3. Premier chapitre : le suivi et le juste milieu</summary>
 <h4>Section 1 : S'attacher au Coran et à la Sunna</h4>
 <p>Le Coran et la Sunna sont la référence de la croyance, de l'adoration et de la conduite. La récitation va de pair avec la méditation et la pratique, et l'amour du Prophète ﷺ avec le fait de le suivre. Le consensus et l'analogie reviennent à ces deux sources : revenir à la révélation ne signifie pas abolir le fiqh ni se passer de ses savants.</p>
 <p><b>En pratique :</b></p>
 <ul>
  <li>Apprenez les obligations et les Sunnas dont vous avez besoin.</li>
  <li>Vérifiez les règles de vos pratiques d'adoration.</li>
  <li>Interrogez les gens de science en cas de doute.</li>
  <li>Soumettez vos paroles et vos ressentis spirituels à la Loi.</li>
 </ul>
 <p class="tq-note">Ne faites jamais d'un rêve, d'un dévoilement ou de l'état d'un maître un argument pour délaisser une obligation ou commettre un interdit.</p>

 <h4>Section 2 : Se garder des innovations et des mauvaises coutumes</h4>
 <p>On distingue le sens linguistique de l'innovation (bid'a) de son sens légal, et les coutumes des actes d'adoration. Tout moyen de vie nouveau n'est pas une adoration inventée. Les dévoilements, les prodiges et la vision des prophètes ne justifient jamais de contredire la Loi, et les maîtres de la voie s'accordent sur la nécessité du suivi.</p>
 <p><b>En pratique :</b></p>
 <ul>
  <li>Examinez l'origine et le contenu d'une pratique, ainsi que l'obligation ou le mérite particulier qu'on lui attribue.</li>
  <li>Distinguez un moyen d'organisation d'un acte d'adoration.</li>
  <li>Vérifiez avant de généraliser des règles dans les questions d'ijtihad.</li>
 </ul>
 <p class="tq-note">Le critère est que l'acte soit légitime, et non simplement habituel ou émouvant.</p>

 <h4>Section 3 : La mesure dans les œuvres</h4>
 <p>Ni excès ni négligence. L'adoration tient compte des capacités, de la constance et des droits de soi-même, de la famille et des autres. Ce qui est rapporté des efforts intenses de certains anciens cède le pas à ce qui est établi de la guidance prophétique, et un récit non vérifié ne sert pas à imposer sa difficulté à tous.</p>
 <p><b>En pratique :</b></p>
 <ul>
  <li>Placez les obligations en premier.</li>
  <li>Choisissez des œuvres surérogatoires que vous pouvez maintenir.</li>
  <li>Examinez l'effet de votre programme sur vos devoirs, votre santé et votre travail.</li>
 </ul>
 <p class="tq-note">La fatigue n'est pas un but en soi, et l'adoration ne doit jamais faire négliger un autre devoir.</p>
</details>

<details><summary>4. Deuxième chapitre : la croyance et la science</summary>
 <p>Les points importants de la Loi muhammadienne sont trois : la croyance, les sciences, puis la taqwa, à laquelle sont consacrées les deux parties suivantes.</p>
 <h4>Section 1 : La croyance correcte</h4>
 <p>Elle couvre les questions suivantes :</p>
 <ul>
  <li>L'unicité divine et les attributs de Dieu, le Coran, et la prophétie.</li>
  <li>Les actes des serviteurs et leur libre choix ; le décret, le terme de la vie et la subsistance.</li>
  <li>Le barzakh, la Résurrection, la récompense et le châtiment.</li>
  <li>Le Voyage nocturne et l'Ascension, et les signes de l'Heure.</li>
  <li>Les péchés, et le rang des Compagnons.</li>
  <li>Des questions liées à la communauté musulmane et aux règles religieuses.</li>
 </ul>
 <p><b>Mise en pratique :</b></p>
 <ul>
  <li>Apprenez la foi auprès de sources fiables.</li>
  <li>Unissez révérence, amour, crainte et espérance.</li>
  <li>Recherchez davantage de certitude.</li>
  <li>Évitez les débats dont vous n'avez pas les outils.</li>
 </ul>
 <p class="tq-note">Ne transformez pas ces questions en jugements sur la foi de personnes précises.</p>

 <h4>Section 2 : Les sciences recherchées pour autre chose qu'elles-mêmes</h4>
 <p>Les sciences sont de trois sortes :</p>
 <ul>
  <li><b>Ordonnées :</b> les obligations individuelles liées à la situation de chacun, et les obligations collectives dont la communauté a besoin.</li>
  <li><b>Interdites :</b> comme la magie, ce qui mène à l'égarement ou au préjudice, et la polémique artificielle. La critique de la théologie spéculative, de l'astrologie et de certaines sciences se comprend dans son contexte, et ne s'étend pas aux sciences utiles ni aux études modernes à cause d'un simple nom.</li>
  <li><b>Recommandées :</b> l'approfondissement utile de la science, la connaissance des Sunnas, des vertus et des convenances, et le complément de ce que la communauté assure déjà.</li>
 </ul>
 <p><b>Mise en pratique :</b></p>
 <ul>
  <li>Déterminez ce qui vous incombe maintenant, et apprenez-le auprès de ceux qui le maîtrisent.</li>
  <li>Mettez en pratique ce que vous avez appris.</li>
  <li>Élargissez ensuite à ce qui est utile.</li>
  <li>Rectifiez votre intention dans l'apprentissage et l'enseignement : le but n'est ni de l'emporter dans les débats, ni la notoriété, ni le rang auprès des gens.</li>
 </ul>
</details>

<details><summary>5. La taqwa (1) : réformer le cœur</summary>
 <p>La taqwa est le fondement le plus complet ; elle a son mérite, son sens et ses voies. <b>La taqwa</b> consiste à préserver l'âme de ce qui lui nuit dans l'au-delà, et elle s'obtient à la fois par l'action et par l'abstention.</p>
 <p>Ses voies pratiques :</p>
 <ul>
  <li>Garder le cœur.</li>
  <li>Garder la langue, les oreilles, les yeux, les mains, le ventre, les parties intimes et les pieds.</li>
  <li>Garder le corps en général.</li>
 </ul>
 <p class="tq-note">Ce sont les organes que vous purifiez dans la section « Purification ».</p>
 <p>Le cœur dirige les organes ; il reçoit donc le plus grand soin. <b>Le caractère</b> est une disposition d'où les actes découlent avec aisance, et il peut changer par l'éducation et la répétition. L'âme a trois facultés : la perception, la colère et le désir. Les racines des vertus sont quatre :</p>
 <table class="tq-t">
  <tr><th>Racine</th><th>Son sens éducatif</th></tr>
  <tr><td>La sagesse</td><td>Percevoir le juste et bien orienter la connaissance</td></tr>
  <tr><td>Le courage</td><td>Maîtriser la colère, et oser à bon escient sans témérité ni lâcheté</td></tr>
  <tr><td>La chasteté</td><td>Maîtriser le désir selon la Loi, sans avidité et sans étouffer ce qui est dû</td></tr>
  <tr><td>La justice</td><td>L'harmonie des facultés et des vertus, et le respect des droits sans injustice</td></tr>
 </table>
 <h4>La méthode générale de traitement</h4>
 <ol>
  <li>Connaissez la maladie : sa réalité, son tort, ses causes, et la vertu opposée avec ses bienfaits.</li>
  <li>Recherchez-la en vous, sans toujours justifier votre comportement.</li>
  <li>Profitez d'un ami sincère qui vous avertit, et de la critique juste, même venant de quelqu'un qui ne vous aime pas.</li>
  <li>Faites des rapports des gens avec vous un miroir qui révèle les défauts de votre conduite.</li>
  <li>Identifiez la cause et supprimez-la, puis exercez-vous au comportement opposé au vice.</li>
  <li>Répétez jusqu'à ce que cela s'enracine, puis préservez-le par la bonne compagnie, la science et la pratique.</li>
  <li>Veillez à l'équilibre, pour ne pas passer d'un vice à son extrême opposé, tout aussi blâmable.</li>
 </ol>
 <p class="tq-note">Dans les exercices spirituels et l'examen de soi, la règle de la mesure s'applique : ils ne doivent jamais devenir privation de nourriture, ascèse excessive ou atteinte à soi-même.</p>
 <h4>Exemples ciblés de traitement</h4>
 <table class="tq-t">
  <tr><th>Maladie</th><th>Remède et pratique</th></tr>
  <tr><td>L'ostentation et l'amour des louanges</td><td><b>La sincérité :</b> examiner sa motivation, renforcer les œuvres cachées, cesser de chercher un rang par l'adoration</td></tr>
  <tr><td>L'orgueil</td><td><b>L'humilité :</b> accepter la vérité de quiconque l'apporte, cesser de mépriser les gens</td></tr>
  <tr><td>L'autosatisfaction</td><td>Se rappeler la grâce de Dieu, son besoin de Lui et ses manquements</td></tr>
  <tr><td>L'envie</td><td><b>Le bon conseil et l'émulation licite :</b> détester souhaiter la disparition d'un bienfait, et faire du bien à son détenteur</td></tr>
  <tr><td>La rancune et la colère</td><td><b>Un cœur sain et la longanimité :</b> maîtriser sa réaction, ne pas transgresser, rechercher la réconciliation</td></tr>
  <tr><td>L'avarice et le gaspillage</td><td><b>La générosité et la mesure :</b> s'acquitter des droits, dépenser avec mesure</td></tr>
  <tr><td>La convoitise, l'amour du monde, les longs espoirs</td><td><b>Le contentement, le détachement, le rappel de la mort :</b> utiliser l'argent sans en être l'esclave</td></tr>
  <tr><td>La mauvaise opinion</td><td><b>La vérification et la bonne opinion,</b> sans ignorer les preuves évidentes</td></tr>
  <tr><td>L'impatience, le mécontentement, l'ingratitude</td><td><b>La patience, l'agrément et la gratitude,</b> tout en œuvrant licitement à changer sa situation</td></tr>
  <tr><td>Se croire à l'abri du dessein de Dieu, désespérer de Sa miséricorde</td><td>Unir crainte et espérance, sans illusion ni désespoir</td></tr>
  <tr><td>La paresse, la procrastination, la précipitation</td><td>L'effort, l'empressement et la réflexion, chacun à sa place</td></tr>
  <tr><td>La tricherie, la trahison, la perfidie</td><td>La véracité, la loyauté, la fidélité et la restitution des droits</td></tr>
  <tr><td>La persistance dans le péché</td><td>Le repentir, couper les causes, renouveler l'examen de soi</td></tr>
 </table>
 <h4>Les sept vices qui perdent</h4>
 <p>Les vices les plus dangereux sont sept : <b>la mécréance, l'innovation, l'ostentation, l'orgueil, l'envie, l'avarice et le gaspillage</b>, les quatre premiers étant les plus graves.</p>
 <p class="tq-note">Le sens de ces termes et les limites de l'application de leurs règles relèvent du détail juridique. Les listes de maladies sont un outil pour s'examiner soi-même, non pour juger hâtivement les autres.</p>
</details>

<details><summary>6. La taqwa (2) : garder la langue et les autres organes</summary>
 <h4>Garder la langue</h4>
 <p>Réformer la langue ne se limite pas à éviter la médisance. Cela concerne la parole sur la croyance, la véracité, l'honneur des gens, les divergences, les contrats, l'enseignement, l'exhortation, l'invocation et la prière, ainsi que le silence. Ses thèmes sont six :</p>
 <ol>
  <li>La parole interdite en principe.</li>
  <li>Les habitudes de parole : plaisanterie, éloge, poésie, prose rimée et bavardage.</li>
  <li>La parole dans les transactions.</li>
  <li>L'adoration profitable aux autres : enseigner et rappeler.</li>
  <li>L'adoration personnelle : récitation, dhikr et invocation.</li>
  <li>Les défauts du silence sur un devoir.</li>
 </ol>
 <p><b>Mise en pratique :</b> avant de parler, posez-vous quatre questions :</p>
 <ul>
  <li>Est-ce vrai ?</li>
  <li>Est-ce utile ?</li>
  <li>Est-ce le bon moment ?</li>
  <li>Cela respecte-t-il les droits d'autrui ?</li>
 </ul>
 <p>Ensuite :</p>
 <ul>
  <li>Abandonnez le mensonge, la médisance, la calomnie, la moquerie, l'insulte, le faux témoignage et la divulgation des secrets.</li>
  <li>Corrigez vos paroles dans la colère.</li>
  <li>Apprenez les règles des contrats que vous concluez.</li>
  <li>Conseillez avec science et douceur.</li>
 </ul>
 <p class="tq-note">Ne faites pas du silence un prétexte pour taire un témoignage, un enseignement ou un conseil qui vous incombe.</p>

 <h4>Les autres organes</h4>
 <div class="tq-organs">
  <div><b>Les oreilles</b><span class="neg">Vidage</span>Se garder d'écouter délibérément ce qui n'est pas permis, comme la médisance et la calomnie.<span class="pos">Équilibre</span>Distinguer l'audition fortuite de l'écoute intentionnelle, en tenant compte de la nécessité et des exceptions.</div>
  <div><b>Les yeux</b><span class="neg">Vidage</span>Baisser le regard, respecter l'intimité et la nudité d'autrui.<span class="pos">Équilibre</span>S'en tenir aux limites du besoin dans les soins, le témoignage et autres.</div>
  <div><b>Les mains</b><span class="neg">Vidage</span>Empêcher le tort, l'agression, le vol et la prise injuste.<span class="pos">Ornement</span>Rendre les dépôts, faire le bien, respecter les droits des humains et des animaux.</div>
  <div><b>Le ventre</b><span class="neg">Vidage</span>Délaisser l'interdit et l'excès nuisible.<span class="pos">Ornement</span>Rechercher le licite dans le gain et la nourriture, respecter les convenances du manger et du boire.</div>
  <div><b>Les parties intimes</b><span class="neg">Vidage</span>Préserver les relations et respecter leurs limites.<span class="pos">Ornement</span>La chasteté, et le respect des règles de la vie conjugale, de la purification et des besoins naturels.</div>
  <div><b>Les pieds</b><span class="neg">Vidage</span>Ne pas marcher vers le péché et l'injustice, respecter les biens et les choses sacrées.<span class="pos">Ornement</span>Marcher vers le devoir et le bien.</div>
  <div><b>Le corps en général</b><span class="neg">Vidage</span>Délaisser l'injustice, l'usurpation et la désobéissance aux parents.<span class="pos">Ornement</span>Couvrir sa nudité, respecter les règles du vêtement et du logement, honorer ses parents, s'acquitter des droits et des devoirs.</div>
 </div>
 <p class="tq-note">La taqwa se conclut par l'insistance sur les droits des humains et des animaux. Les rapports, la loyauté et la miséricorde sont l'épreuve de la purification, et non un ajout extérieur à la voie.</p>
</details>

<details><summary>7. Troisième chapitre : ce qu'on prend à tort pour de la piété et du scrupule</summary>
 <h4>Section 1 : L'excès de scrupule sur la pureté et l'impureté</h4>
 <p>Parmi les formes de rigueur blâmable :</p>
 <ul>
  <li>Verser trop d'eau et répéter les lavages au-delà de la limite.</li>
  <li>Laver ce qui est pur par imagination, et inspecter sans indice.</li>
  <li>Réserver des ustensiles que l'obsédé n'accepte pas de remplacer.</li>
  <li>La perte qui en résulte : prière en commun, prière elle-même, dhikr et droits d'autrui.</li>
 </ul>
 <p>Le traitement repose sur quatre points :</p>
 <ol>
  <li>Cette rigueur contredit la guidance prophétique.</li>
  <li>Le blâme de l'obsession (waswasa) et ses méfaits.</li>
  <li>Son remède.</li>
  <li>Les divergences des juristes et les principes de la pureté et de l'impureté.</li>
 </ol>
 <p>Parmi les principes : <b>les choses sont pures à l'origine, et la certitude n'est pas levée par le doute</b>. On oriente l'obsédé vers la latitude reconnue jusqu'à ce que ses doutes disparaissent.</p>
 <p><b>Mise en pratique :</b> apprenez la règle, accomplissez l'adoration en conséquence, ne la refaites pas pour un simple doute, et ne prolongez pas l'inspection.</p>
 <p class="tq-note">Ne faites pas de la propreté extérieure un prétexte pour négliger la purification du cœur de l'ostentation et de l'orgueil, ni une cause de perte d'un devoir.</p>

 <h4>Section 2 : Le scrupule sur l'argent et la nourriture sans imagination</h4>
 <p>On critique celui qui refuse la nourriture de ceux qui sont rémunérés par les fondations pieuses ou le trésor public sous prétexte d'un doute général, tout en étant laxiste dans d'autres transactions. La règle dépend de la validité du droit, de la transaction et des conditions, et non de l'impression que l'on a du propriétaire. Généraliser le doute sur l'argent et les transactions mène à la gêne.</p>
 <p class="tq-note">Il s'agit ici de l'idée éducative ; les règles des cas anciens ne s'appliquent pas mécaniquement à tout salaire ou revenu moderne.</p>
 <p><b>Mise en pratique :</b></p>
 <ul>
  <li>Évitez l'interdit avéré.</li>
  <li>Vérifiez à partir d'indices clairs.</li>
  <li>Apprenez les règles de vos gains et de vos contrats.</li>
  <li>Ne déclarez pas un bien interdit sur la base de l'imagination.</li>
  <li>Respectez les droits, et ne vous élevez pas au-dessus des gens par une apparence de scrupule sans fondement de science.</li>
 </ul>

 <h4>Section 3 : Des œuvres prises pour des actes de dévotion sans vérification</h4>
 <p>Par exemple :</p>
 <ul>
  <li>Certaines fondations pieuses et certains legs.</li>
  <li>La rémunération de la récitation et du dhikr, et le don de la récompense.</li>
  <li>Les repas offerts lors des décès.</li>
  <li>Imposer de passer la nuit auprès d'une tombe, et construire sur les tombes.</li>
 </ul>
 <p>La balance est la validité de l'œuvre et de l'intention, en se gardant de faire de l'adoration un moyen pour ce bas monde.</p>
 <p><b>Mise en pratique :</b> vérifiez l'origine, la règle et les conditions de l'œuvre, rectifiez votre intention, et ne faites pas d'une coutume une obligation religieuse simplement parce qu'elle est répandue.</p>
 <p class="tq-note">Les questions de rémunération, de fondation pieuse et de don de la récompense comportent des détails et des divergences ; elles ne se présentent pas comme des règles unanimes, et leurs différentes formes ne s'assimilent pas.</p>
</details>

<details><summary>8. Comment réaliser la voie : le programme du cheminant</summary>
 <p>Cet ordre est tiré de la voie ; ce n'est pas un wird obligatoire :</p>
 <ol>
  <li><b>Rectifiez votre orientation :</b> recherchez l'agrément de Dieu, et revoyez votre intention dans l'adoration, la science et le service.</li>
  <li><b>Apprenez ce qui vous incombe :</b> connaissez les règles de votre adoration, de votre travail et de votre famille, et appliquez-les avant de vous étendre inutilement.</li>
  <li><b>Repentez-vous de la transgression :</b> abandonnez-la, regrettez-la, résolvez de ne pas y revenir, et restituez les droits d'autrui selon le cas.</li>
  <li><b>Accomplissez les obligations :</b> fixer les priorités passe avant l'ajout d'œuvres surérogatoires.</li>
  <li><b>Choisissez une maladie apparente à soigner :</b> comprenez sa cause, notez les situations où elle apparaît, et exercez-vous à son contraire.</li>
  <li><b>Gardez les organes :</b> repérez où se situe la faille — parole, regard, écoute ou rapports — et coupez-en les causes.</li>
  <li><b>Renforcez votre lien avec Dieu :</b> par le Coran, la prière, le dhikr, l'invocation et la méditation, en respectant la Sunna, vos capacités et la constance.</li>
  <li><b>Tenez-vous à la vigilance (murabata) :</b>
   <ul>
    <li><b>L'engagement</b> au début de la journée.</li>
    <li><b>La vigilance</b> pendant l'action.</li>
    <li><b>Le bilan</b> après.</li>
    <li><b>Le reproche et la correction</b> en cas de manquement.</li>
   </ul>
   On y mentionne aussi <b>la sanction de soi</b>, dont les applications restent dans ce qui ne cause aucun tort ni n'impose de charge illégitime.</li>
  <li><b>Recherchez une compagnie sincère :</b> acceptez d'être averti, vérifiez la critique, et suivez la vérité sans esprit de parti envers les personnes.</li>
  <li><b>Examinez le fruit :</b> plus de véracité, une loyauté plus grande, moins de colère, des droits respectés, une adoration plus stable, plus d'humilité et de miséricorde.</li>
 </ol>
 <h4>Questions du bilan quotidien</h4>
 <ul>
  <li>Quel devoir ai-je accompli ou négligé ?</li>
  <li>Quelle maladie est apparue dans mon cœur ?</li>
  <li>Qui ai-je blessé par une parole ou un acte ?</li>
  <li>Quel droit doit être restitué ?</li>
  <li>Quelle correction précise vais-je faire demain ?</li>
 </ul>
 <p class="tq-note">Vous pouvez noter vos réponses dans la « note du jour », et enregistrer la garde de vos organes dans la section « Purification ».</p>
</details>

<details><summary>9. La voie en un paragraphe</summary>
 <p>La Voie muhammadienne consiste à suivre le Messager de Dieu ﷺ dans la croyance, l'adoration, le caractère et les rapports, et à faire du Coran et de la Sunna la balance qui réforme l'extérieur et l'intérieur de l'être humain.</p>
 <p>Elle repose sur trois fondements : la croyance correcte, l'apprentissage des règles de religion dont on a besoin, et la réalisation de la taqwa en accomplissant les obligations et en évitant les interdits.</p>
 <p>Sa purification se réalise de deux façons :</p>
 <ul>
  <li>Vider le cœur de l'ostentation, de l'orgueil, de l'autosatisfaction, de l'envie et de ses autres maladies, et l'orner de sincérité, d'humilité, de gratitude, de patience, de miséricorde et de véracité.</li>
  <li>Garder la langue et les organes, et s'acquitter des droits d'autrui.</li>
 </ul>
 <p>Celui qui la suit avance par la science et la pratique, la vigilance et le bilan, et par une adoration mesurée et constante, loin de l'extrémisme, de l'obsession et du scrupule fondé sur l'imagination. Son fruit apparaît dans une adoration droite, un bon caractère, la loyauté, la justice et la miséricorde.</p>
</details>

<details><summary>Annexe 1 : Les soixante maladies du cœur</summary>
 <ol>
  <li>La mécréance envers Dieu</li><li>L'ignorance</li><li>L'amour du pouvoir mondain</li><li>La peur du blâme et du reproche</li><li>L'amour de l'éloge et des louanges</li><li>Adhérer à une croyance innovée</li><li>Suivre ses passions</li>
  <li>L'imitation sans preuve ni vérification (on distingue croyance et pratique : le non-spécialiste peut suivre un savant qualifié dans la pratique)</li>

 <p class="tq-note">Les précisions de certains points empêchent d'étendre le blâme à toute forme de tristesse, de peur, d'amour des gens ou de l'argent. Le détail des règles se demande aux gens de science.</p>
</details>

<details><summary>Annexe 2 : Les soixante-dix-huit vertus</summary>

on</li><li>Le repentir</li><li>Le recueillement (khushu')</li><li>La certitude</li><li>La servitude envers Dieu</li><li>La liberté</li><li>La volonté spirituelle</li>

 <h4>Les branches des racines des vertus</h4>

  <li><b>La sagesse :</b> la clarté d'esprit, la bonne compréhension, l'apprentissage et la mémoire.</li>
  <li><b>Le courage :</b> la patience, la longanimité, le pardon et l'endurance.</li>
  <li><b>La chasteté :</b> la pudeur, le contentement, la gravité et la générosité.</li>
  <li><b>La justice :</b> la fidélité, le bon partenariat, les liens de parenté, la réconciliation et l'adoration.</li>

 <ol>
  <li>La parole de mécréance</li><li>Ce qui risque de mener à la mécréance</li><li>L'erreur</li><li>Le mensonge, y compris la calomnie, le faux témoignage et l'invention</li><li>L'allusion trompeuse</li><li>La médisance</li><li>Le colportage</li><li>La moquerie</li><li>La malédiction</li><li>L'insulte</li><li>L'obscénité</li><li>La diffamation et le reproche</li><li>Les lamentations</li><li>La querelle</li><li>La polémique blâmable</li><li>L'hostilité blâmable</li><li>Le chant et ce qui s'y rattache, avec des détails</li><li>Divulguer un secret</li><li>S'adonner au faux</li><li>Demander de l'argent ou un profit mondain à qui n'y est pas tenu</li><li>Le profane qui interroge sur l'essence de Dieu</li><li>Les questions faites pour piéger ou embarrasser</li><li>L'erreur d'expression et ses subtilités</li><li>L'hypocrisie verbale</li><li>Le double langage</li><li>La mauvaise intercession</li><li>Ordonner le mal et interdire le bien</li><li>La parole dure, la violence et l'atteinte à l'honneur</li><li>Rechercher les défauts des gens</li><li>L'ignorant qui prend la parole devant un savant contrairement aux convenances de l'apprentissage</li><li>Parler pendant l'appel à la prière et l'iqama, sauf pour y répondre</li><li>Parler dans la prière en dehors du Coran et des invocations transmises</li><li>Parler pendant le sermon</li><li>Les propos mondains de l'aube jusqu'à la prière, et avant le lever du soleil</li><li>Parler aux toilettes et en satisfaisant un besoin</li><li>Parler pendant l'acte conjugal</li><li>Maudire un musulman, avec des détails en cas d'injustice et sans excès</li><li>Prier pour un mécréant ou un injuste en des termes qui approuvent la mécréance ou l'injustice, contrairement à la prière pour leur bonne guidance</li><li>Parler pendant la récitation du Coran</li><li>Les propos mondains dans les mosquées sans excuse</li><li>Donner un mauvais surnom à un musulman</li><li>Le faux serment délibéré (yamin ghamus)</li><li>Jurer par autre que Dieu</li><li>Jurer souvent, même en disant vrai</li><li>Demander le pouvoir ou la magistrature</li><li>Demander la gestion des fondations pieuses</li><li>Rechercher la tutelle</li><li>Invoquer contre soi-même et souhaiter la mort</li><li>Refuser l'excuse d'un frère</li><li>Interpréter le Coran par une opinion blâmable sans science</li><li>Effrayer un croyant sans faute, et le contraindre à ce qu'il ne veut pas</li><li>Couper la parole sans nécessité</li><li>Le disciple qui contredit son guide dans des cas précis — cela n'interdit pas d'accepter la vérité ni n'autorise l'obéissance dans le péché</li><li>Les questions obsessionnelles sur le licite, la pureté et la propriété sans indice</li><li>Deux personnes qui chuchotent à l'écart d'une troisième</li><li>Parler avec une jeune femme étrangère, avec des détails — l'intitulé n'interdit pas toute communication légitime</li><li>Saluer un non-musulman protégé sans besoin — question de détail et de divergence</li><li>Saluer quelqu'un qui satisfait un besoin</li><li>Indiquer à qui veut pécher ce qui l'y aide</li><li>Permettre et autoriser ce qui est un péché</li>
 </ol>
 <h4>Les défauts du silence</h4>
 <p>Négliger d'apprendre ce qui est nécessaire, taire une parole obligatoire, et délaisser le conseil, l'ordre du bien et l'interdiction du mal lorsque leurs conditions sont réunies. La santé de la langue n'est pas l'abstention constante de parler, mais mettre la parole et le silence chacun à sa place.</p>
</details>

<div class="tq-head">
 <h2>La Vía muhammadiana</h2>
 <p class="tq-sub">Seguir al Profeta ﷺ en lo exterior y lo interior: definición, fundamentos, capítulos y cómo realizarla</p>
 <p class="tq-src">Las normas detalladas y los puntos de divergencia se consultan con la gente de conocimiento.</p>
</div>

<div class="tq-map" aria-label="Mapa de la vía">
 <span>Seguimiento y moderación</span><i>→</i><span>Creencia correcta</span><i>→</i><span>Conocimiento del propio estado</span><i>→</i><span>Taqwa</span><i>→</i><span>Purificar corazón y órganos</span><i>→</i><span>Rectitud y complacencia de Dios</span>
</div>

<details open><summary>1. Definición y fin de la Vía muhammadiana</summary>
 <p><b>La Vía muhammadiana</b> es seguir al Mensajero de Dios ﷺ en la creencia, las palabras, el carácter y los actos, y tomar su guía como la balanza con la que el caminante corrige lo exterior y lo interior de sus obras.</p>
 <ul>
  <li><b>Su fin:</b> la complacencia de Dios Altísimo y el éxito en la otra vida.</li>
  <li><b>Sus medios:</b> el conocimiento, la acción, la taqwa (conciencia de Dios) y la purificación del alma.</li>
  <li><b>Su propósito:</b> que cada caminante contraste sus obras con el camino del Profeta y distinga así lo correcto de lo erróneo.</li>
 </ul>
 <h4>Dos males que trata la vía</h4>
 <ul>
  <li><b>El devoto sin conocimiento:</b> se esfuerza en la adoración ignorando las normas de la religión, y así sobrepasa sus límites.</li>
  <li><b>El sabio sin práctica:</b> conoce la norma pero descuida actuar según ella.</li>
 </ul>
 <p>Por eso la vía une tres cosas: <b>conocimiento correcto, voluntad sincera y conducta recta</b>.</p>
 <h4>El sentido de la purificación</h4>
 <ul>
  <li><b>Vaciar (takhliya):</b> liberar el corazón de los rasgos censurables.</li>
  <li><b>Adornar (tahliya):</b> embellecerlo con rasgos loables.</li>
  <li><b>Guardar los órganos:</b> preservar los miembros del pecado hasta que la rectitud sea una disposición firme.</li>
 </ul>
 <p class="tq-note">El dhikr y la adoración son medios que fortalecen la rectitud; nunca se separan de la honradez en el trato ni del respeto a los derechos de los demás.</p>
</details>

<details><summary>2. Los tres fundamentos que obligan al caminante</summary>
 <p>Lo que incumbe al caminante se resume en tres: <b>la creencia correcta, el conocimiento del propio estado y la taqwa</b>. Son los fundamentos y pilares prácticos de la vía.</p>
 <h4>Primer fundamento: la creencia correcta</h4>
 <p>Conocer la perfección que corresponde a Dios y la imperfección de la que está exento; creer en el mensaje, la revelación, el Último Día y el decreto; y corregir las ideas religiosas. No se pretende consenso donde los sabios difieren.</p>
 <h4>Segundo fundamento: el conocimiento del propio estado</h4>
 <p>Aprender lo que el caminante necesita para establecer su religión en su realidad:</p>
 <ul>
  <li>La purificación, la oración y el ayuno, y el zakat y el hayy cuando son obligatorios.</li>
  <li>Las normas de su oficio, su comercio y su familia, según su situación.</li>
  <li>Conocer las enfermedades de su corazón y sus remedios.</li>
 </ul>
 <p class="tq-note">El conocimiento necesario no se sustituye acumulando información que no cambia la práctica.</p>
 <h4>Tercer fundamento: la taqwa</h4>
 <p>Obedecer lo ordenado y evitar lo prohibido, por dentro y por fuera. Incluye dejar lo prohibido y cumplir lo obligatorio, pues abandonar una obligación es en sí una transgresión. Los tres fundamentos vuelven todos a la taqwa, que abarca el conocimiento necesario, la creencia correcta y la acción.</p>
</details>

<details><summary>3. Capítulo primero: el seguimiento y la moderación</summary>
 <h4>Sección 1: Aferrarse al Corán y a la Sunna</h4>
 <p>El Corán y la Sunna son la referencia de la creencia, la adoración y la conducta. La recitación va unida a la reflexión y la práctica, y el amor al Profeta ﷺ va unido a seguirle. El consenso y la analogía remiten a estas dos fuentes: volver a la revelación no significa anular el fiqh ni prescindir de sus sabios.</p>
 <p><b>En la práctica:</b></p>
 <ul>
  <li>Aprende las obligaciones y Sunnas que necesitas.</li>
  <li>Verifica las normas de tus prácticas de adoración.</li>
  <li>Pregunta a la gente de conocimiento cuando algo no esté claro.</li>
  <li>Somete tus palabras y tus sentimientos espirituales a la Ley.</li>
 </ul>
 <p class="tq-note">Nunca tomes un sueño, una revelación interior o el estado de un maestro como argumento para dejar una obligación o cometer algo prohibido.</p>

 <h4>Sección 2: Guardarse de las innovaciones y las malas costumbres</h4>
 <p>Se distingue el sentido lingüístico de la innovación (bid'a) de su sentido legal, y las costumbres de los actos de adoración. No todo medio nuevo de vida es una adoración inventada. Las revelaciones interiores, los prodigios y la visión de los profetas nunca justifican contradecir la Ley, y los maestros de la vía coinciden en la necesidad del seguimiento.</p>
 <p><b>En la práctica:</b></p>
 <ul>
  <li>Examina el origen y el contenido de una práctica, y la obligación o el mérito especial que se le atribuye.</li>
  <li>Distingue un medio organizativo de un acto de adoración.</li>
  <li>Verifica antes de generalizar normas en cuestiones de iytihad.</li>
 </ul>
 <p class="tq-note">El criterio es que el acto sea legítimo, no solo habitual o conmovedor.</p>

 <h4>Sección 3: La moderación en las obras</h4>
 <p>Ni exceso ni descuido. La adoración tiene en cuenta la capacidad, la constancia y los derechos de uno mismo, la familia y los demás. Lo que se narra de los grandes esfuerzos de algunos antiguos cede ante lo establecido de la guía profética, y un relato no verificado no sirve para imponer su dureza a todos.</p>
 <p><b>En la práctica:</b></p>
 <ul>
  <li>Pon las obligaciones primero.</li>
  <li>Elige obras voluntarias que puedas mantener.</li>
  <li>Revisa el efecto de tu programa en tus deberes, tu salud y tu trabajo.</li>
 </ul>
 <p class="tq-note">El cansancio no es un fin en sí mismo, y la adoración nunca debe hacerte descuidar otro deber.</p>
</details>

<details><summary>4. Capítulo segundo: la creencia y el conocimiento</summary>
 <p>Los asuntos importantes de la Ley muhammadiana son tres: la creencia, las ciencias y la taqwa, a la que se dedican las dos partes siguientes.</p>
 <h4>Sección 1: La creencia correcta</h4>
 <p>Abarca las siguientes cuestiones:</p>
 <ul>
  <li>La unicidad divina y los atributos de Dios, el Corán y la profecía.</li>
  <li>Los actos de los siervos y su libre elección; el decreto, el plazo de la vida y el sustento.</li>
  <li>El barzaj, la Resurrección, la recompensa y el castigo.</li>
  <li>El Viaje Nocturno y la Ascensión, y los signos de la Hora.</li>
  <li>Los pecados y el rango de los Compañeros.</li>
  <li>Cuestiones relacionadas con la comunidad musulmana y las normas religiosas.</li>
 </ul>
 <p><b>Cómo realizarlo:</b></p>
 <ul>
  <li>Aprende la fe de fuentes fiables.</li>
  <li>Une reverencia, amor, temor y esperanza.</li>
  <li>Busca aumentar la certeza.</li>
  <li>Evita debates para los que no tienes herramientas.</li>
 </ul>
 <p class="tq-note">No conviertas estas cuestiones en juicios sobre la fe de personas concretas.</p>

 <h4>Sección 2: Las ciencias buscadas para otros fines</h4>
 <p>Las ciencias son de tres clases:</p>
 <ul>
  <li><b>Ordenadas:</b> las obligaciones individuales ligadas a la situación de cada uno, y las obligaciones colectivas que la comunidad necesita.</li>
  <li><b>Prohibidas:</b> como la magia, lo que lleva al extravío o al daño, y la polémica artificiosa. La crítica de la teología especulativa, la astrología y ciertas ciencias se entiende en su contexto, y no se extiende a las ciencias útiles ni a los estudios modernos por un simple nombre.</li>
  <li><b>Recomendadas:</b> la ampliación útil del conocimiento, conocer las Sunnas, las virtudes y los buenos modales, y completar lo que la comunidad ya cubre.</li>
 </ul>
 <p><b>Cómo realizarlo:</b></p>
 <ul>
  <li>Determina lo que te incumbe ahora y apréndelo de quienes lo dominan.</li>
  <li>Actúa según lo que has aprendido.</li>
  <li>Después amplía hacia lo que es útil.</li>
  <li>Corrige tu intención al aprender y enseñar: el fin no es ganar discusiones, ni la fama, ni el rango ante la gente.</li>
 </ul>
</details>

<details><summary>5. La taqwa (1): reformar el corazón</summary>
 <p>La taqwa es el fundamento más completo; tiene su mérito, su significado y sus cauces. <b>La taqwa</b> es proteger el alma de lo que le daña en la otra vida, y se logra tanto haciendo como absteniéndose.</p>
 <p>Sus cauces prácticos:</p>
 <ul>
  <li>Guardar el corazón.</li>
  <li>Guardar la lengua, los oídos, los ojos, las manos, el vientre, las partes íntimas y los pies.</li>
  <li>Guardar el cuerpo en general.</li>
 </ul>
 <p class="tq-note">Son los órganos que trabajas en purificar en la sección «Purificación».</p>
 <p>El corazón dirige los órganos, por eso recibe el mayor cuidado. <b>El carácter</b> es una disposición de la que los actos brotan con facilidad, y puede cambiar mediante la educación y la repetición. El alma tiene tres facultades: la percepción, la ira y el deseo. Las raíces de las virtudes son cuatro:</p>
 <table class="tq-t">
  <tr><th>Raíz</th><th>Su sentido educativo</th></tr>
  <tr><td>La sabiduría</td><td>Percibir lo correcto y orientar bien el conocimiento</td></tr>
  <tr><td>El valor</td><td>Dominar la ira, y atreverse cuando corresponde sin temeridad ni cobardía</td></tr>
  <tr><td>La castidad</td><td>Dominar el deseo según la Ley, sin avidez y sin suprimir lo debido</td></tr>
  <tr><td>La justicia</td><td>La armonía de las facultades y las virtudes, y dar a cada derecho lo suyo sin injusticia</td></tr>
 </table>
 <h4>El método general de tratamiento</h4>
 <ol>
  <li>Conoce la enfermedad: su realidad, su daño y sus causas, y la virtud opuesta con sus beneficios.</li>
  <li>Búscala en ti, sin justificar siempre tu conducta.</li>
  <li>Aprovecha a un amigo sincero que te avise, y la crítica válida aunque venga de quien no te quiere.</li>
  <li>Haz del trato de la gente contigo un espejo que revele los defectos de tu conducta.</li>
  <li>Identifica la causa y elimínala, luego ejercita la conducta opuesta al vicio.</li>
  <li>Repite hasta que arraigue, y después protégela con la buena compañía, el conocimiento y la práctica.</li>
  <li>Cuida el equilibrio, para no pasar de un vicio a su extremo opuesto igualmente censurable.</li>
 </ol>
 <p class="tq-note">En los ejercicios espirituales y el examen de uno mismo rige la moderación: nunca deben convertirse en hambre, privación o daño a uno mismo.</p>
 <h4>Ejemplos concretos de tratamiento</h4>
 <table class="tq-t">
  <tr><th>Enfermedad</th><th>Remedio y práctica</th></tr>
  <tr><td>La ostentación y el amor al elogio</td><td><b>La sinceridad:</b> examinar el motivo, fortalecer las obras ocultas, dejar de buscar rango con la adoración</td></tr>
  <tr><td>La soberbia</td><td><b>La humildad:</b> aceptar la verdad de quien la traiga y dejar de despreciar a la gente</td></tr>
  <tr><td>La vanidad</td><td>Recordar el favor de Dios, la necesidad de Él y las propias faltas</td></tr>
  <tr><td>La envidia</td><td><b>El buen consejo y la emulación lícita:</b> rechazar el deseo de que desaparezca una gracia y hacer el bien a su dueño</td></tr>
  <tr><td>El rencor y la ira</td><td><b>Un corazón limpio y la paciencia:</b> controlar la reacción, no transgredir, buscar la reconciliación</td></tr>
  <tr><td>La avaricia y el derroche</td><td><b>La generosidad y la mesura:</b> cumplir los derechos y gastar con medida</td></tr>
  <tr><td>La codicia, el amor al mundo, las largas esperanzas</td><td><b>El contentamiento, el desapego, el recuerdo de la muerte:</b> usar el dinero sin ser su esclavo</td></tr>
  <tr><td>La mala opinión</td><td><b>La verificación y la buena opinión,</b> sin ignorar las pruebas evidentes</td></tr>
  <tr><td>La impaciencia, el descontento, la ingratitud</td><td><b>La paciencia, la conformidad y la gratitud,</b> procurando lícitamente cambiar la situación</td></tr>
  <tr><td>Sentirse a salvo del designio de Dios y desesperar de Su misericordia</td><td>Unir temor y esperanza, sin engaño ni desesperación</td></tr>
  <tr><td>La pereza, la postergación, la prisa</td><td>El esfuerzo, la prontitud y la calma, cada cual en su lugar</td></tr>
  <tr><td>El fraude, la traición, la perfidia</td><td>La veracidad, la honradez, la fidelidad y devolver los derechos</td></tr>
  <tr><td>Persistir en el pecado</td><td>El arrepentimiento, cortar las causas y renovar el examen de uno mismo</td></tr>
 </table>
 <h4>Los siete vicios destructores</h4>
 <p>Los vicios más peligrosos son siete: <b>la incredulidad, la innovación, la ostentación, la soberbia, la envidia, la avaricia y el derroche</b>, siendo los cuatro primeros los más graves.</p>
 <p class="tq-note">El sentido de estos términos y los límites de aplicar sus normas dependen del detalle jurídico. Las listas de enfermedades son una herramienta para examinarse uno mismo, no para juzgar precipitadamente a los demás.</p>
</details>

<details><summary>6. La taqwa (2): guardar la lengua y los demás órganos</summary>
 <h4>Guardar la lengua</h4>
 <p>Reformar la lengua no se limita a evitar la murmuración. Abarca hablar de la creencia, la veracidad, el honor de la gente, las discrepancias, los contratos, la enseñanza, la exhortación, el dhikr y la súplica, y también el silencio. Sus temas son seis:</p>
 <ol>
  <li>El habla prohibida en principio.</li>
  <li>Los hábitos del habla: bromas, elogios, poesía, prosa rimada y charla ociosa.</li>
  <li>El habla en las transacciones.</li>
  <li>La adoración que beneficia a otros: enseñar y recordar.</li>
  <li>La adoración personal: recitación, dhikr y súplica.</li>
  <li>Los defectos de callar ante un deber.</li>
 </ol>
 <p><b>Cómo realizarlo:</b> antes de hablar, hazte cuatro preguntas:</p>
 <ul>
  <li>¿Es verdad?</li>
  <li>¿Es útil?</li>
  <li>¿Es el momento adecuado?</li>
  <li>¿Respeta los derechos de los demás?</li>
 </ul>
 <p>Después:</p>
 <ul>
  <li>Abandona la mentira, la murmuración, el chisme, la burla, el insulto, el falso testimonio y la revelación de secretos.</li>
  <li>Corrige tus palabras cuando estés enfadado.</li>
  <li>Aprende las normas de los contratos que firmas.</li>
  <li>Aconseja con conocimiento y suavidad.</li>
 </ul>
 <p class="tq-note">No uses el silencio como excusa para callar un testimonio, una enseñanza o un consejo que te corresponde.</p>

 <h4>Los demás órganos</h4>
 <div class="tq-organs">
  <div><b>Los oídos</b><span class="neg">Vaciar</span>Guardarse de escuchar deliberadamente lo que no está permitido, como la murmuración y el chisme.<span class="pos">Equilibrio</span>Distinguir el oír casual del escuchar intencionado, teniendo en cuenta la necesidad y las excepciones.</div>
  <div><b>Los ojos</b><span class="neg">Vaciar</span>Bajar la mirada y respetar la intimidad y la desnudez ajenas.<span class="pos">Equilibrio</span>Ceñirse a los límites de la necesidad en el tratamiento médico, el testimonio y similares.</div>
  <div><b>Las manos</b><span class="neg">Vaciar</span>Impedir el daño, la agresión, el robo y lo tomado injustamente.<span class="pos">Adornar</span>Devolver los depósitos, hacer el bien y respetar los derechos de personas y animales.</div>
  <div><b>El vientre</b><span class="neg">Vaciar</span>Dejar lo prohibido y el exceso dañino.<span class="pos">Adornar</span>Buscar lo lícito en el sustento y la comida, y cuidar los modales al comer y beber.</div>
  <div><b>Las partes íntimas</b><span class="neg">Vaciar</span>Proteger las relaciones y respetar sus límites.<span class="pos">Adornar</span>La castidad, y respetar las normas de la vida conyugal, la purificación y las necesidades naturales.</div>
  <div><b>Los pies</b><span class="neg">Vaciar</span>No caminar hacia el pecado y la injusticia, y respetar los bienes y lo sagrado.<span class="pos">Adornar</span>Caminar hacia el deber y el bien.</div>
  <div><b>El cuerpo en general</b><span class="neg">Vaciar</span>Dejar la injusticia, la usurpación y la desobediencia a los padres.<span class="pos">Adornar</span>Cubrir la desnudez, respetar las normas del vestido y la vivienda, honrar a los padres y cumplir derechos y deberes.</div>
 </div>
 <p class="tq-note">La taqwa concluye insistiendo en los derechos de las personas y los animales. El trato, la honradez y la misericordia son la prueba de la purificación, no un añadido ajeno a la vía.</p>
</details>

<details><summary>7. Capítulo tercero: lo que se confunde con piedad y escrúpulo</summary>
 <h4>Sección 1: El escrúpulo excesivo sobre la pureza y la impureza</h4>
 <p>Formas de rigor censurable:</p>
 <ul>
  <li>Verter demasiada agua y repetir el lavado más allá del límite.</li>
  <li>Lavar lo puro por imaginación e inspeccionar sin indicio.</li>
  <li>Reservar utensilios que el obsesivo no acepta sustituir.</li>
  <li>La pérdida resultante de la oración en grupo, la propia oración, el dhikr y los derechos ajenos.</li>
 </ul>
 <p>El tratamiento se basa en cuatro puntos:</p>
 <ol>
  <li>Este rigor contradice la guía profética.</li>
  <li>La censura de la obsesión (waswasa) y sus males.</li>
  <li>Su remedio.</li>
  <li>Las divergencias de los juristas y los principios de la pureza y la impureza.</li>
 </ol>
 <p>Entre los principios: <b>las cosas son puras en origen, y la certeza no se elimina con la duda</b>. Al obsesivo se le orienta hacia la amplitud reconocida hasta que desaparezcan sus dudas.</p>
 <p><b>Cómo realizarlo:</b> aprende la norma, realiza la adoración según ella, no la repitas por una simple duda y no prolongues la inspección.</p>
 <p class="tq-note">No hagas de la limpieza exterior una excusa para descuidar la purificación del corazón de la ostentación y la soberbia, ni una causa para perder un deber.</p>

 <h4>Sección 2: El escrúpulo con el dinero y la comida sin imaginación</h4>
 <p>Se critica a quien rechaza la comida de los que cobran de fundaciones piadosas o del tesoro público por una duda general, mientras es laxo en otras transacciones. La norma depende de la validez del derecho, la transacción y las condiciones, no de la impresión sobre el dueño del dinero. Generalizar la duda sobre el dinero y las transacciones lleva a la dificultad.</p>
 <p class="tq-note">Lo que importa aquí es la idea educativa; las normas de casos antiguos no se aplican mecánicamente a todo salario o ingreso moderno.</p>
 <p><b>Cómo realizarlo:</b></p>
 <ul>
  <li>Evita lo que sabes que es prohibido.</li>
  <li>Verifica con indicios claros.</li>
  <li>Aprende las normas de tus ingresos y contratos.</li>
  <li>No declares prohibido un bien basándote en la imaginación.</li>
  <li>Respeta los derechos y no te eleves sobre la gente con una apariencia de escrúpulo sin base de conocimiento.</li>
 </ul>

 <h4>Sección 3: Obras tomadas como actos de devoción sin verificación</h4>
 <p>Por ejemplo:</p>
 <ul>
  <li>Algunas fundaciones piadosas y legados.</li>
  <li>El pago por la recitación y el dhikr, y el regalo de la recompensa.</li>
  <li>Las comidas ofrecidas tras un fallecimiento.</li>
  <li>Imponer pasar la noche junto a una tumba, y construir sobre las tumbas.</li>
 </ul>
 <p>La balanza es la validez de la obra y de la intención, guardándose de hacer de la adoración un medio para lo mundano.</p>
 <p><b>Cómo realizarlo:</b> verifica el origen, la norma y las condiciones de la obra, corrige tu intención y no conviertas una costumbre en obligación religiosa solo porque esté extendida.</p>
 <p class="tq-note">Las cuestiones del pago, las fundaciones y el regalo de la recompensa tienen detalles y divergencias; no se presentan como normas unánimes, ni se equiparan sus distintas formas.</p>
</details>

<details><summary>8. Cómo realizar la vía: el programa del caminante</summary>
 <p>Este orden se extrae de la vía; no es un wird obligatorio:</p>
 <ol>
  <li><b>Corrige tu orientación:</b> busca la complacencia de Dios y revisa tu intención en la adoración, el estudio y el servicio.</li>
  <li><b>Aprende lo que te incumbe:</b> conoce las normas de tu adoración, tu trabajo y tu familia, y aplícalas antes de ampliar sin necesidad.</li>
  <li><b>Arrepiéntete de la transgresión:</b> déjala, lamenta haberla cometido, decide no volver a ella y devuelve los derechos ajenos según el caso.</li>
  <li><b>Cumple las obligaciones:</b> fijar prioridades va antes que añadir obras voluntarias.</li>
  <li><b>Elige una enfermedad visible para tratarla:</b> comprende su causa, anota las situaciones en que aparece y ejercita su contrario.</li>
  <li><b>Guarda los órganos:</b> localiza dónde está el fallo — en el habla, la mirada, el oído o el trato — y corta sus causas.</li>
  <li><b>Fortalece tu vínculo con Dios:</b> con el Corán, la oración, el dhikr, la súplica y la reflexión, respetando la Sunna, tu capacidad y la constancia.</li>
  <li><b>Mantén la vigilancia (murabata):</b>
   <ul>
    <li><b>El compromiso</b> al inicio del día.</li>
    <li><b>La vigilancia</b> durante la acción.</li>
    <li><b>El examen</b> después.</li>
    <li><b>El reproche y la corrección</b> cuando falles.</li>
   </ul>
   También se menciona <b>la sanción de uno mismo</b>, cuyas aplicaciones se mantienen en lo que no causa daño ni crea una carga ilegítima.</li>
  <li><b>Busca una compañía sincera:</b> acepta que te avisen, verifica la crítica y sigue la verdad sin partidismo hacia las personas.</li>
  <li><b>Revisa el fruto:</b> más veracidad, mayor honradez, menos ira, derechos respetados, adoración más firme, más humildad y misericordia.</li>
 </ol>
 <h4>Preguntas del examen diario</h4>
 <ul>
  <li>¿Qué deber cumplí o descuidé?</li>
  <li>¿Qué enfermedad apareció en mi corazón?</li>
  <li>¿A quién herí de palabra o de obra?</li>
  <li>¿Qué derecho debo devolver?</li>
  <li>¿Qué corrección concreta haré mañana?</li>
 </ul>
 <p class="tq-note">Puedes anotar tus respuestas en la «nota del día» y registrar la guarda de tus órganos en la sección «Purificación».</p>
</details>

<details><summary>9. La vía en un párrafo</summary>
 <p>La Vía muhammadiana es seguir al Mensajero de Dios ﷺ en la creencia, la adoración, el carácter y el trato, y tomar el Corán y la Sunna como la balanza que reforma lo exterior y lo interior del ser humano.</p>
 <p>Se apoya en tres fundamentos: la creencia correcta, aprender las normas de la religión que uno necesita, y realizar la taqwa cumpliendo las obligaciones y evitando lo prohibido.</p>
 <p>Su purificación se realiza de dos maneras:</p>
 <ul>
  <li>Vaciar el corazón de la ostentación, la soberbia, la vanidad, la envidia y sus demás enfermedades, y adornarlo con sinceridad, humildad, gratitud, paciencia, misericordia y veracidad.</li>
  <li>Guardar la lengua y los órganos, y cumplir los derechos de los demás.</li>
 </ul>
 <p>Quien la sigue avanza con conocimiento y práctica, vigilancia y examen, y con una adoración moderada y constante, lejos del extremismo, la obsesión y el escrúpulo basado en la imaginación. Su fruto se ve en una adoración firme, buen carácter, honradez, justicia y misericordia.</p>
</details>
