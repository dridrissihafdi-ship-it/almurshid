ado de vigilia y con su cuerpo.","Los signos de la Hora mencionados en la Sunna son verdad."]],["h","C. La fe y los pecados mayores"],["p","Presenta la divergencia sobre la definición de la fe: ¿es solo asentimiento y afirmación, o palabra y acto que aumenta con la obediencia y disminuye con la desobediencia? Afirma que la divergencia en algunas formulaciones de los teólogos es en parte verbal, mientras que la Gente de la Sunna coincide en que Dios quiere de los siervos la palabra y el acto, y que los pecados mayores no sacan al monoteísta del islam ni le hacen merecer la eternidad en el Infierno."],["p","También presenta la cuestión del musulmán que dice: «Soy creyente, si Dios quiere», y señala que si con ello pretende dudar del fundamento de su fe, es peligroso; pero si pretende humildad, temor a un mal final o rechazar la autoalabanza, tiene fundamento según los sabios."],["p","Afirma que la fe de quien sigue por imitación es válida según un grupo de la Gente de la Sunna, aunque abandonar el razonamiento pudiendo hacerlo sea una falta o un pecado según algunos de ellos."],["h","D. La profecía, los prodigios de los santos y los Compañeros"],["ul",["Los profetas están libres de la mentira y la traición; el mejor y el último de ellos es Muhammad ﷺ.","Los ángeles son siervos honrados que no desobedecen a Dios.","Los milagros de los profetas son verdad.","Los prodigios de los santos son posibles, pero no elevan al santo al rango de profeta ni lo eximen de las órdenes y prohibiciones.","Los mejores de los santos son los Compañeros, encabezados por Abu Bakr, luego Umar, luego Uzmán, luego Ali, y luego el resto de los Compañeros; hay que abstenerse de hablar de ellos si no es para bien.","Amar y honrar a los Compañeros es un fruto del amor al Profeta ﷺ, e insultarlos o menospreciarlos es una desviación."]],["h","E. El imamato y las cuestiones jurídicas ligadas al credo"],["p","El método menciona la necesidad de los musulmanes de un gobernante capaz de aplicar los dictámenes; no es condición su infalibilidad ni que sea el mejor de su época, y en su posición jurídica no se exige destituirlo por la mera perversidad o injusticia. Menciona que está permitido rezar detrás del piadoso y del pecador, sin dejar de reprobar el pecado."],["p","También trata cuestiones como pasar la mano sobre los calcetines de cuero, el nabidh de jarra si no embriaga, el beneficio que obtiene el difunto de las adoraciones, súplicas y limosnas hechas por él, la magia y el mal de ojo, y si el muytahid acierta la verdad o se equivoca; afirma que la verdad en la realidad es una, y que quien se equivoca de forma excusable es recompensado por su esfuerzo."],["h","F. Las sectas y las innovaciones"],["p","El método presenta numerosas sectas y doctrinas, entre ellas los jariyíes, los murchi'íes, los qadaríes, los yabaríes, los mu'tazilíes, los rafidíes, los kaysaníes, los yazidíes, los nayyaríes y los yahmíes, y refuta lo que considera contrario a los fundamentos de la Gente de la Sunna, especialmente:"],["ul",["Declarar incrédulos a los musulmanes por los pecados mayores.","Negar el decreto o hacer del siervo el creador de sus propios actos.","Negar los atributos o afirmar lo que implica antropomorfismo.","Creer en la reencarnación de las almas o en la encarnación de Dios en los imanes.","Suprimir la oración, el ayuno y el zakat con el pretexto de obedecer a un jeque o a un imán oculto.","Poner a los santos por encima de los profetas o preferirlos al Profeta ﷺ."]],["p","El resumen del método para el caminante: alcanzar la certeza en el credo de la Gente de la Sunna, desconfiar de quienes extravían y siembran dudas, y no aceptar las pretensiones que elevan a sus autores por encima de los textos o del rango de la profecía."]]},{"t":"Sección segunda: las ciencias buscadas por otra cosa","b":[["p","El método divide las ciencias en tres tipos:"],["h","1. Ciencias de obligación individual"],["p","Son las que todo responsable necesita para la validez de su religión y de su estado, como:"],["ul",["Los dictámenes de la purificación, la oración, el ayuno, el zakat y el hayy para quien le es obligatorio.","Los dictámenes necesarios de la compraventa, el alquiler, el matrimonio, el divorcio y el trabajo.","La ciencia del corazón: la confianza en Dios, el temor reverencial, la esperanza y el retorno a Él.","Conocer la soberbia, la ostentación, la envidia y la avaricia, y lo necesario para tratarlas."]],["p","La ignorancia de aquello sin lo cual la adoración o la transacción no es válida no es excusa para quien puede aprender."],["h","2. Ciencias de obligación colectiva"],["p","Son aquellas de las que basta que se ocupe una parte de la comunidad, como la jurisprudencia, la exégesis, el hadiz, los fundamentos del derecho, las ciencias de la lengua árabe, el derecho sucesorio, el cálculo necesario para la judicatura y las herencias, así como la medicina y las ciencias útiles que la comunidad necesita."],["h","3. Ciencias prohibidas o reprobables"],["ul",["Adentrarse en la teología especulativa y la dialéctica sin necesidad o sin capacidad, sobre todo si genera dudas.","La astrología que pretende conocer lo oculto o la influencia de los astros.","La magia, los hechizos y la charlatanería; solo se exceptúa el estudio de sus estados cuando se pretende desenmascarar y repeler el mal.","El debate cuando busca la disputa, la ostentación y derrotar al adversario; está permitido cuando es necesario con la intención de equidad y de manifestar la verdad."]],["p","En cuanto a la astronomía que el musulmán necesita para conocer las horas de oración y la alquibla, es lícita o útil en la medida de la necesidad; lo que llega a pretender conocer lo oculto está prohibido."],["h","La medicina, los medios y la confianza en Dios"],["p","El método divide los medios en:"],["ul",["<b>Seguros:</b> como el agua para la sed y la comida para el hambre; abandonarlos ante el temor de morir puede ser ilícito.","<b>Probables:</b> como el medicamento, la ventosaterapia y la sangría; recurrir a ellos no contradice la confianza en Dios si el musulmán cree que Dios es quien cura.","<b>Ilusorios:</b> como los medios supersticiosos o sin prueba; renunciar a apegarse a ellos es lo que exige la confianza en Dios."]],["p","La confianza en Dios no significa abandonar todo medio, sino que el corazón no crea que el medio actúa con independencia de Dios."]]},{"t":"Sección tercera: la piedad (taqwa)","b":[["h","El significado de la taqwa y su mérito"],["p","La taqwa viene de «protección»: que el siervo ponga entre él y la ira y el castigo de Dios una protección, obedeciéndole y dejando la desobediencia. Tiene un sentido general: protegerse de todo lo que perjudica en la otra vida; y un sentido particular: evitar toda palabra, acto u omisión que merezca castigo."],["p","La taqwa no se completa con solo dejar algunas cosas permitidas o ser riguroso en la purificación; incluye:"],["ul",["La validez del credo.","El cumplimiento de las obligaciones y los deberes.","El abandono de lo prohibido y de las innovaciones.","La reforma del corazón, la lengua y los miembros.","El cumplimiento de los derechos de las personas y de los animales."]],["h","Los fundamentos de la reforma del carácter"],["p","El método vincula el carácter a tres facultades:"],["ul",["<b>La razón y el habla:</b> su equilibrio es la sabiduría, su exceso la astucia y el engaño, y su defecto la torpeza.","<b>La ira:</b> su equilibrio es la valentía, su exceso la temeridad, y su defecto la cobardía.","<b>El deseo:</b> su equilibrio es la castidad, y su exceso la voracidad y el libertinaje."]],["p","La manera de tratar un rasgo reprobable:"],["ol",["Conocer la realidad de la enfermedad, sus causas y sus daños.","Examinarse y buscar los signos de la enfermedad.","Eliminar la causa que conduce a ella.","Practicar el rasgo opuesto hasta que la virtud se convierta en una disposición arraigada.","Aceptar el consejo de la gente sincera.","Recordar los textos de amenaza sobre el vicio y los textos de alabanza sobre la virtud.","Luchar contra el alma de forma gradual, no con arrebatos pasajeros.","Acompañar a la gente de ciencia y virtud, y dejar la compañía corruptora."]]]},{"t":"Los males del corazón","b":[["p","El método incluye <b>sesenta males del corazón</b>, y explica de cada uno su significado, sus daños y su remedio. A continuación, la lista completa y ordenada, conservando los títulos de los que derivan desarrollos terapéuticos o aplicaciones prácticas:"],["h","Primero: males del credo, la intención y el conocimiento"],["dl",[["1. La incredulidad en Dios","Entre sus tipos: la incredulidad por ignorancia, la incredulidad por negación y obstinación, y la incredulidad por dictamen legal; es el mayor de los factores de perdición."],["2. La ignorancia","Incluye la ignorancia simple, que es la falta de conocimiento, y la ignorancia compuesta, que es creer que lo falso es ciencia y verdad."],["3. El amor al poder y al prestigio mundano","Buscar poseer los corazones de la gente y apegarse al rango y la fama, salvo lo que se busca para apoyar la verdad o reformar a la gente sin ostentación."],["4. El miedo al reproche y a la censura","Dejar la verdad o callarla por miedo a lo que diga la gente y a sus reproches."],["5. El amor a la alabanza y al elogio","Alegrarse del elogio de la gente y buscarlo; su remedio es recordar que lo que beneficia es la aceptación de Dios, no la admiración de las criaturas."],["6. La creencia innovada","Instaurar una creencia o una adoración sin fundamento, o anteponer las costumbres y los gustos a la Sunna."],["7. Seguir la pasión","Hacer del deseo personal el juez del texto y de la verdad; su remedio es la lucha contra el alma y el seguimiento de la guía."],["8. La imitación ciega en el credo","Aceptar una creencia sin prueba pudiendo reflexionar, distinguiendo esto del no muytahid que sigue a un sabio en los dictámenes prácticos."],["9. La ostentación (riya')","Obrar para ser visto y alabado por la gente; incluye la ostentación manifiesta y la oculta, y su contrario es la sinceridad."],["10. La esperanza y la larga esperanza","Retrasar el arrepentimiento y la acción confiando en una larga vida; su remedio es recordar la muerte y acortar la esperanza."],["11. La codicia","El apego del corazón a lo que está en manos de la gente o a lo que no posee; su contrario es el contentamiento y la confianza en Dios."],["12. La soberbia","Verse por encima de la verdad o de la gente; entre sus remedios: aceptar la verdad, la humildad y conocer el origen y el fin del hombre."],["13. La adulación y la lisonja","Esforzarse artificialmente por obtener la aprobación y el elogio de la gente y congraciarse con ellos, de un modo que corrompe la sinceridad y la dignidad."],["14. La autocomplacencia ('uyb)","Admirarse a sí mismo, sus obras o su saber, olvidando el favor de Dios."]]],["h","Segundo: males de la envidia, la ira y la enemistad"],["dl",[["15. La envidia","Desear que desaparezca la gracia del otro; su remedio es recordar que las gracias son un reparto de Dios, desear el bien al envidiado y obrar en contra de lo que la envidia pide."],["16. El rencor","La permanencia de la enemistad en el corazón esperando una ocasión de venganza; su remedio es el perdón y eliminar las causas de la ira."],["17. La alegría por el mal ajeno","Alegrarse de la desgracia de un musulmán; su remedio es la misericordia y recordar cómo cambian las situaciones."],["18. La ruptura y la enemistad","Cortar los lazos y albergar odio sin derecho; su contrario es la reconciliación, el perdón y mantener los lazos familiares."],["19. La cobardía","La debilidad del corazón ante la verdad o ante lo que hay que repeler; su contrario es la valentía regida por la sabiduría."],["20. La temeridad","Lanzarse sin verificar ni sopesar las consecuencias; su contrario es la verificación y la audacia disciplinada."],["21. La perfidia","Romper un pacto o compromiso sin aviso o razón legal; su contrario es guardar y cumplir los compromisos."],["22. La traición","Faltar a la confianza en la palabra, el dinero, el consejo o el trabajo; su contrario es la lealtad."],["23. Incumplir la promesa","Prometer con la intención de no cumplir, o no cumplir sin excusa; su contrario es cumplir la promesa y honrar el compromiso."],["24. Pensar mal de Dios y de los creyentes por mera ilusión o duda","Es ilícito cuando lleva a acusar a un musulmán o hablar de él; la cautela basada en indicios fiables no es una sospecha prohibida."],["25. El mal agüero (tiyara)","Ver malos presagios en las personas, los días, los sonidos y los acontecimientos; su contrario es el buen augurio, que no implica pretender conocer lo oculto ni juzgar el futuro."]]],["h","Tercero: males del dinero, el mundo y el trabajo"],["dl",[["26. La avaricia y la mezquindad","Retener el dinero donde hay que gastarlo según la Ley o la decencia; una de sus peores formas es privarse de comida, ropa y tratamiento cuando se necesitan."],["27. El derroche y el despilfarro","Gastar el dinero donde hay que retenerlo, o sobrepasar la moderación en la comida, la ropa, la limosna y los demás gastos."],["28. El amor al dinero","El apego del corazón al dinero por sí mismo o convertirlo en un fin, cuando el dinero es un medio para cumplir los derechos y gastar de forma lícita."],["29. El amor a este mundo","Preferir este mundo a la otra vida, sumergirse en sus placeres y olvidar el destino."],["30. La avidez reprobable","Un apego intenso al dinero, al prestigio y a los beneficios, hasta el punto de generar injusticia, abandono de la adoración o humillación de sí mismo."],["31. La necedad","La ligereza mental, la mala conducta y no poner el dinero, la palabra o el acto en su lugar adecuado."],["32. La pereza y la ociosidad","Dejar el trabajo útil y los deberes pudiendo hacerlos, abandonarse al descanso y desperdiciar las energías."],["33. La precipitación","Actuar antes de verificar, y emitir un juicio o realizar un acto antes de reflexionar por completo."],["34. El retraso y la procrastinación","Aplazar el arrepentimiento, el deber y la obra útil hasta que pase su tiempo."],["35. La rudeza y la dureza de corazón","El trato áspero, la falta de misericordia y la incapacidad de soportar a la gente; su contrario es la indulgencia, la suavidad y la amabilidad."]]],["p","El punto medio en el dinero es la generosidad sin derroche, el ahorro sin avaricia, el sustento lícito sin sumergirse en él, y la limosna sin descuidar los derechos de uno mismo, de la familia y de la religión. El derroche se trata con la ciencia —conocer sus daños—, con la práctica —controlar los gastos— y con el desarraigo —eliminar sus causas, como la ostentación, la necedad y la mala compañía—."],["h","Cuarto: males de la determinación, la conformidad y las relaciones"],["dl",[["36. La desvergüenza y la pérdida del pudor","La osadía en lo feo, no encontrar repugnante el pecado y no disculparse por los errores."],["37. La impaciencia y la queja","La objeción del corazón y de la lengua contra la prueba de un modo que contradice la paciencia; quejarse a Dios y pedir Su ayuda está permitido."],["38. La ingratitud por las gracias","Olvidar al Bienhechor, atribuir la gracia a uno mismo o solo a la gente, y no emplearla en lo que agrada a Dios."],["39. El descontento por no obtener lo deseado","El resentimiento y la agitación cuando se pierde lo que el alma desea; su contrario es la conformidad con el decreto de Dios recurriendo a los medios lícitos."],["40. El apego a otro que Dios","El corazón que se apoya en una criatura, un medio o una ilusión, olvidando que el beneficio y el daño están en la mano de Dios; lo debido es recurrir a los medios con confianza en Dios."],["41. El amor a los pervertidos y la inclinación hacia los opresores","Amarlos, adularlos o apoyarse en ellos en la injusticia y la falsedad, distinguiendo entre reprobar sus actos y ser justo con ellos."],["42. El odio a los sabios y a los virtuosos","Detestar a la gente de ciencia y rectitud por envidia, fanatismo o porque contradicen la pasión."],["43. La osadía ante Dios y sentirse a salvo de Su castigo y Su ira","Persistir en el pecado sintiéndose a salvo del castigo."],["44. La desesperanza de la misericordia de Dios","Creer que un pecado no será perdonado o que el arrepentimiento no sirve; su contrario es unir el temor y la esperanza."],["45. La tristeza por los asuntos mundanos","La tristeza que invade el corazón por un placer pasajero perdido, hasta debilitarlo para la religión y el deber."],["46. El miedo en los asuntos mundanos","El miedo excesivo a la pobreza, a la gente o al futuro, hasta impedir la verdad o hacer caer en lo prohibido."],["47. El engaño y el resentimiento","No dar un consejo sincero, ocultar un defecto o embaucar a otros; incluye el fraude, el engaño y la intriga; el engaño en la guerra o para repeler una injusticia merecida tiene otro dictamen."],["48. La sedición (fitna)","Arrojar a la gente a la turbulencia, la disputa y el combate, o tergiversar las palabras e incitar a la gente a la agresión, la rebelión y la desgracia."],["49. La complacencia culpable (mudahana)","No reprobar la falsedad, o embellecerla, para agradar a la gente o por miedo a perder el prestigio, a diferencia de la cortesía permitida (mudara), que preserva la verdad y no justifica la falsedad."],["50. La intimidad excesiva con la gente y la soledad al separarse de ella","El apego del corazón a las criaturas hasta debilitar su apego a Dios; su contrario es una buena compañía con un corazón independiente por Dios."],["51. La irreflexión y la ligereza","La falta de ponderación, la rápida exaltación y actuar sin sabiduría."],["52. La obstinación, la arrogancia frente a la verdad y su negación después de conocerla","Rechazar la verdad no porque esté oculta, sino porque contradice la pasión o para conservar la posición."],["53. La rebeldía y la negativa","Negarse a someterse a la verdad y a la orden legítima por soberbia o por amor a la independencia."],["54. La altanería","Darse importancia, ensoberbecerse, mostrar superioridad y despreciar a la gente."],["55. La hipocresía","Mostrar el bien y ocultar el mal, o la diferencia entre lo exterior y lo interior; incluye la hipocresía de creencia y la hipocresía de obra."],["56. La aspereza y la crueldad","La falta de misericordia y no conmoverse por la exhortación o por el dolor de la gente; su contrario es la suavidad y la misericordia."],["57. La torpeza y la estupidez","La debilidad de comprensión, la falta de perspicacia o impedir a la mente aprender y reflexionar."],["58. La voracidad por la comida y las relaciones carnales","Sobrepasar el límite de la necesidad y dejarse llevar por el deseo hasta debilitar la adoración, la castidad y la salud."],["59. La apatía","La debilidad de la determinación, la flojedad en el bien y no apresurarse hacia los actos de obediencia y lo beneficioso."],["60. La persistencia en los pecados y las diversiones vanas","Repetir el pecado sin arrepentirse, y continuar en la diversión y en lo que aparta de los deberes y debilita el corazón."]]],["h","La regla general para tratar los males del corazón"],["p","Cada enfermedad se trata conociendo su realidad y sus daños, luego cortando sus causas y practicando el rasgo opuesto hasta que se convierta en una disposición arraigada: la soberbia se trata con la humildad, la avaricia con la generosidad, la cobardía con la valentía, la ira con la indulgencia, la envidia con el buen consejo y el amor, la ostentación con la sinceridad, la larga esperanza con el recuerdo de la muerte, la desesperanza con pensar bien de Dios, y la voracidad con la castidad y la moderación. El método menciona luego los fundamentos de las virtudes, como la sabiduría, la valentía, la castidad y la justicia, y muestra que las virtudes son disposiciones que se manifiestan en el trato, el gasto, la paciencia, la veracidad y el cumplimiento de los derechos."]]},{"t":"Los males de la lengua","b":[["p","El método hace de la lengua una de las puertas más peligrosas de la taqwa, porque una palabra puede demoler un credo, perjudicar a una persona, estropear una relación o provocar una sedición. Entre los males de la lengua que detalla:"],["ul",["La palabra de incredulidad y lo que se le acerca.","El error, la mentira y la invención contra Dios y Su Mensajero.","Prometer con intención de incumplir, y contar todo lo que se oye.","La insinuación corruptora.","La murmuración, el chisme, la difamación, el reproche, la burla, el insulto, la obscenidad y la maldición.","Las lamentaciones por los muertos, divulgar secretos y enfrascarse en la falsedad.","La pelea, la disputa, la discusión estéril y la afectación al hablar.","Preguntar a la gente común sobre sutilezas que la confunden o la inquietan.","Buscar dinero y prestigio con palabras humillantes.","La hipocresía verbal y el doble discurso.","La mala intercesión, ordenar el mal y prohibir el bien.","La dureza en el habla y atentar contra el honor de la gente.","Preguntar por los defectos de la gente y rebuscarlos.","Hablar durante el adhan y la iqama, en la oración, durante el sermón, en el retrete, durante las relaciones conyugales, durante la recitación del Corán y en las mezquitas sin necesidad.","Suplicar contra un musulmán o suplicar a favor de un opresor.","Interrumpir a los demás, y que el subordinado replique a su superior sin derecho.","Que dos hablen en secreto en presencia de un tercero si eso lo entristece.","Hablar con una mujer ajena sin necesidad.","Indicar el camino del pecado o permitirlo."]],["p","En contrapartida, menciona los males del silencio: no saludar, no devolver el saludo, no responder al que estornuda, no aconsejar, no socorrer al oprimido o a quien pide auxilio pudiendo hacerlo, y no prohibir lo reprobable cuando se cumplen sus condiciones. El silencio no es una virtud absoluta; la virtud es hablar donde hay que hablar y callar donde hay que callar."],["p","Entre las palabras permitidas o recomendables con condiciones: la broma libre de mentira y de susto, el elogio libre de exageración y ostentación, la poesía libre de lo prohibido, la prosa rimada y la elocuencia cuando no son afectadas, y hablar de los intereses de la religión y del mundo."]]},{"t":"Los males del oído, la vista, la mano, el vientre, el sexo, el pie y el cuerpo","b":[["h","Los males del oído"],["ul",["Escuchar la murmuración, el chisme, la mentira y la falsedad.","Escuchar el canto, las diversiones y las melodías que el método reprueba.","Escuchar palabras que excitan el deseo o la sedición.","Escuchar el Corán o el dhikr de un modo que altera su sentido o lo convierte en diversión y baile.","Dejar la escucha obligatoria de la ciencia, la exhortación y el consejo."]],["p","El método advierte contra la danza sufí acompañada de gritos, canto y confusión, y afirma que el dhikr de pie y sentado está permitido si se hace con decoro y calma, sin melodía que altere las palabras y sin diversión."],["h","Los males del ojo"],["ul",["Mirar las partes íntimas ('awra).","Mirar con deseo a una mujer ajena.","Mirar lo que excita la tentación o ayuda al pecado.","Mirar dentro de las casas de la gente o sus secretos."]],["p","Menciona excepciones por necesidad, como recibir y prestar testimonio, el juicio del juez, la partera en el parto, verificar un defecto, la circuncisión, el tratamiento médico, y la intención de matrimonio o de compra; el criterio es la medida de la necesidad sin sobrepasarla."],["h","Los males de la mano"],["ul",["Matar, herir y golpear sin derecho.","La usurpación, el robo y el soborno.","Tomar un bien usurpado o destruir el bien ajeno.","Ayudar al opresor, o abstenerse de corregir lo reprobable pudiendo hacerlo.","La representación figurativa que el método considera incluida en la prohibición.","Jugar con lo que daña al ser humano o al animal.","Usar la mano para dañar o agredir a la gente."]],["h","Los males del vientre y la etiqueta de comer y beber"],["ul",["Introducir lo ilícito en el vientre.","Comer más de lo necesario y la saciedad excesiva.","Comer lo que daña al cuerpo.","Dejar la comida y la bebida hasta debilitarse para las obligaciones o la oración en congregación.","El derroche de la comida y echarla a perder."]],["p","Entre las normas que menciona: pronunciar el nombre de Dios, comer con la mano derecha, comer de lo que está delante de uno, no comer del centro del plato si es de un solo tipo, no soplar en la bebida ni respirar dentro del recipiente, servir al de la derecha, y no usar recipientes de oro y plata para comer y beber, según el detalle jurídico."],["h","Los males del sexo"],["p","El método detalla la fornicación, la sodomía y la bestialidad, las relaciones con la mujer menstruante o en el puerperio de la forma prohibida, el disfrute ilícito, las relaciones con daño o antes del periodo de espera, y lo relativo a preservar la 'awra y la etiqueta en la intimidad y al hacer las necesidades."],["h","Los males del pie"],["ul",["Ir a reuniones de pecado para cometerlo o presenciarlo.","Viajar o salir de un modo que perjudique a los padres o descuide sus derechos.","Entrar en la tierra o la casa ajena sin permiso, salvo necesidad o permiso consuetudinario.","Caminar sobre las tumbas o entrar en los lugares sagrados sin decoro.","Pasar por encima de la gente el viernes.","Ausentarse de la oración del viernes, la congregación, el aprendizaje y la enseñanza, el hayy y el yihad cuando se vuelven obligación individual.","Acudir a los gobernantes y opresores buscando bienes mundanos o para ayudarlos en su injusticia.","Llegar a casa de improviso después de un largo viaje."]],["h","Los males generales del cuerpo y los derechos de la gente"],["p","El método se extiende en los derechos sociales y familiares, entre ellos:"],["ul",["La desobediencia a los padres, señalando que no hay obediencia a una criatura en la desobediencia al Creador, y que la bondad con los padres y servirlos es obligatorio aunque sean incrédulos, mientras el musulmán no tema por su religión.","Cortar los lazos familiares; lo mínimo para mantenerlos es saludar o enviar saludos, y aumenta con la visita, la ayuda y los regalos.","Dañar a la esposa o al esposo, y no respetar los derechos mutuos.","Descuidar a los hijos y a quienes se debe mantener, y no instruirlos ni educarlos.","Oprimir a los sirvientes o cargarlos por encima de su capacidad, y no alimentarlos, vestirlos ni enseñarles lo que necesitan.","Dañar al vecino, y no ayudarlo, visitarlo o consolarlo.","Elegir una mala compañía; la persona se ve influida por su amigo íntimo.","Sentarse en la calle sin respetar el derecho de la calle, o entre la sombra y el sol, o en medio de un círculo sin permiso.","Bostezar sin cubrirse la boca, inclinarse al saludar y hacer que alguien se levante de su sitio sin derecho.","La magia, los amuletos, la adivinación, el tatuaje, depilar las cejas, separar los dientes y la imitación entre hombres y mujeres.","Arrancar las canas o cambiar la apariencia por ostentación, y dejarse la barba y recortar el bigote según lo que establece el método.","El viaje de la mujer sin mahram, según los detalles y relatos que presenta.","Abandonar la oración, la oración del viernes, el ayuno, el hayy o el yihad cuando son obligatorios, y huir del campo de batalla.","La usura, el acaparamiento, la venta 'ina, el fraude, comprar a quien está coaccionado y disponer del bien ajeno sin consentimiento.","Tener un perro sin necesidad válida, encender velas sobre las tumbas, construir mezquitas sobre ellas y hacer de las tumbas lugares de diversión o de ritos.","El lujo y la ropa por soberbia, alargar la prenda por vanidad y el derroche en el adorno."]]]},{"t":"Capítulo tercero: cosas que se creen piedad y escrúpulo","b":[["p","Este capítulo es de los más importantes de la Vía Muhammadiana, porque muestra que algunas personas abandonan sunnas y deberes o paralizan su vida a causa de un escrúpulo aparente y de dudas obsesivas (waswasa) sin fundamento."],["h","Sección primera: el escrúpulo excesivo en la pureza y la impureza"],["h","A. Formas de exceso"],["ul",["El exceso en el número de lavados.","Juzgar impura el agua o la ropa por una simple duda.","Repetir la ablución y la oración muchas veces.","La búsqueda exagerada de la impureza.","Dejar la oración en congregación o retrasar la oración por posibilidades imaginarias.","Desperdiciar agua y tiempo en nombre del escrúpulo.","Preguntar constantemente a la gente por la pureza de las cosas, cuando el principio es la pureza."]],["h","B. Reglas jurídicas"],["ul",["El principio en las cosas es la pureza y la licitud hasta que se demuestre lo contrario.","La certeza no se elimina con la duda.","El agua es purificadora mientras su color, sabor u olor no se altere por una impureza, presentando los detalles de las escuelas.","Está permitido usar los recipientes de la Gente del Libro mientras no se sepa que son impuros.","Está permitido rezar con sandalias cuando se constata su pureza.","No se abandona el estado aparente por una ilusión."]],["p","El método presenta las posiciones de los zahiríes, malikíes, shafiíes y hanafíes sobre el agua y la impureza, y menciona detalles sobre los pozos, los recipientes, el pan, la comida mezclada con impureza, los calcetines de cuero y el baño ritual, para afirmar que la jurisprudencia no se construye sobre las dudas obsesivas."],["h","C. Tratar las dudas obsesivas (waswasa)"],["ul",["Aprender los dictámenes de la purificación de un sabio fiable.","Tomar la facilidad y la holgura cuando las dudas se intensifican, hasta que desaparezcan.","No repetir la oración y la ablución por una simple duda.","Perseverar en la oración en congregación, el dhikr y la recitación.","Rociar a veces el cuerpo con agua después de la ablución para alejar la ilusión de humedad impura.","No dejarse arrastrar por la ilusión, y pasar a la acción siguiente.","Recordar que los Salaf no se imponían estas sutilezas imaginarias."]],["h","Sección segunda: el escrúpulo ante la comida de los bienes habices y del tesoro público"],["p","El método trata el escrúpulo respecto de los bienes mezclados, sobre todo la comida de los bienes habices (awqaf) y del tesoro público, y afirma que el juicio no se basa en la duda general, sino en el conocimiento de que lo ilícito está presente en el objeto concreto. Así, el musulmán no abandona derechos e intereses permitidos por una simple ilusión, del mismo modo que no consume un bien cuya usurpación, robo o malversación está probada."],["p","La balanza es:"],["ul",["Conocer la fuente del dinero en la medida de lo posible.","Obrar según una fetua fiable que tenga en cuenta la realidad.","Dejar lo ilícito seguro.","No convertir el escrúpulo en paralización del sustento o en acusación de la gente sin prueba."]],["h","Sección tercera: innovaciones que la gente cree actos de devoción"],["p","El método concluye advirtiendo contra cosas innovadas que la gente cree adoraciones, sobre todo lo relativo a las tumbas, los bienes habices y la recitación por los muertos en formas cuyo fundamento no está establecido a su juicio, la construcción de manifestaciones religiosas sin prueba, y la adopción de ritos colectivos, melodías o danzas en nombre del dhikr."],["p","La regla general de este capítulo: <b>no todo aquello con lo que su autor busca el bien es un acto de devoción; la devoción es lo que Dios y Su Mensajero han legislado, y lo que no ha sido legislado no se convierte en adoración por la mera buena intención.</b>"]]},{"t":"Rasgos del método terapéutico en la Vía Muhammadiana","b":[["p","El método trata las enfermedades de la religión, del alma y de los miembros con un plan recurrente:"],["ol",["<b>La definición:</b> explicar el sentido de la enfermedad o del acto, lingüística y legalmente.","<b>La exposición de los daños:</b> lo que produce en el corazón, la religión, este mundo y la otra vida.","<b>La mención del contrario:</b> mostrar que el contrario de la soberbia es la humildad, el de la envidia el buen consejo y el amor, el de la avaricia la generosidad, y el de la precipitación la verificación.","<b>La argumentación:</b> citar los versículos, los hadices, los relatos y las palabras de los juristas.","<b>El diagnóstico:</b> conocer las causas de la enfermedad, como la ignorancia, la ostentación, la mala compañía y la debilidad de la certeza.","<b>El tratamiento por la ciencia:</b> el aprendizaje, la reflexión y el conocimiento de los textos.","<b>El tratamiento práctico:</b> obligar al alma a los actos virtuosos hasta que se conviertan en hábito.","<b>El tratamiento por desarraigo:</b> cortar las causas y los ambientes que hacen volver la enfermedad.","<b>El examen de conciencia:</b> revisar la intención, la acción y los resultados.","<b>La compañía:</b> acompañar a los sabios y a los virtuosos y dejar a la gente de las pasiones.","<b>La gradualidad:</b> no pasar a un nuevo exceso en nombre del tratamiento del antiguo.","<b>La perseverancia:</b> lo que cuenta es la constancia y la conformidad con la Sunna, no el arrebato pasajero."]]]},{"t":"Resumen concentrado de la Vía Muhammadiana","b":[["p","Todo el método puede resumirse en esta fórmula:"],["p","<b>Conoce el monoteísmo, aprende el dictamen, sigue el texto, toma como modelo al Profeta ﷺ, deja la innovación y la pasión, adora a Dios con moderación, guarda tu corazón, tu lengua y tus miembros, cumple los derechos de la gente, y no dejes que el escrúpulo imaginario te aparte de las obligaciones y de una vida útil.</b>"],["p","Los signos de la sinceridad del caminante en esta Vía:"],["ul",["Que su credo sea sano y no se base en la superstición.","Que su adoración sea conforme a la Sunna y no a la exageración personal.","Que sea humilde y no se deje engañar por un prodigio, un desvelamiento o un gran número de seguidores.","Que cumpla las obligaciones y los derechos de los padres, el cónyuge, los hijos y los vecinos.","Que coma, beba y vista de lo lícito sin derroche ni avaricia.","Que vigile su lengua, su oído, su vista, su mano, su vientre, su sexo y su pie.","Que busque la ciencia que necesita, y evite la disputa y las ciencias que conducen a las dudas.","Que recurra a los medios con el corazón confiado en Dios.","Que distinga entre la verdadera taqwa y la duda obsesiva, y entre el escrúpulo legítimo y el rigorismo innovado.","Que el fruto de su vía sea misericordia, veracidad, lealtad, buen carácter y beneficio para la gente."]]]},{"t":"Conclusión","b":[["p","La Vía Muhammadiana es, en esencia, un proyecto de reforma integral: parte del credo, pasa por la ciencia, la adoración y la purificación del alma, y llega a los detalles del habla, la comida, el comercio, la familia, la vecindad y los derechos públicos. Por eso «la Vía Muhammadiana» no es una apariencia espiritual separada de la Ley, sino <b>la reconstrucción de toda la vida del musulmán sobre el seguimiento del Profeta ﷺ, uniendo la rectitud del credo, la rectitud de la práctica y la rectitud del carácter</b>."],["p","La balanza que se repite en todos los capítulos de la Vía es: <b>el Libro de Dios, la Sunna de Su Mensajero, la comprensión de los Salaf, la ciencia de la jurisprudencia, el abandono del exceso y la negligencia, y la realización de la taqwa en el corazón, los miembros y los derechos de los demás.</b>"]]}]},"ru":{"title":"Мухаммадов путь","sub":"Полное введение в его основы, столпы, разделы и практические вопросы","note":"<b>Методологическое примечание:</b> это обобщающий обзор Мухаммадова пути, охватывающий его основы, столпы и практические области. В спорных вопросах фикха и вероучения следует обращаться к признанным учёным, а также проверять степень достоверности хадисов и преданий, прежде чем приводить их как доводы.","secs":[{"t":"Первое: определение Мухаммадова пути и его общая цель","b":[["p","<b>Мухаммадов путь</b> — это не название суфийского тариката, основанного на особых вирдах или на принадлежности к определённому шейху, а название целостного исламского метода, на котором зиждутся спасение и праведность мусульманина: <b>правильное вероубеждение, поклонение согласно Сунне, нравы и поведение, упорядоченные Книгой и Сунной, при избегании крайностей, небрежения и нововведений</b>."],["p","Пророческое жизнеописание — это практическое воплощение этого метода в жизни Пророка ﷺ: его убеждений, слов, дел, нрава, поклонения и обращения с людьми. Цель в том, чтобы идущий по пути сверял свои дела с этим жизнеописанием и понимал, прав ли он и следует ли образцу, или ошибается и вводит новшества. Поэтому дела каждого идущего сверяются с этим методом, чтобы отличить правого от ошибающегося и спасённого от погибающего."],["p","Этот метод появился как ответ на положение двух противоположных групп:"],["ul",["<b>Невежественные подвижники:</b> они умножают формы поклонения и духовные упражнения, но не знают границ шариата и потому впадают в нововведения и крайности.","<b>Беспечные учёные или учащиеся:</b> у них есть знание или принадлежность к науке, но они пренебрегают делами, и ими овладевают мирское и страсти."]],["p","Этот метод возвращает мусульманина к <b>середине между крайностью и небрежением</b> и к решающему источнику: Корану, Сунне и пониманию саляфов — а не к обычаям, личным вкусам, эзотерическим притязаниям или простому обилию поклонения."]]},{"t":"Второе: три столпа Мухаммадова пути","b":[["p","Мухаммадов путь стоит на трёх больших разделах, которые являются столпами метода:"],["h","1. Крепкая приверженность Книге и Сунне"],["p","Коран — источник руководства, исцеления и света, и мерило, к которому сводятся вероубеждение, поклонение и поведение. Сунна — не дополнение, без которого можно обойтись; она — разъяснение Корана, в ней повеления и запреты Пророка ﷺ и их практические подробности."],["p","Приверженность включает:"],["ul",["Почитание Корана, его чтение, понимание и следование ему, а не ограничение лишь звучным чтением.","Принятие достоверной Сунны, даже если она не совпадает с обычаями людей или частным мнением мазхаба.","Следование Сунне Пророка ﷺ, Сунне праведных халифов и пониманию сподвижников.","Отвержение всякого слова, вкуса, «откровения» или обычая, противоречащего достоверному тексту или установленному шариатскому положению.","Обращение к надёжным учёным при неясности и отказ брать религию у невежд или людей пустых притязаний."]],["h","2. Ограждение от дурных обычаев и новоизобретённых нововведений"],["p","Недостаточно лишь заявлять о любви к Сунне; нужно оставить то, что вытесняет её, — испорченные обычаи и нововведения в вероубеждении, поклонении или нравах. Одна из основ метода: нововведение может испортить соответствующую ему Сунну, и люди могут заменить пророческое руководство новыми внешними формами, считая их благочестием."],["p","Но метод различает:"],["ul",["<b>Общее языковое новшество:</b> всё новое после первого поколения — будь то обычай или полезное средство.","<b>Порицаемое шариатское нововведение:</b> добавление к религии или убавление из неё, либо введение убеждения или поклонения без дозволения Законодателя, особенно если оно противоречит тексту или установленной Сунне."]],["p","Примеры новых средств, которые сами по себе не являются порицаемым нововведением: школы, написание книг, возведение минаретов для оповещения о времени молитвы и упорядочивание доводов для опровержения атеистов, — ведь это средства, служащие шариатской цели и не противоречащие основам."],["h","3. Умеренность в делах и срединность"],["p","Поклонение заключается не в тяготах самих по себе и не в истязании себя, а в соответствии шариату и осуществлении рабства Аллаху. Умеренность означает:"],["ul",["Сначала выполнять обязательное и должное.","Соблюдать сунны без крайностей.","Соблюдать права тела, семьи, супруга или супруги, детей и людей.","Принимать облегчения, узаконенные Аллахом, при нужде.","Не поститься постоянно, не простаивать всю ночь и не отказываться от брака и благ так, чтобы это умаляло Сунну Пророка ﷺ.","Не оставлять работу, заработок и служение людям под предлогом полного посвящения себя поклонению.","Делать поклонение постоянным и устойчивым, а не временным порывом, угасающим через несколько дней."]]]},{"t":"Третье: как мусульманин осуществляет Мухаммадов путь?","b":[["p","Мухаммадов метод можно превратить в практическое мерило из десяти шагов:"],["ol",["<b>Исправление вероубеждения:</b> изучить основы единобожия, веры, пророчества, Последней жизни и предопределения по Книге и Сунне.","<b>Знание того, что нужно в твоём положении:</b> изучить то, что тебе необходимо для молитвы, очищения, поста, закята, сделок, семьи и работы.","<b>Сверка дела с текстом:</b> спрашивай о доводе убеждения, поклонения или поведения и не делай вкус или сон самостоятельным доводом.","<b>Возвращение к достоверной Сунне:</b> недостаточно, чтобы предание было в какой-либо книге; нужно учитывать его достоверность, понимание и сбор его путей передачи.","<b>Понимание сподвижников и саляфов:</b> ибо они лучше всех знали смысл текста и то, как его применять.","<b>Проверка последствий:</b> ведёт ли поступок к оставлению обязательного, притеснению человека, гибели себя или порче вероубеждения? Если да — это не Мухаммадов путь.","<b>Отвержение противоречащего «откровения»:</b> вдохновение, сон и чудо могут случаться, но они не устанавливают шариатского положения, не делают запретное дозволенным и не запрещают дозволенное.","<b>Достижение равновесия:</b> соединяй поклонение и заработок, уединение и общение, страх и надежду, использование средств и упование на Аллаха.","<b>Наблюдение за плодом:</b> признак правильности пути — возрастание веры, покорности, смирения, благонравия и милосердия, а не самолюбование, высокомерие и презрение к людям.","<b>Постоянный самоотчёт:</b> проверяй сердце, язык и члены тела и лечи каждый порок его противоположностью, праведным окружением, знанием и делом."]],["p","<b>Итог:</b> Мухаммадов путь осуществляется не обилием вирдов или притязаний, а соответствием внешнего и внутреннего Книге и Сунне, которое проявляется в вероубеждении, поклонении, нравах и правах людей."]]},{"t":"Подробная карта пути","b":[["h","Введение в Мухаммадов путь"],["p","Мухаммадов путь объединяет вероучение, фикх, аскезу, поклонение, поведение, болезни сердец и опровержение нововведений; поэтому это метод всестороннего исправления, не ограничивающийся одной стороной жизни мусульманина."],["p","Среди черт этого метода:"],["ul",["Обычно он начинается с аятов, затем хадисов и преданий, затем слов факихов и саляфов.","Он разъясняет языковые и шариатские термины.","Он учитывает разногласия факихов и согласует тексты с правилами выведения доводов.","Он превращает довод в практическое положение и применимое поведение.","Он направляет идущего к делу и самоотчёту.","Он опровергает противоречащие мнения и притязания доводами и шариатскими правилами."]],["p","В вопросах вероучения и фикха, в которых учёные разошлись, необходимо отличать категоричные основы от вопросов иджтихада и не превращать разногласие в фикхе в обвинение в нововведении или неверии без знания."]]},{"t":"Раздел первый: следование и срединность","b":[["h","1. Приверженность Корану и Сунне"],["p","Метод утверждает, что Коран — крепкая вервь Аллаха, исцеление, свет и руководство; кто поставит его перед собой, того он приведёт в Рай, а кто отбросит его за спину, того он приведёт к погибели. Затем он присоединяет к Корану Сунну, ибо Пророку ﷺ была дана Книга и подобное ей вместе с ней, и недопустимо ограничиваться Кораном, отвергая разъяснение Пророка."],["p","Метод приводит хадисы о том, что лучшее руководство — руководство Мухаммада ﷺ, предостерегающие от новоизобретённых дел и обязывающие следовать Сунне Пророка и праведных халифов. Значит, при разногласии мерилом служит не то, что люди сочли хорошим, и не то, на что притязает шейх или обладатель «откровения», а Откровение и понимание саляфов."],["h","2. Смысл нововведения и его виды"],["p","Метод рассматривает нововведение с двух сторон:"],["ul",["<b>Нововведение в вероубеждении:</b> самое опасное — например, противоречие основам единобожия, отрицание того, что известно в религии с необходимостью, или предпочтение страсти и ложного толкования тексту.","<b>Нововведение в поклонении:</b> введение формы, числа или обрядового обязательства без основания; оно тяжелее, если сталкивается с подтверждённой Сунной.","<b>Новшество в обычаях и средствах:</b> оно не является заблуждением лишь потому, что ново; рассматривают его цель и соответствие шариату. Школа, книга и минарет — средства для правильных целей, а не самостоятельные поклонения."]],["p","Среди правил этого раздела:"],["ul",["Если дело колеблется между Сунной и нововведением, безопаснее его оставить, если только это не ведёт к оставлению обязательного.","Совершение нововведения может быть вреднее оставления Сунны, ибо нововведение внушает совершающему, что он на истине, и вытесняет Сунну.","Неверно считать шариатским нововведением всё, чего не было в первом поколении; следует смотреть, является ли это самоцельным поклонением или дозволенным средством.","Иджтихад — оправдание во второстепенных вопросах, допускающих толкование, но не оправдание в категоричных основах вероубеждения или в противоречии установленному тексту после того, как он стал известен."]],["h","3. Опровержение притязаний эзотерического суфизма"],["p","Метод разбирает тех, кто говорит, что у шариата есть внешнее для простых людей и особое внутреннее, или что люди «откровения» не нуждаются в Книге и Сунне, или что они получают положения от Пророка ﷺ во сне, или утверждают, что чудо доказывает правильность их пути."],["p","Он опровергает это, утверждая, что:"],["ul",["Вдохновение не является самостоятельным источником шариатских положений.","Сон не делает запретное дозволенным и не запрещает дозволенное.","Чудо не является шариатским чудом, если ему сопутствует противоречие Книге и Сунне; оно может быть постепенным заманиванием к гибели или иллюзией.","Мерило праведника (вали) — соблюдение границ, следование повелениям и запретам, знание и дело, а не чудеса и внешние проявления.","Кто утверждает, что внутреннее позволяет ему нарушать внешнее, тот разрушил шариат."]],["p","Метод приводит слова великих суфийских шейхов, подтверждающие эту основу: аль-Джунайд говорит, что все пути закрыты, кроме как для того, кто следует по стопам Посланника; ас-Сари ас-Сакати определяет суфизм так, что внутреннее не нарушает внешнего, а чудеса не побуждают попирать запреты Аллаха; а Абу Язид делает мерилом соблюдение повелений и запретов, а не полёты по воздуху или проявление чудес."],["h","4. Умеренность в поклонении"],["p","Метод приводит пример трёх человек: один хотел всегда простаивать ночь, второй — поститься постоянно, а третий — отказаться от брака. Пророк ﷺ вернул их к своей Сунне: он постится и прерывает пост, молится и спит, и женится."],["p","Он разъясняет, что суровость духовных упражнений может быть временным лечением болезни сердца или привычкой, свойственной природе некоторых праведников, но это не означает, что иной путь лучше руководства Пророка ﷺ. Она не должна вести к:"],["ul",["Оставлению обязательного.","Пренебрежению правами семьи и тела.","Прекращению дозволенного заработка при нужде.","Гибели себя или отрыву от общины.","Убеждению, что сама тягота приближает к Аллаху больше, чем Сунна."]],["p","Заработок может быть обязательным в мере, достаточной человеку и тем, кого он обязан содержать, и желательным, если превышает это, чтобы содержать родственника или помочь бедному. Польза заработка, распространяющаяся на других, может быть лучше добровольного поклонения, приносящего пользу лишь совершающему."]]},{"t":"Раздел второй: важные дела в Мухаммадовом шариате","b":[["p","Этот раздел — самый обширный в методе; в нём три больших главы:"],["ol",["Исправление вероубеждения согласно пути людей Сунны и общины.","Науки, изучаемые ради другого.","Богобоязненность (таква), её проявления и пороки сердца, языка и членов тела."]],["h","Глава первая: исправление вероубеждения"],["h","А. Единобожие и атрибуты"],["p","Метод утверждает, что Всевышний Аллах превыше тела, субстанции, акциденции, места, направления, пределов, органов и времени; что Он Един и ничему не подобен; вечен без начала и без конца; обладает атрибутами совершенства."],["p","Он излагает вопросы атрибутов, Речи и видения Аллаха, приводя положения мутакаллимов и факихов, учитывая различия научных школ в некоторых вопросах вероучения и приводя слова саляфов и людей хадиса."],["h","Б. Коран, видение Аллаха и предопределение"],["p","Среди вопросов вероучения, которые он излагает:"],["ul",["Коран — несотворённая Речь Аллаха.","Видение Аллаха в Последней жизни установлено у людей Сунны — без охвата, без «как» и без места.","Деяния рабов сотворены Аллахом, а у рабов есть выбор и приобретение, за которые они заслуживают похвалы и порицания; метод — середина между джабаритами (фаталистами) и кадаритами (отрицателями предопределения).","Способность учитывается вместе с действием, и Аллах не возлагает на душу сверх её возможностей.","Сроки жизни и уделы предопределены; запретное является «уделом» в том смысле, что оно происходит в рамках предопределения Аллаха, а не в смысле его дозволенности.","Мучения и блаженство в могиле, воскрешение, Весы, Книга деяний, Водоём, Мост, заступничество, Рай и Ад — истина.","Вознесение (Мирадж) произошло с Пророком ﷺ наяву, телом.","Признаки Часа, упомянутые в Сунне, — истина."]],["h","В. Вера и великие грехи"],["p","Он излагает разногласие об определении веры: только ли это признание и подтверждение, или это слово и дело, которое увеличивается с покорностью и уменьшается с ослушанием. Он утверждает, что разногласие в некоторых формулировках мутакаллимов отчасти словесное, при этом люди Сунны согласны, что Аллах желает от рабов слова и дела, и что великие грехи не выводят единобожника из ислама и не делают его достойным вечного пребывания в Аду."],["p","Он также излагает вопрос о словах мусульманина: «Я верующий, если пожелает Аллах», и отмечает, что если он подразумевает сомнение в самой основе своей веры, то это опасно; если же подразумевает смирение, страх дурного конца или отказ от самовосхваления, то у учёных это имеет основание."],["p","Он утверждает, что вера подражающего действительна у части людей Сунны, хотя оставление размышления при способности к нему — упущение или грех по мнению некоторых из них."],["h","Г. Пророчество, чудеса праведников и сподвижники"],["ul",["Пророки свободны от лжи и вероломства; лучший и последний из них — Мухаммад ﷺ.","Ангелы — почётные рабы, не ослушивающиеся Аллаха.","Чудеса пророков — истина.","Чудеса праведников возможны, но они не возвышают праведника до степени пророка и не снимают с него повелений и запретов.","Лучшие из праведников — сподвижники, во главе с Абу Бакром, затем Умаром, затем Усманом, затем Али, затем остальными сподвижниками; о них следует говорить лишь хорошее.","Любовь к сподвижникам и их почитание — плод любви к Пророку ﷺ, а их поношение или умаление — отклонение."]],["h","Д. Имамат и фикховые вопросы, связанные с вероубеждением"],["p","Метод упоминает нужду мусульман в правителе, способном исполнять положения; его непогрешимость или то, что он лучший человек своего времени, не являются условием, и, согласно его фикховой позиции, смещение правителя не обязательно лишь из-за нечестия и несправедливости. Он упоминает дозволенность молитвы позади благочестивого и грешника при сохранении порицания греха."],["p","Он также рассматривает такие вопросы, как протирание кожаных носков, кувшинный набиз, если он не опьяняет, польза умершему от поклонений, мольбы и милостыни за него, колдовство и сглаз, а также вопрос о том, достигает ли муджтахид истины или ошибается; он утверждает, что истина в действительности одна, а ошибающийся, имеющий оправдание, получает награду за свой иджтихад."],["h","Е. Течения и нововведения"],["p","Метод излагает многие течения и учения, среди них хариджиты, мурджииты, кадариты, джабариты, мутазилиты, рафидиты, кайсаниты, язидиты, наджжариты и джахмиты, и опровергает то, что считает противоречащим основам людей Сунны, особенно:"],["ul",["Обвинение мусульман в неверии за великие грехи.","Отрицание предопределения или признание раба творцом собственных деяний.","Отрицание атрибутов или утверждение того, что влечёт уподобление.","Учение о переселении душ или о вселении Бога в имамов.","Отмена молитвы, поста и закята под предлогом повиновения шейху или скрытому имаму.","Возвышение праведников над пророками или предпочтение их Пророку ﷺ."]],["p","Итог метода для идущего: обрести убеждённость в вероучении людей Сунны, остерегаться вводящих в заблуждение и сеющих сомнения и не принимать притязаний, возвышающих своих авторов над текстами или над степенью пророчества."]]},{"t":"Глава вторая: науки, изучаемые ради другого","b":[["p","Метод делит науки на три вида:"],["h","1. Науки, являющиеся личной обязанностью"],["p","Это то, что нужно каждому ответственному для правильности его религии и положения, например:"],["ul",["Положения об очищении, молитве, посте, закяте и хадже для того, кому он обязателен.","Необходимые положения о купле-продаже, найме, браке, разводе и работе.","Знание сердца: упование на Аллаха, богобоязненный трепет, надежда и обращение к Нему.","Знание о высокомерии, показухе, зависти и скупости и о том, что нужно для их лечения."]],["p","Незнание того, без чего поклонение или сделка недействительны, — не оправдание для того, кто способен учиться."],["h","2. Науки, являющиеся коллективной обязанностью"],["p","Это те, которыми достаточно заниматься части общины: фикх, тафсир, хадис, основы фикха, арабские науки, наука о наследовании, арифметика, нужная для судейства и наследства, а также медицина и полезные науки, в которых нуждается община."],["h","3. Запретные или порицаемые науки"],["ul",["Углубление в калям и споры без нужды или без способности, особенно если это порождает сомнения.","Астрология, притязающая на знание сокровенного или на влияние звёзд.","Колдовство, чародейство и шарлатанство; изучение их состояний допускается лишь с целью разоблачить зло и отвратить его.","Диспут, если он ради препирательства, показухи и поражения противника; он дозволен при нужде с намерением справедливости и выявления истины."]],["p","Что же до астрономии, которая нужна мусульманину для определения времени молитв и киблы, она дозволена или полезна в меру нужды; а то, что доходит до притязания на знание сокровенного, запрещено."],["h","Медицина, средства и упование на Аллаха"],["p","Метод делит средства на:"],["ul",["<b>Несомненные:</b> как вода при жажде и еда при голоде; их оставление при страхе гибели может быть запретным.","<b>Предположительные:</b> как лекарство, хиджама и кровопускание; обращение к ним не противоречит упованию, если мусульманин убеждён, что исцеляет Аллах.","<b>Мнимые:</b> как суеверные средства или то, на что нет довода; отказ от привязанности к ним — требование упования."]],["p","Упование не означает оставления всякого средства; оно означает, что сердце не верит, будто средство действует независимо от Аллаха."]]},{"t":"Глава третья: богобоязненность (таква)","b":[["h","Смысл таквы и её достоинство"],["p","Таква происходит от слова «защита»: раб ставит между собой и гневом и наказанием Аллаха защиту, повинуясь Ему и оставляя ослушание. У неё есть общий смысл — оберегать себя от всего, что вредит в Последней жизни, и частный — избегать всякого слова, дела или упущения, заслуживающего наказания."],["p","Таква не завершается лишь оставлением некоторых дозволенных вещей или строгостью в очищении; она включает:"],["ul",["Правильность вероубеждения.","Выполнение обязательного и должного.","Оставление запретного и нововведений.","Исправление сердца, языка и членов тела.","Соблюдение прав людей и животных."]],["h","Основы исправления нрава"],["p","Метод связывает нрав с тремя силами:"],["ul",["<b>Разум и речь:</b> их равновесие — мудрость, избыток — хитрость и коварство, недостаток — тупость.","<b>Гнев:</b> его равновесие — храбрость, избыток — безрассудство, недостаток — трусость.","<b>Вожделение:</b> его равновесие — целомудрие, а избыток — жадность и распутство."]],["p","Способ лечения порицаемого нрава:"],["ol",["Знать суть болезни, её причины и пагубные последствия.","Отчитываться перед собой и искать признаки болезни.","Устранять причину, ведущую к ней.","Практиковать противоположное качество, пока добродетель не станет устойчивым свойством.","Принимать совет правдивых людей.","Помнить тексты угрозы за порок и тексты похвалы за добродетель.","Бороться с душой постепенно, а не временными порывами.","Держаться людей знания и праведности и оставлять губительное окружение."]]]},{"t":"Пороки сердца","b":[["p","Метод включает <b>шестьдесят пороков сердца</b> и разъясняет для каждого его смысл, пагубу и лечение. Ниже — полный упорядоченный список с сохранением заголовков, от которых ответвляются лечебные разборы или практические применения:"],["h","Первое: пороки убеждения, намерения и знания"],["dl",[["1. Неверие в Аллаха","Его виды — неверие по невежеству, неверие отрицания и упрямства и неверие по шариатскому суждению; это величайшее из губительного."],["2. Невежество","Оно бывает простым — отсутствие знания, и составным — когда ложь считают знанием и истиной."],["3. Любовь к власти и мирскому положению","Стремление владеть сердцами людей и привязанность к положению и славе, кроме того, что направлено на поддержку истины или исправление людей без показухи."],["4. Страх порицания и упрёков","Оставление или сокрытие истины из страха перед словами и упрёками людей."],["5. Любовь к похвале и восхвалению","Радость от похвалы людей и стремление к ней; её лечение — помнить, что полезно принятие Аллахом, а не восхищение творений."],["6. Нововведенческое убеждение","Введение убеждения или поклонения без основания или предпочтение обычаев и вкусов Сунне."],["7. Следование страсти","Превращение личного желания в судью над текстом и истиной; лечение — борьба с душой и следование руководству."],["8. Слепое подражание в вероучении","Принятие убеждения без довода при способности к размышлению — в отличие от следования не-муджтахида за учёным в практических положениях."],["9. Показуха (рия)","Совершение дел ради того, чтобы люди видели и хвалили; она бывает явной и скрытой, а её противоположность — искренность."],["10. Надежда и долгая надежда","Откладывание покаяния и дел в расчёте на долгую жизнь; лечение — поминание смерти и сокращение надежд."],["11. Алчность","Привязанность сердца к тому, что в руках людей, или к тому, чем оно не владеет; противоположность — довольство малым и упование на Аллаха."],["12. Высокомерие","Видеть себя выше истины или выше людей; среди лекарств — принятие истины, смирение и знание о начале и конце человека."],["13. Угодничество и лесть","Натянутое стремление снискать одобрение и похвалу людей и заискивание перед ними, портящее правдивость и достоинство."],["14. Самолюбование (уджб)","Восхищение человека собой, своими делами или знанием и забвение милости Аллаха к нему."]]],["h","Второе: пороки зависти, гнева и вражды"],["dl",[["15. Зависть","Желание, чтобы благо другого исчезло; лечение — помнить, что блага — удел от Аллаха, желать добра тому, кому завидуешь, и поступать вопреки тому, к чему призывает зависть."],["16. Злопамятство","Сохранение вражды в сердце в ожидании возможности отомстить; лечение — прощение и устранение причин гнева."],["17. Злорадство","Радость беде мусульманина; лечение — милосердие и памятование о переменчивости состояний."],["18. Разрыв отношений и вражда","Разрыв связей и скрываемая ненависть без права; противоположность — примирение, прощение и поддержание родственных связей."],["19. Трусость","Слабость сердца перед истиной или перед тем, что нужно отразить; противоположность — храбрость, упорядоченная мудростью."],["20. Безрассудство","Действие без проверки и без учёта последствий; противоположность — основательность и выверенная решимость."],["21. Вероломство","Нарушение договора и обязательства без уведомления или шариатской причины; противоположность — соблюдение и исполнение договора."],["22. Предательство доверия","Нарушение доверия в слове, имуществе, совете или работе; противоположность — честность."],["23. Нарушение обещания","Обещание с намерением не исполнить или неисполнение без оправдания; противоположность — исполнение обещания и верность обязательству."],["24. Дурное мнение об Аллахе и верующих из-за простой мнительности или сомнения","Оно запретно, если ведёт к обвинению мусульманина или разговорам о нём; осторожность, основанная на весомых признаках, не является запретным дурным мнением."],["25. Суеверные дурные приметы (тияра)","Видеть дурные знаки в людях, днях, звуках и событиях; противоположность — добрый знак, не содержащий притязания на сокровенное и суждения о будущем."]]],["h","Третье: пороки, связанные с имуществом, миром и трудом"],["dl",[["26. Скупость и скаредность","Удерживать имущество там, где его следует тратить по шариату или по благородству; одна из худших форм — лишать себя еды, одежды и лечения при нужде."],["27. Расточительство и транжирство","Тратить имущество там, где его следует удержать, или переходить меру в еде, одежде, милостыне и прочих расходах."],["28. Любовь к имуществу","Привязанность сердца к имуществу ради него самого или превращение его в цель, тогда как имущество — средство для исполнения прав и дозволенных расходов."],["29. Любовь к миру","Предпочтение этого мира Последней жизни, погружение в его утехи и забвение участи."],["30. Порицаемая жадность","Сильная привязанность к имуществу, положению и выгодам, порождающая несправедливость, оставление поклонения или унижение себя."],["31. Безрассудство ума (сафах)","Лёгкость ума, дурное поведение и неумение употреблять имущество, слово или дело по назначению."],["32. Лень и праздность","Оставление полезного труда и обязанностей при способности, склонность к покою и растрачивание сил впустую."],["33. Поспешность","Действие до проверки, вынесение суждения или поступок до полного размышления."],["34. Откладывание и промедление","Отсрочка покаяния, обязанности и полезного дела, пока не пройдёт их время."],["35. Грубость и жестокосердие","Грубое обращение, мало милосердия и нетерпимость к людям; противоположность — кротость, мягкость и обходительность."]]],["p","Середина в имуществе — щедрость без расточительства, бережливость без скупости, дозволенный заработок без погружения в него и милостыня без ущерба для прав себя, семьи и религии. Расточительство лечится знанием — понимая его пагубу, делом — контролируя расходы, и искоренением — устраняя его причины, такие как показуха, безрассудство и дурное окружение."],["h","Четвёртое: пороки устремлённости, довольства и отношений"],["dl",[["36. Бесстыдство и утрата стыдливости","Дерзость в мерзком, отсутствие отвращения к греху и нежелание извиняться за ошибку."],["37. Нетерпение и жалобы","Возражение сердцем и языком против испытания, противоречащее терпению; при этом жаловаться Аллаху и просить Его помощи дозволено."],["38. Неблагодарность за блага","Забвение Дарующего, приписывание блага себе или одним лишь людям и неиспользование его в том, что угодно Аллаху."],["39. Недовольство тем, что желаемое не получено","Негодование и раздражение, когда упущено то, чего желает душа; противоположность — довольство предопределением Аллаха при использовании дозволенных средств."],["40. Привязанность к кому-либо, кроме Аллаха","Опора сердца на творение, средство или иллюзию при забвении того, что польза и вред в руке Аллаха; должное — использовать средства, уповая на Аллаха."],["41. Любовь к нечестивцам и склонность к притеснителям","Любовь к ним, заискивание перед ними или опора на них в несправедливости и лжи — при различении между порицанием их дел и справедливостью к ним."],["42. Ненависть к учёным и праведникам","Неприязнь к людям знания и стойкости из-за зависти, фанатизма или противоречия страсти."],["43. Дерзость перед Аллахом и чувство безопасности от Его наказания и гнева","Упорство в грехе с чувством безопасности от наказания."],["44. Отчаяние в милости Аллаха","Убеждённость, что грех не будет прощён или что покаяние бесполезно; противоположность — сочетание страха и надежды."],["45. Печаль о мирском","Овладение сердцем печали из-за упущенной преходящей утехи, так что оно слабеет для религии и обязанностей."],["46. Страх в мирских делах","Чрезмерный страх бедности, людей или будущего, мешающий истине или ведущий к запретному."],["47. Обман и злоба","Неискренность в совете, сокрытие изъяна или введение других в заблуждение; сюда входят надувательство, обман и коварство; обман на войне или для отражения заслуженной несправедливости имеет иное положение."],["48. Смута (фитна)","Ввергание людей в смятение, раздоры и столкновения или искажение смысла слов и подстрекательство людей к притеснению, мятежу и бедствиям."],["49. Угодливое потакание (мудахана)","Отказ от порицания лжи или её приукрашивание ради угождения людям или из страха за положение — в отличие от дозволенной обходительности (мудара), которая сохраняет истину и не оправдывает ложь."],["50. Чрезмерная привязанность к людям и тоска при разлуке с ними","Привязанность сердца к творениям до ослабления его привязанности к Аллаху; противоположность — праведное общение при независимости сердца, опирающегося на Аллаха."],["51. Опрометчивость и легкомыслие","Недостаток степенности, быстрая возбудимость и действия без мудрости."],["52. Упрямство, высокомерие перед истиной и её отрицание после знания","Отвержение истины не из-за её неясности, а из-за противоречия страсти или ради сохранения положения."],["53. Непокорность и отказ","Отказ подчиняться истине и законному повелению из-за высокомерия или любви к независимости."],["54. Чванство","Возвеличивание себя, гордыня, демонстрация превосходства и презрение к людям."],["55. Лицемерие","Показ добра и сокрытие зла или расхождение внешнего и внутреннего; сюда входит лицемерие в убеждении и лицемерие в делах."],["56. Чёрствость и жестокость","Мало милосердия и невосприимчивость к увещеванию или к страданиям людей; противоположность — мягкость и милосердие."],["57. Тупость и глупость","Слабость понимания, недостаток проницательности или бездействие ума в учении и размышлении."],["58. Ненасытность к еде и плотской близости","Выход за пределы нужды и подчинение вожделению до ослабления поклонения, целомудрия и здоровья."],["59. Вялость","Слабость устремлённости, охлаждение к благу и отказ от поспешания к покорности и полезному."],["60. Упорство в грехах и пустых забавах","Повторение греха без покаяния и продолжение забав и того, что отвлекает от обязанностей и ослабляет сердце."]]],["h","Общее правило лечения пороков сердца"],["p","Каждая болезнь лечится знанием её сути и пагубы, затем пресечением её причин и практикой противоположного качества, пока оно не станет устойчивым свойством: высокомерие лечится смирением, скупость — щедростью, трусость — храбростью, гнев — кротостью, зависть — доброжелательностью и любовью, показуха — искренностью, долгая надежда — поминанием смерти, отчаяние — благим мнением об Аллахе, а ненасытность — целомудрием и умеренностью. Затем метод упоминает основы добродетелей, такие как мудрость, храбрость, целомудрие и справедливость, и показывает, что добродетели — устойчивые свойства, проявляющиеся в обращении, расходах, терпении, правдивости и исполнении прав."]]},{"t":"Пороки языка","b":[["p","Метод считает язык одним из самых опасных врат таквы, ибо слово может разрушить вероубеждение, обидеть человека, испортить отношения или вызвать смуту. Среди пороков языка, которые он подробно разбирает:"],["ul",["Слово неверия и то, что близко к нему.","Ошибка, ложь и измышление на Аллаха и Его Посланника.","Обещание с намерением нарушить и пересказ всего услышанного.","Губительный намёк.","Злословие (гыйба), сплетни, поношение, укоры, насмешка, брань, непристойность и проклятие.","Причитания по умершим, разглашение тайны и погружение в ложное.","Ссоры, споры, препирательства и вычурность в речи.","Расспросы простых людей о тонкостях, которые их смущают или запутывают.","Добывание имущества и положения унизительной речью.","Словесное лицемерие и двуличная речь.","Дурное заступничество, повеление порицаемого и запрещение одобряемого.","Грубость речи и посягательство на честь людей.","Расспросы о недостатках людей и выискивание их.","Разговоры во время азана и икамы, в молитве, во время хутбы, в уборной, во время близости, во время чтения Корана и в мечетях без нужды.","Мольба против мусульманина или мольба за притеснителя.","Перебивание собеседника и возражение подчинённого старшему без права.","Тайный разговор двоих в присутствии третьего, если это его огорчает.","Разговор с посторонней женщиной без нужды.","Указание пути к греху или разрешение на него."]],["p","С другой стороны, он упоминает пороки молчания: не приветствовать, не отвечать на приветствие, не отвечать чихнувшему, не давать совета, не спасать притеснённого или зовущего на помощь при возможности и не запрещать порицаемое при наличии условий. Молчание — не абсолютная добродетель; добродетель в том, чтобы говорить, где нужно говорить, и молчать, где нужно молчать."],["p","К речи дозволенной или желательной при условиях относятся: шутка без лжи и запугивания, похвала без преувеличения и показухи, стихи без запретного, рифмованная проза и красноречие без вычурности, и разговор о благе религии и мира."]]},{"t":"Пороки слуха, зрения, руки, живота, срамных органов, ноги и тела","b":[["h","Пороки уха"],["ul",["Слушание злословия, сплетен, лжи и ложного.","Слушание пения, забав и мелодий, которые порицает метод.","Слушание речей, возбуждающих страсть или смуту.","Слушание Корана или зикра так, что это искажает смысл или превращает его в забаву и пляску.","Оставление обязательного слушания знания, увещевания и совета."]],["p","Метод предостерегает от суфийской пляски с криками, пением и сумбуром и утверждает, что зикр стоя и сидя дозволен, если совершается с благоговением и спокойствием, без напева, искажающего слова, и без забавы."],["h","Пороки глаза"],["ul",["Взгляд на аурат.","Взгляд с вожделением на постороннюю женщину.","Взгляд на то, что возбуждает соблазн или помогает греху.","Заглядывание в дома людей или в их тайны."]],["p","Он упоминает исключения при нужде: принятие и дача свидетельства, решение судьи, повитуха при родах, проверка изъяна, обрезание, лечение, намерение жениться или купить; мерилом служит мера нужды без превышения."],["h","Пороки руки"],["ul",["Убийство, ранение и побои без права.","Захват чужого, кража и взятка.","Взятие захваченного имущества или уничтожение чужого имущества.","Помощь притеснителю или отказ исправить порицаемое при возможности.","Изображение, которое метод относит к запретному.","Игра с тем, что вредит человеку или животному.","Использование руки для причинения вреда или посягательства на людей."]],["h","Пороки живота и правила еды и питья"],["ul",["Введение запретного в живот.","Еда сверх нужды и чрезмерное пресыщение.","Еда того, что вредит телу.","Отказ от еды и питья до ослабления для обязательного или общей молитвы.","Расточительство в еде и её порча."]],["p","Среди правил, которые он упоминает: произнесение имени Аллаха, еда правой рукой, еда с того, что перед тобой, не есть из середины блюда, если оно одного вида, не дуть в напиток и не дышать в сосуд, подавать сидящему справа и не пользоваться сосудами из золота и серебра для еды и питья — согласно подробностям фикха."],["h","Пороки срамных органов"],["p","Метод подробно разбирает прелюбодеяние, мужеложство и скотоложство, близость с женщиной во время менструации или послеродового кровотечения запретным образом, запретное наслаждение, близость с вредом или до истечения срока очищения (истибра), а также то, что связано с сокрытием аурата и правилами уединения и справления нужды."],["h","Пороки ноги"],["ul",["Хождение на собрания греха, чтобы совершать его или наблюдать.","Поездки или выходы, вредящие родителям или пренебрегающие их правами.","Вход на чужую землю или в чужой дом без разрешения, кроме как при необходимости или с обычным разрешением.","Хождение по могилам или вход в святые места без должного почтения.","Перешагивание через людей в пятницу.","Уклонение от пятничной молитвы, общей молитвы, учения и обучения, хаджа и джихада, когда они становятся личной обязанностью.","Посещение правителей и притеснителей ради мирского или чтобы помочь им в их несправедливости.","Внезапное возвращение к семье после долгого путешествия."]],["h","Общие пороки тела и права людей"],["p","Метод подробно разбирает общественные и семейные права, среди них:"],["ul",["Непочтительность к родителям — с указанием, что нет повиновения творению в ослушании Творца, и что доброта к родителям и служение им обязательны даже при их неверии, пока мусульманин не опасается за свою религию.","Разрыв родственных связей; наименьшее их поддержание — приветствие или передача приветствия, а большее — посещение, помощь и подарки.","Причинение вреда жене или мужу и несоблюдение взаимных прав.","Пренебрежение детьми и теми, кого обязан содержать, и отказ от их обучения и воспитания.","Притеснение слуг или возложение на них непосильного, отказ кормить, одевать их и учить необходимому.","Причинение вреда соседу, отказ помогать ему, навещать или утешать его.","Выбор дурного окружения; человек подвержен влиянию своего близкого друга.","Сидение на дороге без соблюдения прав дороги, или между тенью и солнцем, или посреди круга без разрешения.","Зевота без прикрытия рта, поклон при приветствии и поднятие человека с его места без права.","Колдовство, амулеты, гадание, татуировки, выщипывание бровей, разведение зубов и уподобление мужчин женщинам и наоборот.","Выщипывание седины или изменение облика ради показухи, а также отращивание бороды и подстригание усов согласно тому, что устанавливает метод.","Поездка женщины без махрама — согласно подробностям и преданиям, которые он излагает.","Оставление молитвы, пятничной молитвы, поста, хаджа или джихада, когда они обязательны, и бегство с поля боя.","Ростовщичество, спекулятивное удержание товара, сделка ина, обман, покупка у принуждённого и распоряжение чужим имуществом без согласия.","Содержание собаки без уважительной нужды, зажигание свечей на могилах, строительство мечетей над ними и превращение могил в места забав или обрядов.","Роскошь и одежда ради высокомерия, удлинение одежды из кичливости и расточительство в украшениях."]]]},{"t":"Раздел третий: то, что считают богобоязненностью и благочестивой осторожностью","b":[["p","Этот раздел — один из важнейших в Мухаммадовом пути, так как показывает, что некоторые люди оставляют сунны и обязанности или парализуют свою жизнь из-за внешней осторожности и беспочвенных наваждений (васваса)."],["h","Глава первая: чрезмерная дотошность в чистоте и нечистоте"],["h","А. Формы крайности"],["ul",["Чрезмерность в числе омовений частей.","Признание воды или одежды нечистой по одному лишь сомнению.","Многократное повторение омовения и молитвы.","Чрезмерные поиски нечистоты.","Оставление общей молитвы или задержка молитвы из-за мнимых вероятностей.","Растрата воды и времени во имя осторожности.","Постоянные расспросы людей о чистоте вещей, тогда как исходное положение — чистота."]],["h","Б. Фикховые правила"],["ul",["Исходное в вещах — чистота и дозволенность, пока не доказано обратное.","Уверенность не устраняется сомнением.","Вода очищающая, пока её цвет, вкус или запах не изменились от нечистоты, — с изложением подробностей мазхабов.","Дозволено пользоваться посудой людей Писания, пока не известна её нечистота.","Дозволено молиться в сандалиях, если установлена их чистота.","Явное состояние не оставляют ради мнимого."]],["p","Метод излагает мнения захиритов, маликитов, шафиитов и ханафитов о воде и нечистоте и приводит подробности о колодцах, посуде, хлебе, пище, смешанной с нечистотой, кожаных носках и полном омовении, чтобы утвердить, что фикх не строится на наваждениях."],["h","В. Лечение наваждений (васваса)"],["ul",["Изучение положений об очищении у надёжного учёного.","Использование облегчения и широты при усилении наваждений, пока они не пройдут.","Не повторять молитву и омовение из-за одного лишь сомнения.","Продолжать посещать общую молитву, совершать зикр и чтение.","Иногда побрызгать водой на тело после омовения, чтобы отогнать мнимое ощущение нечистой влаги.","Не поддаваться мнимому и переходить к следующему делу.","Помнить, что саляфы не обременяли себя такими мнимыми тонкостями."]],["h","Глава вторая: осторожность в отношении пищи из вакфов и казны"],["p","Метод разбирает осторожность в отношении смешанного имущества, особенно пищи из вакфов и государственной казны, и утверждает, что суждение строится не на общем сомнении, а на знании о наличии запретного в конкретной вещи. Мусульманин не оставляет дозволенных прав и выгод из-за простой мнительности, как и не употребляет имущество, захват, кража или растрата которого установлены."],["p","Мерило таково:"],["ul",["Знать источник имущества по мере возможности.","Действовать по надёжной фетве, учитывающей реальность.","Оставлять несомненно запретное.","Не превращать осторожность в паралич жизнеобеспечения или обвинение людей без доказательств."]],["h","Глава третья: нововведения, которые люди считают богоугодными делами"],["p","Метод завершается предостережением от новоизобретённых дел, которые люди считают поклонением, особенно связанных с могилами, вакфами и чтением за умерших в формах, основа которых, по его мнению, не установлена, возведением религиозных проявлений без довода и введением коллективных обрядов, напевов или плясок под именем зикра."],["p","Общее правило этого раздела: <b>не всё, чем совершающий стремится к благу, является богоугодным делом; богоугодное — то, что узаконили Аллах и Его Посланник, а неузаконенное не становится поклонением лишь благодаря благому намерению.</b>"]]},{"t":"Черты лечебного метода Мухаммадова пути","b":[["p","Метод лечит болезни религии, души и членов тела по повторяющемуся плану:"],["ol",["<b>Определение:</b> разъяснение смысла болезни или поступка в языковом и шариатском отношении.","<b>Разъяснение пагубы:</b> то, к чему она ведёт в сердце, религии, этом мире и Последней жизни.","<b>Указание противоположности:</b> противоположность высокомерия — смирение, зависти — доброжелательность и любовь, скупости — щедрость, поспешности — основательность.","<b>Приведение доводов:</b> аяты, хадисы, предания и слова факихов.","<b>Диагностика:</b> знание причин болезни, таких как невежество, показуха, дурное окружение и слабость убеждённости.","<b>Лечение знанием:</b> учёба, размышление и знание текстов.","<b>Лечение делом:</b> принуждение души к добродетельным делам, пока они не станут привычкой.","<b>Лечение искоренением:</b> пресечение причин и обстановки, возвращающих болезнь.","<b>Самоотчёт:</b> пересмотр намерения, дела и результатов.","<b>Окружение:</b> держаться учёных и праведников и оставлять людей страстей.","<b>Постепенность:</b> не переходить к новой крайности во имя лечения старой.","<b>Постоянство:</b> значение имеют постоянство и соответствие Сунне, а не мимолётный порыв."]]]},{"t":"Сжатый итог Мухаммадова пути","b":[["p","Весь метод можно выразить такой формулой:"],["p","<b>Познай единобожие, изучи положение, следуй тексту, бери пример с Пророка ﷺ, оставь нововведение и страсть, поклоняйся Аллаху умеренно, береги сердце, язык и члены тела, исполняй права людей и не позволяй мнимой осторожности отрезать тебя от обязательного и полезной жизни.</b>"],["p","Признаки искренности идущего по этому пути:"],["ul",["Чтобы его вероубеждение было правильным, а не основанным на суевериях.","Чтобы его поклонение соответствовало Сунне, а не личным преувеличениям.","Чтобы он был смиренным и не обольщался чудом, «откровением» или множеством последователей.","Чтобы он соблюдал обязательное и права родителей, супруга, детей и соседей.","Чтобы он ел, пил и одевался из дозволенного без расточительства и скупости.","Чтобы он следил за своим языком, слухом, зрением, рукой, животом, срамными органами и ногой.","Чтобы он искал нужное ему знание и избегал споров и наук, ведущих к сомнениям.","Чтобы он использовал средства, а сердцем
