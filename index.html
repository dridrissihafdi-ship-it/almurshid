"سُجّلت زلة، وبدأ العدّ من جديد. تُب واستأنف غدًا.":["Slip logged and the count restarted. Repent and resume tomorrow.","Faute notée, le compteur repart. Repentez-vous et reprenez demain.","Desliz registrado y la cuenta reinicia. Arrepiéntete y continúa mañana.","Оплошность отмечена, счёт начат заново. Покайтесь и продолжайте завтра."],

"مجاري القلب كلها مفتوحة: كل جارحة لم تُطهَّر بعدُ مدخلٌ تتسرّب منه ظلمة الذنوب إلى القلب.":["All the heart's channels are open: every organ not yet purified is a way for the darkness of sins to seep into the heart.","Tous les canaux du cœur sont ouverts : chaque organe non purifié laisse entrer l'obscurité des péchés.","Todos los canales del corazón están abiertos: cada órgano no purificado deja entrar la oscuridad de los pecados.","Все каналы сердца открыты: каждый неочищенный орган впускает в сердце тьму грехов."],
"أُغلقت مجاري القلب كلها، فانقطع سيل ظلمات الذنوب وصفا القلب بنور الذكر والطاعة.":["All channels are closed: the flood of sins' darkness has stopped and the heart is clear with the light of remembrance and obedience.","Tous les canaux sont fermés : le flot d'obscurité s'est arrêté et le cœur s'est éclairci par la lumière du dhikr et de l'obéissance.","Todos los canales están cerrados: se detuvo el torrente de oscuridad y el corazón se aclaró con la luz del dhikr y la obediencia.","Все каналы закрыты: поток тьмы остановлен, сердце очищено светом поминания и покорности."],

/* ---------- prayer times (MWL-style math, Fajr 19°, Isha 17°, Shafi'i Asr) ---------- */
const rad=d=>d*Math.PI/180,deg=r=>r*180/Math.PI;
const fix=(a,b)=>{a=a-b*Math.floor(a/b);return a<0?a+b:a};
function sunPos(jd){const D=jd-2451545,g=fix(357.529+0.98560028*D,360),q=fix(280.459+0.98564736*D,360),
  L=fix(q+1.915*Math.sin(rad(g))+0.02*Math.sin(rad(2*g)),360),e=23.439-0.00000036*D,
  RA=fix(deg(Math.atan2(Math.cos(rad(e))*Math.sin(rad(L)),Math.cos(rad(L))))/15,24),
  decl=deg(Math.asin(Math.sin(rad(e))*Math.sin(rad(L))));return{decl,eqt:q/15-RA}}
function prayerTimes(date){
  let y=date.getFullYear(),m=date.getMonth()+1,d=date.getDate();if(m<=2){y--;m+=12}
  const A=Math.floor(y/100),B=2-A+Math.floor(A/4);
  const jd=Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5-LNG/(15*24);
  const tz=-date.getTimezoneOffset()/60;
  const noon=t=>fix(12-sunPos(jd+t).eqt,24);
  const at=(angle,t,ccw)=>{const s=sunPos(jd+t),n=noon(t);
    const T=deg(Math.acos((-Math.sin(rad(angle))-Math.sin(rad(s.decl))*Math.sin(rad(LAT)))/(Math.cos(rad(s.decl))*Math.cos(rad(LAT)))))/15;
    return n+(ccw?-T:T)};
  const asrAngle=t=>{const s=sunPos(jd+t);return -deg(Math.atan(1/(1+Math.tan(rad(Math.abs(LAT-s.decl))))))};
  const raw={fajr:at(19,5/24,1),sunrise:at(0.833,6/24,1),dhuhr:noon(12/24),asr:at(asrAngle(13/24),13/24,0),maghrib:at(0.833,18/24,0),isha:at(17,18/24,0)};
  const night=24-(raw.maghrib-raw.sunrise);
  if(!isFinite(raw.fajr))raw.fajr=raw.sunrise-night/7;
  if(!isFinite(raw.isha))raw.isha=raw.maghrib+night/7;
  const out={};for(const k in raw)out[k]=fix(raw[k]+tz-LNG/15,24);
  // Morocco: the Ministry of Habous tables add 5 minutes to Dhuhr and Maghrib (precaution) and round Asr up
  if(inMorocco(LAT,LNG)){out.dhuhr+=5/60;out.maghrib+=5/60;out.asr+=0.5/60}
  // the seeker's own correction to match the local mosque, in minutes
  try{const A=(typeof S!=='undefined'&&S&&S.ptAdj)||{};for(const k in out)if(A[k])out[k]=fix(out[k]+A[k]/60,24)}catch(e){}
  return out;
}
/* manual correction per prayer (minutes), to match the mosque's timetable */
function ptAdjBox(){const A=S.ptAdj||{},pt=prayerTimes(new Date());
  return `<div class="box pad pa-box"><b>تعديل المواقيت يدويًا</b><p class="meta" style="margin:2px 0 8px">تُحسب المواقيت على طريقة وزارة الأوقاف المغربية (الفجر 19°، العشاء 17°) حسب ساعة هاتفك. إن اختلف وقت مسجدك فعدّله بالدقائق هنا.</p>
   ${PRAYERS.map(([k,n])=>`<div class="pa-row"><span class="pa-n">${n}</span><span class="pa-t notr" dir="ltr">${hm(pt[k])}</span><span class="pa-c"><button class="btn small" data-ptadj="${k}:-1" aria-label="ناقص دقيقة">−</button><b class="notr" dir="ltr">${(A[k]||0)>0?'+':''}${A[k]||0}</b><button class="btn small" data-ptadj="${k}:1" aria-label="زائد دقيقة">+</button></span></div>`).join('')}
   ${Object.values(A).some(Boolean)?'<div class="btns" style="margin-top:8px"><button class="btn small" data-ptadj="reset">إرجاع الحساب الأصلي</button></div>':''}</div>`}
function inMorocco(lat,lng){return lat>=20.5&&lat<=36.2&&lng>=-17.6&&lng<=-0.9}
const hm=h=>{let m=Math.round(h*60);return pad(Math.floor(m/60)%24)+':'+pad(m%60)};

async function authSubmit(){

  AUTH.err='';AUTH.info='';
  if(!window.FB){AUTH.err='تعذّر الاتصال بخدمة الحسابات. تحقّق من الإنترنت ثم أعد فتح التطبيق.';return render()}
  if(AUTH.mode==='reset'){if(!email){AUTH.err='اكتب بريدك الإلكتروني.';return render()}
    AUTH.busy=true;render();try{await FB.reset(email);AUTH.info='أُرسل رابط الاستعادة إلى بريدك. افتحه ثم ارجع وادخل بكلمة المرور الجديدة.'}catch(e){AUTH.err=authErr(e)}AUTH.busy=false;return render()}

}

let pendingName='';
const OWNER='murshid-owner';
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};

async function onAuthUser(u){
  const was=AUTH.state==='in';
  AUTH.user=u;AUTH.busy=false;
  if(!u){if(was){try{localStorage.removeItem(KEY);localStorage.removeItem(OWNER)}catch(e){}location.reload();return}
    AUTH.state='out';return render()}
  const owner=lsGet(OWNER),nm=(u.displayName||pendingName||'').trim();
  let cloud=null,offline=false;
  try{cloud=await FB.loadProgress(u.uid)}catch(e){offline=true;console.warn('load',e)}
  if(!offline){
    if(cloud&&cloud.data){
      const localAt=owner===u.uid?(S.updatedAt||0):-1;
      if((cloud.updatedAt||0)>localAt){lsSet(KEY,cloud.data);lsSet(OWNER,u.uid);location.reload();return}
    }else if(owner!==u.uid){
      // first sign-in on this account: keep this device's own data if it is real (not demo, not another account)
      if(S.demo||owner){S=freshState(nm);S.lang=LANG}
    }
    lsSet(OWNER,u.uid);
    if(!S.name&&nm)S.name=nm;
    AUTH.state='in';save();cloudSaveNow();
  }else{
    if(owner&&owner!==u.uid){S=freshState(nm);S.lang=LANG}
    lsSet(OWNER,u.uid);AUTH.state='in';
  }
  pendingName='';
  FB.touchUser(u,S.name||nm,LANG).catch(e=>console.warn('user',e));
  FB.loadContent().then(c=>{if(c){CONTENT=Object.assign({announcement:null,extra:[]},c);try{localStorage.setItem('murshid-content',JSON.stringify({ui:CONTENT.ui||null}))}catch(e){}edTheme();if(AUTH.state==='in')render()}}).catch(()=>{});
  render();
}

function normOrgans(){let ch=false;ORGANS.forEach(g=>{
  if(!S.organs[g.id])S.organs[g.id]=blankOrgan();
  const o=S.organs[g.id];
  if(!o.slips)o.slips=[];
  if(o.attempt==null)o.attempt=o.phase==='idle'?0:(o.resets||0)+1;
  if(o.attemptStart===undefined)o.attemptStart=o.days>0&&o.last?addDays(o.last,-(o.days-1)):null;
  if(!o.base&&(o.phase==='tathir'||o.phase==='tanwir'))orgMigrate(o);
  if(o.base){const k=JSON.stringify([o.days,o.phase,o.slips.length]);orgSim(o);if(k!==JSON.stringify([o.days,o.phase,o.slips.length]))ch=true}
  else o.today=o.last===TODAY?o.today:null});return ch}
/* each organ keeps a day-by-day record (hist) from a starting point (base); its count is always recomputed from it,
   so a past day can be reviewed and corrected */
function orgMigrate(o){const slipToday=o.today==='slip'&&o.last===TODAY,sl=o.slips.slice();let r='';
  if(slipToday&&sl.length&&sl[sl.length-1].date===TODAY)r=sl.pop().reason||'';
  const d0=o.days>0&&o.last?addDays(o.last,-(o.days-1)):slipToday?TODAY:(o.attemptStart&&o.attemptStart<=TODAY?o.attemptStart:TODAY);
  o.base={d:d0,ph:o.phase,slips:sl,resets:Math.max(0,(o.resets||0)-(slipToday?1:0)),at:Math.max(1,(o.attempt||1)-(slipToday?1:0))};o.hist={};
  if(o.days>0&&o.last)for(let i=0;i<o.days;i++)o.hist[addDays(o.last,-i)]={v:'ok'};
  if(slipToday)o.hist[TODAY]={v:'slip',r}}
/* the seeker sets the day the current attempt began: days from then until yesterday that are not logged count as kept */
function orgSetStart(o,D){if(!D||D>TODAY)return;if(!o.base)orgMigrate(o);if(!o.base)return;
  const ph=o.phase==='done'?'tanwir':o.phase;
  o.base={d:D,ph,slips:(o.slips||[]).filter(x=>x.date<D),resets:(o.slips||[]).filter(x=>x.date<D).length,at:o.attempt||1};
  Object.keys(o.hist||{}).forEach(k=>{if(k<D)delete o.hist[k]});
  /* days from the new start up to the first logged day take that day's verdict; with nothing logged they wait for the next log */
  const first=Object.keys(o.hist).filter(k=>k>=D).sort()[0];
  if(first){const v=o.hist[first].v;for(let d=D;d<first;d=addDays(d,1))if(!o.hist[d])o.hist[d]=v==='ok'?{v:'ok',f:first}:{v:'miss',f:first}}
  orgSim(o)}
function prepSetStart(D){if(!D||D>TODAY)return;const P=prepState();P.start=D;
  Object.keys(P.log).forEach(k=>{if(k<D)delete P.log[k]});
  for(let d=D;d<TODAY;d=addDays(d,1))if(!P.log[d]||!Object.keys(P.log[d]).length){P.log[d]={};PREP.forEach(x=>P.log[d][x.id]='ok')}
  if(prepDays()>=30){P.status='done';P.doneAt=TODAY}else if(P.status==='done')P.status='active'}
function orgBase(o,ph){o.base={d:TODAY,ph,slips:(o.slips||[]).slice(),resets:o.resets||0,at:1};o.hist={}}
function orgSim(o){const B=o.base;if(!B)return;let ph=B.ph,days=0,last=null,at=B.at||1,aStart=B.d,resets=B.resets||0,pend=0,pendFrom=null,ready=false;const slips=(B.slips||[]).slice();o.hist=o.hist||{};
  const lastLog=Object.keys(o.hist).filter(k=>k<=TODAY).sort().pop()||'';
  for(let d=B.d;d<=TODAY&&ph!=='done'&&!ready;d=addDays(d,1)){const h=o.hist[d];
    if(h&&h.v==='miss')continue;
    if(!h&&d<TODAY&&d>lastLog){pend++;if(!pendFrom)pendFrom=d;continue}
    if(h&&h.v==='ok'){if(days===0)aStart=d;days++;last=d;if(days>=30){if(ph==='tathir'){days=30;ready=true}else{ph='done';days=30}}}
    else if(h&&h.v==='slip'){slips.push({date:d,phase:ph,day:days,reason:h.r||''});days=0;resets++;at++;aStart=addDays(d,1);last=d}
    else if(d<TODAY&&days>0){slips.push({date:d,phase:ph,day:days,reason:'انقطاع: يوم لم يُسجَّل',auto:true});days=0;resets++;at++;aStart=d}}
  const L=slips[slips.length-1];
  Object.assign(o,{phase:ph,days,ready,last,attempt:at,attemptStart:aStart,slips,resets,pend:ph==='done'||ready?0:pend,pendFrom,today:ready?(last===TODAY?'ok':null):o.hist[TODAY]?(o.hist[TODAY].v==='ok'?'ok':'slip'):null,broken:!!(L&&L.auto&&days===0&&ph!=='done'&&L.date>=addDays(TODAY,-1))})}

function orgPark(o){const s0=addDays(TODAY,-30);o.base={d:s0,ph:'tathir',slips:(o.slips||[]).slice(),resets:o.resets||0,at:o.attempt||1};o.hist={};

function orgDrop(id){const o=S.organs[id];
  if(orgPassed(o))orgPark(o);
  else{Object.assign(o,{phase:'idle',days:0,ready:false,parked:false,today:null,last:null,attempt:0,attemptStart:null,pend:0,pendFrom:null,broken:false});delete o.base;o.hist={}}}

function nextPrayer(pt){
  const now=new Date(),h=now.getHours()+now.getMinutes()/60;
  for(const [k,n] of PRAYERS){if(k!=='sunrise'&&pt[k]>h)return{k,n,in:pt[k]-h}}
  return{k:'fajr',n:'الفجر',in:24-h+pt.fajr};
}

  const dateL=now.toLocaleDateString(LOC[LANG],{weekday:'long',day:'numeric',month:'long'});
  const mins=Math.round(nx.in*60),F=PRAYERS.filter(p=>p[0]!=='sunrise'),X=[306,238,170,102,34],Y=[16,33,40,36,20];
  const ki=F.findIndex(p=>p[0]===nx.k);
  return `<header class="hero home2">

   <section class="h2-pr" aria-label="مواقيت الصلاة"><div class="h2-prh"><span>مواقيت الصلاة</span><b><span>صلاة</span> ${nx.n} <span>بعد</span> ${mins>=60?Math.floor(mins/60)+' <span>س</span> ':''}${mins%60} <span>د</span></b></div>
    <svg class="h2-curve" viewBox="0 0 340 50" aria-hidden="true"><path d="M6 14 Q90 46 170 40 T334 12" fill="none" stroke="rgba(243,237,230,.32)" stroke-width="1.2"/>${(LANG==='ar'?X:X.slice().reverse()).map((x,i)=>i===ki?`<circle cx="${x}" cy="${Y[i]}" r="8" fill="none" stroke="#E6C891" stroke-width="1.6"/><circle cx="${x}" cy="${Y[i]}" r="3.6" fill="#E6C891"/>`:`<circle cx="${x}" cy="${Y[i]}" r="2.8" fill="#F3EDE6"/>`).join('')}</svg>

  </header>`;

function homeNow(){const L=dayLog(),pr=L.prayers||[],now=new Date(),h=dH(),pt=ptDay(),PN=Object.fromEntries(FIVE),P=period(),nx=nextPrayer(pt),pk=amPick(L);
  const due=FIVE.filter(([k])=>!pr.includes(k)&&h>=pt[k]).map(f=>f[0]).pop();
  const arrow='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>';
  let k,t,v,cta;
  if(due){k='دخل وقت الصلاة';t='<span>صلاة</span> '+PN[due];v='﴿إِنَّ الصَّلَاةَ كَانَتْ عَلَى الْمُؤْمِنِينَ كِتَابًا مَّوْقُوتًا﴾';cta=`<button class="h2-cta" data-pray="${due}"><span>صلّيتها</span>${arrow}</button>`}
  else if(pk.aw.includes(P.kind)&&!L.awrad.includes(P.kind)){const s=P.kind==='sabah';k=s?'وقت الصباح':'وقت المساء';t=s?'أذكار الصباح':'أذكار المساء';v='﴿فَسُبْحَانَ اللَّهِ حِينَ تُمْسُونَ وَحِينَ تُصْبِحُونَ﴾';cta=`<button class="h2-cta" data-adhkar="${P.kind}"><span>${s?'ابدأ أذكار الصباح':'ابدأ أذكار المساء'}</span>${arrow}</button>`}
  else if(pk.aw.includes('quran')&&!L.awrad.includes('quran')){k='وردك اليوم';t='ورد القرآن';v='﴿وَرَتِّلِ الْقُرْآنَ تَرْتِيلًا﴾';cta=`<button class="h2-cta" data-mshopen="1"><span>اقرأ وردك من المصحف</span>${arrow}</button>`}
  else{k='الصلاة التالية';t='<span>صلاة</span> '+nx.n+' · '+hm(pt[nx.k]);v='﴿أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ﴾';cta=`<button class="h2-cta" data-go="aamal"><span>أعمالك اليوم</span>${arrow}</button>`}
  return `<section class="h2-now"><small>${k}</small><h2>${t}</h2><p class="h2-v" dir="rtl" lang="ar">${v}</p>${cta}<button class="h2-sec" data-go="aamal">كل أعمال اليوم</button></section>`}
function amProgress(L){const P=amPick(L),nf=P.nf.filter(i=>NAFL_IDS.includes(i)),aw=awList(P);
  const D=Object.keys(S.log||{}).find(k=>S.log[k]===L)||TODAY,my=(S.mine||[]).filter(m=>mineDue(m,D));
  return [(L.prayers||[]).length+aw.filter(i=>L.awrad.includes(i)).length+nf.filter(i=>(L.nafl||{})[i]).length+my.filter(m=>L.awrad.includes(m.id)).length,FIVE.length+aw.length+nf.length+my.length]}
function heroSub(id){if(id==='organ'){const g=ORGANS.find(x=>x.id===orgSel)||ORGANS[0];return `<header class="hero compact"><div class="topbar"><button class="iconbtn" data-back="tazkiya" aria-label="رجوع">${BACK}</button><h1>${g.name}</h1><span></span></div><p class="verse" dir="rtl" lang="ar">${ORG_VERSE[g.id]||''}</p></header>`}
  if(TOPTABS.includes(id))return `<header class="hero top"><div class="tt-row"><button class="iconbtn tt-back" data-back="home" aria-label="رجوع">${BACK}</button><div class="tt-tx"><h1 class="tt">${TITLES[id]}</h1><p class="verse" dir="rtl" lang="ar">${VERSES[id]}</p></div>${id==='tazkiya'&&!tzDate?`<label class="am-ib tt-ib" aria-label="اختيار يوم آخر"><input type="date" id="tzDateIn" value="${TODAY}" max="${TODAY}" min="${addDays(TODAY,-365)}">${'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>'}</label>`:''}</div></header>`;
  return `<header class="hero compact"><div class="topbar"><button class="iconbtn" data-back="${id==='mushaf'?'quran':id==='method'?'tazkiya':tabOf(id)==='home'?'home':tabOf(id)}" aria-label="رجوع">${BACK}</button><h1>${TITLES[id]}</h1><span></span></div><p class="verse" dir="rtl" lang="ar">${VERSES[id]}</p></header>`;
}

function ring(days,phase){
  const r=27,c=2*Math.PI*r,p=phase==='done'?1:Math.min(days,30)/30;
  const col=phase==='tanwir'||phase==='done'?'var(--green)':phase==='tathir'?'var(--amber)':'var(--card-line)';
  return `<div class="ring"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--chip)" stroke-width="6"/><circle class="fg" cx="32" cy="32" r="${r}" fill="none" stroke="${col}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}"/></svg><b>${phase==='done'?'✓':days+'<small>من 30</small>'}</b></div>`;
}
function pendTxt(o){const n=o.pend;return `<b>${n===1?'<span>يوم واحد لم يُسجَّل</span>':n===2?'<span>يومان لم يُسجَّلا</span>':n+' <span>أيام لم تُسجَّل</span>'}</b> <span>منذ</span> ${fmtD(o.pendFrom)}. <span>إن سجّلت «حفظتُها» حُسبت كلها محفوظة، وإن سجّلت «زلّة» أُعيد العدّ من الأول.</span>`}
function tzEditBox(g){const o=S.organs[g.id],passed=orgPassed(o),mode=tzEdit.mode;
  const fate=passed?`<span>${g.name}</span>: <span>تبقى قد أتمّت التطهير، وتخرج من «اليوم». يمكنك إعادتها متى شئت من «رحلة الجوارح» لتبدأ تنويرها.</span>${o.phase==='tanwir'&&o.days?' <span>وتُلغى أيام التنوير التي سجّلتها.</span>':''}`
    :`<span>${g.name}</span>: <span>تعود إلى «لم تبدأ»</span>${o.days?`<span>، ويُلغى عدّ تطهيرها</span> (<span dir="ltr">${o.days}</span> <span>${o.days>10||o.days<3?'يومًا':'أيام'}</span>)`:''}.`;
  if(mode==='drop')return `<div class="tz-ed"><b><span>إلغاء</span> ${g.name} <span>من «اليوم»</span></b><p>${fate}</p><div class="btns"><button class="btn slip" data-tzdrop="${g.id}">نعم، ألغِها</button><button class="btn" data-tzeditno="1">تراجع</button></div></div>`;
  const cand=ORGANS.filter(x=>{const q=S.organs[x.id];return x.id!==g.id&&q.phase!=='done'&&(q.phase==='idle'||q.parked)});
  return `<div class="tz-ed"><b><span>تبديل</span> ${g.name} <span>بجارحة أخرى</span></b><p>${fate}</p>
   ${cand.length?`<p class="tz-ed-h">اختر الجارحة التي تحلّ محلّها:</p><div class="tz-ed-l">${cand.map(x=>{const q=S.organs[x.id];return `<button class="tz-ed-o" data-tzswap="${g.id}" data-to="${x.id}"><b>${x.name}</b><small>${q.parked?'أتمّت التطهير · تبدأ تنويرها':'تبدأ تطهيرها اليوم'}</small></button>`}).join('')}</div>`:'<p class="meta">لا توجد جارحة أخرى متاحة للتبديل.</p>'}
   <div class="btns"><button class="btn" data-tzeditno="1">تراجع</button></div></div>`}
function tanwirAsk(g){return `<div class="tw-ask"><b><span>أتممت تطهير</span> ${g.name}<span>: ثلاثون يومًا ✓</span></b><p>مرحلة التنوير ثلاثون يومًا أخرى من أعمال البرّ بهذه الجارحة. ابدأها حين تكون مستعدًّا لها، ولا يُحسب شيء قبل أن تبدأها.</p><div class="btns"><button class="btn ok" data-tanwirgo="${g.id}" data-when="today">ابدأ التنوير اليوم</button><button class="btn" data-tanwirgo="${g.id}" data-when="tomorrow">ابدأ غدًا</button></div></div>`}
function organCard(g,full){
  const o=S.organs[g.id];let body='';
  if(o.phase==='idle')body=`<div class="btns"><button class="btn primary" data-start="${g.id}">ابدأ التطهير</button></div>`;
  else if(o.parked)body=`<div class="tw-ask"><b>أتمّت التطهير ✓ · خارج «اليوم»</b><p>أخرجتها من «اليوم» بعد أن أتممت تطهيرها. أعدها حين تريد أن تبدأ تنويرها.</p><div class="btns"><button class="btn ok" data-unpark="${g.id}">أعدها إلى «اليوم»</button></div></div>`;
  else if(o.ready)body=tanwirAsk(g);
  else if(o.phase==='done')body=`<div class="meta">أتممت التطهير والتنوير${(o.cycle||1)>1?' في الدورة '+o.cycle:''}. ثبّتك الله.</div>`;
  else if(o.today==='ok')body=`<div class="logged">سُجّل اليوم: حفظتها ✓</div>`;
  else if(o.today==='slip')body=`<div class="logged bad">سُجّلت زلة، وبدأ العدّ من جديد. تُب واستأنف غدًا.</div>`;
  else if(confirmFor===g.id)body=`<div class="confirm"><span>ستعود أيام ${PHASE[o.phase]} ${g.name} إلى الصفر.${o.pend?' <span>وتُعتبر الأيام التي لم تسجّلها منذ</span> '+fmtD(o.pendFrom)+' <span>فائتة.</span>':''}</span>
    <label for="slipnote-${g.id}" class="slip-label">سبب الزلة: ما الذي أوقعك؟ وفي أي حال كنت؟</label>
    <textarea id="slipnote-${g.id}" class="slip-note" placeholder="مثال: مجلس طال فيه الكلام، أو تعب وغفلة، أو صحبة معيّنة…"></textarea>
    <div class="btns"><button class="btn slip" data-slipyes="${g.id}">نعم، أعد العدّ</button><button class="btn" data-slipno="1">تراجع</button></div></div>`;
  else body=`<div class="btns"><button class="btn ok" data-ok="${g.id}">حفظتُها اليوم</button><button class="btn slip" data-slip="${g.id}">وقعت زلة</button></div>`;
  const list=o.phase==='tanwir'?g.tanwir:g.tathir;
  const tips=o.phase!=='done'?`<details${full&&o.phase==='tanwir'?' open':''}><summary>${o.phase==='tanwir'?'أعمال التنوير':'ما تمتنع عنه'} (${list.length})</summary><ul>${list.map(x=>`<li>${x}</li>`).join('')}</ul></details>`:'';
  const broke=(o.broken?`<div class="meta" style="color:var(--red)">انقطعت السلسلة بيوم فائت، فبدأ العدّ من جديد.</div>`:'')+(o.pend&&!o.today?`<div class="tz-pendn">${pendTxt(o)}</div>`:'');
  const left=o.phase==='tathir'||o.phase==='tanwir'?`باقٍ ${30-o.days} يومًا`:'';
  const att=(o.phase==='tathir'||o.phase==='tanwir')&&o.attemptStart?`<div class="attempt">${(o.cycle||1)>1?'الدورة '+o.cycle+' · ':''}المحاولة ${o.attempt} · بدأت ${o.attemptStart>TODAY?'غدًا':''} ${fmtD(o.attemptStart)}</div>${true?`<label class="st-date"><span>تاريخ بدء المحاولة</span><input type="date" data-orgstart="${g.id}" value="${o.attemptStart>TODAY?TODAY:o.attemptStart}" max="${TODAY}"></label><p class="meta st-note">إذا بدأت قبل تسجيلها في التطبيق، اختر يوم البدء. الأيام التي لم تسجّلها تُحسب محفوظة إذا سجّلت بعدها «حفظتُها»، وتُعاد من الأول إذا سجّلت «زلّة».</p>`:''}`:'';
  const slips=full&&o.slips.length?`<details class="slips"><summary>مراجعة أسباب الزلات (${o.slips.length})</summary><ol>${o.slips.slice().reverse().map(s=>`<li><div class="sl-h"><b>${fmtD(s.date)}</b><span class="pill p-${s.phase}">${PHASE[s.phase]}</span><span class="meta">بعد ${s.day} ${s.day>10?'يومًا':'أيام'}</span></div><p>${s.reason?'<span class="notr" dir="auto">'+esc(s.reason)+'</span>':'<span class="meta">لم يُدوَّن سبب</span>'}</p></li>`).join('')}</ol></details>`:'';
  let redo='';
  if(full&&o.phase!=='idle'){
    const canT=o.phase==='tanwir'||o.phase==='done';
    if(redoFor&&redoFor.id===g.id){
      const k=redoFor.kind,lbl=k==='tathir'?'التطهير':'التنوير';
      redo=`<div class="confirm redo-c"><span>ستبدأ ${lbl} ${g.name} من جديد: ثلاثون يومًا متتالية تبدأ اليوم${k==='tathir'?'، ويعود مجراها في القلب مفتوحًا حتى تُتمّ التطهير':o.phase==='done'?'، ويعود قسمها في القلب رماديًا حتى تُتمّ التنوير':''}.</span>
        <label for="redonote-${g.id}" class="slip-label">سبب الإعادة (اختياري)</label>
        <textarea id="redonote-${g.id}" class="slip-note" placeholder="مثال: أحسست بفتور في هذه الجارحة، أو أريد تثبيت ما حققته…"></textarea>
        <div class="btns"><button class="btn ok" data-redoyes="${g.id}">نعم، أعد ${lbl}</button><button class="btn" data-redono="1">تراجع</button></div></div>`;
    }else{
      redo=`<div class="redo"><span class="meta">${o.phase==='done'?'تجديد السلوك:':'إعادة المرحلة:'}</span><button class="btn small" data-redo="${g.id}" data-kind="tathir">إعادة التطهير</button>${canT?`<button class="btn small" data-redo="${g.id}" data-kind="tanwir">إعادة التنوير</button>`:''}</div>`;
    }
  }
  const hist=full&&o.history&&o.history.length?`<details class="slips redo-h"><summary>سجل الإعادات (${o.history.length})</summary><ol>${o.history.slice().reverse().map(h=>`<li><div class="sl-h"><b>${fmtD(h.date)}</b><span class="pill p-${h.kind}">إعادة ${PHASE[h.kind]}</span><span class="meta">من حال: ${PHASE[h.from]}${h.from!=='done'?' · '+h.day+' يوم':''}</span></div>${h.reason?`<p class="notr" dir="auto">${esc(h.reason)}</p>`:''}</li>`).join('')}</ol></details>`:'';
  return `<div class="box organ"><div class="orow">${ring(o.days,o.phase)}<div class="info"><h3>${g.name}</h3><span class="pill p-${o.phase}">${PHASE[o.phase]}</span> <span class="meta">${left}${o.resets?' · إعادات: '+o.resets:''}</span>${att}</div></div>${broke}${body}${tips}${redo}${slips}${hist}</div>`;
}

/* ---------- preliminary phase: three prophetic practices, 30 logged days, no reset ---------- */
const PREP=[
 {id:'samt',t:'طول الصمت',s:'لا تتكلم إلا بخير أو لحاجة، واترك فضول الكلام'},
 {id:'khuluq',t:'حسن الخلق',s:'لين الكلام، وطلاقة الوجه، وكفّ الأذى، والصبر على الناس'},
 {id:'hudur',t:'الحضور مع الله طيلة اليوم',s:'استحضار مراقبة الله في كل حال، والرجوع إليه كلما غفلت'}];
let prepFail=null,prepRedo=false,prepOpen=false;
document.addEventListener('toggle',e=>{if(e.target&&e.target.id==='prepD')prepOpen=e.target.open},true);
function prepState(){if(!S.prep)S.prep={status:'idle',log:{},cycle:1,history:[]};if(!S.prep.log)S.prep.log={};return S.prep}
const prepDayDone=d=>PREP.every(x=>d&&d[x.id]);
const prepDays=()=>Object.values(prepState().log).filter(prepDayDone).length;
const prepReady=()=>prepState().status==='done';
const prepPendingToday=()=>{const P=prepState();return P.status==='active'&&!prepDayDone(P.log[TODAY])};
function prepCard(){
  const P=prepState(),n=Math.min(prepDays(),30),T=P.log[tzDate||TODAY]||{};
  const fails=[];Object.keys(P.log).sort().forEach(d=>PREP.forEach(x=>{if(P.log[d][x.id]==='fail')fails.push({d,x,r:(P.log[d].notes||{})[x.id]||''})}));
  const okCount=id=>Object.values(P.log).filter(d=>d[id]==='ok').length;
  let body='';
  if(P.status==='idle')body=`<p class="meta" style="color:var(--ink)">قبل تزكية الجوارح، تدرّب ثلاثين يومًا على ثلاث وصايا نبوية. لا يُعاد العدّ إن أخفقت في يوم، بل تدوّن سبب الإخفاق وتستمر حتى تُتمّ ثلاثين يومًا.</p>
    <ul class="prep-l">${PREP.map(x=>`<li><b>${x.t}</b><small>${x.s}</small></li>`).join('')}</ul>
    <div class="btns"><button class="btn primary" data-prepstart="1">ابدأ المرحلة التمهيدية</button></div>`;
  else if(P.status==='active'){
    const stRow=`<label class="st-date"><span>تاريخ بدء المرحلة</span><input type="date" data-prepstartd="1" value="${P.start&&P.start<=TODAY?P.start:TODAY}" max="${TODAY}"></label><p class="meta st-note">إذا بدأت قبل تسجيلها في التطبيق، اختر يوم البدء: تُحسب الأيام منه إلى الأمس محقّقة، إلا ما سجّلت فيه إخفاقًا.</p>`;
    const rows=PREP.map(x=>{const v=T[x.id];
      if(prepFail===x.id)return `<div class="prep-r"><div class="t"><b>${x.t}</b></div><div class="confirm"><label for="prepnote-${x.id}" class="slip-label">سبب الإخفاق: ما الذي حصل؟</label><textarea id="prepnote-${x.id}" class="slip-note" placeholder="مثال: انشغلت فغفلت، أو غضبت في نقاش…"></textarea><div class="btns"><button class="btn slip" data-prepfailyes="${x.id}">سجّل الإخفاق</button><button class="btn" data-prepno="1">تراجع</button></div></div></div>`;
      if(v)return `<div class="prep-r"><div class="t"><b>${x.t}</b><small>${x.s}</small></div><span class="logged${v==='fail'?' bad':''}">${v==='ok'?'حققته ✓':'أخفقت اليوم'}</span><button class="btn small" data-prepundo="${x.id}">تعديل</button></div>`;
      return `<div class="prep-r"><div class="t"><b>${x.t}</b><small>${x.s}</small></div><div class="btns"><button class="btn ok" data-prepok="${x.id}">حققته</button><button class="btn slip" data-prepfail="${x.id}">أخفقت</button></div></div>`}).join('');
    body=`${P.start?`<p class="meta" style="margin:0 0 6px"><span>بدأت المرحلة:</span> ${fmtD(P.start)}</p>`:''}${rows}${prepDayDone(T)?`<div class="logged">سُجّل يوم ${String(n)} من 30. بارك الله فيك.</div>`:'<p class="meta">سجّل الوصايا الثلاث ليُحتسب اليوم.</p>'}${stRow}`;
  }else body=`<div class="logged">أتممت المرحلة التمهيدية${(P.cycle||1)>1?' في الدورة '+String(P.cycle):''} ✓</div>
    <div class="meta">${PREP.map(x=>`${x.t}: ${String(okCount(x.id))} يومًا`).join(' · ')}</div>`;
  const redo=P.status==='idle'?'':prepRedo?`<div class="confirm"><span>ستبدأ المرحلة التمهيدية من الصفر، ويُحفظ السجل السابق.</span><div class="btns"><button class="btn slip" data-prepredoyes="1">نعم، أعدها من الصفر</button><button class="btn" data-prepredono="1">تراجع</button></div></div>`:`<div class="redo"><span class="meta">إعادة المرحلة:</span><button class="btn small" data-prepredo="1">إعادة المرحلة التمهيدية من الصفر</button></div>`;
  const log=fails.length?`<details class="slips"><summary>مراجعة أسباب الإخفاق (${String(fails.length)})</summary><ol>${fails.reverse().map(f=>`<li><div class="sl-h"><b>${fmtD(f.d)}</b><span class="pill p-tathir">${f.x.t}</span></div><p>${f.r?'<span class="notr" dir="auto">'+esc(f.r)+'</span>':'<span class="meta">لم يُدوَّن سبب</span>'}</p></li>`).join('')}</ol></details>`:'';
  const hist=P.history&&P.history.length?`<details class="slips redo-h"><summary>سجل الإعادات (${String(P.history.length)})</summary><ol>${P.history.slice().reverse().map(h=>`<li><div class="sl-h"><b>${fmtD(h.date)}</b><span class="meta">بعد ${String(h.days)} يومًا</span></div></li>`).join('')}</ol></details>`:'';
  const ph=P.status==='done'?'done':P.status==='active'?'tathir':'idle';
  return `<div class="box organ prep"><div class="orow">${ring(n,ph)}<div class="info"><h3>المرحلة التمهيدية</h3><span class="pill p-${ph}">${P.status==='done'?'مكتملة':P.status==='active'?'قيد العمل':'لم تبدأ'}</span> <span class="meta">${P.status==='active'?'باقٍ '+String(30-n)+' يومًا':''}</span></div></div>
   <p class="quote notr" dir="rtl" lang="ar">«عليك بطول الصمت وحسن الخلق، فوالذي نفسي بيده ما تجمّل الخلائق بمثلهما»</p>${meaning('hsamt')}<details class="prep-d" id="prepD"${prepOpen?' open':''}><summary>${P.status==='idle'?'الوصايا الثلاث وطريقة العمل':P.status==='active'?(prepDayDone(T)?'سجل اليوم ✓':'سجّل يومك'):'تفاصيل المرحلة'}</summary><div class="prep-in">${body}${redo}${log}${hist}</div></details></div>`;
}
function prepSet(id,v,note){const P=prepState(),DD=tzDate||TODAY,T=P.log[DD]||(P.log[DD]={});
  if(v===null){delete T[id];if(T.notes)delete T.notes[id]}else{T[id]=v;if(v==='fail'){(T.notes=T.notes||{})[id]=(note||'').trim()}else if(T.notes)delete T.notes[id]}
  prepFail=null;if(prepDays()>=30){P.status='done';P.doneAt=TODAY}save();render()}

  return `<div class="box pad kh-card ${st}"><div class="kh-top"><b>${khName(r)}</b><span class="pill p-${st==='now'?'tanwir':st==='soon'?'tathir':'done'}">${st==='now'?'جارية الآن':st==='soon'?'مبرمجة':'انتهت'}</span></div>

   ${st!=='soon'?`<i class="kh-bar"><b style="width:${pct}%"></b></i>`:''}
   ${nx&&st!=='past'?`<p class="kh-next"><span>التالي:</span> <b>${hmMs(nx.at)}</b> · <span class="notr" dir="auto">${esc(nx.x||'')}</span></p>`:''}
   ${st==='past'&&!r.logged?`<div class="confirm"><span>هل أتممت ${khName(r)}؟ سيستنير جسدك كله في «حالتك الروحية اليومية» ثلاثين يومًا.</span><div class="btns"><button class="btn ok" data-khlog="${r.id}">نعم، أتممتها</button></div></div>`:''}
   ${r.logged?'<p class="logged">سُجّلت ✓</p>':''}
   <details class="kh-det"${st==='now'?' open':''}><summary>البرنامج (${ev.length})</summary>${prog||'<p class="meta">لا يوجد برنامج.</p>'}</details>

const QALB=[{"id":"ghafla","n":"الغفلة","v":"﴿وَلَا تَكُن مِّنَ الْغَافِلِينَ﴾","q":["تمرّ عليك ساعات طويلة لا تذكر الله فيها؟","تصلّي وقلبك مشغول بغير الصلاة؟","تبدأ أعمالك دون أن تستحضر نيتها؟"],"act":"جدّد نيتك قبل كل عمل، وقف وقفة حضور مع الله عند كل ساعة.","wird":["لا إله إلا الله",100],"mh":"هل تحرّكت فيّ الغفلة اليوم؟ وماذا فعلت حين انتبهت؟","learn":["حقيقتها: الغفلة أن ينشغل القلب عن الله وعن الآخرة بما هو فيه، فيمضي العبد يومه دون أن يستحضر ربه ولا مقصده.","علاماتها: أن تمرّ الساعات بلا ذكر، وأن تُؤدّى العبادة بلا حضور، وأن يُفعل الشيء بحكم العادة لا بالنية.","أسبابها: كثرة الانشغال بالدنيا، وكثرة الكلام والخلطة، والسهر، وطول الأمل، وترك الأوراد.","خطرها: ﴿وَلَا تُطِعْ مَنْ أَغْفَلْنَا قَلْبَهُ عَن ذِكْرِنَا وَاتَّبَعَ هَوَاهُ وَكَانَ أَمْرُهُ فُرُطًا﴾. الغفلة باب المعاصي، لأن من نسي نظر الله إليه قلّ حياؤه منه.","علاجها: دوام الذكر، وتجديد النية قبل كل عمل، ومراقبة الله، وتذكّر الموت، وصحبة الذاكرين.","ضدّها الحضور واليقظة: أن تكون مع الله في كل حال. ﴿الَّذِينَ يَذْكُرُونَ اللَّهَ قِيَامًا وَقُعُودًا وَعَلَىٰ جُنُوبِهِمْ﴾"]},{"id":"riya","n":"الرياء","v":"﴿فَمَن كَانَ يَرْجُو لِقَاءَ رَبِّهِ فَلْيَعْمَلْ عَمَلًا صَالِحًا وَلَا يُشْرِكْ بِعِبَادَةِ رَبِّهِ أَحَدًا﴾","q":["إذا علمت أن أحدًا يراك وأنت تصلّي، هل تُحسن صلاتك أكثر مما تفعل وحدك؟","تحب أن يعرف الناس عباداتك وأعمالك الصالحة؟","يفتر عملك إذا لم يره أحد ولم يُمدح؟"],"act":"اعمل كل يوم عملًا صالحًا خفيًّا لا يعلمه أحد غير الله.","wird":["اللهم إني أعوذ بك أن أشرك بك وأنا أعلم، وأستغفرك لما لا أعلم",3],"mh":"هل عملت اليوم شيئًا لأجل نظر الناس؟ وهل عملت عملي الخفي؟","learn":["حقيقته: الرياء أن تفعل العبادة ليراك الناس فيعجبوا بك أو يمدحوك.","علاماته: أن تُحسن العمل حين تُرى، وأن تنتظر احترامًا أو خدمة خاصة بسبب عبادتك، وأن تفتر إذا خلوت.","أسبابه: حب المدح والمكانة، والخوف من كلام الناس، والطمع فيما في أيديهم.","خطره: قال ﷺ: «إن أخوف ما أخاف عليكم الشرك الأصغر». قالوا: وما الشرك الأصغر؟ قال: «الرياء» (رواه أحمد).","علاجه: الإخلاص، وإخفاء ما يُستحبّ إخفاؤه من العمل، ومراجعة النية، وأن تعلم أن الناس لا يملكون لك نفعًا ولا ضرًّا.","ضدّه الإخلاص: أن يكون عملك لله وحده. والفرح بانتفاع الناس بعملك ليس رياءً ما دامت النية لله."]},{"id":"ujb","n":"العُجب","v":"﴿وَيَوْمَ حُنَيْنٍ إِذْ أَعْجَبَتْكُمْ كَثْرَتُكُمْ فَلَمْ تُغْنِ عَنكُمْ شَيْئًا﴾","q":["تستكثر عبادتك وما قدّمت من خير؟","تنسب نجاحك وتوفيقك إلى نفسك وجهدك؟","ترى عملك كافيًا لنجاتك؟"],"act":"بعد كل طاعة قل: «هذا من فضل الله»، وتذكّر تقصيرًا واحدًا فيك.","wird":["أستغفر الله",33],"mh":"هل أعجبتني نفسي اليوم بعمل أو صفة؟ وهل شكرت الله عليه؟","learn":["حقيقته: العُجب أن يغترّ الإنسان بنفسه وعمله، وينسى أن الخير كله من توفيق الله.","علاماته: استكثار الطاعة، ونسبة النجاح إلى النفس، والاطمئنان إلى العمل ونسيان التقصير.","أسبابه: الجهل بحقيقة النفس، ونسيان منّة الله، وكثرة المدح، وقلة محاسبة النفس.","خطره: ﴿فَلَا تُزَكُّوا أَنفُسَكُمْ هُوَ أَعْلَمُ بِمَنِ اتَّقَىٰ﴾. والعجب يُحبط بركة العمل ويفتح باب الكبر.","علاجه: أن تتذكر أن كل خير من الله ﴿وَمَا بِكُم مِّن نِّعْمَةٍ فَمِنَ اللَّهِ﴾، وأنك محتاج إليه، وأن لك تقصيرًا كثيرًا.","ضدّه شهود المنّة: أن ترى الطاعة نعمة من الله عليك لا فضلًا منك عليه."]},{"id":"ghadab","n":"الغضب","v":"«لا تغضب» (رواه البخاري)","q":["يرتفع صوتك في الخلاف؟","تقول أو تفعل في غضبك ما تندم عليه بعد ذلك؟","يصعب عليك أن تعفو عمّن أغضبك؟"],"act":"عند الغضب: اسكت، واستعذ بالله من الشيطان، وغيّر حالك؛ إن كنت قائمًا فاجلس.","wird":["أعوذ بالله من الشيطان الرجيم",33],"mh":"هل غضبت اليوم؟ وهل ملكت نفسي، أم قلت أو فعلت ما أندم عليه؟","learn":["حقيقته: الغضب ثورة في النفس طلبًا للانتصار لها. والمطلوب ضبطه، لا ألّا يغضب الإنسان أبدًا.","علاماته: رفع الصوت، والكلام الجارح، والتعدّي على الناس، والندم بعد أن يهدأ.","أسبابه: الكبر، والمراء والجدال، وكثرة المزاح، والتعب والسهر، وحب الانتصار للنفس.","خطره: قال ﷺ: «ليس الشديد بالصُّرَعة، إنما الشديد الذي يملك نفسه عند الغضب» (متفق عليه).","علاجه: الاستعاذة بالله من الشيطان الرجيم، والسكوت، وتغيير الحال، فقد قال ﷺ: «إذا غضب أحدكم وهو قائم فليجلس» (رواه أبو داود).","ضدّه الحِلم: ﴿وَالْكَاظِمِينَ الْغَيْظَ وَالْعَافِينَ عَنِ النَّاسِ وَاللَّهُ يُحِبُّ الْمُحْسِنِينَ﴾"]},{"id":"hiqd","n":"الحقد","v":"﴿وَلَا تَجْعَلْ فِي قُلُوبِنَا غِلًّا لِّلَّذِينَ آمَنُوا﴾","q":["تتذكر إساءة من أساء إليك زمنًا طويلًا؟","تفرح إذا أصابت من أساء إليك مصيبة؟","تهجر من بينك وبينه خلاف أيامًا طويلة؟"],"act":"ادعُ باسمه لمن أساء إليك، واعفُ عنه في قلبك قبل النوم.","wird":["ربنا اغفر لنا ولإخواننا الذين سبقونا بالإيمان ولا تجعل في قلوبنا غلًّا للذين آمنوا",7],"mh":"هل بقي في قلبي اليوم شيء على أحد؟ وهل دعوت له؟","learn":["حقيقته: الحقد أن تحتفظ بالغضب وتغذّيه حتى يصير كراهية وعداوة.","علاماته: تذكّر الإساءة طويلًا، والفرح بأذى من أساء، والهجر، وسوء الظن به.","أسبابه: الغضب الذي لم يُعالَج، وحب الانتصار للنفس، وكثرة التفكير في الإساءة.","خطره: قال ﷺ: «لا يحلّ لمسلم أن يهجر أخاه فوق ثلاث» (متفق عليه).","علاجه: العفو والدعاء لمن أساء: ﴿وَلْيَعْفُوا وَلْيَصْفَحُوا أَلَا تُحِبُّونَ أَن يَغْفِرَ اللَّهُ لَكُمْ﴾","ضدّه سلامة الصدر: أن تبيت وليس في قلبك غشّ لأحد."]},{"id":"hasad","n":"الحسد","v":"«لا تحاسدوا… وكونوا عباد الله إخوانًا» (رواه مسلم)","q":["تضيق إذا رأيت نعمة عند غيرك؟","تبحث عن عيب فيمن أُعطي ما لم تُعطَ؟","يسرّك أن تزول نعمة عن غيرك؟"],"act":"ادعُ لمن تحسده بالبركة، واذكر محاسنه.","wird":["ما شاء الله، اللهم بارك له",33],"mh":"هل ضقت اليوم بنعمة عند أحد؟ وهل دعوت له بالبركة؟","learn":["حقيقته: الحسد أن تتمنى زوال نعمة غيرك. أما الغبطة فأن تتمنى مثلها دون أن تزول عنه، وهي جائزة.","علاماته: الضيق بنعمة الغير، والبحث عن عيوب المحسود، والفرح بزوال النعمة عنه.","أسبابه: ضعف الرضا بقسمة الله، والكبر، والمنافسة على الدنيا.","خطره: ﴿أَمْ يَحْسُدُونَ النَّاسَ عَلَىٰ مَا آتَاهُمُ اللَّهُ مِن فَضْلِهِ﴾. والحسد اعتراض على قسمة الله.","علاجه: أن تقاوم تمنّي زوال النعمة، وتدرّب نفسك على حب الخير للناس والإحسان إليهم.","ضدّه حب الخير للناس: «لا يؤمن أحدكم حتى يحبّ لأخيه ما يحبّ لنفسه» (متفق عليه)."]},{"id":"dunya","n":"حب الدنيا والشح","v":"﴿وَمَن يُوقَ شُحَّ نَفْسِهِ فَأُولَٰئِكَ هُمُ الْمُفْلِحُونَ﴾","q":["تحزن لفوات المال أكثر من حزنك لفوات الطاعة؟","تتردد كثيرًا قبل أن تتصدق؟","تشغلك أمور الرزق عن عبادتك؟"],"act":"تصدّق كل يوم ولو بقليل، وتذكّر الموت.","wird":["اللهم لا عيش إلا عيش الآخرة",33],"mh":"هل تصدّقت اليوم؟ وهل شغلتني الدنيا عن طاعة؟","learn":["حقيقته: أن يتعلّق القلب بالدنيا حتى يقدّمها على الآخرة، ويبخل بما وجب أو استُحبّ إنفاقه.","علاماته: الحزن لفوات المال أكثر من فوات الطاعة، والتردد في الصدقة، وطول الأمل.","أسبابه: نسيان الموت، والغفلة عن الآخرة، والخوف من الفقر.","خطره: ﴿وَمَا الْحَيَاةُ الدُّنْيَا إِلَّا مَتَاعُ الْغُرُورِ﴾","علاجه: الصدقة، وذكر الموت: «أكثروا ذكر هاذم اللذات» (رواه الترمذي)، والقناعة. والزهد لا يعني ترك العمل والكسب الحلال.","ضدّه الزهد والسخاء: أن تكون الدنيا في يدك لا في قلبك."]},{"id":"kibr","n":"الكبر","v":"«لا يدخل الجنة من كان في قلبه مثقال ذرة من كبر» (رواه مسلم)","q":["يصعب عليك قبول النصيحة ممن هو أصغر منك؟","ترى نفسك خيرًا من غيرك؟","يثقل عليك الاعتراف بخطئك أمام الناس؟"],"act":"اقبل نصيحة، واخدم من هو دونك، وابدأ بالسلام.","wird":["سبحان ربي الأعلى",33],"mh":"هل رددت حقًّا اليوم، أو تعاليت على أحد؟","learn":["حقيقته: قال ﷺ: «الكبر بَطَر الحق وغَمْط الناس» (رواه مسلم)، أي ردّ الحق واحتقار الناس.","علاماته: ردّ النصيحة، والتعالي على الناس، وصعوبة الاعتراف بالخطأ.","أسبابه: العجب بالعلم أو المال أو النسب أو المنصب، ونسيان أصل الإنسان ومصيره.","خطره: الكبر آخر ما يخرج من القلب، وهو الذي منع إبليس من السجود.","علاجه: التواضع وخدمة الناس وقبول الحق: «وما تواضع أحد لله إلا رفعه» (رواه مسلم).","ضدّه التواضع: أن تقبل الحق ممن جاء به، ولا ترى لنفسك فضلًا على أحد."]}];

const normAr=s=>String(s||'').toLowerCase().replace(/[ً-ٰٟـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي');
function allSlips(){const out=[];
  ORGANS.forEach(g=>(S.organs[g.id].slips||[]).forEach(s=>out.push({date:s.date,org:g.name,oid:g.id,reason:s.reason||''})));
  const P=prepState();Object.keys(P.log||{}).forEach(d=>PREP.forEach(x=>{if(P.log[d][x.id]==='fail')out.push({date:d,org:'المرحلة التمهيدية',oid:'prep',reason:((P.log[d].notes||{})[x.id])||''})}));
  return out.sort((a,b)=>a.date<b.date?1:-1)}
const slipCands=t=>[t,t.replace(/^(وال|بال|فال|كال|لل|ال)/,''),t.replace(/^[وفبل]/,''),t.replace(/^[وفبل]ال/,'')];
function slipCats(reason){const toks=normAr(reason).split(/[^\p{L}]+/u).filter(Boolean);
  return SLIP_CATS.filter(c=>c.w.some(w=>{const k=normAr(w).replace(/^ال/,'');return toks.some(t=>slipCands(t).some(x=>x===k||(k.length>=3&&x.startsWith(k))))}))}
const WDAYS_AR=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
// weekday names follow the interface language wherever they are glued into a sentence
const WDAYS=new Proxy(WDAYS_AR,{get:(t,k)=>typeof k==='string'&&/^\d$/.test(k)&&typeof LANG!=='undefined'&&LANG!=='ar'?Tx(t[k]):t[k]});
function viewTahlil(){
  const L=allSlips();
  if(!L.length)return `<section><div class="box pad"><b>لا توجد زلّات مسجّلة بعد</b><p class="muted" style="margin:6px 0 0">كلما سجّلت زلّة في جارحة أو إخفاقًا في المرحلة التمهيدية مع سببها، يظهر لك هنا ما يتكرر في أسبابك، فتعرف موضع ضعفك وتسدّ بابه.</p></div></section>`;
  const withR=L.filter(s=>s.reason.trim()),cc={},ex={};
  withR.forEach(s=>{const cs=slipCats(s.reason);(cs.length?cs:[{id:'other',t:'أسباب أخرى'}]).forEach(c=>{cc[c.id]=(cc[c.id]||0)+1;(ex[c.id]=ex[c.id]||[]).push(s)})});
  const name=id=>(SLIP_CATS.find(c=>c.id===id)||{t:'أسباب أخرى'}).t;
  const cats=Object.keys(cc).sort((a,b)=>(a==='other')-(b==='other')||cc[b]-cc[a]);
  const max=Math.max(1,...Object.values(cc));
  const oc={};L.forEach(s=>oc[s.org]=(oc[s.org]||0)+1);const orgs=Object.keys(oc).sort((a,b)=>oc[b]-oc[a]);
  const wd=[0,0,0,0,0,0,0];L.forEach(s=>wd[new Date(s.date+'T12:00:00').getDay()]++);const wmax=Math.max(...wd),wi=wd.indexOf(wmax);
  const top=cats.find(c=>c!=='other');
  const bar=(label,n,m,cls)=>`<div class="tb-row"><span class="tb-l">${label}</span><span class="tb-bar"><i class="${cls||''}" style="width:${Math.round(n/m*100)}%"></i></span><b class="tb-n">${n}</b></div>`;
  return `<section><div class="box pad tb-sum"><b>${L.length}</b><span class="muted">زلّة مسجّلة، منها ${withR.length} مع سببها</span></div>
   ${top?`<div class="box pad tb-key"><span class="muted">أكثر ما يتكرر في أسبابك</span><b>${name(top)}</b><p class="muted" style="margin:4px 0 0">ابدأ من هنا: اجعل لهذا الباب خطة صغيرة واضحة، فإن سدّه يحفظ أكثر من جارحة.</p></div>`:''}</section>
   <section><div class="sh"><h2>أسباب الزلّات</h2></div><div class="box pad">${cats.map(c=>bar(name(c),cc[c],max,c==='other'?'o':'')).join('')}</div>
   <p class="meta">تُصنَّف الأسباب تلقائيًا من الكلمات التي كتبتها، وقد يدخل السبب الواحد في بابين.</p></section>
   <section><div class="sh"><h2>الجوارح الأكثر زللًا</h2></div><div class="box pad">${orgs.map(o=>bar(o,oc[o],oc[orgs[0]])).join('')}</div>
   ${wmax>1?`<p class="meta"><span>أكثر الأيام زللًا: يوم</span> <b>${WDAYS[wi]}</b></p>`:''}</section>
   <section><div class="sh"><h2>أمثلة من أسبابك</h2></div>${cats.slice(0,4).map(c=>`<details class="slips"><summary>${name(c)} <span>(${cc[c]})</span></summary><ol>${ex[c].slice(0,5).map(s=>`<li><div class="sl-h"><b>${fmtD(s.date)}</b><span class="pill p-tathir">${s.org}</span></div><p><span class="notr" dir="auto">${esc(s.reason)}</span></p></li>`).join('')}</ol></details>`).join('')}</section>`;
}

function acc(id,ic,t,body,val){return `<details class="acc" data-acc="${id}"${aboutOpen.has(id)?' open':''}><summary><span class="acc-ic"><svg viewBox="0 0 24 24" aria-hidden="true">${ABI[ic]}</svg></span><span class="acc-t">${t}</span>${val?`<span class="acc-v">${val}</span>`:''}${CHEV}</summary><div class="acc-b">${body}</div></details>`}
function viewAbout(){
  const canSend=AUTH.state==='in'&&window.FB,P=installParts(true);
  if(contactMsg)aboutOpen.add('contact');
  const status=P.standalone?'<span class="ab-ok">مثبّت على شاشتك ✓</span>':installEvt?'<button class="btn ok small" data-install="1">ثبّت المرشد على الشاشة</button>':'';
  const install=(P.top&&!P.standalone?P.top.replace(/class="box pad[^"]*"/,'class="acc-note"'):'')+(P.standalone?'<p class="muted" style="margin:0">أنت تستعمله الآن كتطبيق مستقل، ويعمل حتى دون اتصال بالإنترنت.</p>':(P.ios?P.iosS+P.andS:P.andS+P.iosS));
  const contact=canSend?`<p class="muted" style="margin:0 0 8px">سؤال، أو ملاحظة، أو خطأ وجدته في التطبيق: اكتبه هنا فيصل إلى إدارة المرشد.</p><textarea id="ct-text" dir="auto" placeholder="اكتب رسالتك…" maxlength="2000"></textarea>
    <div class="btns"><button class="btn ok" data-ctsend="1" ${contactBusy?'disabled':''}>أرسل الرسالة</button></div>${contactMsg?`<p class="logged">${esc(contactMsg)}</p>`:''}`
    :'<p class="muted" style="margin:0">سجّل الدخول بحسابك لتتمكن من مراسلة الإدارة.</p>';
  const privacy=`<dl class="pv">
    <dt>ما الذي يُحفظ؟</dt><dd>بريدك الإلكتروني واسمك عند إنشاء الحساب، وتقدمك في التزكية والأوراد والمحاسبة، ومدينتك أو موقعك التقريبي لحساب مواقيت الصلاة، ورمز الإشعارات إن فعّلت التذكيرات.</dd>
    <dt>أين يُحفظ؟</dt><dd>على هاتفك، وفي حسابك على خدمة Google Firebase لتجده على كل أجهزتك.</dd>
    <dt>من يطّلع عليه؟</dt><dd>لا أحد غيرك. لا تُباع بياناتك، ولا تُشارك مع أي جهة، ولا يوجد في التطبيق إعلانات ولا أدوات تتبّع. ترى الإدارة اسمك وبريدك فقط، ولا ترى تفاصيل تقدمك الروحي ولا محاسباتك ولا زلّاتك.</dd>
    <dt>الموقع</dt><dd>يُستعمل لحساب مواقيت الصلاة ووقت التذكيرات فقط، ويمكنك اختيار مدينتك يدويًا بدلًا منه.</dd>
    <dt>حذف بياناتك</dt><dd>من الملف الشخصي، اضغط «حذف الحساب» فتُحذف كل بياناتك نهائيًا.</dd></dl>`;
  return `<section class="ab-hero"><div class="ab-logo">${LOGO}</div><h2 class="ab-name">المرشد</h2>
    <p class="ab-tag">رفيق السالك في طريق التزكية على المنهج المحمدي</p>
    <div class="ab-chips"><span>مجاني</span><span>بلا إعلانات</span><span>يعمل دون إنترنت</span><span>خمس لغات</span></div>${status?`<div class="ab-st">${status}</div>`:''}</section>
   <p class="ab-g">التطبيق</p>
   <div class="acc-card">${acc('about','info','عن المرشد','<p style="margin:0">يعين المرشد السالك على تطهير جوارحه وتنويرها، والمداومة على أوراده، ومحاسبة نفسه، ومراقبة قلبه يومًا بعد يوم. وهو مجاني، بلا إعلانات.</p>')}
    ${acc('install','install','تثبيت التطبيق',install)}${acc('notif','bell','تفعيل التذكيرات',P.notS.replace(/<b class="acc-sub">[^<]*<\/b>/,''))}
    ${acc('tips','help','إن لم تصلك التذكيرات',P.tipS.replace(/<b class="acc-sub">[^<]*<\/b>/,''))}${acc('offline','offline','العمل دون إنترنت',P.offS.replace(/<b class="acc-sub">[^<]*<\/b>/,''))}
    ${acc('transfer','transfer','نقل بياناتك',P.transfer)}</div>
   <p class="ab-g">الخصوصية والتواصل</p>
   <div class="acc-card">${acc('privacy','shield','سياسة الخصوصية',privacy)}${acc('contact','mail','راسلنا',contact)}</div>
   <p class="ab-foot"><span class="notr" dir="ltr">dr.idrissi.hafdi@gmail.com</span></p>`;
}
async function contactSend(){const el=document.getElementById('ct-text'),t=(el&&el.value||'').trim();
  if(!t){contactMsg='اكتب رسالتك أولًا.';return render()}
  contactBusy=true;render();
  try{await FB.sendMessage(AUTH.user,t,S.name||'',LANG);contactMsg='وصلت رسالتك إلى الإدارة. جزاك الله خيرًا.'}
  catch(e){contactMsg='تعذّر الإرسال. تأكد من اتصالك بالإنترنت ثم أعد المحاولة.'+(e&&e.code?' ('+e.code+')':'')}
  contactBusy=false;render()}

tawba:{t:'التوبة',lead:'التوبة هي العودة والرجوع: الرجوع عن الحياة المليئة بالذنوب إلى طريق الصلاح، ومن الشر إلى الخير. وهي باب يُدخل العبد جنة المأوى، والله عز وجل يحب التوابين والعائدين إلى طريقه. فهي طريق إصلاح العلاقة بين العبد وخالقه، ومن لم يصلح علاقته بالله لم تنفعه أي علاقة أخرى.',

 secs:[
 {t:'الشروط الأربعة للتوبة',h:`<ol><li><b>الندم:</b> أن يمتلئ الإنسان شعورًا بالندم والخجل من المعصية التي ارتكبها، صغيرة كانت أو كبيرة، فكل معصية تترك سوادًا في القلب، حتى الأعمال المكروهة.</li>
  <li><b>قطع الطرق إلى المعصية:</b> أن يقطع كل طريق يؤدي إليها، ويبتعد عن كل ما يأخذه إلى الظلمات، كالصحبة السيئة، وسوء استعمال التلفاز والإنترنت.</li>
  <li><b>العزم الصادق:</b> أن تكون له نية خالصة وعزم على عدم العودة إلى الظلمة، ومجاهدة للسير على الصراط المستقيم.</li>
  <li><b>ردّ الحقوق:</b> أن يؤدي حقوق الله وحقوق الرسول ﷺ وحقوق المخلوقات، ويتضرع ويسأل المغفرة إن انتهك شيئًا منها. ولا يتجاهل حقوق نفسه أيضًا، وإلا بقي في ظلمة المعصية.</li></ol>`},
 {t:'الوفاء بالحقوق وردّ المظالم',h:`<p>من الجميل أن يريد الإنسان قضاء ما بقي من عمره في طاعة كاملة لله، متّبعًا سنة الرسول ﷺ. لكن إذا انتهك في الماضي حقوق الله، أو حقوق الرسول ﷺ، أو حقوق نفسه، أو حقوق الخلق، <b>وجب عليه ردّ هذه المظالم وسؤال الله المغفرة</b>.</p>
  <h4>أولًا: حقوق الله</h4><ol><li>ألّا يُشرك به أحدًا، لا في ذاته ولا في صفاته.</li><li>أن يعبده لينال رضاه وحده، لا من أجل الشهرة أو الذكر الحسن عند الناس.</li><li>أن يقضي كل الصلوات المفروضة الفائتة، ويسأل الله المغفرة.</li><li>أن يعوّض كل صيام مفروض فائت أو غير تام، ويدفع كفارته وفق ما جاء في الشريعة.</li><li>أن يحسب الزكاة المفروضة التي فاتته في السنوات الماضية ويدفعها.</li><li>أن يحجّ في موسم الحج القادم إن كان الحج مفروضًا عليه.</li><li>إن أقسم أو نذر لله ولم يفِ، وجب عليه الإتيان به، أو دفع الكفارة، والتوبة من ذلك.</li></ol>
  <h4>ثانيًا: حقوق رسول الله ﷺ</h4><ol><li>الإيمان التام والكامل برسول الله محمد ﷺ.</li><li>أن تحبه ﷺ أكثر من زوجك وأولادك ووالديك وكل شيء آخر.</li><li>توقيره وتبجيله وتعظيمه، وتعظيم كل ما يتعلق به: دينه وسنته وحياته.</li><li>اتباع دينه وشريعته وسنته، أي أن تعيش حياتك كما عاشها ﷺ.</li><li>دعوة الآخرين إلى الشريعة والسنة وسيرته ﷺ، وتبليغ ذلك للناس.</li></ol>
  <h4>ثالثًا: حقوق النفس</h4><ol><li>أن تنقذ نفسك من سخط الله ومن عذاب جهنم.</li><li>أن تراعي صحة جسدك.</li><li>أن تكفي جسدك من النوم والراحة.</li><li>أن تحافظ على جسدك طاهرًا نظيفًا.</li><li>أن تطعم نفسك من الحلال.</li></ol>
  <h4>رابعًا: حقوق الخلق، وهي ثلاثة أنواع</h4><ol><li><b>حقوق مالية:</b> كل ما يتعلق بالمال والممتلكات. فإن جنيت مالًا غير مشروع في الماضي، أرضًا كان أو عقارًا أو ذهبًا أو فضة أو غيره، وجب أن تردّه إلى أصحابه أو تسألهم العفو. وإن مات صاحبه فأعِده إلى ورثته، فإن لم يكن له وارث وجب التصدق به لصالح صاحبه.</li>
   <li><b>حقوق بدنية ومادية (الحياة):</b> إن آذيت أحدًا في جسده أو في مشاعره أو في عقله، فلا بد أن تطلب منه الصفح.</li>
   <li><b>حقوق تتعلق بالعِرض والشرف:</b> كالادّعاء الكاذب، والغيبة، والنميمة، وشهادة الزور، والسخرية من أخيك المسلم، والتقليل من شأنه. فيجب أن تطلب منهم العفو والمغفرة.</li></ol>
  <p class="ls-note">بعد أن تسأل الناس العفو، تضرّع إلى الله لينال عفوه، وتُب إليه محقّقًا شروط التوبة.</p>
  <p>ولا بد أيضًا أن تتوب إلى الله إن قتلت أو آذيت حيوانًا أو طائرًا أو حشرة دون وجه حق.</p>
  <p>وفي النهاية يتضرع الإنسان إلى الله بسيد الاستغفار:</p><p class="ls-q">اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي، فَاغْفِرْ لِي، فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ <small>(البخاري)</small></p>`},
 {t:'خلاصة الحقوق في جدول',h:`<table class="ls-t"><tr><th>الحقوق المتعلقة بـ</th><th>مضمونها</th></tr><tr><td>الله</td><td>التوحيد، والإخلاص، والزكاة، والحج، والأيمان، والنذور، والحب، والعبودية، والطاعة، والتعظيم</td></tr><tr><td>رسول الله ﷺ</td><td>الإيمان، والحب، والتوقير، والتعظيم، واتباع سنته، وتبليغ رسالته</td></tr><tr><td>النفس</td><td>وقايتها من عقاب الآخرة، والحفاظ على الصحة، والكسب الحلال، والطهارة</td></tr><tr><td>الناس</td><td>الاحترام المادي والمعنوي، والوفاء بالوعود</td></tr><tr><td>باقي المخلوقات: البيئة والأرض والأحياء والموارد الطبيعية</td><td>الرحمة، وعدم الإزعاج، وعدم الإسراف أو التبذير في النعم</td></tr></table>`},
 {t:'ركعتا التوبة',h:`<p>يتوضأ التائب وضوءًا صحيحًا، ثم يصلي ركعتين لوجه الله، ويبكي من صميم قلبه حين يتذكر ذنوبه، ويملؤه الإحساس باللوم والندم الشديدين، ويدعو بسيد الاستغفار: «اللهم أنت ربي لا إله إلا أنت…».</p>
  <p>ويصلي على الرسول ﷺ ويسلّم عليه قبل الصلاة وبعدها.</p>
  <p>و<b>أفضل الأوقات: الثلث الأخير من الليل</b>، حين يقول الله تعالى: «هل من مستغفر؟».</p>`},
 {t:'لا تتوقف عن التوبة ولا تؤجّلها',h:`<p>من المهم أن يأتي التائب بشروط التوبة، وأن يتذكر أن عليه أن ينوي عدم ارتكاب الذنب مرة أخرى في المستقبل. لكن هذا ليس وعدًا قاطعًا: فإن أذنب مرة أخرى عاد إلى شروط التوبة من جديد.</p>
  <p>وإن لم يستطع الإقلاع عن الذنب، <b>فلا يجوز له أن يترك التوبة أبدًا</b>، لأن الله يحب التوابين، وليس هناك معصوم غير الرسول ﷺ والملائكة.</p>`},
 {t:'خداع الشيطان في التوبة',h:`<p>أن تستمر في المعصية دون توبة وتأمل في الغفران، فهذا محض خداع وحماقة وتمنٍّ. أما الطريق الصحيح فهو <b>الأخذ بالأسباب ثم التوكل على الله</b>.</p>
  <p>فلا ينتظر الإنسان الثمرة إلا بعد أن يبذر البذور أولًا: <b>التوبة هي زرع البذور، والغفران هو الثمرة</b>.</p>`},
 {t:'إلى متى يمكن للإنسان أن يتوب؟',h:`<p>يمكن للإنسان أن يتوب ما لم تصل ساعة الاحتضار، أي قبل خروج روحه وانقطاع أنفاسه.</p><p>وباب التوبة مفتوح للناس جميعًا حتى تطلع الشمس من مغربها.</p>`},
 {t:'نقاط مهمة: متى لا تكون التوبة صحيحة؟',h:`<p><b>الإخلاص أولًا:</b> أن تهجر المعصية لوجه الله فقط، لا خوفًا من اللوم أو من أي شيء آخر. لذلك ليست توبة صحيحة:</p>
  <ul><li>من ترك المعصية من أجل وظيفة أو منصب.</li><li>من تركها من أجل الناس.</li><li>من تركها ليتجنّب المرض، أو خوفًا على صحته.</li><li>من توقف عن السرقة لأنه لم يجد مدخلًا إلى البيت أو الخزينة، أو خوفًا من الحراس أو الشرطة.</li><li>من ترك المخدرات أو الخمور بسبب الفقر.</li><li>من منعه من المعصية عامل خارجي، كالعجز الذي يمنع صاحبه من الفاحشة، أو العمى الذي يمنعه من النظرات المحرّمة.</li></ul>`},
 {t:'أمور تعين على الثبات على التوبة',h:`<ol><li><b>ترك المعصية ظاهرًا وباطنًا:</b> ظاهرًا بأن يتركها، وباطنًا بأن يترك التفكير فيها، ولا يسترجع متعتها أو نشوة معاصٍ مضت، ولا يتمنى العودة إليها، وإلا عاد إلى طريقها حتمًا.</li>
  <li><b>الإقلاع عن الصغائر:</b> لأن الصغائر هي التي تقود إلى الكبائر، فالنظرات الشهوانية مثلًا تقود إلى الزنا.</li>
  <li><b>البعد عن كل الطرق المؤدية إلى المعصية،</b> كالخمور وكل ما هو إباحي، وما يجرّ إليها من المشاهد والملهيات.</li>
  <li><b>ترك البيئة التي تسهّل المعصية.</b></li>
  <li><b>ترك الصحبة السيئة،</b> ومصاحبة الأتقياء الذين يعينونه ويساندونه في كل عمل صالح.</li>
  <li><b>الحذر مما يجعل الهجر صعبًا:</b> فبعض المعاصي تعطي صاحبها مكانة كبيرة، كرئيس عصابة أو نجم مشهور، فيصعب عليه تركها.</li>
  <li><b>عدم تأجيل التوبة:</b> فقد يأتي الموت فجأة، وقد يُختم على القلب. وتذكّر أن تأجيل التوبة ذنب في حدّ ذاته، تجب التوبة منه أيضًا.</li>
  <li><b>الخوف والرجاء معًا:</b> يخشى دائمًا من نقص توبته أو عدم كمالها، فلا يثق بأنه قد غُفر له، بل يرجو رحمة الله ويستغفره دائمًا.</li>
  <li><b>حضور مجالس ذكر الله والوعظ،</b> وزيارة القبور ليتذكر الآخرة.</li>
  <li><b>صحبة مرشد صالح تقيّ</b> يعينه على التطهّر من الذنوب، وبلوغ القرب من الله ورضاه، عن طريق تقويم الذات.</li>
  <li><b>تجديد قوة الجسد بالحلال:</b> يبذل طاقة الجسد وقوته التي جاءت من كسب غير مشروع في سبيل الله، ليبدأ في اكتساب طاقته وقوته بالطرق المشروعة.</li></ol>`},
 {t:'الشكوك والوساوس التي تمنع من التوبة',h:`<p>من الوساوس الشائعة:</p><ul><li>«أريد أن أتوب، ولكن من يضمن لي أن الله غفر لي؟»</li><li>«ذنوبي كثيرة، ولا يمكن غفرانها.»</li></ul>
  <p><b>والجواب:</b> لست أنت من يغفر، بل الله. فلا تترك التوبة أبدًا، لأنك تحتاج إليها كلما وقعت في الذنب. فأنت لست معصومًا كالملائكة، ولست مليئًا بالخطايا كالشيطان، بل أنت إنسان لك إرادة حرة وقوية، يمكنها أن تسمو فوق الملائكة، وأن تكون أقوى من أي شيطان يحاول التأثير عليك. فالتزم طريق التقوى، فإن الله يغفر لمن صدقت توبته، ورحمته سبقت غضبه.</p>
  <p>يقول الله تعالى في الحديث القدسي: <b>«يا ابن آدم، لو بلغت ذنوبك عنان السماء ثم استغفرتني غفرت لك ولا أبالي»</b>.</p>
  <p>وجاء رجل إلى رسول الله ﷺ فقال: أرأيت رجلًا عمل الذنوب كلها، ولم يترك حاجة ولا داجة، فهل له من توبة؟ فقال ﷺ: «أسلمت؟» قال: نعم. قال: <b>«فافعل الخيرات، واترك السيئات، فيجعلها الله لك خيرات كلها»</b>. قال: وغدراتي وفجراتي؟ قال: «نعم». فما زال يكبّر حتى توارى. <small>(مسند الإمام أحمد؛ ومنهاج القاصدين لابن قدامة المقدسي، كتاب التوبة)</small></p>`},
 {t:'«لقد غُفر لي»: وسوسة أخرى',h:`<p>لا ينبغي للإنسان أن يعتقد أو يظن أنه قد غُفر له، بل يخشى غضب الله ويأمل في رحمته. فهذا ما يعطيه التوازن ليستمر في رحلة السير إلى الله.</p>
  <p>وقد يلقي الشيطان وسوسته ليجعلك تعتقد أنه غُفر لك، أو أنك أصبحت صالحًا. فعندها يجب أن تلجأ إلى الله، وألّا تهجر باب التوبة أبدًا، وأن تقوّي نيتك وعزيمتك في البعد عن باب المعصية وفتح باب الطاعة.</p>
  <p>يتحلّى الإنسان بالنية الصادقة والعزيمة القوية لهجر المعاصي وطلب المغفرة، حتى يبقى باب التوبة مفتوحًا، فباب التوبة يُغلق متى هجره الإنسان. وقد يفاجئه الموت وقد خُتم على قلبه إن أساء فهم التوكل، فيعمى عن طريق الصلاح ولا يرى إلا الظلام.</p>
  <p class="ls-note"><b>التوبة مفتاح لأبواب كثيرة، وهي الباب المفتوح لرحمة الله. فادخله ولا تنظر إلى الوراء نحو المعصية</b>، وإلا عدت بين يدي الشيطان. فالله يمهلنا برحمته فقط، فلنحسب لكل أفعالنا حسابها.</p>`}]}};

function logOrgan(id,ok,reason,D){D=D||TODAY;
  const o=S.organs[id];if(o.ready&&ok!==null)return render();if(!o.base)orgMigrate(o);
  if(o.base){if(ok===null){delete o.hist[D];Object.keys(o.hist).forEach(k=>{if(o.hist[k].f===D)delete o.hist[k]})}
    else{const prev=Object.keys(o.hist).filter(k=>k<D).sort().pop();let s=prev?addDays(prev,1):o.base.d;
      for(let d=s;d<D;d=addDays(d,1))if(!o.hist[d])o.hist[d]=ok?{v:'ok',f:D}:{v:'miss',f:D};
      o.hist[D]={v:ok?'ok':'slip',r:(reason||'').trim()}}
    orgSim(o);confirmFor=null;tzConf=null;save();render();return}
  o.broken=false;
  if(ok){if(o.days===0&&(!o.attemptStart||o.attemptStart>D))o.attemptStart=D;
    o.days++;if(o.days>=30){if(o.phase==='tathir'){o.days=30;o.ready=true}else{o.phase='done';o.days=30}}}
  else{o.slips.push({date:D,phase:o.phase,day:o.days,reason:(reason||'').trim()});o.days=0;o.resets++;o.attempt++;o.attemptStart=addDays(D,1)}
  o.last=D;o.today=D===TODAY?(ok?'ok':'slip'):null;confirmFor=null;save();render();
}

/* accounts & cloud save — Firebase (Auth + Firestore) */
const V='10.12.2',B='https://www.gstatic.com/firebasejs/'+V+'/';
const cfg={apiKey:"AIzaSyD4FjornbE6-8fOqugJn6YEhZrENXMB_cs",authDomain:"almurshid-64196.firebaseapp.com",projectId:"almurshid-64196",storageBucket:"almurshid-64196.firebasestorage.app",messagingSenderId:"525420006974",appId:"1:525420006974:web:b7357972bad9c4e4fa4b6f"};
let inFrame=false;try{inFrame=window.self!==window.top}catch(e){inFrame=true}
if(inFrame){window.onFbFail()}else(async()=>{
 try{
  const [A,U,F]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]);
  const app=A.initializeApp(cfg),auth=U.getAuth(app),db=F.getFirestore(app);

  const d=(...p)=>F.doc(db,...p);
  window.FB={
   signUp:async(email,pass,name)=>{const c=await U.createUserWithEmailAndPassword(auth,email,pass);
     try{await U.updateProfile(c.user,{displayName:name})}catch(e){}
     if(!/@example\.com$/i.test(email))try{await U.sendEmailVerification(c.user)}catch(e){}return c.user},
   signIn:(email,pass)=>U.signInWithEmailAndPassword(auth,email,pass),
   google:async()=>{try{await U.signInWithPopup(auth,gp)}catch(e){
     if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment','auth/cancelled-popup-request'].includes(e.code))return U.signInWithRedirect(auth,gp);throw e}},
   reset:email=>{auth.languageCode=document.documentElement.lang||'ar';return U.sendPasswordResetEmail(auth,email)},
   signOut:()=>U.signOut(auth),
   resendVerify:()=>auth.currentUser&&U.sendEmailVerification(auth.currentUser),
   claims:async()=>{const r=await auth.currentUser.getIdTokenResult(true);return{email:r.claims.email,v:r.claims.email_verified,p:r.signInProvider}},
   reloadUser:async()=>{if(auth.currentUser){await U.reload(auth.currentUser);await auth.currentUser.getIdToken(true)}return auth.currentUser},
   deleteAccount:async()=>{const u=auth.currentUser;if(!u)return;

   loadProgress:async uid=>{const s=await F.getDoc(d('progress',uid));return s.exists()?s.data():null},
   saveProgress:(uid,data,at)=>F.setDoc(d('progress',uid),{data,updatedAt:at}),
   touchUser:async(u,name,lang)=>{const r=d('users',u.uid),s=await F.getDoc(r);

   enablePush:async(vapidKey)=>{const Mg=await import(B+'firebase-messaging.js');

     const reg=await navigator.serviceWorker.ready,msg=Mg.getMessaging(app);
     const token=await Mg.getToken(msg,{vapidKey,serviceWorkerRegistration:reg});
     if(!window.__fbOnMsg){window.__fbOnMsg=1;Mg.onMessage(msg,p=>{const d=p.data||{};if(d.tag==='murshid-hudur'&&window.showHudur&&document.visibilityState==='visible'){window.showHudur();return}reg.showNotification(d.title||'المرشد',{body:d.body||'',icon:'icon-192.png',image:d.image||undefined,tag:d.tag||'murshid',lang:'ar',dir:'rtl',data:{url:d.url||'./'}})})}

   savePush:(uid,v)=>F.setDoc(d('push',uid),v,{merge:true}),

   deleteMessage:id=>F.deleteDoc(d('messages',id)),
   askQ:(u,text,name,lang)=>F.addDoc(F.collection(db,'questions'),{uid:u.uid,email:u.email||'',name:name||u.displayName||'',lang:lang||'ar',text,createdAt:F.serverTimestamp()}),
   myQs:async uid=>(await F.getDocs(F.query(F.collection(db,'questions'),F.where('uid','==',uid)))).docs.map(x=>({id:x.id,...x.data()})),
   allQs:async()=>(await F.getDocs(F.query(F.collection(db,'questions'),F.orderBy('createdAt','desc'),F.limit(200)))).docs.map(x=>({id:x.id,...x.data()})),
   answerQ:(id,answer)=>F.updateDoc(d('questions',id),{answer,answeredAt:F.serverTimestamp()}),
   delQ:id=>F.deleteDoc(d('questions',id)),
   listUsers:async()=>(await F.getDocs(F.collection(db,'users'))).docs.map(x=>({id:x.id,...x.data()}))
  };
  U.getRedirectResult(auth).catch(e=>window.onAuthRedirectError&&window.onAuthRedirectError(e));
  U.onAuthStateChanged(auth,u=>window.onAuthUser(u));
 }catch(e){console.warn('firebase',e);window.onFbFail()}
})();
