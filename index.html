 уповал на Аллаха.","Чтобы он отличал истинную такву от наваждения, а законную осторожность — от нововведенческой строгости.","Чтобы плодом его пути были милосердие, правдивость, честность, благонравие и польза людям."]]]},{"t":"Заключение","b":[["p","Мухаммадов путь по своей сути — проект всестороннего исправления: он начинается с вероубеждения, проходит через знание, поклонение и очищение души и доходит до подробностей речи, пищи, торговли, семьи, соседства и общественных прав. Поэтому «Мухаммадов путь» — это не духовная внешность, отделённая от шариата, а <b>перестройка всей жизни мусульманина на следовании Пророку ﷺ, с соединением правильности убеждения, правильности дела и правильности нрава</b>."],["p","Мерило, повторяющееся во всех разделах пути: <b>Книга Аллаха, Сунна Его Посланника, понимание саляфов, знание фикха, оставление крайности и небрежения и осуществление таквы в сердце, членах тела и правах людей.</b>"]]}]}};

function tqBlock([k,c]){
  if(k==='h')return `<h4>${c}</h4>`;
  if(k==='note')return `<p class="tq-note">${c}</p>`;
  if(k==='ul'||k==='ol')return `<${k}>${c.map(x=>`<li>${x}</li>`).join('')}</${k}>`;
  if(k==='dl')return `<dl class="tq-dl">${c.map(([n,d])=>`<div><dt>${n}</dt><dd>${d}</dd></div>`).join('')}</dl>`;

function viewMethod(){

function tqSearch(){
  const box=document.getElementById('tqSecs'),N=document.getElementById('tqN');if(!box)return;
  const U=tqU(),raw=tqQuery.trim(),q=tqNorm(raw);
  const clr=document.querySelector('[data-tqclr]');if(clr)clr.hidden=!raw;

  const secs=[...box.querySelectorAll('.tq-s')];
  if(q.length<2){secs.forEach(s=>{s.hidden=false});N.hidden=true;return}
  const words=q.split(/\s+/).filter(w=>w.length>1).map(w=>LANG!=='ar'&&w.length>=6?w.slice(0,-2):w);let total=0,first=null;
  secs.forEach(s=>{let n=0;
    s.querySelectorAll('p,li,dt,dd,h4,summary').forEach(e=>{const t=tqNorm(e.textContent);
      if(words.every(w=>t.includes(w))){n++;e.classList.add('hit');if(!first)first=e;tqMark(e,words)}});

function tqMark(el,words){
  const walk=document.createTreeWalker(el,NodeFilter.SHOW_TEXT),nodes=[];let x;while((x=walk.nextNode()))nodes.push(x);

    for(let i=0;i<s.length;i++){const c=tqNorm(s[i]);for(let j=0;j<c.length;j++){ns+=c[j];map.push(i)}}
    const rs=[];words.forEach(w=>{let p=ns.indexOf(w);while(p>-1){rs.push([map[p],map[p+w.length-1]+1]);p=ns.indexOf(w,p+w.length)}});
    if(!rs.length)return;rs.sort((a,b)=>a[0]-b[0]);
    const f=document.createDocumentFragment();let last=0;
    rs.forEach(([a,b])=>{if(a<last)return;if(LANG!=='ar')while(b<s.length&&/\p{L}/u.test(s[b]))b++;f.append(s.slice(last,a));const m=document.createElement('mark');m.textContent=s.slice(a,b);f.append(m);last=b});
    f.append(s.slice(last));tn.replaceWith(f)})}

function applyWird(w,on,D){

    L.awrad=on?[...new Set([...L.awrad,w])]:L.awrad.filter(x=>x!==w);
    if(w==='quran'||w==='dhikr'){M[w]=M[w].filter(x=>ds(new Date(x))!==D);if(on)M[w].push(atH(D,21))}
    if(w==='sabah'||w==='masa'){if(on)M[w][D]=atH(D,w==='sabah'?8:19);else delete M[w][D]}
    save();return}
  const L=dayLog();
  L.awrad=on?[...new Set([...L.awrad,w])]:L.awrad.filter(x=>x!==w);
  const p=period(),M=S.marks;
  if((w==='sabah'||w==='masa')&&p.kind===w&&(p.key===nowStr()||w==='masa')){if(on)M[w][p.key]=Date.now();else delete M[w][p.key]}
  if(w==='quran'||w==='dhikr'){M[w]=M[w].filter(x=>ds(new Date(x))!==nowStr());if(on)M[w].push(Date.now())}
  save();
}

function geoLocate(){geoMsg='';if(!navigator.geolocation){geoMsg='لا يدعم هذا الجهاز تحديد الموقع. اختر مدينتك من القائمة.';return render()}
  geoMsg='جارٍ تحديد موقعك…';render();
  navigator.geolocation.getCurrentPosition(p=>{const lat=+p.coords.latitude.toFixed(4),lng=+p.coords.longitude.toFixed(4),n=nearestCity(lat,lng);
    const near=n.c&&n.km<60;geoMsg='';setLoc({lat,lng,ar:near?n.c[1]:'موقعي الحالي',lt:near?n.c[2]:'My location',auto:true})},
   e=>{geoMsg=e&&e.code===1?'لم يُسمح بالوصول إلى الموقع. اسمح به من إعدادات المتصفح، أو اختر مدينتك من القائمة.':'تعذّر تحديد الموقع. اختر مدينتك من القائمة.';render()},{enableHighAccuracy:false,timeout:15000,maximumAge:6e5})}
function setPhoto(file){photoMsg='';if(!file)return;if(!/^image\//.test(file.type)){photoMsg='اختر ملف صورة.';return render()}
  const url=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const z=256,c=document.createElement('canvas');c.width=c.height=z;const g=c.getContext('2d'),m=Math.min(im.width,im.height);
    g.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,z,z);URL.revokeObjectURL(url);S.photo=c.toDataURL('image/jpeg',.85);save();render()};
  im.onerror=()=>{URL.revokeObjectURL(url);photoMsg='تعذّرت قراءة هذه الصورة. جرّب صورة أخرى.';render()};im.src=url}
