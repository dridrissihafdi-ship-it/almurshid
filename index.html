["ul",["Putting the unlawful into the stomach.","Eating beyond need and excessive satiety.","Eating what harms the body.","Leaving food and drink until one becomes too weak for obligations or the congregation.","Extravagance with food and spoiling it."]],["p","Among the etiquette it mentions: saying the name of God, eating with the right hand, eating from what is in front of you, not eating from the middle of the dish if it is one kind, not blowing into a drink or breathing into the vessel, giving to the one on the right, and not using gold and silver vessels for eating and drinking, according to the juristic details."],["h","Ailments of the private parts"],["p","The method details fornication, sodomy and bestiality, intercourse with a menstruating woman or one in postnatal bleeding in the forbidden way, forbidden enjoyment, intercourse involving harm or before the waiting period, and what relates to guarding the 'awrah and the etiquette of privacy and relieving oneself."],["h","Ailments of the foot"],["ul",["Going to gatherings of sin to commit it or watch it.","Travelling or going out in a way that harms one's parents or neglects their rights.","Entering another's land or house without permission, except in necessity or with customary permission.","Walking on graves or entering holy places without proper courtesy.","Stepping over people's necks on Friday.","Staying away from Friday prayer, the congregation, learning and teaching, Hajj and jihad when they become individually obligatory.","Visiting rulers and oppressors seeking worldly gain or to help them in their injustice.","Coming upon one's family suddenly after a long journey."]],["h","General ailments of the body and the rights of people"],["p","The method expands on social and family rights, including:"],["ul",["Disobedience to parents — noting that there is no obedience to a creature in disobedience to the Creator, and that kindness to parents and serving them is obligatory even if they are unbelievers, as long as the Muslim does not fear for his religion.","Cutting family ties; the least of keeping them is greeting or sending greetings, and it increases with visiting, helping and giving gifts.","Harming one's wife or husband, and not observing mutual rights.","Neglecting children and those one must support, and not educating and disciplining them.","Wronging servants or burdening them beyond their capacity, and failing to feed, clothe and teach them what they need.","Harming the neighbour, and not helping, visiting or consoling him.","Choosing bad company; a person is influenced by his close friend.","Sitting in the road without observing the rights of the road, or between shade and sun, or in the middle of a circle without permission.","Yawning without covering the mouth, bowing when greeting, and making a person rise from his seat without right.","Magic, amulets, fortune-telling, tattooing, plucking eyebrows, filing teeth apart, and men and women imitating each other.","Plucking grey hair or changing one's appearance out of showing off, and growing the beard and trimming the moustache as the method determines.","A woman travelling without a mahram, according to the details and narrations it presents.","Abandoning prayer, Friday prayer, fasting, Hajj or jihad when obligatory, and fleeing from the battlefield.","Usury, hoarding, 'inah sales, cheating, buying from one under coercion, and disposing of another's property without consent.","Keeping a dog without a valid need, lighting candles on graves, building mosques over them, and taking graves as places of amusement or rituals.","Luxury and clothing worn out of arrogance, lengthening the garment out of pride, and wastefulness in adornment."]]]},{"t":"Chapter Three: Things thought to be taqwa and scrupulousness","b":[["p","This chapter is among the most important of the Muhammadan Path, because it shows that some people abandon Sunnahs and duties or disrupt their lives because of outward scrupulousness and baseless obsessive doubts (waswasa)."],["h","Section One: Over-scrupulousness in purity and impurity"],["h","A. Forms of excess"],["ul",["Excess in the number of washings.","Judging water or a garment impure on mere doubt.","Repeating ablution and prayer many times.","Exaggerated searching for impurity.","Leaving the congregation or delaying prayer because of imaginary possibilities.","Wasting water and time in the name of scrupulousness.","Constantly asking people about the purity of things, when the default is purity."]],["h","B. Juristic rules"],["ul",["The default in things is purity and permissibility until the opposite is established.","Certainty is not removed by doubt.","Water is purifying unless its colour, taste or smell is changed by impurity, with the details of the schools presented.","It is permitted to use the vessels of the People of the Book unless their impurity is known.","Praying in sandals is permitted when their purity is ascertained.","The apparent state is not abandoned for an illusion."]],["p","The method presents the positions of the Zahiris, Malikis, Shafi'is and Hanafis on water and impurity, and mentions details about wells, vessels, bread, food mixed with impurity, leather socks and ritual bathing, to affirm that jurisprudence is not built on obsessive doubts."],["h","C. Treating obsessive doubts (waswasa)"],["ul",["Learning the rulings of purification from a trustworthy scholar.","Taking the concession and leeway when the doubts intensify, until they go away.","Not repeating prayer and ablution on mere doubt.","Continuing with the congregation, dhikr and recitation.","Sometimes sprinkling water on the body after ablution to dispel the illusion of impure wetness.","Not giving in to illusion, and moving on to the next action.","Remembering that the Salaf did not burden themselves with these imaginary subtleties."]],["h","Section Two: Scrupulousness about food from endowments and the public treasury"],["p","The method discusses scrupulousness regarding mixed wealth, especially food from endowments (awqaf) and the public treasury, and affirms that the ruling is not built on general doubt, but on knowledge that the unlawful is present in the specific item. So a Muslim does not abandon permissible rights and interests on mere illusion, nor does he consume wealth proven to be usurped, stolen or embezzled."],["p","The scale is:"],["ul",["Knowing the source of wealth as far as possible.","Acting on a reliable fatwa that takes reality into account.","Leaving what is certainly unlawful.","Not turning scrupulousness into disrupting livelihood or accusing people without proof."]],["h","Section Three: Innovations people think are acts of devotion"],["p","The method concludes by warning against innovated matters that people think are acts of worship, especially those related to graves, endowments and reciting for the dead in forms whose basis is not established in its view, building religious displays for which there is no evidence, and adopting group rituals, melodies or dances in the name of dhikr."],["p","The comprehensive rule in this chapter: <b>not everything by which its doer intends good is an act of devotion; devotion is what God and His Messenger have legislated, and what was not legislated does not become worship merely through good intention.</b>"]]},{"t":"Features of the therapeutic method in the Muhammadan Path","b":[["p","The method treats the diseases of religion, the self and the limbs with a recurring plan:"],["ol",["<b>Definition:</b> explaining the meaning of the disease or the act, linguistically and legally.","<b>Explaining the harms:</b> what results from it in the heart, religion, this world and the Hereafter.","<b>Naming the opposite:</b> showing that the opposite of arrogance is humility, of envy sincere goodwill and love, of miserliness generosity, and of haste verification.","<b>Evidence:</b> citing verses, hadiths, reports and the sayings of the jurists.","<b>Diagnosis:</b> knowing the causes of the disease, such as ignorance, showing off, bad company and weak certainty.","<b>Treatment through knowledge:</b> learning, reflection and knowing the texts.","<b>Practical treatment:</b> obliging the self to virtuous acts until they become habit.","<b>Uprooting treatment:</b> cutting off the causes and environments that bring the disease back.","<b>Self-accounting:</b> reviewing intention, action and results.","<b>Company:</b> keeping close to scholars and the righteous and leaving people of whims.","<b>Gradualness:</b> not moving to a new excess in the name of treating the old one.","<b>Continuity:</b> what counts is constancy and conformity to the Sunnah, not a passing burst."]]]},{"t":"Concise summary of the Muhammadan Path","b":[["p","The whole method can be summarized in this formula:"],["p","<b>Know monotheism, learn the ruling, follow the text, emulate the Prophet ﷺ, leave innovation and desire, worship God with moderation, guard your heart, tongue and limbs, fulfil people's rights, and do not let imaginary scrupulousness cut you off from obligations and a beneficial life.</b>"],["p","Signs of the seeker's sincerity on this Path:"],["ul",["That his creed is sound, not built on superstition.","That his worship conforms to the Sunnah, not to personal exaggeration.","That he is humble and not deluded by a miracle, an unveiling or many followers.","That he keeps the obligations and the rights of parents, spouse, children and neighbours.","That he eats, drinks and dresses from the lawful without extravagance or miserliness.","That he watches his tongue, hearing, sight, hand, stomach, private parts and foot.","That he seeks the knowledge he needs, and avoids disputation and sciences that lead to doubts.","That he takes means while his heart relies on God.","That he distinguishes between true taqwa and obsessive doubt, and between legitimate scrupulousness and innovated strictness.","That the fruit of his path is mercy, truthfulness, trustworthiness, good character and benefit to people."]]]},{"t":"Conclusion","b":[["p","The Muhammadan Path is, in essence, a comprehensive project of reform: it starts from creed, passes through knowledge, worship and purification of the soul, then reaches the details of speech, food, trade, family, neighbourliness and public rights. Therefore \"the Muhammadan Path\" is not a spiritual appearance separate from the Sacred Law; it is <b>rebuilding the Muslim's entire life on following the Prophet ﷺ, combining soundness of creed, soundness of practice and soundness of character</b>."],["p","The scale that recurs in all chapters of the Path is: <b>the Book of God, the Sunnah of His Messenger, the understanding of the Salaf, knowledge of jurisprudence, leaving excess and negligence, and realizing taqwa in the heart, the limbs and the rights of others.</b>"]]}]},"fr":{"title":"La Voie muhammadienne","sub":"Une présentation complète de ses fondements, de ses piliers, de ses chapitres et de ses questions pratiques","note":"<b>Note méthodologique :</b> ceci est une présentation d'ensemble de la Voie muhammadienne, couvrant ses fondements, ses piliers et ses domaines pratiques. Pour les questions de jurisprudence et de croyance qui font l'objet de divergences, il convient de se référer aux savants reconnus, et de vérifier l'authenticité des hadiths et des récits avant de s'en servir comme preuves.","secs":[{"t":"Premièrement : définition de la Voie muhammadienne et de sa finalité générale","b":[["p","<b>La Voie muhammadienne</b> n'est pas le nom d'une confrérie soufie fondée sur des litanies particulières ou sur l'affiliation à un cheikh précis ; c'est le nom de la méthode islamique globale sur laquelle reposent le salut et la droiture du musulman : <b>une croyance saine, une adoration conforme à la Sunna, une morale et une conduite réglées par le Livre et la Sunna, en évitant l'excès, la négligence et les innovations</b>."],["p","La biographie prophétique est l'application pratique de cette méthode dans la vie du Prophète ﷺ : ses croyances, ses paroles, ses actes, son caractère, son adoration et sa manière de traiter les gens. Le but est que le cheminant confronte sa pratique à cette biographie, afin de savoir s'il est dans le vrai et suit le modèle, ou s'il se trompe et innove. C'est pourquoi la pratique de chaque cheminant est mesurée à cette méthode, afin de distinguer celui qui a raison de celui qui se trompe, et celui qui est sauvé de celui qui se perd."],["p","Cette méthode est apparue en réponse à la situation de deux groupes opposés :"],["ul",["<b>Des dévots ignorants :</b> ils multiplient les formes d'adoration et les exercices spirituels, mais ignorent les limites de la Loi, et tombent ainsi dans l'innovation et l'excès.","<b>Des savants ou étudiants insouciants :</b> ils ont un savoir ou se réclament de la science, mais négligent la pratique, et la vie d'ici-bas et les passions les dominent."]],["p","Cette méthode ramène le musulman au <b>juste milieu entre l'excès et la négligence</b>, et à la référence décisive : le Coran, la Sunna et la compréhension des Salaf — non les coutumes, les goûts personnels, les prétentions ésotériques, ni la simple abondance d'actes d'adoration."]]},{"t":"Deuxièmement : les trois piliers de la Voie muhammadienne","b":[["p","La Voie muhammadienne repose sur trois grands chapitres, qui sont les piliers de la méthode :"],["h","1. S'attacher au Livre et à la Sunna"],["p","Le Coran est la source de la guidance, de la guérison et de la lumière, et la balance à laquelle on ramène la croyance, l'adoration et la conduite. La Sunna n'est pas un supplément dont on pourrait se passer ; elle est l'explication du Coran, et contient les ordres et les interdits du Prophète ﷺ ainsi que leurs détails pratiques."],["p","Cet attachement comprend :"],["ul",["Vénérer le Coran, le réciter, le comprendre et le mettre en pratique, sans se limiter à la récitation vocale.","Accepter la Sunna authentique même si elle ne correspond pas aux coutumes des gens ou à un avis particulier d'école.","Suivre la Sunna du Prophète ﷺ, celle des califes bien guidés et la compréhension des Compagnons.","Rejeter toute parole, goût, dévoilement ou coutume qui contredit un texte authentique ou une règle établie de la Loi.","Se référer aux savants dignes de confiance en cas de doute, et ne pas prendre la religion auprès des ignorants ou des gens de vaines prétentions."]],["h","2. Se préserver des mauvaises coutumes et des innovations"],["p","Il ne suffit pas de prétendre aimer la Sunna ; il faut abandonner ce qui la concurrence parmi les coutumes corrompues et les innovations dans la croyance, l'adoration ou la morale. Parmi les principes de la méthode : une innovation peut corrompre la Sunna qui lui correspond, et les gens peuvent remplacer la guidance prophétique par de nouvelles apparences qu'ils croient être des actes de piété."],["p","Mais la méthode distingue entre :"],["ul",["<b>La nouveauté au sens linguistique général :</b> toute chose nouvelle après la première génération, qu'il s'agisse d'une coutume ou d'un moyen utile.","<b>L'innovation blâmable au sens légal :</b> ajouter à la religion ou en retrancher, ou instaurer une croyance ou une adoration sans permission du Législateur, surtout si elle contredit un texte ou une Sunna établie."]],["p","Exemples de moyens nouveaux qui ne sont pas en eux-mêmes des innovations blâmables : les écoles, la rédaction de livres, la construction de minarets pour annoncer l'heure de la prière, et l'organisation des preuves pour réfuter les athées ; car ce sont des moyens au service d'une finalité légitime qui ne contredisent aucun principe."],["h","3. La modération dans les œuvres et le juste milieu"],["p","L'adoration ne réside pas dans la peine pour elle-même, ni dans le fait de se tourmenter, mais dans la conformité à la Loi et la réalisation de la servitude envers Dieu. La modération signifie :"],["ul",["Accomplir d'abord les obligations et les devoirs.","Préserver les sunnas sans excès.","Respecter le droit du corps, de la famille, du conjoint, des enfants et des gens.","Accepter les facilités que Dieu a légiférées en cas de besoin.","Ne pas jeûner perpétuellement, ne pas prier toute la nuit, ni renoncer au mariage et aux bonnes choses d'une manière qui rabaisserait la Sunna du Prophète ﷺ.","Ne pas abandonner le travail, le gain et le service des gens sous prétexte de se consacrer à l'adoration.","Rendre l'adoration constante et stable, et non un enthousiasme passager qui s'éteint après quelques jours."]]]},{"t":"Troisièmement : comment le musulman réalise-t-il la Voie muhammadienne ?","b":[["p","La méthode muhammadienne peut se transformer en une balance pratique de dix étapes :"],["ol",["<b>Corriger la croyance :</b> apprendre les fondements du monothéisme, de la foi, de la prophétie, de l'au-delà et du destin à partir du Livre et de la Sunna.","<b>Connaître la science de son état :</b> apprendre ce qui t'est nécessaire pour la prière, la purification, le jeûne, la zakat, les transactions, la famille et le travail.","<b>Confronter la pratique au texte :</b> demande la preuve de la croyance, de l'adoration ou du comportement, et ne fais pas du goût ou du rêve une preuve indépendante.","<b>Revenir à la Sunna authentique :</b> l'existence d'un récit dans un livre ne suffit pas ; il faut tenir compte de son authenticité, de sa compréhension et du rassemblement de ses chaînes.","<b>La compréhension des Compagnons et des Salaf :</b> car ils connaissaient le mieux l'intention du texte et la manière de l'appliquer.","<b>Examiner la conséquence :</b> l'acte conduit-il à abandonner une obligation, léser une personne, se détruire soi-même ou corrompre la croyance ? Si oui, ce n'est pas une voie muhammadienne.","<b>Rejeter le dévoilement contraire :</b> l'inspiration, le rêve et le prodige peuvent survenir, mais ils n'établissent aucune règle légale, ne rendent pas licite l'illicite et n'interdisent pas le licite.","<b>Réaliser l'équilibre :</b> unis l'adoration et le gain, la retraite et la fréquentation des gens, la crainte et l'espérance, le recours aux causes et la confiance en Dieu.","<b>Observer le fruit :</b> le signe d'une voie saine est l'augmentation de la foi, de l'obéissance, de l'humilité, du bon caractère et de la miséricorde — non l'autosatisfaction, l'orgueil et le mépris des gens.","<b>L'examen de conscience continu :</b> examine le cœur, la langue et les membres, et soigne chaque défaut par son contraire, par la bonne compagnie, la science et la pratique."]],["p","<b>En résumé :</b> la Voie muhammadienne ne se réalise pas par la multitude des litanies ou des prétentions, mais par la conformité de l'extérieur et de l'intérieur au Livre et à la Sunna, visible dans la croyance, l'adoration, la morale et les droits d'autrui."]]},{"t":"Carte détaillée de la Voie","b":[["h","Introduction à la Voie muhammadienne"],["p","La Voie muhammadienne réunit la croyance, la jurisprudence, le renoncement, l'adoration, la conduite, les maladies des cœurs et la réfutation des innovations ; c'est donc une méthode de réforme globale qui ne se limite pas à un seul aspect de la vie du musulman."],["p","Parmi les caractéristiques de cette méthode :"],["ul",["Elle commence généralement par les versets, puis les hadiths et les récits, puis les paroles des juristes et des Salaf.","Elle explique les termes linguistiques et légaux.","Elle tient compte des divergences juridiques et concilie les textes avec les règles de déduction.","Elle transforme la preuve en règle pratique et en comportement applicable.","Elle oriente le cheminant vers la pratique et l'examen de conscience.","Elle réfute les paroles et prétentions contraires par les preuves et les règles légales."]],["p","Dans les questions de croyance et de jurisprudence où les savants ont divergé, il faut distinguer les fondements catégoriques des questions d'effort d'interprétation, et ne pas transformer une divergence juridique en accusation d'innovation ou de mécréance sans science."]]},{"t":"Chapitre premier : le suivi du modèle et le juste milieu","b":[["h","1. S'attacher au Coran et à la Sunna"],["p","La méthode affirme que le Coran est la corde solide de Dieu, une guérison, une lumière et une guidance ; celui qui le place devant lui, il le conduit au Paradis, et celui qui le rejette derrière son dos, il le conduit à la perdition. Elle joint ensuite la Sunna au Coran, car le Prophète ﷺ a reçu le Livre et son équivalent avec lui, et il n'est pas permis de se limiter au Coran en rejetant l'explication du Prophète."],["p","La méthode cite les hadiths qui font de la meilleure guidance celle de Muhammad ﷺ, qui mettent en garde contre les choses nouvellement inventées et qui obligent à suivre la Sunna du Prophète et des califes bien guidés. La référence en cas de divergence n'est donc pas ce que les gens jugent bon, ni ce que prétend un cheikh ou un homme de dévoilement, mais la Révélation et la compréhension des Salaf."],["h","2. Le sens de l'innovation et ses catégories"],["p","La méthode aborde l'innovation sous deux angles :"],["ul",["<b>L'innovation dans la croyance :</b> la plus dangereuse, comme contredire les fondements du monothéisme, nier ce qui est connu nécessairement de la religion, ou faire passer la passion et l'interprétation fausse avant le texte.","<b>L'innovation dans l'adoration :</b> inventer une forme, un nombre ou un engagement dévotionnel sans fondement ; elle s'aggrave lorsqu'elle heurte une Sunna confirmée.","<b>La nouveauté dans les coutumes et les moyens :</b> elle n'est pas un égarement du seul fait d'être nouvelle ; on examine plutôt sa finalité et sa conformité à la Loi. L'école, le livre et le minaret sont des moyens au service de finalités saines, et non des adorations indépendantes."]],["p","Parmi les règles de ce chapitre :"],["ul",["Si une chose hésite entre Sunna et innovation, la délaisser est plus sûr, sauf si cela conduit à délaisser une obligation.","Commettre une innovation peut être plus nuisible que délaisser une Sunna, car l'innovation fait croire à son auteur qu'il est dans le vrai et elle concurrence la Sunna.","Il n'est pas correct de considérer comme innovation légale tout ce qui n'a pas existé dans la première génération ; on examine s'il s'agit d'une adoration recherchée en soi ou d'un moyen permis.","L'effort d'interprétation est une excuse dans les questions secondaires sujettes à interprétation, mais pas dans les fondements catégoriques de la croyance, ni dans la contradiction d'un texte établi après en avoir eu connaissance."]],["h","3. Réfutation des prétentions du soufisme ésotérique"],["p","La méthode discute ceux qui disent que la Loi a un sens apparent pour le commun et un sens caché réservé à une élite, ou que les gens du dévoilement peuvent se passer du Livre et de la Sunna, ou qu'ils reçoivent les règles du Prophète ﷺ en rêve, ou qui prétendent que le prodige prouve la justesse de leur voie."],["p","Elle réfute ce principe en affirmant que :"],["ul",["L'inspiration n'est pas une source indépendante des règles légales.","Le rêve ne rend pas licite l'illicite et n'interdit pas le licite.","Le prodige n'est pas un prodige légitime s'il s'accompagne d'une contradiction avec le Livre et la Sunna ; il peut être un leurre menant à la perdition ou une illusion.","La mesure du saint est le respect des limites, l'attachement aux ordres et aux interdits, la science et la pratique — non les prodiges et les apparences.","Celui qui prétend que l'intérieur l'autorise à contredire l'extérieur a démoli la Loi."]],["p","La méthode cite de grands maîtres du soufisme qui confirment ce principe : al-Junayd dit que toutes les voies sont fermées sauf à celui qui suit les traces du Messager ; Sarî as-Saqatî définit le soufisme comme le fait que l'intérieur ne contredise pas l'extérieur, et que les prodiges ne poussent pas à violer les interdits de Dieu ; et Abû Yazîd fait du respect des ordres et des interdits le critère, et non le simple fait de voler dans les airs ou de manifester des prodiges."],["h","4. La modération dans l'adoration"],["p","La méthode donne l'exemple des trois hommes : l'un voulait prier toute la nuit pour toujours, le deuxième jeûner perpétuellement, et le troisième renoncer au mariage. Le Prophète ﷺ les a ramenés à sa Sunna : il jeûne et rompt le jeûne, il prie et il dort, et il se marie."],["p","Elle explique que la rigueur des exercices spirituels peut être un remède temporaire à une maladie du cœur, ou une habitude propre à la nature de certains vertueux, mais cela ne signifie pas qu'une autre voie soit meilleure que la guidance du Prophète ﷺ. Elle ne doit pas conduire à :"],["ul",["Abandonner les obligations.","Négliger les droits de la famille et du corps.","Cesser le gain licite alors qu'on en a besoin.","Se détruire soi-même ou se couper de la communauté.","Croire que la peine elle-même rapproche davantage de Dieu que la Sunna."]],["p","Le gain peut être obligatoire dans la mesure de ce qui suffit à la personne et à ceux dont elle a la charge, et recommandé s'il dépasse cela pour entretenir un proche ou aider un pauvre. Le bénéfice du gain qui profite aux autres peut être meilleur qu'une adoration surérogatoire qui ne profite qu'à son auteur."]]},{"t":"Chapitre deux : les affaires importantes dans la Loi muhammadienne","b":[["p","Ce chapitre est le plus vaste de la méthode, et comprend trois grandes sections :"],["ol",["Corriger la croyance selon la voie des Gens de la Sunna et de la Communauté.","Les sciences recherchées pour autre chose qu'elles-mêmes.","La piété (taqwa), ses canaux, et les maux du cœur, de la langue et des membres."]],["h","Section un : corriger la croyance"],["h","A. Le monothéisme et les attributs"],["p","La méthode affirme que Dieu le Très-Haut est exempt de corps, de substance, d'accident, de lieu, de direction, de limites, d'organes et de temps ; qu'Il est Un et ne ressemble à rien ; éternel sans commencement ni fin ; qualifié des attributs de perfection."],["p","Elle présente les questions des attributs, de la parole divine et de la vision de Dieu, en rapportant les positions des théologiens et des juristes, tout en tenant compte des divergences entre écoles savantes dans certaines questions de croyance et en rapportant les paroles des Salaf et des gens du hadith."],["h","B. Le Coran, la vision de Dieu et le destin"],["p","Parmi les questions de croyance qu'elle présente :"],["ul",["Le Coran est la parole incréée de Dieu.","La vision de Dieu dans l'au-delà est établie selon les Gens de la Sunna, sans cernement, sans modalité et sans lieu.","Les actes des serviteurs sont créés par Dieu, et les serviteurs ont un choix et une acquisition pour lesquels ils méritent l'éloge ou le blâme ; la méthode est le juste milieu entre les Jabrites (fatalistes) et les Qadarites (négateurs du destin).","La capacité est prise en compte avec l'acte, et Dieu n'impose à aucune âme plus que ce qu'elle peut supporter.","Les termes de vie et les subsistances sont prédestinés ; l'illicite est « subsistance » en ce sens qu'il survient dans le décret de Dieu, non en ce sens qu'il serait permis.","Le châtiment et la félicité de la tombe, la résurrection, la Balance, le Livre des œuvres, le Bassin, le Pont, l'intercession, le Paradis et l'Enfer sont vérité.","L'Ascension (Mi'raj) a eu lieu pour le Prophète ﷺ à l'état de veille, avec son corps.","Les signes de l'Heure mentionnés dans la Sunna sont vérité."]],["h","C. La foi et les grands péchés"],["p","Elle présente la divergence sur la définition de la foi : est-elle seulement adhésion et affirmation, ou parole et acte qui augmente par l'obéissance et diminue par la désobéissance ? Elle affirme que la divergence entre certaines formulations des théologiens est en partie verbale, tandis que les Gens de la Sunna s'accordent sur le fait que Dieu veut des serviteurs la parole et l'acte, et que les grands péchés ne font pas sortir le monothéiste de l'islam et ne lui valent pas l'éternité en Enfer."],["p","Elle présente aussi la question du musulman qui dit : « Je suis croyant, si Dieu le veut », et indique que s'il entend par là douter du fondement de sa foi, c'est dangereux ; mais s'il entend l'humilité, la crainte d'une mauvaise fin ou le refus de se glorifier, cela a un fondement chez les savants."],["p","Elle affirme que la foi de celui qui suit par imitation est valide selon un groupe des Gens de la Sunna, même si abandonner le raisonnement en en étant capable est un manquement ou un péché selon certains d'entre eux."],["h","D. La prophétie, les prodiges des saints et les Compagnons"],["ul",["Les prophètes sont exempts du mensonge et de la trahison ; le meilleur et le dernier d'entre eux est Muhammad ﷺ.","Les anges sont des serviteurs honorés qui ne désobéissent pas à Dieu.","Les miracles des prophètes sont vérité.","Les prodiges des saints sont possibles, mais ils n'élèvent pas le saint au rang de prophète et ne le dispensent pas des ordres et des interdits.","Les meilleurs des saints sont les Compagnons, en tête Abû Bakr, puis 'Umar, puis 'Uthmân, puis 'Alî, puis le reste des Compagnons ; il faut s'abstenir de parler d'eux autrement qu'en bien.","Aimer et honorer les Compagnons est un fruit de l'amour du Prophète ﷺ, et les insulter ou les dénigrer est une déviation."]],["h","E. L'imamat et les questions juridiques liées à la croyance"],["p","La méthode mentionne le besoin des musulmans d'un dirigeant capable d'appliquer les règles ; son infaillibilité ou le fait d'être le meilleur de son époque n'est pas une condition, et dans sa position juridique, sa destitution n'est pas exigée pour la seule perversité ou injustice. Elle mentionne la permission de prier derrière le pieux et le pécheur, tout en continuant de désapprouver le péché."],["p","Elle traite aussi de questions comme l'essuyage sur les chaussettes de cuir, le nabîdh de jarre s'il n'est pas enivrant, le bénéfice que tire le défunt des adorations, des invocations et de l'aumône faites pour lui, la magie et le mauvais œil, et la question de savoir si le mujtahid atteint la vérité ou se trompe ; elle affirme que la vérité dans la réalité est une, et que celui qui se trompe de manière excusable est récompensé pour son effort."],["h","F. Les sectes et les innovations"],["p","La méthode présente de nombreuses sectes et doctrines, dont les Kharijites, les Murji'ites, les Qadarites, les Jabrites, les Mu'tazilites, les Râfidites, les Kaysânites, les Yazîdites, les Najjârites et les Jahmites, et réfute ce qu'elle juge contraire aux fondements des Gens de la Sunna, notamment :"],["ul",["Déclarer les musulmans mécréants à cause des grands péchés.","Nier le destin ou faire du serviteur le créateur de ses propres actes.","Nier les attributs ou affirmer ce qui implique l'anthropomorphisme.","Croire à la réincarnation des âmes ou à l'incarnation de Dieu dans les imams.","Supprimer la prière, le jeûne et la zakat sous prétexte d'obéir à un cheikh ou à un imam caché.","Placer les saints au-dessus des prophètes ou les préférer au Prophète ﷺ."]],["p","Le résumé de la méthode pour le cheminant : acquérir la certitude dans la croyance des Gens de la Sunna, se méfier de ceux qui égarent et sèment le doute, et ne pas accepter les prétentions qui élèvent leurs auteurs au-dessus des textes ou au-dessus du rang de la prophétie."]]},{"t":"Section deux : les sciences recherchées pour autre chose qu'elles-mêmes","b":[["p","La méthode divise les sciences en trois catégories :"],["h","1. Les sciences d'obligation individuelle"],["p","Ce sont celles dont tout responsable a besoin pour la validité de sa religion et de son état, comme :"],["ul",["Les règles de la purification, de la prière, du jeûne, de la zakat, et du hajj pour celui à qui il est obligatoire.","Les règles nécessaires de la vente, de la location, du mariage, du divorce et du travail.","La science du cœur : la confiance en Dieu, la crainte révérencielle, l'espérance et le retour vers Lui.","Connaître l'orgueil, l'ostentation, l'envie et l'avarice, et ce qui est nécessaire pour les soigner."]],["p","L'ignorance de ce sans quoi l'adoration ou la transaction n'est pas valide n'est pas une excuse pour celui qui est capable d'apprendre."],["h","2. Les sciences d'obligation collective"],["p","Ce sont celles dont il suffit qu'une partie de la communauté s'en charge, comme la jurisprudence, l'exégèse, le hadith, les fondements du droit, les sciences de la langue arabe, le droit successoral, le calcul nécessaire à la magistrature et aux héritages, ainsi que la médecine et les sciences utiles dont la communauté a besoin."],["h","3. Les sciences interdites ou blâmables"],["ul",["S'enfoncer dans la théologie spéculative et la dialectique sans besoin ou sans capacité, surtout si cela engendre des doutes.","L'astrologie qui prétend connaître l'invisible ou l'influence des astres.","La magie, les sortilèges et le charlatanisme ; on n'excepte de l'étude de leurs états que ce qui vise à dévoiler le mal et à le repousser.","La controverse lorsqu'elle sert la chicane, l'ostentation et l'écrasement de l'adversaire ; elle est permise en cas de besoin avec l'intention d'équité et de manifester la vérité."]],["p","Quant à l'astronomie dont le musulman a besoin pour connaître les heures de prière et la qibla, elle est permise ou utile dans la mesure du besoin ; ce qui va jusqu'à prétendre connaître l'invisible est interdit."],["h","La médecine, les causes et la confiance en Dieu"],["p","La méthode divise les causes en :"],["ul",["<b>Certaines :</b> comme l'eau pour la soif et la nourriture pour la faim ; les délaisser par crainte de la mort peut être illicite.","<b>Probables :</b> comme le médicament, la hijâma et la saignée ; y recourir ne contredit pas la confiance en Dieu si le musulman croit que c'est Dieu qui guérit.","<b>Illusoires :</b> comme les causes superstitieuses ou sans preuve ; renoncer à s'y attacher est ce qu'exige la confiance en Dieu."]],["p","La confiance en Dieu ne signifie pas délaisser toute cause, mais que le cœur ne croie pas que la cause agit indépendamment de Dieu."]]},{"t":"Section trois : la piété (taqwa)","b":[["h","Le sens de la taqwa et son mérite"],["p","La taqwa vient de « protection » : que le serviteur place entre lui et la colère et le châtiment de Dieu une protection, en Lui obéissant et en délaissant la désobéissance. Elle a un sens général : se préserver de tout ce qui nuit dans l'au-delà ; et un sens particulier : éviter toute parole, tout acte ou toute omission qui mérite le châtiment."],["p","La taqwa ne s'accomplit pas par le seul fait de délaisser certaines choses permises ou d'être rigoriste dans la purification ; elle comprend :"],["ul",["La validité de la croyance.","L'accomplissement des obligations et des devoirs.","Le délaissement des interdits et des innovations.","La réforme du cœur, de la langue et des membres.","L'accomplissement des droits des gens et des animaux."]],["h","Les fondements de la réforme du caractère"],["p","La méthode rattache le caractère à trois facultés :"],["ul",["<b>La raison et la parole :</b> son équilibre est la sagesse, son excès la ruse et la fourberie, et son défaut la stupidité.","<b>La colère :</b> son équilibre est le courage, son excès la témérité, et son défaut la lâcheté.","<b>Le désir :</b> son équilibre est la chasteté, et son excès la voracité et la débauche."]],["p","La manière de soigner un trait blâmable :"],["ol",["Connaître la réalité de la maladie, ses causes et ses méfaits.","S'examiner et rechercher les signes de la maladie.","Supprimer la cause qui y mène.","Pratiquer le trait opposé jusqu'à ce que la vertu devienne une disposition établie.","Accepter le conseil des gens sincères.","Se rappeler les textes de menace concernant le vice et les textes d'éloge concernant la vertu.","Lutter contre l'âme progressivement, et non par des élans passagers.","Fréquenter les gens de science et de vertu, et quitter la compagnie corruptrice."]]]},{"t":"Les maux du cœur","b":[["p","La méthode comprend <b>soixante maux du cœur</b>, et explique pour chacun son sens, ses méfaits et son remède. Voici la liste complète et ordonnée, en conservant les titres d'où découlent des développements thérapeutiques ou des applications pratiques :"],["h","Premièrement : maux de la croyance, de l'intention et de la connaissance"],["dl",[["1. La mécréance envers Dieu","Parmi ses types : la mécréance d'ignorance, la mécréance de négation et d'obstination, et la mécréance par jugement légal ; c'est le plus grand des facteurs de perdition."],["2. L'ignorance","Elle comprend l'ignorance simple, qui est l'absence de savoir, et l'ignorance composée, qui est de croire que le faux est science et vérité."],["3. L'amour du pouvoir et du prestige mondain","Chercher à posséder les cœurs des gens et s'attacher au rang et à la célébrité, sauf ce qui vise à soutenir la vérité ou à réformer les gens sans ostentation."],["4. La crainte du blâme et du reproche","Délaisser la vérité ou la taire par crainte des paroles et des reproches des gens."],["5. L'amour de la louange et de l'éloge","Se réjouir de l'éloge des gens et le rechercher ; son remède est de se rappeler que ce qui profite est l'acceptation de Dieu, non l'admiration des créatures."],["6. La croyance innovée","Instaurer une croyance ou une adoration sans fondement, ou faire passer les coutumes et les goûts avant la Sunna."],["7. Suivre la passion","Faire du désir personnel le juge du texte et de la vérité ; son remède est la lutte contre l'âme et le suivi de la guidance."],["8. L'imitation aveugle en matière de croyance","Accepter une croyance sans preuve alors qu'on est capable de réfléchir — en distinguant cela du non-mujtahid qui suit un savant dans les règles pratiques."],["9. L'ostentation (riyâ')","Agir pour être vu et loué des gens ; elle comprend l'ostentation apparente et cachée, et son contraire est la sincérité."],["10. L'espoir et le long espoir","Retarder le repentir et l'action en comptant sur une longue vie ; son remède est le rappel de la mort et la réduction de l'espoir."],["11. La convoitise","L'attachement du cœur à ce qui est entre les mains des gens ou à ce qu'il ne possède pas ; son contraire est le contentement et la confiance en Dieu."],["12. L'orgueil","Se voir au-dessus de la vérité ou des gens ; parmi ses remèdes : accepter la vérité, l'humilité, et connaître l'origine et la fin de l'homme."],["13. La flagornerie et la flatterie","S'efforcer artificiellement de gagner l'approbation et l'éloge des gens et de s'insinuer auprès d'eux, d'une manière qui corrompt la sincérité et la dignité."],["14. L'autosatisfaction ('ujb)","S'admirer soi-même, ses œuvres ou son savoir, en oubliant la grâce de Dieu."]]],["h","Deuxièmement : maux de l'envie, de la colère et de l'inimitié"],["dl",[["15. L'envie","Souhaiter la disparition du bienfait d'autrui ; son remède est de se rappeler que les bienfaits sont une répartition de Dieu, de souhaiter le bien à l'envié et d'agir à l'opposé de ce à quoi pousse l'envie."],["16. La rancune","La persistance de l'inimitié dans le cœur dans l'attente d'une occasion de vengeance ; son remède est le pardon et la suppression des causes de la colère."],["17. La joie maligne","Se réjouir du malheur d'un musulman ; son remède est la miséricorde et le rappel de la versatilité des situations."],["18. La rupture et l'inimitié","Couper les liens et nourrir la haine sans droit ; son contraire est la réconciliation, le pardon et le maintien des liens de parenté."],["19. La lâcheté","La faiblesse du cœur face à la vérité ou à ce qu'il faut repousser ; son contraire est le courage réglé par la sagesse."],["20. La témérité","S'élancer sans vérification ni évaluation des conséquences ; son contraire est la vérification et l'audace maîtrisée."],["21. La perfidie","Rompre un pacte ou un engagement sans avertissement ou raison légale ; son contraire est le respect et l'accomplissement des engagements."],["22. La trahison","Manquer au dépôt dans la parole, l'argent, le conseil ou le travail ; son contraire est la loyauté."],["23. Le manquement à la promesse","Promettre avec l'intention de ne pas tenir, ou ne pas tenir sans excuse ; son contraire est d'accomplir la promesse et d'honorer l'engagement."],["24. Penser du mal de Dieu et des croyants sur une simple illusion ou un doute","C'est interdit lorsque cela mène à accuser un musulman ou à parler de lui ; la prudence fondée sur des indices sérieux n'est pas un soupçon interdit."],["25. La superstition (tiyara)","Voir de mauvais présages dans les personnes, les jours, les sons et les événements ; son contraire est le bon augure qui n'implique ni prétention à l'invisible ni jugement sur l'avenir."]]],["h","Troisièmement : maux de l'argent, de la vie d'ici-bas et du travail"],["dl",[["26. L'avarice et la parcimonie","Retenir l'argent là où il faut le dépenser selon la Loi ou la décence ; l'une de ses pires formes est de se priver de nourriture, de vêtements et de soins en cas de besoin."],["27. L'excès et le gaspillage","Dépenser l'argent là où il faut le retenir, ou dépasser la modération dans la nourriture, l'habillement, l'aumône et les autres dépenses."],["28. L'amour de l'argent","L'attachement du cœur à l'argent pour lui-même ou en faire un but, alors que l'argent est un moyen de s'acquitter des droits et de dépenser licitement."],["29. L'amour de ce bas monde","Préférer ce monde à l'au-delà, s'absorber dans ses jouissances et oublier sa destinée."],["30. L'avidité blâmable","Un attachement intense à l'argent, au prestige et aux avantages, au point d'engendrer l'injustice, l'abandon de l'adoration ou l'avilissement de soi."],["31. La sottise","La légèreté d'esprit, la mauvaise conduite, et le fait de ne pas mettre l'argent, la parole ou l'acte à leur juste place."],["32. La paresse et l'oisiveté","Délaisser le travail utile et les devoirs alors qu'on en est capable, se laisser aller au repos et gaspiller ses énergies."],["33. La précipitation","Agir avant de vérifier, et prononcer un jugement ou accomplir un acte avant d'avoir bien réfléchi."],["34. Le retard et la procrastination","Remettre à plus tard le repentir, le devoir et l'œuvre utile jusqu'à ce que leur temps passe."],["35. La rudesse et la dureté du cœur","La brutalité dans les rapports, le manque de miséricorde et l'incapacité à supporter les gens ; son contraire est la mansuétude, la douceur et la bienveillance."]]],["p","Le juste milieu dans l'argent est la générosité sans gaspillage, l'économie sans avarice, le gain licite sans s'y absorber, et l'aumône sans négliger les droits de soi-même, de la famille et de la religion. L'excès se soigne par la science — connaître ses méfaits ; par la pratique — maîtriser les dépenses ; et par le déracinement — supprimer ses causes comme l'ostentation, la sottise et la mauvaise compagnie."],["h","Quatrièmement : maux de la résolution, du contentement et des relations"],["dl",[["36. L'impudence et la perte de la pudeur","L'audace dans le laid, ne pas trouver le péché répugnant et ne pas s'excuser de ses fautes."],["37. L'impatience et la plainte","L'objection du cœur et de la langue contre l'épreuve d'une manière qui contredit la patience — la plainte à Dieu et la demande de Son aide restant permises."],["38. L'ingratitude envers les bienfaits","Oublier le Bienfaiteur, attribuer le bienfait à soi-même ou aux seuls gens, et ne pas l'employer dans ce qui plaît à Dieu."],["39. Le mécontentement de ne pas obtenir ce que l'on veut","Le ressentiment et l'agitation lorsque l'on manque ce que l'âme désire ; son contraire est l'agrément du décret de Dieu tout en recourant aux moyens licites."],["40. L'attachement à autre que Dieu","Le cœur qui s'appuie sur une créature, une cause ou une illusion, en oubliant que le bien et le mal sont dans la main de Dieu ; il faut recourir aux causes avec confiance en Dieu."],["41. L'amour des pervers et le penchant vers les oppresseurs","Les aimer, les flatter ou s'appuyer sur eux dans l'injustice et le faux — en distinguant entre désapprouver leurs actes et être juste envers eux."],["42. La haine des savants et des vertueux","Détester les gens de science et de droiture par envie, par fanatisme ou parce qu'ils contredisent la passion."],["43. L'audace envers Dieu et le sentiment de sécurité face à Son châtiment et à Sa colère","Persister dans le péché tout en se sentant à l'abri de la punition."],["44. Le désespoir de la miséricorde de Dieu","Croire qu'un péché ne sera pas pardonné ou que le repentir ne sert à rien ; son contraire est d'unir la crainte et l'espérance."],["45. La tristesse pour les affaires de ce monde","La tristesse qui envahit le cœur pour une jouissance passagère manquée, au point de l'affaiblir pour la religion et le devoir."],["46. La peur pour les affaires de ce monde","La peur excessive de la pauvreté, des gens ou de l'avenir, au point d'empêcher la vérité ou de faire tomber dans l'interdit."],["47. La tromperie et la rancœur","Ne pas donner un conseil sincère, cacher un défaut ou duper autrui ; cela inclut la fraude, la duperie et la ruse — la ruse à la guerre ou pour repousser une injustice méritée ayant un autre statut."],["48. La sédition (fitna)","Jeter les gens dans le trouble, la querelle et le combat, ou détourner les paroles de leur sens et inciter les gens à l'agression, à la rébellion et au malheur."],["49. La complaisance coupable (mudâhana)","Ne pas désapprouver le faux, ou l'embellir, pour plaire aux gens ou par crainte pour son prestige — à la différence de la courtoisie permise (mudârâ), qui préserve la vérité et ne justifie pas le faux."],["50. L'attachement excessif aux gens et la solitude à leur départ","L'attachement du cœur aux créatures au point d'affaiblir son attachement à Dieu ; son contraire est une bonne compagnie avec un cœur indépendant par Dieu."],["51. L'étourderie et la légèreté","Le manque de pondération, l'emportement rapide et l'action sans sagesse."],["52. L'obstination, l'arrogance face à la vérité et sa négation après l'avoir connue","Rejeter la vérité non parce qu'elle est cachée, mais parce qu'elle contredit la passion ou pour préserver son rang."],["53. La rébellion et le refus","Refuser de se soumettre à la vérité et à l'ordre légitime par orgueil ou par amour de l'indépendance."],["54. La morgue","Se donner de l'importance, s'enorgueillir, afficher sa supériorité et mépriser les gens."],["55. L'hypocrisie","Montrer le bien et cacher le mal, ou la différence entre l'extérieur et l'intérieur ; elle comprend l'hypocrisie de croyance et l'hypocrisie d'action."],["56. La rudesse et la cruauté","Le manque de miséricorde et l'insensibilité à l'exhortation ou aux souffrances des gens ; son contraire est la douceur et la miséricorde."],["57. La stupidité et la bêtise","La faiblesse de compréhension, le manque de perspicacité ou le fait d'empêcher l'intelligence d'apprendre et de réfléchir."],["58. La voracité envers la nourriture et les rapports charnels","Dépasser la limite du besoin et se laisser mener par le désir au point d'affaiblir l'adoration, la chasteté et la santé."],["59. L'apathie","La faiblesse de la résolution, le relâchement dans le bien et le fait de ne pas s'empresser vers les actes d'obéissance et les choses utiles."],["60. La persistance dans les péchés et les divertissements futiles","Répéter le péché sans se repentir, et continuer dans le divertissement et ce qui détourne des devoirs et affaiblit le cœur."]]],["h","La règle générale pour soigner les maux du cœur"],["p","Chaque maladie se soigne en connaissant sa réalité et ses méfaits, puis en coupant ses causes et en pratiquant le trait opposé jusqu'à ce qu'il devienne une disposition établie : l'orgueil se soigne par l'humilité, l'avarice par la générosité, la lâcheté par le courage, la colère par la mansuétude, l'envie par le bon conseil et l'amour, l'ostentation par la sincérité, le long espoir par le rappel de la mort, le désespoir par la bonne opinion de Dieu, et la voracité par la chasteté et la modération. La méthode mentionne ensuite les fondements des vertus, comme la sagesse, le courage, la chasteté et la justice, et montre que les vertus sont des dispositions qui apparaissent dans les rapports, la dépense, la patience, la véracité et l'accomplissement des droits."]]},{"t":"Les maux de la langue","b":[["p","La méthode fait de la langue l'une des portes les plus dangereuses de la taqwa, car une parole peut démolir une croyance, léser une personne, gâter une relation ou déclencher une sédition. Parmi les maux de la langue qu'elle détaille :"],["ul",["La parole de mécréance et ce qui s'en approche.","L'erreur, le mensonge et l'invention contre Dieu et Son Messager.","Promettre avec l'intention de ne pas tenir, et rapporter tout ce que l'on entend.","L'allusion corruptrice.","La médisance, la calomnie colportée, la diffamation, le reproche, la moquerie, l'insulte, l'obscénité et la malédiction.","Les lamentations sur les morts, la divulgation des secrets et le fait de s'engager dans le faux.","La querelle, la dispute, la chicane et l'affectation dans la parole.","Interroger le commun sur des subtilités qui l'égarent ou le troublent.","Chercher l'argent et le prestige par des paroles avilissantes.","L'hypocrisie verbale et le double langage.","La mauvaise intercession, ordonner le mal et interdire le bien.","La dureté de la parole et l'atteinte à l'honneur des gens.","S'enquérir des défauts des gens et les rechercher.","Parler pendant l'appel à la prière et l'iqâma, pendant la prière, pendant le sermon, aux toilettes, pendant les rapports conjugaux, pendant la récitation du Coran, et dans les mosquées sans besoin.","Invoquer contre un musulman ou invoquer en faveur d'un oppresseur.","Interrompre autrui, et le subordonné qui réplique à son supérieur sans droit.","Deux personnes qui se parlent en aparté en présence d'une troisième si cela l'attriste.","Parler avec une femme étrangère sans besoin.","Indiquer le chemin du péché ou l'autoriser."]],["p","En contrepartie, elle mentionne les maux du silence : ne pas saluer, ne pas rendre le salut, ne pas répondre à celui qui éternue, ne pas conseiller, ne pas secourir l'opprimé ou celui qui appelle à l'aide en en étant capable, et ne pas interdire le blâmable lorsque ses conditions sont réunies. Le silence n'est pas une vertu absolue ; la vertu est de parler là où il faut parler et de se taire là où il faut se taire."],["p","Parmi les paroles permises ou recommandées sous conditions : la plaisanterie exempte de mensonge et d'effroi, l'éloge exempt d'exagération et d'ostentation, la poésie exempte d'interdit, la prose rimée et l'éloquence lorsqu'elles ne sont pas affectées, et la parole sur les intérêts de la religion et du monde."]]},{"t":"Les maux de l'ouïe, de la vue, de la main, du ventre, du sexe, du pied et du corps","b":[["h","Les maux de l'oreille"],["ul",["Écouter la médisance, la calomnie, le mensonge et le faux.","Écouter le chant, les divertissements et les mélodies que la méthode réprouve.","Écouter des paroles qui excitent le désir ou la sédition.","Écouter le Coran ou le dhikr d'une manière qui en altère le sens ou en fait un divertissement et une danse.","Délaisser l'écoute obligatoire de la science, de l'exhortation et du conseil."]],["p","La méthode met en garde contre la danse soufie accompagnée de cris, de chant et de confusion, et affirme que le dhikr debout et assis est permis s'il se fait avec bienséance et calme, sans mélodie qui altère les mots et sans divertissement."],["h","Les maux de l'œil"],["ul",["Regarder les parties intimes ('awra).","Regarder avec désir une femme étrangère.","Regarder ce qui excite la tentation ou aide au péché.","Regarder dans les maisons des gens ou leurs secrets."]],["p","Elle mentionne des exceptions pour le besoin, comme recevoir et rendre un témoignage, le jugement du juge, la sage-femme lors de l'accouchement, la vérification d'un défaut, la circoncision, les soins médicaux, et l'intention de mariage ou d'achat ; le critère est la mesure du besoin sans la dépasser."],["h","Les maux de la main"],["ul",["Tuer, blesser et frapper sans droit.","L'usurpation, le vol et la corruption.","Prendre un bien usurpé ou détruire le bien d'autrui.","Aider l'oppresseur, ou s'abstenir de corriger le blâmable en en étant capable.","La représentation figurative que la méthode considère comme incluse dans l'interdiction.","Jouer avec ce qui nuit à l'homme ou à l'animal.","Utiliser la main pour nuire ou agresser les gens."]],["h","Les maux du ventre et les règles de bienséance du manger et du boire"],["ul",["Faire entrer l'illicite dans le ventre.","Manger au-delà du besoin et la satiété excessive.","Manger ce qui nuit au corps.","Délaisser la nourriture et la boisson au point de s'affaiblir pour les obligations ou la prière en commun.","Le gaspillage de la nourriture et son gâchis."]],["p","Parmi les règles qu'elle mentionne : prononcer le nom de Dieu, manger de la main droite, manger de ce qui est devant soi, ne pas manger du milieu du plat s'il est d'une seule sorte, ne pas souffler dans la boisson ni respirer dans le récipient, servir celui de droite, et ne pas utiliser de récipients d'or et d'argent pour manger et boire, selon le détail juridique."],["h","Les maux du sexe"],["p","La méthode détaille la fornication, la sodomie et la bestialité, les rapports avec une femme en menstrues ou en lochies de la manière interdite, la jouissance illicite, les rapports nuisibles ou avant la période d'attente, et ce qui concerne la préservation de la 'awra et les règles de bienséance dans l'intimité et pour satisfaire ses besoins."],["h","Les maux du pied"],["ul",["Se rendre aux assemblées de péché pour le commettre ou y assister.","Voyager ou sortir d'une manière qui nuit aux parents ou néglige leurs droits.","Entrer dans la terre ou la maison d'autrui sans permission, sauf nécessité ou permission coutumière.","Marcher sur les tombes ou entrer dans les lieux saints sans bienséance.","Enjamber les gens le vendredi.","Rester à l'écart de la prière du vendredi, de la prière en commun, de l'apprentissage et de l'enseignement, du hajj et du jihad lorsqu'ils deviennent une obligation individuelle.","Se rendre auprès des gouvernants et des oppresseurs pour obtenir des biens de ce monde ou les aider dans leur injustice.","Arriver chez sa famille à l'improviste après un long voyage."]],["h","Les maux généraux du corps et les droits des gens"],["p","La méthode développe les droits sociaux et familiaux, dont :"],["ul",["La désobéissance aux parents — en soulignant qu'il n'y a pas d'obéissance à une créature dans la désobéissance au Créateur, et que la bonté envers les parents et leur service sont obligatoires même s'ils sont mécréants, tant que le musulman ne craint pas pour sa religion.","La rupture des liens de parenté ; le minimum pour les maintenir est le salut ou l'envoi du salut, et cela s'accroît par la visite, l'aide et les cadeaux.","Nuire à son épouse ou à son mari, et ne pas respecter les droits mutuels.","Négliger les enfants et ceux dont on a la charge, et ne pas les instruire ni les éduquer.","Opprimer les serviteurs ou les charger au-delà de leurs capacités, et ne pas les nourrir, les vêtir et leur enseigner ce qui leur est nécessaire.","Nuire au voisin, et ne pas l'aider, le visiter ou le réconforter.","Choisir une mauvaise compagnie ; l'homme est influencé par son ami intime.","S'asseoir dans la rue sans respecter le droit de la rue, ou entre l'ombre et le soleil, ou au milieu d'un cercle sans permission.","Bâiller sans couvrir la bouche, s'incliner en saluant, et faire lever quelqu'un de sa place sans droit.","La magie, les amulettes, la divination, le tatouage, l'épilation des sourcils, l'écartement des dents et l'imitation entre hommes et femmes.","Arracher les cheveux blancs ou changer son apparence par ostentation, et laisser pousser la barbe et tailler la moustache selon ce que la méthode établit.","Le voyage de la femme sans mahram, selon les détails et les récits qu'elle présente.","Délaisser la prière, la prière du vendredi, le jeûne, le hajj ou le jihad lorsqu'ils sont obligatoires, et fuir le champ de bataille.","L'usure, l'accaparement, la vente 'îna, la fraude, l'achat auprès de celui qui est contraint et le fait de disposer du bien d'autrui sans son consentement.","Posséder un chien sans besoin valable, allumer des bougies sur les tombes, y construire des mosquées, et faire des tombes des lieux de divertissement ou de rites.","Le luxe et l'habillement par orgueil, l'allongement du vêtement par vanité, et le gaspillage dans la parure."]]]},{"t":"Chapitre trois : choses que l'on croit relever de la piété et du scrupule","b":[["p","Ce chapitre est parmi les plus importants de la Voie muhammadienne, car il montre que certaines personnes délaissent des sunnas et des devoirs ou paralysent leur vie à cause d'un scrupule apparent et de doutes obsessionnels (waswasa) sans fondement."],["h","Section un : le scrupule excessif en matière de pureté et d'impureté"],["h","A. Les formes d'excès"],["ul",["L'excès dans le nombre de lavages.","Juger l'eau ou un vêtement impur sur un simple doute.","Refaire les ablutions et la prière de nombreuses fois.","La recherche exagérée de l'impureté.","Délaisser la prière en commun ou retarder la prière à cause de possibilités imaginaires.","Gaspiller l'eau et le temps au nom du scrupule.","Interroger sans cesse les gens sur la pureté des choses, alors que le principe est la pureté."]],["h","B. Les règles juridiques"],["ul",["Le principe dans les choses est la pureté et la licéité jusqu'à preuve du contraire.","La certitude n'est pas levée par le doute.","L'eau est purifiante tant que sa couleur, son goût ou son odeur n'est pas altéré par une impureté, en présentant les détails des écoles.","Il est permis d'utiliser les récipients des Gens du Livre tant que leur impureté n'est pas connue.","La prière avec les sandales est permise lorsque leur pureté est avérée.","On ne délaisse pas l'état apparent pour une illusion."]],["p","La méthode présente les positions des zahirites, des malikites, des chafiites et des hanafites sur l'eau et l'impureté, et mentionne des détails sur les puits, les récipients, le pain, la nourriture mêlée d'impureté, les chaussettes de cuir et le bain rituel, pour affirmer que la jurisprudence ne se construit pas sur les doutes obsessionnels."],["h","C. Soigner les doutes obsessionnels (waswasa)"],["ul",["Apprendre les règles de la purification auprès d'un savant digne de confiance.","Prendre la facilité et la largesse lorsque les doutes s'intensifient, jusqu'à ce qu'ils disparaissent.","Ne pas refaire la prière et les ablutions sur un simple doute.","Persévérer dans la prière en commun, le dhikr et la récitation.","Asperger parfois d'eau le corps après les ablutions pour chasser l'illusion d'une humidité impure.","Ne pas se laisser aller à l'illusion, et passer à l'action suivante.","Se rappeler que les Salaf ne s'imposaient pas ces subtilités imaginaires."]],["h","Section deux : le scrupule envers la nourriture des fondations pieuses et du trésor public"],["p","La méthode discute du scrupule concernant les biens mélangés, notamment la nourriture des fondations pieuses (awqâf) et du trésor public, et affirme que le jugement ne se fonde pas sur un doute général, mais sur la connaissance de la présence de l'illicite dans l'objet précis. Le musulman ne délaisse donc pas des droits et intérêts permis sur une simple illusion, de même qu'il ne consomme pas un bien dont l'usurpation, le vol ou le détournement est avéré."],["p","La balance est :"],["ul",["Connaître la source de l'argent dans la mesure du possible.","Agir selon une fatwa fiable qui tient compte de la réalité.","Délaisser l'illicite certain.","Ne pas transformer le scrupule en paralysie de la subsistance ou en accusation des gens sans preuve."]],["h","Section trois : des innovations que les gens croient être des actes de piété"],["p","La méthode conclut en mettant en garde contre des choses innovées que les gens croient être des adorations, notamment ce qui concerne les tombes, les fondations pieuses et la récitation pour les morts selon des formes dont le fondement n'est pas établi à ses yeux, la construction de manifestations religieuses sans preuve, et l'adoption de rites collectifs, de mélodies ou de danses au nom du dhikr."],["p","La règle générale de ce chapitre : <b>tout ce par quoi son auteur vise le bien n'est pas un acte de piété ; l'acte de piété est ce que Dieu et Son Messager ont légiféré, et ce qui n'a pas été légiféré ne devient pas adoration par la seule bonne intention.</b>"]]},{"t":"Les traits de la méthode thérapeutique dans la Voie muhammadienne","b":[["p","La méthode soigne les maladies de la religion, de l'âme et des membres selon un plan récurrent :"],["ol",["<b>La définition :</b> expliquer le sens de la maladie ou de l'acte, linguistiquement et légalement.","<b>L'exposé des méfaits :</b> ce qui en résulte dans le cœur, la religion, ce monde et l'au-delà.","<b>La mention du contraire :</b> montrer que le contraire de l'orgueil est l'humilité, celui de l'envie le bon conseil et l'amour, celui de l'avarice la générosité, et celui de la précipitation la vérification.","<b>L'argumentation :</b> citer les versets, les hadiths, les récits et les paroles des juristes.","<b>Le diagnostic :</b> connaître les causes de la maladie, comme l'ignorance, l'ostentation, la mauvaise compagnie et la faiblesse de la certitude.","<b>Le traitement par la science :</b> l'apprentissage, la réflexion et la connaissance des textes.","<b>Le traitement pratique :</b> astreindre l'âme aux actes vertueux jusqu'à ce qu'ils deviennent une habitude.","<b>Le traitement par déracinement :</b> couper les causes et les environnements qui font revenir la maladie.","<b>L'examen de conscience :</b> revoir l'intention, l'action et les résultats.","<b>La compagnie :</b> fréquenter les savants et les vertueux, et quitter les gens des passions.","<b>La progressivité :</b> ne pas passer à un nouvel excès au nom du traitement de l'ancien.","<b>La persévérance :</b> ce qui compte est la constance et la conformité à la Sunna, non l'élan passager."]]]},{"t":"Résumé concentré de la Voie muhammadienne","b":[["p","Toute la méthode peut se résumer dans cette formule :"],["p","<b>Connais le monothéisme, apprends la règle, suis le texte, prends exemple sur le Prophète ﷺ, délaisse l'innovation et la passion, adore Dieu avec modération, préserve ton cœur, ta langue et tes membres, acquitte-toi des droits des gens, et ne laisse pas le scrupule imaginaire te couper des obligations et d'une vie utile.</b>"],["p","Les signes de la sincérité du cheminant sur cette Voie :"],["ul",["Que sa croyance soit saine et non fondée sur la superstition.","Que son adoration soit conforme à la Sunna et non à l'exagération personnelle.","Qu'il soit humble et ne se laisse pas griser par un prodige, un dévoilement ou un grand nombre de disciples.","Qu'il préserve les obligations et les droits des parents, du conjoint, des enfants et des voisins.","Qu'il mange, boive et s'habille du licite sans excès ni avarice.","Qu'il surveille sa langue, son ouïe, sa vue, sa main, son ventre, son sexe et son pied.","Qu'il recherche la science dont il a besoin, et évite la dispute et les sciences qui mènent aux doutes.","Qu'il recoure aux causes tout en ayant le cœur confiant en Dieu.","Qu'il distingue entre la vraie taqwa et le doute obsessionnel, et entre le scrupule légitime et le rigorisme innové.","Que le fruit de sa voie soit miséricorde, véracité, loyauté, bon caractère et utilité pour les gens."]]]},{"t":"Conclusion","b":[["p","La Voie muhammadienne est, dans son essence, un projet de réforme global : elle part de la croyance, passe par la science, l'adoration et la purification de l'âme, puis atteint les détails de la parole, de la nourriture, du commerce, de la famille, du voisinage et des droits publics. C'est pourquoi « la Voie muhammadienne » n'est pas une apparence spirituelle séparée de la Loi, mais <b>la reconstruction de toute la vie du musulman sur l'imitation du Prophète ﷺ, en unissant la justesse de la croyance, la justesse de la pratique et la justesse du caractère</b>."],["p","La balance qui revient dans tous les chapitres de la Voie est : <b>le Livre de Dieu, la Sunna de Son Messager, la compréhension des Salaf, la science de la jurisprudence, le délaissement de l'excès et de la négligence, et la réalisation de la taqwa dans le cœur, les membres et les droits d'autrui.</b>"]]}]},"es":{"title":"La Vía Muhammadiana","sub":"Una presentación completa de sus fundamentos, pilares, capítulos y cuestiones prácticas","note":"<b>Nota metodológica:</b> esta es una presentación general de la Vía Muhammadiana, que abarca sus fundamentos, pilares y ámbitos prácticos. En las cuestiones de jurisprudencia y de credo en las que hay divergencia, conviene remitirse a los sabios reconocidos, y verificar la autenticidad de los hadices y relatos antes de usarlos como prueba.","secs":[{"t":"Primero: definición de la Vía Muhammadiana y su finalidad general","b":[["p","<b>La Vía Muhammadiana</b> no es el nombre de una cofradía sufí basada en letanías particulares o en la afiliación a un jeque concreto; es el nombre del método islámico integral sobre el que descansan la salvación y la rectitud del musulmán: <b>un credo sano, una adoración conforme a la Sunna, y una moral y conducta regidas por el Libro y la Sunna, evitando el exceso, la negligencia y las innovaciones</b>."],["p","La biografía profética es la aplicación práctica de este método en la vida del Profeta ﷺ: sus creencias, palabras, actos, carácter, adoración y trato con la gente. El objetivo es que el caminante contraste su práctica con esta biografía, para saber si acierta y sigue el modelo, o si se equivoca e innova. Por eso la práctica de cada caminante se mide con este método, para distinguir al que acierta del que se equivoca, y al que se salva del que se pierde."],["p","Este método surgió en respuesta a la situación de dos grupos opuestos:"],["ul",["<b>Devotos ignorantes:</b> multiplican las formas de adoración y los ejercicios espirituales, pero ignoran los límites de la Ley, y así caen en la innovación y el exceso.","<b>Sabios o estudiantes descuidados:</b> tienen conocimiento o se atribuyen la ciencia, pero descuidan la práctica, y la vida mundana y las pasiones los dominan."]],["p","Este método devuelve al musulmán al <b>punto medio entre el exceso y la negligencia</b>, y a la referencia decisiva: el Corán, la Sunna y la comprensión de los Salaf; no las costumbres, ni los gustos personales, ni las pretensiones esotéricas, ni la mera abundancia de adoración."]]},{"t":"Segundo: los tres pilares de la Vía Muhammadiana","b":[["p","La Vía Muhammadiana se basa en tres grandes capítulos, que son los pilares del método:"],["h","1. Aferrarse al Libro y a la Sunna"],["p","El Corán es la fuente de la guía, la curación y la luz, y la balanza a la que se remiten el credo, la adoración y la conducta. La Sunna no es un añadido del que se pueda prescindir; es la explicación del Corán, y contiene las órdenes y prohibiciones del Profeta ﷺ y sus detalles prácticos."],["p","Este aferrarse incluye:"],["ul",["Venerar el Corán, recitarlo, comprenderlo y obrar según él, sin limitarse a la recitación oral.","Aceptar la Sunna auténtica aunque no coincida con las costumbres de la gente o con una opinión particular de escuela.","Seguir la Sunna del Profeta ﷺ, la de los califas bien guiados y la comprensión de los Compañeros.","Rechazar toda opinión, gusto, desvelamiento o costumbre que contradiga un texto auténtico o un dictamen legal establecido.","Recurrir a sabios fiables en caso de duda, y no tomar la religión de los ignorantes ni de la gente de vanas pretensiones."]],["h","2. Guardarse de las malas costumbres y de las innovaciones"],["p","No basta con pretender amar la Sunna; hay que abandonar lo que compite con ella entre costumbres corruptas e innovaciones en el credo, la adoración o la moral. Entre los principios del método: la innovación puede corromper la Sunna que le corresponde, y la gente puede sustituir la guía profética por nuevas apariencias que cree actos de devoción."],["p","Pero el método distingue entre:"],["ul",["<b>La novedad en sentido lingüístico general:</b> todo lo nuevo después de la primera generación, ya sea una costumbre o un medio útil.","<b>La innovación reprobable en sentido legal:</b> añadir a la religión o quitarle, o instaurar una creencia o una adoración sin permiso del Legislador, sobre todo si contradice un texto o una Sunna establecida."]],["p","Ejemplos de medios nuevos que no son en sí innovaciones reprobables: las escuelas, la redacción de libros, la construcción de alminares para anunciar la hora de la oración y la organización de pruebas para refutar a los ateos; porque son medios al servicio de un fin legítimo que no contradicen ningún principio."],["h","3. La moderación en las obras y el punto medio"],["p","La adoración no consiste en la penalidad por sí misma, ni en atormentarse, sino en conformarse a la Ley y realizar la servidumbre a Dios. La moderación significa:"],["ul",["Cumplir primero las obligaciones y los deberes.","Mantener las sunnas sin exceso.","Respetar el derecho del cuerpo, de la familia, del cónyuge, de los hijos y de la gente.","Aceptar las facilidades que Dios ha legislado cuando hay necesidad.","No ayunar perpetuamente, ni rezar toda la noche, ni abandonar el matrimonio y las cosas buenas de un modo que rebaje la Sunna del Profeta ﷺ.","No abandonar el trabajo, el sustento y el servicio a la gente con el pretexto de dedicarse a la adoración.","Hacer que la adoración sea constante y estable, no un entusiasmo pasajero que se apaga a los pocos días."]]]},{"t":"Tercero: ¿cómo realiza el musulmán la Vía Muhammadiana?","b":[["p","El método muhammadiano puede convertirse en una balanza práctica de diez pasos:"],["ol",["<b>Corregir el credo:</b> aprender los fundamentos del monoteísmo, la fe, la profecía, la otra vida y el decreto divino a partir del Libro y la Sunna.","<b>Conocer la ciencia de tu estado:</b> aprender lo que necesitas para la oración, la purificación, el ayuno, el zakat, las transacciones, la familia y el trabajo.","<b>Contrastar la práctica con el texto:</b> pregunta por la prueba de la creencia, la adoración o la conducta, y no hagas del gusto o del sueño una prueba independiente.","<b>Volver a la Sunna auténtica:</b> no basta con que exista un relato en un libro; hay que tener en cuenta su autenticidad, su comprensión y la reunión de sus cadenas.","<b>La comprensión de los Compañeros y los Salaf:</b> porque ellos conocían mejor la intención del texto y la manera de aplicarlo.","<b>Examinar la consecuencia:</b> ¿conduce el acto a abandonar una obligación, perjudicar a una persona, destruirse a uno mismo o corromper el credo? Si es así, no es una vía muhammadiana.","<b>Rechazar el desvelamiento contrario:</b> la inspiración, el sueño y el prodigio pueden ocurrir, pero no establecen ningún dictamen legal, ni hacen lícito lo ilícito, ni prohíben lo lícito.","<b>Lograr el equilibrio:</b> une la adoración y el sustento, el retiro y el trato con la gente, el temor y la esperanza, el recurso a los medios y la confianza en Dios.","<b>Observar el fruto:</b> el signo de una vía sana es el aumento de la fe, la obediencia, la humildad, el buen carácter y la misericordia; no la autocomplacencia, la soberbia y el desprecio de la gente.","<b>El examen de conciencia continuo:</b> revisa el corazón, la lengua y los miembros, y trata cada defecto con su contrario, con la buena compañía, la ciencia y la práctica."]],["p","<b>En resumen:</b> la Vía Muhammadiana no se realiza con muchas letanías o pretensiones, sino con la conformidad de lo exterior y lo interior al Libro y la Sunna, visible en el credo, la adoración, la moral y los derechos de los demás."]]},{"t":"Mapa detallado de la Vía","b":[["h","Introducción a la Vía Muhammadiana"],["p","La Vía Muhammadiana reúne el credo, la jurisprudencia, la renuncia, la adoración, la conducta, las enfermedades de los corazones y la refutación de las innovaciones; por eso es un método de reforma integral que no se limita a un solo aspecto de la vida del musulmán."],["p","Entre las características de este método:"],["ul",["Suele comenzar con los versículos, luego los hadices y relatos, y después las palabras de los juristas y los Salaf.","Explica los términos lingüísticos y legales.","Tiene en cuenta la divergencia jurídica y concilia los textos con las reglas de deducción.","Convierte la prueba en un dictamen práctico y en una conducta aplicable.","Orienta al caminante hacia la práctica y el examen de conciencia.","Refuta las opiniones y pretensiones contrarias con pruebas y reglas legales."]],["p","En las cuestiones de credo y jurisprudencia en las que los sabios han divergido, hay que distinguir entre los fundamentos categóricos y las cuestiones de esfuerzo interpretativo, y no convertir la divergencia jurídica en acusación de innovación o de incredulidad sin conocimiento."]]},{"t":"Capítulo primero: el seguimiento y el punto medio","b":[["h","1. Aferrarse al Corán y a la Sunna"],["p","El método afirma que el Corán es la cuerda firme de Dios, curación, luz y guía; a quien lo pone delante de sí, lo conduce al Paraíso, y a quien lo arroja a sus espaldas, lo conduce a la perdición. Luego une la Sunna al Corán, porque al Profeta ﷺ se le dio el Libro y algo semejante con él, y no está permitido limitarse al Corán rechazando la explicación del Profeta."],["p","El método cita los hadices que hacen de la mejor guía la guía de Muhammad ﷺ, que advierten contra las cosas recién inventadas y que obligan a seguir la Sunna del Profeta y de los califas bien guiados. La referencia ante la divergencia no es lo que la gente considera bueno, ni lo que pretende un jeque o alguien con desvelamiento, sino la Revelación y la comprensión de los Salaf."],["h","2. El significado de la innovación y sus tipos"],["p","El método trata la innovación desde dos ángulos:"],["ul",["<b>La innovación en el credo:</b> la más peligrosa, como contradecir los fundamentos del monoteísmo, negar lo que se sabe necesariamente de la religión, o anteponer la pasión y la interpretación falsa al texto.","<b>La innovación en la adoración:</b> inventar una forma, un número o un compromiso devocional sin fundamento; se agrava cuando choca con una Sunna confirmada.","<b>La novedad en las costumbres y los medios:</b> no es extravío por el mero hecho de ser nueva; se examina su finalidad y su conformidad con la Ley. La escuela, el libro y el alminar son medios para fines sanos, no adoraciones independientes."]],["p","Entre las reglas de este capítulo:"],["ul",["Si algo oscila entre ser Sunna o innovación, dejarlo es más seguro, salvo que dejarlo lleve a abandonar una obligación.","Cometer una innovación puede ser más dañino que dejar una Sunna, porque la innovación hace creer a quien la practica que está en la verdad y compite con la Sunna.","No es correcto considerar innovación legal todo lo que no existió en la primera generación; se examina si es una adoración buscada en sí o un medio permitido.","El esfuerzo interpretativo es una excusa en las cuestiones secundarias abiertas a interpretación, pero no en los fundamentos categóricos del credo ni en contradecir un texto establecido después de conocerlo."]],["h","3. Refutación de las pretensiones del sufismo esotérico"],["p","El método discute a quienes dicen que la Ley tiene un sentido exterior para el común y un sentido interior reservado, o que la gente del desvelamiento puede prescindir del Libro y la Sunna, o que reciben los dictámenes del Profeta ﷺ en sueños, o que pretenden que el prodigio prueba la validez de su vía."],["p","Refuta este principio afirmando que:"],["ul",["La inspiración no es una fuente independiente de dictámenes legales.","El sueño no hace lícito lo ilícito ni prohíbe lo lícito.","El prodigio no es un prodigio legítimo si va acompañado de una contradicción con el Libro y la Sunna; puede ser un señuelo hacia la perdición o una ilusión.","La medida del santo es guardar los límites, cumplir las órdenes y prohibiciones, la ciencia y la práctica; no los prodigios ni las apariencias.","Quien pretende que lo interior le permite contradecir lo exterior ha demolido la Ley."]],["p","El método cita a grandes maestros del sufismo que confirman este principio: al-Yunayd dice que todos los caminos están cerrados salvo para quien sigue las huellas del Mensajero; Sari as-Saqati define el sufismo como que lo interior no contradiga lo exterior, y que los prodigios no lleven a violar lo sagrado de Dios; y Abu Yazid hace del cumplimiento de las órdenes y prohibiciones el criterio, no el mero volar por los aires o manifestar prodigios."],["h","4. La moderación en la adoración"],["p","El método pone el ejemplo de los tres hombres: uno quería rezar toda la noche siempre, el segundo ayunar perpetuamente y el tercero renunciar al matrimonio. El Profeta ﷺ los devolvió a su Sunna: ayuna y rompe el ayuno, reza y duerme, y se casa."],["p","Explica que el rigor de los ejercicios espirituales puede ser un remedio temporal para una enfermedad del corazón, o un hábito propio de la naturaleza de algunos virtuosos, pero no significa que otra vía sea mejor que la guía del Profeta ﷺ. No debe conducir a:"],["ul",["Abandonar las obligaciones.","Descuidar los derechos de la familia y del cuerpo.","Cortar el sustento lícito cuando se necesita.","Destruirse a uno mismo o apartarse de la comunidad.","Creer que la penalidad misma acerca más a Dios que la Sunna."]],["p","El sustento puede ser obligatorio en la medida de lo que basta a la persona y a quienes debe mantener, y recomendable si lo supera para mantener a un pariente o ayudar a un pobre. El beneficio del sustento que alcanza a otros puede ser mejor que una adoración voluntaria que solo beneficia a quien la hace."]]},{"t":"Capítulo segundo: los asuntos importantes en la Ley muhammadiana","b":[["p","Este capítulo es el más amplio del método, y contiene tres grandes secciones:"],["ol",["Corregir el credo según la vía de la Gente de la Sunna y la Comunidad.","Las ciencias buscadas por otra cosa.","La piedad (taqwa), sus cauces, y los males del corazón, la lengua y los miembros."]],["h","Sección primera: corregir el credo"],["h","A. El monoteísmo y los atributos"],["p","El método afirma que Dios Altísimo está libre de cuerpo, sustancia, accidente, lugar, dirección, límites, órganos y tiempo; que es Uno y no se parece a nada; eterno sin principio ni fin; descrito con los atributos de perfección."],["p","Presenta las cuestiones de los atributos, la palabra divina y la visión de Dios, recogiendo las posiciones de los teólogos y juristas, teniendo en cuenta las divergencias entre escuelas en algunas cuestiones de credo y recogiendo las palabras de los Salaf y de la gente del hadiz."],["h","B. El Corán, la visión de Dios y el decreto"],["p","Entre las cuestiones de credo que presenta:"],["ul",["El Corán es la palabra increada de Dios.","La visión de Dios en la otra vida está establecida según la Gente de la Sunna, sin abarcarlo, sin modalidad y sin lugar.","Los actos de los siervos son creados por Dios, y los siervos tienen elección y adquisición por las que merecen alabanza o reproche; el método es el punto medio entre los yabaríes (fatalistas) y los qadaríes (negadores del decreto).","La capacidad se considera junto con el acto, y Dios no impone a ningún alma más de lo que puede.","Los plazos de vida y los sustentos están decretados; lo ilícito es «sustento» en el sentido de que ocurre dentro del decreto de Dios, no en el sentido de que esté permitido.","El castigo y la dicha de la tumba, la resurrección, la Balanza, el Libro de las obras, el Estanque, el Puente, la intercesión, el Paraíso y el Infierno son verdad.","La Ascensión (Mi'rach) le ocurrió al Profeta ﷺ en est
