/* ---------- 100 questions on the path to God's good pleasure: flip cards ---------- */
const QA={"secs":["معنى المنهج المحمدي","اتباع النبي ﷺ والاعتدال","الإيمان والعلم والنية","التقوى وإصلاح القلب","أمراض القلب وعلاجها","الفضائل ومحاسبة النفس","حفظ اللسان والجوارح والحقوق","الورع والوسوسة"],"qa":[[0,"ما هي الطريقة المحمدية؟","هي اتباع النبي ﷺ في إيماننا وعبادتنا وأخلاقنا وتعاملنا مع الناس."],[0,"كيف نعرف أن سيرنا إلى الله صحيح؟","نقارن أقوالنا وأعمالنا بهدي النبي ﷺ، ونصلح ما يخالفه."],[0,"ما هدف السير إلى الله؟","طلب رضا الله والفوز بالآخرة، مع إصلاح أنفسنا وأعمالنا."],[0,"ما أهم ما يحتاج إليه السالك؟","إيمان صحيح، وعلم بما يلزمه، وتقوى في قلبه وعمله."],[0,"هل التقوى تشمل العلم والإيمان؟","نعم؛ فمن التقوى أن نصحح إيماننا ونتعلم ما نحتاجه لنطيع الله."],[0,"ما معنى تزكية النفس؟","أن نترك الصفات السيئة، ونتعلم الصفات الحسنة، ونعمل بها."],[0,"ما خطآن يجب أن نحذر منهما؟","أن نعبد الله دون علم، أو نعرف الصواب ولا نعمل به."],[0,"هل كثرة العبادة وحدها تكفي؟","لا؛ نحتاج أيضًا إلى الإخلاص وحسن الخلق وحفظ حقوق الناس."],[1,"ما الذي يرشدنا في ديننا؟","القرآن والسنة، مع الرجوع إلى أهل العلم لفهم الأحكام."],[1,"كيف نتمسك بالقرآن؟","نقرأه ونتدبره، ونعمل بأوامره، ونبتعد عن نواهيه."],[1,"كيف نتبع السنة؟","نتعلم هدي النبي ﷺ ونعمل به في عبادتنا وحياتنا."],[1,"هل نستفيد من فهم العلماء؟","نعم؛ نستفيد من علمهم واستدلالهم، ومن الإجماع والقياس الصحيح."],[1,"كيف تظهر محبتنا للنبي ﷺ؟","باتباعه، والصلاة عليه، والتخلق بأخلاقه."],[1,"هل كل شيء جديد في حياتنا ممنوع؟","لا؛ الوسائل الجديدة ليست كلها عبادات، والحكم يختلف بحسب الشيء واستعماله."],[1,"هل نجعل أي عمل عبادة لمجرد أنه يعجبنا؟","لا؛ نتأكد من مشروعيته، ولا ننسب إليه فضلًا خاصًا دون دليل."],[1,"هل الحلم أو الشعور الروحي يبيح الحرام؟","لا؛ لا يبيحان فعل الحرام أو ترك الواجب."],[1,"هل تزكية النفس منفصلة عن الشريعة؟","لا؛ التزكية الصحيحة تقوم على طاعة الله واتباع رسوله ﷺ."],[1,"ما معنى الاعتدال في العبادة؟","أن نعبد الله بما نستطيع، ونستمر، ونحفظ حقوق أنفسنا والناس."],[1,"متى تكون المجاهدة زائدة عن الحد؟","إذا أضرت بنا، أو ضيعت واجبًا أو حقًا، أو جعلتنا نترك العبادة."],[1,"هل نقلد كل عبادة شاقة نسمع عنها؟","لا؛ نتأكد من صحتها ومشروعيتها، ونراعي قدرتنا وواجباتنا."],[2,"لماذا نبدأ بتصحيح الإيمان؟","لأن العبادة تحتاج إلى معرفة صحيحة بالله وما أمرنا به."],[2,"ما أهم ما نتعلمه في الإيمان؟","ما يتعلق بالله ورسله ووحيه والقدر واليوم الآخر، وما يلزمنا من أمور الإيمان."],[2,"كيف يؤثر الإيمان في حياتنا؟","يدفعنا إلى الطاعة، ويقوي محبتنا لله وخوفنا منه ورجاءنا فيه."],[2,"ما معنى علم الحال؟","أن تتعلم ما تحتاجه الآن لتصح عبادتك ومعاملاتك."],[2,"هل يحتاج كل شخص إلى العلم نفسه؟","نتشارك أساسيات الدين، ويحتاج كل شخص أيضًا إلى أحكام تخص عمله وحاله."],[2,"ما الفرق بين فرض العين وفرض الكفاية؟","فرض العين يجب على كل شخص معني به، وفرض الكفاية يكفي أن يقوم به عدد يحقق حاجة الناس."],[2,"هل تعلم كل علم له الحكم نفسه؟","لا؛ فمن العلم ما يجب تعلمه، ومنه ما يستحب، ومنه ما يحرم."],[2,"ما العلم الذي ينبغي أن نحذر منه؟","ما يقود إلى الحرام أو الضلال أو الضرر، مثل السحر والجدال الذي لا ينفع."],[2,"لماذا نطلب العلم؟","لنرضي الله، ونصحح أعمالنا، وننفع الناس."],[2,"هل النية الحسنة تجعل الحرام حلالًا؟","لا؛ يجب أن تكون النية حسنة والعمل مشروعًا أيضًا."],[3,"ما هي التقوى؟","أن تطيع الله وتبتعد عما نهى عنه، في قلبك وعملك."],[3,"هل يكفي أن نترك الحرام؟","لا؛ يجب أيضًا أن نؤدي الواجبات."],[3,"ما الذي نحفظه من المعاصي؟","القلب واللسان والسمع والبصر واليد والبطن والفرج والرجل، وسائر البدن."],[3,"لماذا نهتم بالقلب؟","لأن نياتنا ودوافعنا فيه، وهو يؤثر في أقوالنا وأعمالنا."],[3,"ما معنى الخلق؟","صفة ثابتة في النفس تجعلنا نتصرف بطريقة معينة بسهولة."],[3,"هل يمكن أن نغير أخلاقنا؟","نعم؛ بالتعلم والتدريب والمجاهدة، ولو احتجنا إلى وقت."],[3,"ما القوى التي تؤثر في أخلاقنا؟","التفكير والغضب والرغبة؛ ونحتاج إلى توجيهها وضبطها."],[3,"ما أهم أصول الأخلاق الحسنة؟","الحكمة، والشجاعة، والعفة، والعدل."],[3,"كيف نبدأ علاج صفة سيئة؟","نفهمها، ونعرف ضررها وأسبابها، ثم نتعلم الصفة الحسنة التي تقابلها."],[3,"كيف نكتشف عيوبنا؟","نراجع تصرفاتنا، ونقبل النصيحة الصادقة، ونستفيد من النقد الصحيح."],[3,"كيف نتخلص من صفة سيئة؟","نبتعد عن أسبابها، ونتدرب على عكسها الحسن، ونكرر ذلك."],[3,"كيف نحافظ على الخلق الحسن؟","نستمر في العمل به، ونصاحب الصالحين، ونتجنب ما يفسده."],[4,"لماذا نتعلم أمراض القلب؟","حتى نعرف ما يحتاج إلى إصلاح في أنفسنا، ونتعلم كيف نعالجه."],[4,"ما بعض أخطر ما يفسد القلب؟","الكفر، والبدعة المذمومة، والرياء، والكبر، والحسد، والبخل، والإسراف."],[4,"كيف نعالج الجهل؟","نتعلم من أهل العلم، ونسأل عما لا نعرف، ولا نتكلم بغير علم."],[4,"ما ضرر اتباع الهوى؟","قد يجعلنا نختار ما نريده بدل ما يرضي الله."],[4,"متى يكون التقليد خطأ؟","إذا اتبعنا أحدًا بلا تحقق في أمر يحتاج إلى تحقق؛ أما سؤال أهل العلم فمطلوب."],[4,"متى يكون حب المنصب ضارًا؟","إذا طلبناه للتعالي على الناس أو الوصول إلى الحرام."],[4,"ما ضرر الانشغال بمدح الناس وذمهم؟","قد يجعلنا نترك الصواب، أو نعمل من أجل إعجابهم بنا."],[4,"كيف نقلل تعلقنا برأي الناس؟","نطلب رضا الله، ونقبل النقد المفيد، ولا نجعل المدح هدفًا."],[4,"ما هو الرياء؟","أن نفعل العبادة ليعجب الناس بنا أو يمدحونا."],[4,"ما الذي يدفع إلى الرياء؟","حب المدح والمكانة، والخوف من كلام الناس، والطمع فيما عندهم."],[4,"ما علامة خفية للرياء؟","أن ننتظر احترامًا أو خدمة خاصة من الناس بسبب عبادتنا."],[4,"هل الفرح بمعرفة الناس بعملنا الصالح رياء دائمًا؟","لا؛ قد نفرح لأنهم استفادوا منه. المهم أن نراجع نيتنا."],[4,"كيف نعالج الرياء؟","نخلص لله، ونراجع نيتنا، ونتوقف عن طلب مدح الناس بعبادتنا."],[4,"هل يجوز إظهار عمل صالح ليقتدي بنا الناس؟","نعم، إذا كان العمل لله، وكان إظهاره مشروعًا وبنية نفع الناس."],[4,"ما معنى طول الأمل؟","أن ننشغل بحياة طويلة نتوقعها، فنؤخر التوبة والعمل للآخرة."],[4,"كيف نعالج طول الأمل والطمع؟","نتذكر الموت، ونعمل اليوم، ونقوي القناعة والثقة بالله."],[4,"ما هو الكبر؟","أن نتعالى على الناس، أو نرفض الحق لأننا لا نريد قبوله."],[4,"ما الفرق بين العجب والكبر؟","العجب أن نغتر بأنفسنا، والكبر أن نتعالى على غيرنا."],[4,"كيف نعالج العجب؟","نتذكر أن الخير من توفيق الله، وأننا نحتاج إليه، وأن لنا تقصيرًا."],[4,"ما الفرق بين الحسد والغبطة؟","الحسد أن نتمنى زوال نعمة غيرنا، والغبطة أن نتمنى مثلها دون زوالها عنه."],[4,"كيف نعالج الحسد؟","نقاوم تمني زوال النعمة، وندرب أنفسنا على حب الخير للناس والإحسان إليهم."],[4,"كيف يتحول الغضب إلى حقد؟","إذا احتفظنا به وغذيناه، فقد يتحول إلى كراهية وعداوة وفرح بأذى الآخر."],[4,"هل يجب ألا نغضب أبدًا؟","المطلوب أن نضبط غضبنا، وألا يجعلنا نظلم أو نتعدى."],[4,"كيف نعالج الخيانة وعدم الوفاء؟","نؤدي الأمانة، ونفي بالوعد، ونرد الحقوق، ونصلح ما أفسدناه."],[4,"ما سوء الظن المذموم؟","أن نتهم الناس بالسوء لمجرد الشك، دون دليل."],[4,"كيف نتجنب البخل والإسراف معًا؟","نؤدي الحقوق، وننفق في الخير باعتدال، فلا نمنع واجبًا ولا نبذر."],[4,"هل الزهد يعني ترك العمل والمال؟","لا؛ نكسب الحلال وننتفع به، دون أن يبعدنا التعلق به عن طاعة الله."],[4,"كيف نجمع بين الخوف والرجاء؟","نخاف التقصير فلا نستهين بالذنب، ونرجو رحمة الله فلا نيأس."],[5,"ما هو الصبر؟","أن نثبت على الطاعة، ونترك المعصية، ونتحمل البلاء دون تعدٍّ، مع السعي فيما ينفع."],[5,"كيف نشكر الله؟","نعترف بنعمته، ونحمده، ونستعمل النعمة فيما يرضيه."],[5,"هل الرضا يعني ألا نحاول تغيير حالنا؟","لا؛ نرضى بقضاء الله، ونسعى إلى الإصلاح ورفع الضرر بطرق مشروعة."],[5,"ما هو التوكل؟","أن نعتمد على الله بقلوبنا، ونعمل بالأسباب المشروعة."],[5,"هل الصدق في الكلام فقط؟","لا؛ يكون أيضًا في النية والوعد والعمل والوفاء."],[5,"كيف ندرب أنفسنا على الطاعة؟","نحدد ما نريد فعله، ونراقب أنفسنا، ثم نحاسبها ونصلح التقصير."],[5,"ما هي المشارطة؟","أن تضع لنفسك خطة للطاعة وترك المعصية، وتعزم على الالتزام بها."],[5,"ما هي المراقبة؟","أن تتذكر أن الله يراك ويعلم حالك، فتنتبه إلى نيتك وعملك."],[5,"ما هي المحاسبة؟","أن تراجع يومك: ماذا أحسنت؟ وأين قصرت؟ وما الذي ستصلحه؟"],[5,"ماذا نفعل بعد اكتشاف تقصيرنا؟","نتوب، ونصلح الخطأ، ونضع خطوة تمنع تكراره، دون إيذاء أنفسنا."],[6,"لماذا نهتم بحفظ اللسان؟","لأن كلامنا قد يصلح الناس أو يؤذيهم، وقد يحفظ الحقوق أو يضيعها."],[6,"ما الفرق بين الكذب والغيبة والبهتان؟","الكذب قول غير صحيح؛ والغيبة ذكر شخص بما يكره وهو فيه؛ والبهتان اتهامه بما ليس فيه."],[6,"ما هي النميمة؟","نقل الكلام لإفساد العلاقة بين الناس. وهي تختلف عن الإبلاغ اللازم لدفع ضرر."],[6,"ما الفرق بين النقاش النافع والجدال المذموم؟","النافع يطلب الحق والحل، والمذموم يطلب الغلبة أو الإهانة."],[6,"هل المزاح والمدح والشعر ممنوعة دائمًا؟","لا؛ يجوز منها ما خلا من الحرام، مثل الكذب والأذى، ومن الإفراط المذموم."],[6,"كيف نحسن كلامنا في العمل والتعليم والعبادة؟","نصدق، ونتعلم الأحكام والآداب، ونصحح النية، ولا نتكلم فيما نجهل."],[6,"هل السكوت صحيح دائمًا؟","لا؛ قد يجب الكلام لأداء شهادة أو تعليم لازم أو نصيحة بشروطها."],[6,"كيف نحفظ سمعنا وبصرنا؟","نترك تعمد سماع الحرام والنظر إليه، ونراعي ما يجوز للحاجة المشروعة."],[6,"كيف نحفظ أيدينا وأقدامنا؟","لا نعتدي ولا نأخذ مالًا بالباطل ولا نسعى إلى المعصية، ونستعملهما في الخير."],[6,"كيف نحفظ البطن والفرج؟","نأكل الحلال دون إفراط ضار، ونلتزم بالعفة وأحكام العلاقات المشروعة."],[6,"كيف نحفظ بدننا كله؟","نستر العورة، ونتجنب الظلم والعقوق واستعمال ما لا يحل لنا، ونؤدي الواجبات."],[6,"هل التقوى تشمل الرحمة بالناس والحيوان؟","نعم؛ تشمل ترك الأذى والظلم، وحفظ الحقوق والأمانات، والرحمة بالخلق."],[7,"هل كل تشدد يدل على التقوى؟","لا؛ قد يكون ناتجًا عن الجهل أو الوسوسة، وقد يوقع في مخالفة."],[7,"ما التشدد المذموم في الطهارة؟","تكرار الغسل والتفتيش بلا سبب، أو اعتبار الشيء نجسًا لمجرد الشك."],[7,"هل نحكم على الشيء بالنجاسة لمجرد الشك؟","لا؛ الأصل الطهارة، واليقين لا يزول بالشك."],[7,"كيف نتعامل مع وسوسة الطهارة؟","نتعلم الحكم، ولا نسترسل في الشك، ونأخذ بالسعة المعتبرة دون تكرار غير لازم."],[7,"هل نحكم على المال بالحرمة لمجرد شبهة عامة؟","لا؛ نتحقق من سبب المال وصحة استحقاقه، ولا نعتمد على الوهم."],[7,"كيف نتحرى الحلال دون وسوسة؟","نترك الحرام المعلوم، ونتحقق عند وجود دليل معتبر، ولا نشك في كل معاملة."],[7,"كيف نعرف حكم أعمال الوفاة وإهداء الثواب؟","نسأل أهل العلم عن كل عمل وشروطه، ونراعي الخلاف، ولا نجعل العادة عبادة لمجرد انتشارها."],[7,"ما علامة السير الصحيح على المنهج المحمدي؟","إيمان صحيح، وعلم نافع، وطاعة وإخلاص، وحسن خلق، وحفظ لحقوق الناس."]],"tr":{"en":{"secs":["The meaning of the Muhammadan method","Following the Prophet ﷺ and moderation","Faith, knowledge and intention","Piety and reforming the heart","Diseases of the heart and their cure","Virtues and self-accounting","Guarding the tongue, the limbs and others' rights","Scrupulousness and obsessive doubt"],"qa":[["What is the Muhammadan way?","It is following the Prophet ﷺ in our faith, our worship, our character and how we treat people."],["How do we know our journey to God is sound?","We compare our words and deeds with the guidance of the Prophet ﷺ and correct whatever contradicts it."],["What is the aim of the journey to God?","Seeking God’s good pleasure and success in the Hereafter, while reforming ourselves and our deeds."],["What does the seeker need most?","Sound faith, knowledge of what is required of him, and piety in his heart and deeds."],["Does piety include knowledge and faith?","Yes; part of piety is to correct our faith and learn what we need in order to obey God."],["What does purifying the soul mean?","Leaving bad traits, learning good traits, and acting upon them."],["What are two mistakes we must beware of?","Worshipping God without knowledge, or knowing what is right and not acting on it."],["Is abundant worship alone enough?","No; we also need sincerity, good character and respect for people’s rights."],["What guides us in our religion?","The Qur’an and the Sunnah, with recourse to the people of knowledge to understand the rulings."],["How do we hold fast to the Qur’an?","We read it and reflect on it, act on its commands and keep away from what it forbids."],["How do we follow the Sunnah?","We learn the guidance of the Prophet ﷺ and act on it in our worship and our lives."],["Do we benefit from the scholars’ understanding?","Yes; we benefit from their knowledge and reasoning, and from consensus and sound analogy."],["How does our love for the Prophet ﷺ show?","By following him, sending blessings upon him, and taking on his character."],["Is everything new in our lives forbidden?","No; new means are not all acts of worship, and the ruling depends on the thing and how it is used."],["Do we make any act worship just because we like it?","No; we make sure it is legitimate, and we do not attribute a special merit to it without evidence."],["Does a dream or spiritual feeling make the forbidden permissible?","No; they never permit doing what is forbidden or leaving what is obligatory."],["Is purifying the soul separate from the Sacred Law?","No; true purification rests on obeying God and following His Messenger ﷺ."],["What does moderation in worship mean?","To worship God as much as we can, to keep it up, and to respect our own rights and those of others."],["When is spiritual striving excessive?","When it harms us, neglects a duty or a right, or makes us give up worship."],["Do we imitate every hard practice we hear about?","No; we check that it is authentic and legitimate, and take our ability and duties into account."],["Why do we begin by correcting faith?","Because worship requires sound knowledge of God and of what He has commanded us."],["What is most important to learn about faith?","What concerns God, His messengers, His revelation, destiny and the Last Day, and the matters of faith required of us."],["How does faith affect our lives?","It moves us to obedience and strengthens our love for God, our fear of Him and our hope in Him."],["What is ‘knowledge of one’s state’?","Learning what you need now so that your worship and dealings are valid."],["Does everyone need the same knowledge?","We share the basics of religion, and each person also needs rulings specific to their work and situation."],["What is the difference between an individual and a communal obligation?","An individual obligation is required of every person it concerns; a communal one is fulfilled when enough people do it to meet the community’s need."],["Does learning every science have the same ruling?","No; some knowledge must be learned, some is recommended, and some is forbidden."],["Which knowledge should we beware of?","Whatever leads to the forbidden, to misguidance or to harm, such as sorcery and useless argument."],["Why do we seek knowledge?","To please God, correct our deeds, and benefit people."],["Does a good intention make the forbidden lawful?","No; the intention must be good and the act must also be legitimate."],["What is piety (taqwa)?","To obey God and keep away from what He has forbidden, in your heart and your deeds."],["Is leaving the forbidden enough?","No; we must also fulfil the obligations."],["What do we guard from sins?","The heart, the tongue, hearing, sight, the hands, the stomach, the private parts, the feet, and the whole body."],["Why do we care about the heart?","Because our intentions and motives are in it, and it shapes our words and deeds."],["What is character (khuluq)?","A settled trait in the soul that makes us act in a certain way with ease."],["Can we change our character?","Yes; through learning, training and striving, even if it takes time."],["Which faculties shape our character?","Thought, anger and desire; they need to be directed and restrained."],["What are the main roots of good character?","Wisdom, courage, chastity and justice."],["How do we begin to cure a bad trait?","We understand it, learn its harm and causes, then learn the good trait that opposes it."],["How do we discover our faults?","We review our conduct, accept sincere advice, and benefit from fair criticism."],["How do we rid ourselves of a bad trait?","We avoid its causes, train ourselves in its good opposite, and repeat this."],["How do we preserve good character?","We keep practising it, keep company with the righteous, and avoid what spoils it."],["Why do we learn about the diseases of the heart?","To know what needs reforming in ourselves and learn how to cure it."],["What are some of the most dangerous corrupters of the heart?","Disbelief, blameworthy innovation, showing off, arrogance, envy, miserliness and extravagance."],["How do we cure ignorance?","We learn from the people of knowledge, ask about what we do not know, and do not speak without knowledge."],["What is the harm of following whims?","It can make us choose what we want instead of what pleases God."],["When is imitation a mistake?","When we follow someone without verifying in a matter that requires verification; asking the scholars, however, is required."],["When is love of position harmful?","When we seek it to rise above people or to reach what is forbidden."],["What is the harm of being preoccupied with people’s praise and blame?","It can make us abandon what is right, or act to win their admiration."],["How do we reduce our attachment to people’s opinion?","We seek God’s pleasure, accept useful criticism, and do not make praise our goal."],["What is showing off (riya’)?","Doing worship so that people admire or praise us."],["What drives showing off?","Love of praise and standing, fear of people’s talk, and coveting what they have."],["What is a hidden sign of showing off?","Expecting special respect or service from people because of our worship."],["Is being glad that people know of our good deed always showing off?","No; we may be glad because they benefited from it. What matters is reviewing our intention."],["How do we cure showing off?","We act sincerely for God, review our intention, and stop seeking people’s praise for our worship."],["May we show a good deed so that people follow our example?","Yes, if the deed is for God and showing it is legitimate and intended to benefit people."],["What does ‘long hope’ (tul al-amal) mean?","Being absorbed in a long life we expect, so we postpone repentance and work for the Hereafter."],["How do we cure long hope and greed?","We remember death, act today, and strengthen contentment and trust in God."],["What is arrogance (kibr)?","Looking down on people, or rejecting the truth because we do not want to accept it."],["What is the difference between self-admiration and arrogance?","Self-admiration is being deluded by ourselves; arrogance is rising above others."],["How do we cure self-admiration?","We remember that good comes from God’s enabling, that we need Him, and that we fall short."],["What is the difference between envy and healthy emulation?","Envy is wishing another’s blessing would vanish; emulation is wishing for the same without it leaving them."],["How do we cure envy?","We resist wishing the blessing away and train ourselves to love good for people and to do good to them."],["How does anger turn into rancour?","If we hold on to it and feed it, it can become hatred, enmity and joy at the other’s harm."],["Must we never get angry?","What is required is to control our anger and not let it make us wrong or transgress against others."],["How do we cure betrayal and unfaithfulness?","We fulfil trusts, keep our promises, return rights, and repair what we have damaged."],["What is blameworthy suspicion?","Accusing people of evil on mere doubt, without evidence."],["How do we avoid both miserliness and extravagance?","We pay what is due and spend on good with moderation, neither withholding an obligation nor wasting."],["Does renunciation (zuhd) mean leaving work and wealth?","No; we earn lawfully and benefit from it, without attachment to it keeping us from obeying God."],["How do we combine fear and hope?","We fear our shortcomings so we do not take sin lightly, and hope for God’s mercy so we do not despair."],["What is patience?","Staying firm in obedience, leaving sin, and bearing trials without transgression, while striving for what benefits."],["How do we thank God?","We acknowledge His blessing, praise Him, and use the blessing in what pleases Him."],["Does contentment mean not trying to change our situation?","No; we accept God’s decree and strive to improve and remove harm by lawful means."],["What is reliance on God (tawakkul)?","Depending on God with our hearts while taking lawful means."],["Is truthfulness only in speech?","No; it is also in intention, promises, deeds and loyalty."],["How do we train ourselves in obedience?","We set what we want to do, watch over ourselves, then hold ourselves to account and correct shortcomings."],["What is self-commitment (musharata)?","Setting yourself a plan for obedience and leaving sin, and resolving to keep to it."],["What is vigilance (muraqaba)?","Remembering that God sees you and knows your state, so you pay attention to your intention and deeds."],["What is self-accounting (muhasaba)?","Reviewing your day: what did you do well? Where did you fall short? What will you correct?"],["What do we do after discovering our shortcomings?","We repent, correct the mistake, and take a step to prevent it recurring, without harming ourselves."],["Why do we care about guarding the tongue?","Because our words may reform people or hurt them, and may preserve rights or lose them."],["What is the difference between lying, backbiting and slander?","Lying is saying what is untrue; backbiting is mentioning someone with what they dislike that is true of them; slander is accusing them of what is not in them."],["What is talebearing (namima)?","Passing on words to spoil relations between people. It differs from reporting that is needed to prevent harm."],["What is the difference between useful discussion and blameworthy argument?","Useful discussion seeks the truth and a solution; blameworthy argument seeks victory or humiliation."],["Are joking, praise and poetry always forbidden?","No; what is free of the forbidden, such as lies and harm, and of blameworthy excess, is permitted."],["How do we improve our speech at work, in teaching and in worship?","We are truthful, learn the rulings and etiquette, correct our intention, and do not speak about what we do not know."],["Is silence always right?","No; speaking may be required to give testimony, necessary teaching, or advice under its conditions."],["How do we guard our hearing and sight?","We avoid deliberately listening to or looking at the forbidden, and observe what is allowed for lawful need."],["How do we guard our hands and feet?","We do not attack, take wealth unjustly or walk towards sin, and we use them for good."],["How do we guard the stomach and private parts?","We eat what is lawful without harmful excess, and keep to chastity and the rulings of lawful relationships."],["How do we guard our whole body?","We cover our ‘awra, avoid injustice, disobedience to parents and using what is not lawful for us, and fulfil our duties."],["Does piety include mercy towards people and animals?","Yes; it includes leaving harm and injustice, preserving rights and trusts, and mercy towards all creatures."],["Is every strictness a sign of piety?","No; it may come from ignorance or obsessive doubt, and may lead to wrongdoing."],["What is blameworthy strictness in purification?","Repeating washing and checking without cause, or considering something impure on mere doubt."],["Do we judge something impure on mere doubt?","No; the default is purity, and certainty is not removed by doubt."],["How do we deal with obsessive doubts about purification?","We learn the ruling, do not follow the doubt, and take the recognised latitude without unnecessary repetition."],["Do we judge wealth unlawful on a vague general suspicion?","No; we verify the source of the wealth and the soundness of the entitlement, and do not rely on imagination."],["How do we seek the lawful without obsession?","We leave the known forbidden, verify when there is valid evidence, and do not doubt every transaction."],["How do we know the ruling on practices after death and gifting reward?","We ask the scholars about each practice and its conditions, take the difference of opinion into account, and do not make custom worship just because it is widespread."],["What is the sign of a sound journey on the Muhammadan method?","Sound faith, beneficial knowledge, obedience and sincerity, good character, and respect for people’s rights."]]},"fr":{"secs":["Le sens de la voie muhammadienne","Suivre le Prophète ﷺ et la modération","La foi, la science et l’intention","La piété et la réforme du cœur","Les maladies du cœur et leur remède","Les vertus et l’examen de soi","Préserver la langue, les membres et les droits d’autrui","Le scrupule et les obsessions"],"qa":[["Qu’est-ce que la voie muhammadienne ?","C’est suivre le Prophète ﷺ dans notre foi, notre adoration, notre caractère et notre manière de traiter les gens."],["Comment savoir que notre cheminement vers Dieu est juste ?","Nous comparons nos paroles et nos actes à la guidance du Prophète ﷺ et corrigeons ce qui s’en écarte."],["Quel est le but du cheminement vers Dieu ?","Rechercher l’agrément de Dieu et le succès dans l’au-delà, tout en réformant nos âmes et nos actes."],["De quoi le cheminant a-t-il le plus besoin ?","D’une foi saine, de la connaissance de ce qui lui incombe et de la piété dans son cœur et ses actes."],["La piété inclut-elle la science et la foi ?","Oui ; il fait partie de la piété de corriger notre foi et d’apprendre ce dont nous avons besoin pour obéir à Dieu."],["Que signifie purifier l’âme ?","Délaisser les mauvais traits, apprendre les bons et les mettre en pratique."],["Quelles sont deux erreurs à éviter ?","Adorer Dieu sans science, ou connaître le juste sans le pratiquer."],["L’abondance d’adoration suffit-elle à elle seule ?","Non ; il faut aussi la sincérité, le bon caractère et le respect des droits d’autrui."],["Qu’est-ce qui nous guide dans notre religion ?","Le Coran et la Sunna, en recourant aux savants pour comprendre les règles."],["Comment s’attacher au Coran ?","Nous le lisons et le méditons, appliquons ses ordres et nous éloignons de ses interdits."],["Comment suivre la Sunna ?","Nous apprenons la guidance du Prophète ﷺ et l’appliquons dans notre adoration et notre vie."],["Profitons-nous de la compréhension des savants ?","Oui ; nous profitons de leur science et de leur argumentation, ainsi que du consensus et de l’analogie correcte."],["Comment se manifeste notre amour pour le Prophète ﷺ ?","En le suivant, en priant sur lui et en adoptant son caractère."],["Tout ce qui est nouveau dans notre vie est-il interdit ?","Non ; les moyens nouveaux ne sont pas tous des actes d’adoration, et le jugement dépend de la chose et de son usage."],["Faisons-nous d’un acte une adoration simplement parce qu’il nous plaît ?","Non ; nous vérifions sa légitimité et ne lui attribuons pas de mérite particulier sans preuve."],["Un rêve ou un ressenti spirituel rend-il licite l’interdit ?","Non ; ils ne permettent ni de commettre l’interdit ni de délaisser l’obligatoire."],["La purification de l’âme est-elle séparée de la Loi ?","Non ; la vraie purification repose sur l’obéissance à Dieu et le suivi de Son Messager ﷺ."],["Que signifie la modération dans l’adoration ?","Adorer Dieu selon nos capacités, persévérer, et préserver nos droits et ceux des autres."],["Quand l’effort spirituel devient-il excessif ?","Quand il nous nuit, fait négliger un devoir ou un droit, ou nous fait abandonner l’adoration."],["Imitons-nous toute pratique difficile dont nous entendons parler ?","Non ; nous vérifions son authenticité et sa légitimité, en tenant compte de nos capacités et de nos devoirs."],["Pourquoi commencer par corriger la foi ?","Parce que l’adoration nécessite une connaissance juste de Dieu et de ce qu’Il nous a ordonné."],["Que faut-il apprendre en priorité dans la foi ?","Ce qui concerne Dieu, Ses messagers, Sa révélation, le destin et le Jour dernier, et ce qui nous incombe en matière de foi."],["Comment la foi influence-t-elle notre vie ?","Elle nous pousse à l’obéissance et renforce notre amour de Dieu, notre crainte de Lui et notre espoir en Lui."],["Qu’est-ce que la « science de l’état » ?","Apprendre ce dont tu as besoin maintenant pour que ton adoration et tes transactions soient valides."],["Chacun a-t-il besoin de la même science ?","Nous partageons les bases de la religion, et chacun a aussi besoin des règles propres à son travail et à sa situation."],["Quelle est la différence entre obligation individuelle et obligation collective ?","L’obligation individuelle incombe à chaque personne concernée ; l’obligation collective est remplie dès qu’un nombre suffisant de personnes répond au besoin de la communauté."],["Apprendre toute science a-t-il le même statut ?","Non ; certaines sciences sont obligatoires, d’autres recommandées, d’autres interdites."],["De quelle science faut-il se méfier ?","De celle qui mène à l’interdit, à l’égarement ou au préjudice, comme la sorcellerie et la polémique stérile."],["Pourquoi cherchons-nous la science ?","Pour plaire à Dieu, corriger nos actes et être utiles aux gens."],["Une bonne intention rend-elle licite l’interdit ?","Non ; l’intention doit être bonne et l’acte aussi doit être légitime."],["Qu’est-ce que la piété (taqwa) ?","Obéir à Dieu et s’éloigner de ce qu’Il a interdit, dans ton cœur et tes actes."],["Suffit-il de délaisser l’interdit ?","Non ; il faut aussi accomplir les obligations."],["Que préservons-nous des péchés ?","Le cœur, la langue, l’ouïe, la vue, les mains, le ventre, le sexe, les pieds et tout le corps."],["Pourquoi accorder de l’importance au cœur ?","Parce que nos intentions et nos motivations s’y trouvent, et il influence nos paroles et nos actes."],["Qu’est-ce que le caractère (khuluq) ?","Une disposition stable de l’âme qui nous fait agir d’une certaine manière avec aisance."],["Pouvons-nous changer notre caractère ?","Oui ; par l’apprentissage, l’entraînement et l’effort, même si cela prend du temps."],["Quelles facultés influencent notre caractère ?","La réflexion, la colère et le désir ; il faut les orienter et les maîtriser."],["Quelles sont les racines du bon caractère ?","La sagesse, le courage, la chasteté et la justice."],["Comment commencer à soigner un mauvais trait ?","Nous le comprenons, connaissons son mal et ses causes, puis apprenons le bon trait qui lui est opposé."],["Comment découvrir nos défauts ?","Nous examinons notre conduite, acceptons le conseil sincère et profitons de la critique juste."],["Comment se débarrasser d’un mauvais trait ?","Nous évitons ses causes, nous exerçons à son contraire vertueux et répétons cela."],["Comment préserver le bon caractère ?","Nous continuons à le pratiquer, fréquentons les vertueux et évitons ce qui le corrompt."],["Pourquoi apprendre les maladies du cœur ?","Pour savoir ce qui doit être réformé en nous et apprendre à le soigner."],["Quels sont parmi les plus graves corrupteurs du cœur ?","La mécréance, l’innovation blâmable, l’ostentation, l’orgueil, l’envie, l’avarice et le gaspillage."],["Comment soigner l’ignorance ?","Nous apprenons auprès des savants, demandons ce que nous ignorons et ne parlons pas sans science."],["Quel est le mal de suivre ses passions ?","Cela peut nous faire choisir ce que nous voulons au lieu de ce qui plaît à Dieu."],["Quand l’imitation est-elle une erreur ?","Quand nous suivons quelqu’un sans vérifier dans une question qui l’exige ; interroger les savants, en revanche, est demandé."],["Quand l’amour du pouvoir est-il nuisible ?","Quand nous le recherchons pour dominer les gens ou atteindre l’interdit."],["Quel est le mal de se préoccuper des éloges et des blâmes des gens ?","Cela peut nous faire abandonner le juste ou agir pour gagner leur admiration."],["Comment réduire notre attachement à l’avis des gens ?","Nous recherchons l’agrément de Dieu, acceptons la critique utile et ne faisons pas de l’éloge un but."],["Qu’est-ce que l’ostentation (riya’) ?","Accomplir l’adoration pour que les gens nous admirent ou nous louent."],["Qu’est-ce qui pousse à l’ostentation ?","L’amour des éloges et du prestige, la peur des propos des gens et la convoitise de ce qu’ils possèdent."],["Quel est un signe caché de l’ostentation ?","Attendre des gens un respect ou un service particulier à cause de notre adoration."],["Se réjouir que les gens connaissent notre bonne action est-il toujours de l’ostentation ?","Non ; nous pouvons nous réjouir parce qu’ils en ont profité. L’essentiel est d’examiner notre intention."],["Comment soigner l’ostentation ?","Nous agissons sincèrement pour Dieu, examinons notre intention et cessons de rechercher les éloges pour notre adoration."],["Peut-on montrer une bonne action pour que les gens nous imitent ?","Oui, si l’action est pour Dieu, et que la montrer est légitime et vise à être utile aux gens."],["Que signifie « le long espoir » (tul al-amal) ?","S’absorber dans une longue vie que l’on espère, au point de retarder le repentir et les œuvres pour l’au-delà."],["Comment soigner le long espoir et l’avidité ?","Nous nous rappelons la mort, agissons aujourd’hui et renforçons le contentement et la confiance en Dieu."],["Qu’est-ce que l’orgueil (kibr) ?","Se placer au-dessus des gens, ou rejeter la vérité parce que l’on ne veut pas l’accepter."],["Quelle est la différence entre l’autosatisfaction et l’orgueil ?","L’autosatisfaction, c’est se laisser éblouir par soi-même ; l’orgueil, c’est se placer au-dessus des autres."],["Comment soigner l’autosatisfaction ?","Nous nous rappelons que le bien vient de l’assistance de Dieu, que nous avons besoin de Lui et que nous sommes défaillants."],["Quelle est la différence entre l’envie et l’émulation ?","L’envie, c’est souhaiter la disparition du bienfait d’autrui ; l’émulation, c’est souhaiter le même sans qu’il le perde."],["Comment soigner l’envie ?","Nous résistons au souhait de voir disparaître le bienfait et nous exerçons à aimer le bien pour les gens et à leur faire du bien."],["Comment la colère se transforme-t-elle en rancune ?","Si nous la gardons et l’alimentons, elle peut devenir haine, inimitié et joie du malheur d’autrui."],["Ne devons-nous jamais nous mettre en colère ?","Ce qui est demandé, c’est de maîtriser notre colère et de ne pas la laisser nous pousser à l’injustice ou à l’excès."],["Comment soigner la trahison et l’infidélité ?","Nous rendons les dépôts, tenons nos promesses, restituons les droits et réparons ce que nous avons gâché."],["Qu’est-ce que la mauvaise opinion blâmable ?","Accuser les gens de mal sur un simple doute, sans preuve."],["Comment éviter à la fois l’avarice et le gaspillage ?","Nous acquittons les droits et dépensons dans le bien avec mesure, sans retenir un dû ni gaspiller."],["Le renoncement (zuhd) signifie-t-il abandonner le travail et l’argent ?","Non ; nous gagnons licitement et en profitons, sans que l’attachement nous éloigne de l’obéissance à Dieu."],["Comment allier crainte et espérance ?","Nous craignons nos manquements pour ne pas banaliser le péché, et espérons la miséricorde de Dieu pour ne pas désespérer."],["Qu’est-ce que la patience ?","Rester ferme dans l’obéissance, délaisser le péché et supporter l’épreuve sans excès, tout en œuvrant pour ce qui est utile."],["Comment remercier Dieu ?","Nous reconnaissons Son bienfait, Le louons et utilisons le bienfait dans ce qui Lui plaît."],["Le contentement signifie-t-il ne pas chercher à changer notre situation ?","Non ; nous acceptons le décret de Dieu et œuvrons à l’amélioration et à écarter le mal par des moyens licites."],["Qu’est-ce que la confiance en Dieu (tawakkul) ?","S’en remettre à Dieu par le cœur tout en prenant les moyens licites."],["La véracité n’est-elle que dans la parole ?","Non ; elle est aussi dans l’intention, la promesse, l’acte et la fidélité."],["Comment nous entraîner à l’obéissance ?","Nous fixons ce que nous voulons faire, nous surveillons, puis nous nous examinons et corrigeons nos manquements."],["Qu’est-ce que l’engagement (musharata) ?","Te fixer un plan d’obéissance et d’abandon du péché, et te résoudre à t’y tenir."],["Qu’est-ce que la vigilance (muraqaba) ?","Te rappeler que Dieu te voit et connaît ton état, afin de veiller à ton intention et à tes actes."],["Qu’est-ce que l’examen de soi (muhasaba) ?","Revoir ta journée : qu’as-tu bien fait ? Où as-tu manqué ? Que vas-tu corriger ?"],["Que faire après avoir découvert nos manquements ?","Nous nous repentons, corrigeons l’erreur et prenons une mesure pour éviter qu’elle se répète, sans nous faire de mal."],["Pourquoi préserver la langue ?","Parce que nos paroles peuvent réformer les gens ou leur nuire, préserver des droits ou les perdre."],["Quelle est la différence entre le mensonge, la médisance et la calomnie ?","Le mensonge est dire ce qui est faux ; la médisance, mentionner quelqu’un par ce qu’il déteste et qui est en lui ; la calomnie, l’accuser de ce qui n’est pas en lui."],["Qu’est-ce que la délation (namima) ?","Rapporter des propos pour gâter les relations entre les gens. Elle diffère du signalement nécessaire pour écarter un mal."],["Quelle est la différence entre la discussion utile et la polémique blâmable ?","La discussion utile cherche la vérité et la solution ; la polémique blâmable cherche à vaincre ou à humilier."],["La plaisanterie, l’éloge et la poésie sont-ils toujours interdits ?","Non ; est permis ce qui est exempt d’interdit, comme le mensonge et la nuisance, et d’excès blâmable."],["Comment améliorer notre parole au travail, dans l’enseignement et l’adoration ?","Nous sommes véridiques, apprenons les règles et les convenances, corrigeons l’intention et ne parlons pas de ce que nous ignorons."],["Le silence est-il toujours juste ?","Non ; parler peut être obligatoire pour témoigner, enseigner le nécessaire ou conseiller selon ses conditions."],["Comment préserver notre ouïe et notre vue ?","Nous évitons d’écouter ou de regarder volontairement l’interdit, en tenant compte de ce qui est permis pour un besoin légitime."],["Comment préserver nos mains et nos pieds ?","Nous n’agressons pas, ne prenons pas de biens injustement, ne marchons pas vers le péché, et les utilisons pour le bien."],["Comment préserver le ventre et le sexe ?","Nous mangeons licite sans excès nuisible, et respectons la chasteté et les règles des relations licites."],["Comment préserver tout notre corps ?","Nous couvrons notre ‘awra, évitons l’injustice, la désobéissance aux parents et l’usage de ce qui nous est illicite, et accomplissons nos devoirs."],["La piété inclut-elle la miséricorde envers les gens et les animaux ?","Oui ; elle inclut l’abandon de la nuisance et de l’injustice, la préservation des droits et des dépôts, et la miséricorde envers les créatures."],["Toute rigueur est-elle signe de piété ?","Non ; elle peut venir de l’ignorance ou de l’obsession, et peut mener à une faute."],["Qu’est-ce que la rigueur blâmable dans la purification ?","Répéter le lavage et la vérification sans raison, ou juger une chose impure sur un simple doute."],["Jugeons-nous une chose impure sur un simple doute ?","Non ; le principe est la pureté, et la certitude ne disparaît pas par le doute."],["Comment gérer les obsessions liées à la purification ?","Nous apprenons la règle, ne suivons pas le doute et prenons la facilité reconnue sans répétition inutile."],["Jugeons-nous un bien illicite sur un soupçon général ?","Non ; nous vérifions l’origine du bien et la validité du droit, sans nous fier à l’imagination."],["Comment rechercher le licite sans obsession ?","Nous délaissons l’interdit connu, vérifions en présence d’une preuve valable et ne doutons pas de chaque transaction."],["Comment connaître la règle des pratiques funéraires et du don de récompense ?","Nous interrogeons les savants sur chaque pratique et ses conditions, tenons compte des divergences et ne faisons pas d’une coutume une adoration parce qu’elle est répandue."],["Quel est le signe d’un cheminement juste sur la voie muhammadienne ?","Une foi saine, une science utile, l’obéissance et la sincérité, le bon caractère et le respect des droits des gens."]]},"es":{"secs":["El sentido del método muhammadí","Seguir al Profeta ﷺ y la moderación","La fe, el conocimiento y la intención","La piedad y la reforma del corazón","Las enfermedades del corazón y su cura","Las virtudes y el examen de sí","Guardar la lengua, los miembros y los derechos ajenos","El escrúpulo y la obsesión"],"qa":[["¿Qué es la vía muhammadí?","Es seguir al Profeta ﷺ en nuestra fe, nuestra adoración, nuestro carácter y nuestro trato con la gente."],["¿Cómo sabemos que nuestro camino hacia Dios es correcto?","Comparamos nuestras palabras y actos con la guía del Profeta ﷺ y corregimos lo que la contradice."],["¿Cuál es el objetivo del camino hacia Dios?","Buscar la complacencia de Dios y el éxito en la otra vida, reformando a la vez nuestras almas y nuestros actos."],["¿Qué es lo que más necesita el caminante?","Una fe sana, el conocimiento de lo que le es obligatorio y piedad en su corazón y sus actos."],["¿La piedad incluye el conocimiento y la fe?","Sí; parte de la piedad es corregir nuestra fe y aprender lo necesario para obedecer a Dios."],["¿Qué significa purificar el alma?","Dejar los rasgos malos, aprender los buenos y practicarlos."],["¿Cuáles son dos errores de los que debemos cuidarnos?","Adorar a Dios sin conocimiento, o conocer lo correcto y no practicarlo."],["¿Basta solo con mucha adoración?","No; también necesitamos sinceridad, buen carácter y respetar los derechos de los demás."],["¿Qué nos guía en nuestra religión?","El Corán y la Sunna, acudiendo a los sabios para comprender los dictámenes."],["¿Cómo nos aferramos al Corán?","Lo leemos y meditamos, cumplimos sus mandatos y nos alejamos de sus prohibiciones."],["¿Cómo seguimos la Sunna?","Aprendemos la guía del Profeta ﷺ y la practicamos en nuestra adoración y nuestra vida."],["¿Nos beneficiamos de la comprensión de los sabios?","Sí; nos beneficiamos de su conocimiento y su razonamiento, y del consenso y la analogía correcta."],["¿Cómo se manifiesta nuestro amor por el Profeta ﷺ?","Siguiéndolo, pidiendo bendiciones por él y adoptando su carácter."],["¿Está prohibido todo lo nuevo en nuestra vida?","No; los medios nuevos no son todos actos de adoración, y el dictamen depende de la cosa y de su uso."],["¿Convertimos un acto en adoración solo porque nos gusta?","No; comprobamos que sea legítimo y no le atribuimos un mérito especial sin prueba."],["¿Un sueño o una sensación espiritual hacen lícito lo prohibido?","No; no permiten hacer lo prohibido ni dejar lo obligatorio."],["¿La purificación del alma está separada de la Ley?","No; la verdadera purificación se basa en obedecer a Dios y seguir a Su Mensajero ﷺ."],["¿Qué significa la moderación en la adoración?","Adorar a Dios según podamos, perseverar y respetar nuestros derechos y los de los demás."],["¿Cuándo es excesivo el esfuerzo espiritual?","Cuando nos perjudica, hace descuidar un deber o un derecho, o nos lleva a abandonar la adoración."],["¿Imitamos toda práctica dura de la que oímos hablar?","No; comprobamos su autenticidad y legitimidad, teniendo en cuenta nuestra capacidad y nuestros deberes."],["¿Por qué empezamos corrigiendo la fe?","Porque la adoración requiere un conocimiento correcto de Dios y de lo que nos ha ordenado."],["¿Qué es lo más importante que aprender sobre la fe?","Lo relativo a Dios, Sus mensajeros, Su revelación, el destino y el Último Día, y lo que se nos exige en la fe."],["¿Cómo influye la fe en nuestra vida?","Nos impulsa a la obediencia y fortalece nuestro amor a Dios, nuestro temor de Él y nuestra esperanza en Él."],["¿Qué es el «conocimiento del estado»?","Aprender lo que necesitas ahora para que tu adoración y tus transacciones sean válidas."],["¿Todos necesitan el mismo conocimiento?","Compartimos los fundamentos de la religión, y cada uno necesita además los dictámenes propios de su trabajo y su situación."],["¿Cuál es la diferencia entre obligación individual y colectiva?","La individual obliga a cada persona afectada; la colectiva se cumple cuando suficientes personas la realizan para cubrir la necesidad de la comunidad."],["¿Aprender cualquier ciencia tiene el mismo dictamen?","No; hay conocimiento obligatorio, otro recomendable y otro prohibido."],["¿De qué conocimiento debemos cuidarnos?","Del que lleva a lo prohibido, al extravío o al daño, como la magia y la discusión inútil."],["¿Por qué buscamos el conocimiento?","Para complacer a Dios, corregir nuestros actos y beneficiar a la gente."],["¿Una buena intención hace lícito lo prohibido?","No; la intención debe ser buena y el acto también legítimo."],["¿Qué es la piedad (taqwa)?","Obedecer a Dios y alejarse de lo que Él prohibió, en tu corazón y en tus actos."],["¿Basta con dejar lo prohibido?","No; también hay que cumplir las obligaciones."],["¿Qué guardamos de los pecados?","El corazón, la lengua, el oído, la vista, las manos, el vientre, las partes íntimas, los pies y todo el cuerpo."],["¿Por qué nos importa el corazón?","Porque en él están nuestras intenciones y motivos, e influye en nuestras palabras y actos."],["¿Qué es el carácter (juluq)?","Un rasgo estable del alma que nos hace actuar de cierta manera con facilidad."],["¿Podemos cambiar nuestro carácter?","Sí; con aprendizaje, entrenamiento y esfuerzo, aunque lleve tiempo."],["¿Qué facultades influyen en nuestro carácter?","El pensamiento, la ira y el deseo; necesitamos orientarlos y dominarlos."],["¿Cuáles son las raíces del buen carácter?","La sabiduría, el valor, la castidad y la justicia."],["¿Cómo empezamos a curar un rasgo malo?","Lo comprendemos, conocemos su daño y sus causas, y luego aprendemos el rasgo bueno opuesto."],["¿Cómo descubrimos nuestros defectos?","Revisamos nuestra conducta, aceptamos el consejo sincero y aprovechamos la crítica justa."],["¿Cómo nos libramos de un rasgo malo?","Evitamos sus causas, nos ejercitamos en su opuesto bueno y lo repetimos."],["¿Cómo conservamos el buen carácter?","Seguimos practicándolo, acompañamos a los virtuosos y evitamos lo que lo estropea."],["¿Por qué aprendemos las enfermedades del corazón?","Para saber qué necesita reforma en nosotros y aprender a curarlo."],["¿Cuáles son algunos de los mayores corruptores del corazón?","La incredulidad, la innovación censurable, la ostentación, la soberbia, la envidia, la avaricia y el derroche."],["¿Cómo curamos la ignorancia?","Aprendemos de los sabios, preguntamos lo que no sabemos y no hablamos sin conocimiento."],["¿Cuál es el daño de seguir los caprichos?","Puede hacernos elegir lo que queremos en lugar de lo que complace a Dios."],["¿Cuándo es un error la imitación?","Cuando seguimos a alguien sin verificar en un asunto que lo requiere; preguntar a los sabios, en cambio, es necesario."],["¿Cuándo es dañino el amor al cargo?","Cuando lo buscamos para elevarnos sobre la gente o alcanzar lo prohibido."],["¿Cuál es el daño de preocuparse por el elogio y la censura de la gente?","Puede hacernos abandonar lo correcto o actuar para ganar su admiración."],["¿Cómo reducimos nuestro apego a la opinión ajena?","Buscamos la complacencia de Dios, aceptamos la crítica útil y no hacemos del elogio una meta."],["¿Qué es la ostentación (riya’)?","Realizar la adoración para que la gente nos admire o nos elogie."],["¿Qué impulsa la ostentación?","El amor al elogio y al prestigio, el miedo a lo que diga la gente y codiciar lo que tienen."],["¿Cuál es una señal oculta de la ostentación?","Esperar de la gente un respeto o servicio especial por nuestra adoración."],["¿Alegrarse de que la gente conozca nuestra buena obra es siempre ostentación?","No; podemos alegrarnos porque se beneficiaron de ella. Lo importante es revisar nuestra intención."],["¿Cómo curamos la ostentación?","Actuamos con sinceridad para Dios, revisamos nuestra intención y dejamos de buscar el elogio por nuestra adoración."],["¿Podemos mostrar una buena obra para que la gente nos imite?","Sí, si la obra es para Dios y mostrarla es legítimo y con intención de beneficiar a la gente."],["¿Qué significa la «larga esperanza» (tul al-amal)?","Absorberse en una vida larga que esperamos, aplazando el arrepentimiento y las obras para la otra vida."],["¿Cómo curamos la larga esperanza y la avidez?","Recordamos la muerte, actuamos hoy y fortalecemos el contentamiento y la confianza en Dios."],["¿Qué es la soberbia (kibr)?","Mirar por encima a la gente, o rechazar la verdad porque no queremos aceptarla."],["¿Cuál es la diferencia entre la autocomplacencia y la soberbia?","La autocomplacencia es engañarse con uno mismo; la soberbia es elevarse sobre los demás."],["¿Cómo curamos la autocomplacencia?","Recordamos que el bien viene de la ayuda de Dios, que lo necesitamos y que somos deficientes."],["¿Cuál es la diferencia entre la envidia y la sana emulación?","La envidia es desear que desaparezca la gracia del otro; la emulación es desear lo mismo sin que él la pierda."],["¿Cómo curamos la envidia?","Resistimos el deseo de que desaparezca la gracia y nos ejercitamos en amar el bien para la gente y hacerles bien."],["¿Cómo se convierte la ira en rencor?","Si la retenemos y alimentamos, puede volverse odio, enemistad y alegría por el daño ajeno."],["¿No debemos enfadarnos nunca?","Lo que se pide es dominar la ira y que no nos lleve a la injusticia ni al exceso."],["¿Cómo curamos la traición y la infidelidad?","Cumplimos lo confiado, mantenemos nuestras promesas, devolvemos los derechos y reparamos lo que estropeamos."],["¿Qué es la mala sospecha censurable?","Acusar a la gente de mal por una simple duda, sin prueba."],["¿Cómo evitamos a la vez la avaricia y el derroche?","Pagamos lo debido y gastamos en el bien con moderación, sin negar lo obligatorio ni derrochar."],["¿La renuncia (zuhd) significa dejar el trabajo y el dinero?","No; ganamos lícitamente y lo aprovechamos, sin que el apego nos aleje de obedecer a Dios."],["¿Cómo combinamos el temor y la esperanza?","Tememos nuestras faltas para no tomar el pecado a la ligera, y esperamos la misericordia de Dios para no desesperar."],["¿Qué es la paciencia?","Mantenerse firme en la obediencia, dejar el pecado y soportar la prueba sin excesos, esforzándose en lo que beneficia."],["¿Cómo agradecemos a Dios?","Reconocemos Su gracia, lo alabamos y usamos la gracia en lo que le complace."],["¿El contento significa no intentar cambiar nuestra situación?","No; aceptamos el decreto de Dios y nos esforzamos por mejorar y quitar el daño por medios lícitos."],["¿Qué es la confianza en Dios (tawakkul)?","Depender de Dios con el corazón mientras usamos los medios lícitos."],["¿La veracidad está solo en las palabras?","No; también está en la intención, las promesas, los actos y la lealtad."],["¿Cómo nos entrenamos en la obediencia?","Fijamos lo que queremos hacer, nos vigilamos y luego nos examinamos y corregimos las faltas."],["¿Qué es el compromiso (musharata)?","Fijarte un plan de obediencia y abandono del pecado, y decidirte a cumplirlo."],["¿Qué es la vigilancia (muraqaba)?","Recordar que Dios te ve y conoce tu estado, para cuidar tu intención y tus actos."],["¿Qué es el examen de sí (muhasaba)?","Repasar tu día: ¿qué hiciste bien? ¿En qué fallaste? ¿Qué vas a corregir?"],["¿Qué hacemos tras descubrir nuestras faltas?","Nos arrepentimos, corregimos el error y damos un paso para evitar que se repita, sin hacernos daño."],["¿Por qué cuidamos la lengua?","Porque nuestras palabras pueden reformar a la gente o herirla, preservar derechos o perderlos."],["¿Cuál es la diferencia entre la mentira, la murmuración y la calumnia?","La mentira es decir lo falso; la murmuración, mencionar a alguien con lo que le disgusta y es cierto; la calumnia, acusarlo de lo que no tiene."],["¿Qué es el chisme (namima)?","Transmitir palabras para estropear la relación entre la gente. Es distinto de avisar cuando hace falta evitar un daño."],["¿Cuál es la diferencia entre la discusión útil y la disputa censurable?","La útil busca la verdad y la solución; la censurable busca ganar o humillar."],["¿Las bromas, el elogio y la poesía están siempre prohibidos?","No; está permitido lo que está libre de lo prohibido, como la mentira y el daño, y del exceso censurable."],["¿Cómo mejoramos nuestro hablar en el trabajo, la enseñanza y la adoración?","Somos veraces, aprendemos los dictámenes y las normas de cortesía, corregimos la intención y no hablamos de lo que ignoramos."],["¿El silencio es siempre lo correcto?","No; hablar puede ser obligatorio para dar testimonio, enseñar lo necesario o aconsejar según sus condiciones."],["¿Cómo guardamos el oído y la vista?","Evitamos escuchar o mirar a propósito lo prohibido, teniendo en cuenta lo permitido por necesidad legítima."],["¿Cómo guardamos las manos y los pies?","No agredimos, no tomamos bienes injustamente ni caminamos hacia el pecado, y los usamos para el bien."],["¿Cómo guardamos el vientre y las partes íntimas?","Comemos lo lícito sin excesos dañinos y respetamos la castidad y las normas de las relaciones lícitas."],["¿Cómo guardamos todo el cuerpo?","Cubrimos nuestra ‘awra, evitamos la injusticia, la desobediencia a los padres y usar lo que no nos es lícito, y cumplimos los deberes."],["¿La piedad incluye la misericordia con la gente y los animales?","Sí; incluye dejar el daño y la injusticia, preservar los derechos y lo confiado, y la misericordia con las criaturas."],["¿Toda rigidez es señal de piedad?","No; puede venir de la ignorancia o de la obsesión, y puede llevar a una falta."],["¿Qué es la rigidez censurable en la purificación?","Repetir el lavado y la comprobación sin motivo, o considerar algo impuro por una simple duda."],["¿Juzgamos algo impuro por una simple duda?","No; el principio es la pureza, y la certeza no se elimina por la duda."],["¿Cómo manejamos las obsesiones sobre la purificación?","Aprendemos el dictamen, no seguimos la duda y tomamos la facilidad reconocida sin repeticiones innecesarias."],["¿Juzgamos ilícito un bien por una sospecha general?","No; verificamos el origen del bien y la validez del derecho, sin fiarnos de la imaginación."],["¿Cómo buscamos lo lícito sin obsesión?","Dejamos lo prohibido conocido, verificamos cuando hay una prueba válida y no dudamos de cada transacción."],["¿Cómo conocemos el dictamen de las prácticas tras la muerte y de regalar la recompensa?","Preguntamos a los sabios por cada práctica y sus condiciones, tenemos en cuenta las divergencias y no convertimos la costumbre en adoración por estar extendida."],["¿Cuál es la señal de un camino correcto en el método muhammadí?","Fe sana, conocimiento útil, obediencia y sinceridad, buen carácter y respeto de los derechos de la gente."]]},"ru":{"secs":["Смысл мухаммаданского пути","Следование Пророку ﷺ и умеренность","Вера, знание и намерение","Богобоязненность и исправление сердца","Болезни сердца и их лечение","Добродетели и самоотчёт","Охрана языка, органов и прав людей","Осмотрительность и навязчивые сомнения"],"qa":[["Что такое мухаммаданский путь?","Это следование Пророку ﷺ в вере, поклонении, нраве и обращении с людьми."],["Как узнать, что наш путь к Богу верен?","Мы сверяем слова и дела с руководством Пророка ﷺ и исправляем то, что ему противоречит."],["Какова цель пути к Богу?","Стремление к довольству Бога и успеху в вечной жизни, с исправлением себя и своих дел."],["Что больше всего нужно идущему?","Правильная вера, знание того, что ему вменено, и богобоязненность в сердце и делах."],["Включает ли богобоязненность знание и веру?","Да; к богобоязненности относится исправление веры и изучение того, что нужно для послушания Богу."],["Что означает очищение души?","Оставить дурные качества, научиться хорошим и следовать им."],["Каких двух ошибок нужно остерегаться?","Поклоняться Богу без знания или знать правильное и не следовать ему."],["Достаточно ли одного обилия поклонения?","Нет; нужны также искренность, благой нрав и соблюдение прав людей."],["Что ведёт нас в религии?","Коран и Сунна, с обращением к знающим людям для понимания положений."],["Как держаться Корана?","Читать его и размышлять, исполнять его веления и избегать запретов."],["Как следовать Сунне?","Изучать руководство Пророка ﷺ и следовать ему в поклонении и жизни."],["Полезно ли нам понимание учёных?","Да; мы пользуемся их знанием и доводами, а также единогласием и правильной аналогией."],["В чём проявляется любовь к Пророку ﷺ?","В следовании ему, благословениях в его адрес и подражании его нраву."],["Всё ли новое в жизни запрещено?","Нет; новые средства не являются поклонением, и решение зависит от вещи и её использования."],["Делаем ли мы что-то поклонением лишь потому, что нам нравится?","Нет; мы убеждаемся в его законности и не приписываем ему особой заслуги без довода."],["Делает ли сон или духовное ощущение запретное дозволенным?","Нет; они не разрешают ни совершать запретное, ни оставлять обязательное."],["Отделено ли очищение души от шариата?","Нет; истинное очищение основано на послушании Богу и следовании Его Посланнику ﷺ."],["Что означает умеренность в поклонении?","Поклоняться Богу по силам, быть постоянным и соблюдать свои права и права людей."],["Когда духовное усилие становится чрезмерным?","Когда оно вредит нам, губит обязанность или право или заставляет бросить поклонение."],["Подражаем ли мы каждой тяжёлой практике, о которой слышим?","Нет; мы проверяем её достоверность и законность, учитывая свои силы и обязанности."],["Почему мы начинаем с исправления веры?","Потому что поклонение требует верного знания о Боге и о том, что Он повелел."],["Что важнее всего изучить в вере?","То, что касается Бога, Его посланников, откровения, предопределения и Последнего дня, и обязательное для нас в вере."],["Как вера влияет на нашу жизнь?","Она побуждает к послушанию и укрепляет любовь к Богу, страх перед Ним и надежду на Него."],["Что такое «знание своего состояния»?","Изучать то, что нужно сейчас, чтобы поклонение и отношения были правильными."],["Нужно ли всем одно и то же знание?","Основы религии общие, а каждому нужны ещё положения, касающиеся его работы и положения."],["В чём разница между личной и коллективной обязанностью?","Личная обязательна для каждого, кого касается; коллективная исполнена, если её выполняет достаточно людей для нужды общины."],["Одинаково ли положение изучения любой науки?","Нет; одни знания обязательны, другие желательны, третьи запрещены."],["Какого знания следует остерегаться?","Того, что ведёт к запретному, заблуждению или вреду, например колдовства и бесполезных споров."],["Зачем мы ищем знание?","Чтобы угодить Богу, исправить свои дела и приносить пользу людям."],["Делает ли благое намерение запретное дозволенным?","Нет; намерение должно быть благим, а дело — дозволенным."],["Что такое богобоязненность (таква)?","Повиноваться Богу и сторониться запретного Им — в сердце и в делах."],["Достаточно ли оставить запретное?","Нет; нужно ещё исполнять обязанности."],["Что мы оберегаем от грехов?","Сердце, язык, слух, зрение, руки, живот, срамные части, ноги и всё тело."],["Почему мы заботимся о сердце?","Потому что в нём наши намерения и побуждения, и оно влияет на слова и дела."],["Что такое нрав (хулук)?","Устойчивое качество души, из-за которого мы легко поступаем определённым образом."],["Можно ли изменить нрав?","Да; учёбой, упражнением и усилием, пусть и со временем."],["Какие силы влияют на наш нрав?","Мышление, гнев и желание; их нужно направлять и обуздывать."],["Каковы основы благого нрава?","Мудрость, мужество, целомудрие и справедливость."],["Как начать лечить дурное качество?","Понять его, узнать его вред и причины, затем изучить противоположное благое качество."],["Как обнаружить свои недостатки?","Пересматривать поступки, принимать искренний совет и извлекать пользу из справедливой критики."],["Как избавиться от дурного качества?","Избегать его причин, упражняться в противоположном благом и повторять это."],["Как сохранить благой нрав?","Продолжать следовать ему, общаться с праведными и избегать того, что его портит."],["Зачем изучать болезни сердца?","Чтобы знать, что в нас требует исправления, и научиться это лечить."],["Что сильнее всего портит сердце?","Неверие, порицаемые нововведения, показуха, высокомерие, зависть, скупость и расточительство."],["Как лечить невежество?","Учиться у знающих, спрашивать о неизвестном и не говорить без знания."],["Чем вредно следование страстям?","Оно может заставить выбирать желаемое вместо угодного Богу."],["Когда подражание ошибочно?","Когда следуют за кем-то без проверки там, где она нужна; а спрашивать учёных — требуется."],["Когда любовь к должности вредна?","Когда её ищут, чтобы возвыситься над людьми или добраться до запретного."],["Чем вредна озабоченность похвалой и порицанием людей?","Она может заставить оставить правильное или действовать ради их восхищения."],["Как уменьшить привязанность к мнению людей?","Искать довольства Бога, принимать полезную критику и не делать похвалу целью."],["Что такое показуха (рия)?","Совершать поклонение, чтобы люди восхищались нами или хвалили."],["Что побуждает к показухе?","Любовь к похвале и положению, страх людских разговоров и жажда того, что у них."],["Каков скрытый признак показухи?","Ожидание особого уважения или услуг от людей из-за нашего поклонения."],["Всегда ли радость, что люди узнали о нашем добром деле, — показуха?","Нет; можно радоваться, что они получили пользу. Важно проверять своё намерение."],["Как лечить показуху?","Действовать искренне ради Бога, проверять намерение и перестать искать похвалы за поклонение."],["Можно ли показать доброе дело, чтобы люди брали пример?","Да, если дело ради Бога, а его показ дозволен и направлен на пользу людям."],["Что означает «долгая надежда» (тул аль-амаль)?","Увлечённость ожидаемой долгой жизнью, из-за чего откладывают покаяние и дела для вечности."],["Как лечить долгую надежду и алчность?","Помнить о смерти, действовать сегодня и укреплять довольство и упование на Бога."],["Что такое высокомерие (кибр)?","Превозноситься над людьми или отвергать истину, потому что не хочешь её принять."],["В чём разница между самолюбованием и высокомерием?","Самолюбование — обольщение собой; высокомерие — превозношение над другими."],["Как лечить самолюбование?","Помнить, что благо — от помощи Бога, что мы нуждаемся в Нём и что у нас есть упущения."],["В чём разница между завистью и белой завистью?","Зависть — желать, чтобы благо другого исчезло; белая зависть — желать такого же, не желая ему потери."],["Как лечить зависть?","Противиться желанию исчезновения блага и приучать себя любить людям добро и делать им добро."],["Как гнев превращается в злобу?","Если его держать и подпитывать, он может стать ненавистью, враждой и радостью чужой беде."],["Нельзя ли гневаться никогда?","Требуется сдерживать гнев и не позволять ему вести к несправедливости и посягательству."],["Как лечить предательство и неверность?","Возвращать доверенное, держать обещания, возвращать права и исправлять испорченное."],["Что такое порицаемое дурное мнение?","Обвинять людей во зле из-за одного сомнения, без доказательства."],["Как избежать и скупости, и расточительства?","Исполнять обязательные выплаты и тратить на благое умеренно, не удерживая должного и не транжиря."],["Означает ли аскетизм (зухд) отказ от работы и денег?","Нет; мы зарабатываем дозволенное и пользуемся им, не позволяя привязанности отдалить нас от Бога."],["Как сочетать страх и надежду?","Бояться упущений, чтобы не пренебрегать грехом, и надеяться на милость Бога, чтобы не отчаиваться."],["Что такое терпение?","Стойкость в послушании, отказ от греха и перенесение испытаний без нарушений, со стремлением к полезному."],["Как благодарить Бога?","Признавать Его милость, восхвалять Его и использовать милость в угодном Ему."],["Означает ли довольство отказ менять своё положение?","Нет; мы довольны предопределением и стремимся к улучшению и устранению вреда дозволенными путями."],["Что такое упование на Бога (таваккуль)?","Полагаться на Бога сердцем, используя дозволенные средства."],["Правдивость — только в словах?","Нет; она и в намерении, обещании, деле и верности."],["Как приучить себя к послушанию?","Определить, что хотим делать, следить за собой, затем отчитывать себя и исправлять упущения."],["Что такое мушарата (обязательство)?","Составить себе план послушания и отказа от греха и решиться его держаться."],["Что такое мурақаба (бдительность)?","Помнить, что Бог видит тебя и знает твоё состояние, и следить за намерением и делами."],["Что такое мухасаба (самоотчёт)?","Пересмотреть свой день: что сделал хорошо? В чём упустил? Что исправишь?"],["Что делать, обнаружив упущения?","Покаяться, исправить ошибку и принять меру против повторения, не причиняя себе вреда."],["Почему важно хранить язык?","Потому что слова могут исправить людей или ранить их, сохранить права или погубить их."],["В чём разница между ложью, злословием и клеветой?","Ложь — сказать неправду; злословие — упомянуть человека тем, что ему неприятно и что в нём есть; клевета — приписать ему то, чего в нём нет."],["Что такое наушничество (намима)?","Передача слов, чтобы испортить отношения людей. Это не то же, что необходимое сообщение ради предотвращения вреда."],["Чем полезное обсуждение отличается от порицаемого спора?","Полезное ищет истину и решение; порицаемое — победы или унижения."],["Всегда ли запрещены шутки, похвала и поэзия?","Нет; дозволено то, что свободно от запретного, вроде лжи и вреда, и от порицаемой чрезмерности."],["Как улучшить речь в работе, обучении и поклонении?","Быть правдивым, изучать положения и этикет, исправлять намерение и не говорить о том, чего не знаешь."],["Всегда ли молчание правильно?","Нет; говорить может быть обязательно — для свидетельства, необходимого обучения или совета при его условиях."],["Как хранить слух и зрение?","Не слушать и не смотреть намеренно на запретное, учитывая дозволенное при законной нужде."],["Как хранить руки и ноги?","Не нападать, не брать имущество несправедливо, не идти к греху и использовать их во благо."],["Как хранить живот и срамные части?","Есть дозволенное без вредного излишества, соблюдать целомудрие и положения дозволенных отношений."],["Как хранить всё тело?","Покрывать аурат, избегать несправедливости, непочтения к родителям и использования недозволенного, исполнять обязанности."],["Включает ли богобоязненность милосердие к людям и животным?","Да; она включает отказ от вреда и несправедливости, сохранение прав и доверенного и милосердие к творениям."],["Всякая ли строгость — признак богобоязненности?","Нет; она может исходить от невежества или наваждения и привести к нарушению."],["Что такое порицаемая строгость в очищении?","Повторять омовение и проверку без причины или считать вещь нечистой из-за сомнения."],["Считаем ли мы вещь нечистой из-за одного сомнения?","Нет; исходное — чистота, а уверенность не снимается сомнением."],["Как справляться с наваждениями в очищении?","Изучить положение, не поддаваться сомнению и пользоваться признанным облегчением без лишних повторов."],["Считаем ли мы имущество запретным из-за общего подозрения?","Нет; мы проверяем источник имущества и правомерность права на него, не полагаясь на домыслы."],["Как стремиться к дозволенному без наваждения?","Оставлять известное запретное, проверять при наличии весомого довода и не сомневаться в каждой сделке."],["Как узнать положение о действиях после смерти и дарении награды?","Спрашивать учёных о каждом действии и его условиях, учитывать разногласия и не делать обычай поклонением из-за его распространённости."],["Каков признак верного пути по мухаммаданскому методу?","Правильная вера, полезное знание, послушание и искренность, благой нрав и соблюдение прав людей."]]}}};
const qaDayIdx=(d)=>{const x=new Date((d||nowStr())+'T00:00:00Z').getTime()/864e5;return [(x*2)%100,(x*2+1)%100]};
let qaSec=-1,qaFocus=null;
const qaT=i=>{const T=LANG!=='ar'&&QA.tr&&QA.tr[LANG];return T?T.qa[i]:[QA.qa[i][1],QA.qa[i][2]]};
const qaSecT=k=>{const T=LANG!=='ar'&&QA.tr&&QA.tr[LANG];return T?T.secs[k]:QA.secs[k]};
const qaDir=()=>LANG==='ar'?'dir="rtl" lang="ar"':'dir="ltr" lang="'+LANG+'"';
function qaCard(i,big){const [q,a]=qaT(i),seen=(S.qaSeen||[]).includes(i);
  return `<button class="qa-card${big?' big':''}${qaFocus===i?' focus':''}" data-qa="${i}" id="qa-${i}" aria-label="${i+1}"><span class="qa-in"><span class="qa-f"><span class="qa-n">${i+1}${seen?' ✓':''}</span><b class="notr" ${qaDir()}>${q}</b><small class="qa-hint">اضغط لرؤية الجواب</small></span><span class="qa-b"><span class="qa-n">الجواب</span><span class="notr" ${qaDir()}>${a}</span><small class="qa-hint">اضغط للعودة إلى السؤال</small></span></span></button>`}
function viewQA(){const [m,e]=qaDayIdx(),seen=(S.qaSeen||[]).length;
  const list=QA.qa.map((x,i)=>i).filter(i=>qaSec<0||QA.qa[i][0]===qaSec);
  return `<section><div class="sh"><h2>سؤالا اليوم</h2><span dir="ltr">${seen} / 100</span></div>
   <div class="qa-day"><div><p class="meta">بعد الفجر</p>${qaCard(m,1)}</div><div><p class="meta">بعد العشاء</p>${qaCard(e,1)}</div></div></section>
  <section><div class="sh"><h2>كل الأسئلة</h2></div>
   <div class="qa-chips"><button class="${qaSec<0?'on':''}" data-qasec="-1">الكل</button>${QA.secs.map((t,k)=>`<button class="${qaSec===k?'on':''} notr" data-qasec="${k}">${qaSecT(k)}</button>`).join('')}</div>
   ${(qaSec<0?QA.secs.map((t,k)=>k):[qaSec]).map(k=>`<h3 class="qa-sh notr">${qaSecT(k)}</h3><div class="qa-grid">${list.filter(i=>QA.qa[i][0]===k).map(i=>qaCard(i)).join('')}</div>`).join('')}
   <p class="meta" style="margin-top:12px">يصلك سؤال بعد الفجر بربع ساعة وآخر بعد العشاء بنصف ساعة، إذا فعّلت «سؤال وجواب» في التذكيرات.</p></section>`}

const QALB=[{"id":"ghafla","n":"الغفلة","v":"﴿وَلَا تَكُن مِّنَ الْغَافِلِينَ﴾","q":["تمرّ عليك ساعات طويلة لا تذكر الله فيها؟","تصلّي وقلبك مشغول بغير الصلاة؟","تبدأ أعمالك دون أن تستحضر نيتها؟"],"act":"جدّد نيتك قبل كل عمل، وقف وقفة حضور مع الله عند كل ساعة.","wird":["لا إله إلا الله",100],"mh":"هل تحرّكت فيّ الغفلة اليوم؟ وماذا فعلت حين انتبهت؟","learn":["حقيقتها: الغفلة أن ينشغل القلب عن الله وعن الآخرة بما هو فيه، فيمضي العبد يومه دون أن يستحضر ربه ولا مقصده.","علاماتها: أن تمرّ الساعات بلا ذكر، وأن تُؤدّى العبادة بلا حضور، وأن يُفعل الشيء بحكم العادة لا بالنية.","أسبابها: كثرة الانشغال بالدنيا، وكثرة الكلام والخلطة، والسهر، وطول الأمل، وترك الأوراد.","خطرها: ﴿وَلَا تُطِعْ مَنْ أَغْفَلْنَا قَلْبَهُ عَن ذِكْرِنَا وَاتَّبَعَ هَوَاهُ وَكَانَ أَمْرُهُ فُرُطًا﴾. الغفلة باب المعاصي، لأن من نسي نظر الله إليه قلّ حياؤه منه.","علاجها: دوام الذكر، وتجديد النية قبل كل عمل، ومراقبة الله، وتذكّر الموت، وصحبة الذاكرين.","ضدّها الحضور واليقظة: أن تكون مع الله في كل حال. ﴿الَّذِينَ يَذْكُرُونَ اللَّهَ قِيَامًا وَقُعُودًا وَعَلَىٰ جُنُوبِهِمْ﴾"]},{"id":"riya","n":"الرياء","v":"﴿فَمَن كَانَ يَرْجُو لِقَاءَ رَبِّهِ فَلْيَعْمَلْ عَمَلًا صَالِحًا وَلَا يُشْرِكْ بِعِبَادَةِ رَبِّهِ أَحَدًا﴾","q":["إذا علمت أن أحدًا يراك وأنت تصلّي، هل تُحسن صلاتك أكثر مما تفعل وحدك؟","تحب أن يعرف الناس عباداتك وأعمالك الصالحة؟","يفتر عملك إذا لم يره أحد ولم يُمدح؟"],"act":"اعمل كل يوم عملًا صالحًا خفيًّا لا يعلمه أحد غير الله.","wird":["اللهم إني أعوذ بك أن أشرك بك وأنا أعلم، وأستغفرك لما لا أعلم",3],"mh":"هل عملت اليوم شيئًا لأجل نظر الناس؟ وهل عملت عملي الخفي؟","learn":["حقيقته: الرياء أن تفعل العبادة ليراك الناس فيعجبوا بك أو يمدحوك.","علاماته: أن تُحسن العمل حين تُرى، وأن تنتظر احترامًا أو خدمة خاصة بسبب عبادتك، وأن تفتر إذا خلوت.","أسبابه: حب المدح والمكانة، والخوف من كلام الناس، والطمع فيما في أيديهم.","خطره: قال ﷺ: «إن أخوف ما أخاف عليكم الشرك الأصغر». قالوا: وما الشرك الأصغر؟ قال: «الرياء» (رواه أحمد).","علاجه: الإخلاص، وإخفاء ما يُستحبّ إخفاؤه من العمل، ومراجعة النية، وأن تعلم أن الناس لا ي "]},{"id":"hiqd","n":"الحقد","v":"﴿وَلَا تَجْعَلْ فِي قُلُوبِنَا غِلًّا لِّلَّذِينَ آمَنُوا﴾","q":["تتذكر إساءة من أساء إليك زمنًا طويلًا؟","تفرح إذا أصابت من أساء إليك مصيبة؟","تهجر من بينك وبينه خلاف أيامًا طويلة؟"],"act":"ادعُ باسمه لمن أساء إليك، واعفُ عنه في قلبك قبل النوم.","wird":["ربنا اغفر لنا ولإخواننا الذين سبقونا بالإيمان ولا تجعل في قلوبنا غلًّا للذين آمنوا",7],"mh":"هل بقي في قلبي اليوم شيء على أحد؟ وهل دعوت له؟","learn":["حقيقته: الحقد أن تحتفظ بالغضب وتغذّيه حتى يصير كراهية وعداوة.","علاماته: تذكّر الإساءة طويلًا، والفرح بأذى من أساء، والهجر، وسوء الظن به.","أسبابه: الغضب الذي لم يُعالَج، وحب الانتصار للنفس، وكثرة التفكير في الإساءة.","خطره: قال ﷺ: «لا يحلّ لمسلم أن يهجر أخاه فوق ثلاث» (متفق عليه).","علاجه: العفو والدعاء لمن أساء: ﴿وَلْيَعْفُوا وَلْيَصْفَحُوا أَلَا تُحِبُّونَ أَن يَغْفِرَ اللَّهُ لَكُمْ﴾","ضدّه سلامة الصدر: أن تبيت وليس في قلبك غشّ لأحد."]},{"id":"hasad","n":"الحسد","v":"«لا تحاسدوا… وكونوا عباد الله إخوانًا» (رواه مسلم)","q":["تضيق إذا رأيت نعمة عند غيرك؟","تبحث عن عيب فيمن أُعطي ما لم تُعطَ؟","يسرّك أن تزول نعمة عن غيرك؟"],"act":"ادعُ لمن تحسده بالبركة، واذكر محاسنه.","wird":["ما شاء الله، اللهم بارك له",33],"mh":"هل ضقت اليوم بنعمة عند أحد؟ وهل دعوت له بالبركة؟","learn":["حقيقته: الحسد أن تتمنى زوال نعمة غيرك. أما الغبطة فأن تتمنى مثلها دون أن تزول عنه، وهي جائزة.","علاماته: الضيق بنعمة الغير، والبحث عن عيوب المحسود، والفرح بزوال النعمة عنه.","أسبابه: ضعف الرضا بقسمة الله، والكبر، والمنافسة على الدنيا.","خطره: ﴿أَمْ يَحْسُدُونَ النَّاسَ عَلَىٰ مَا آتَاهُمُ اللَّهُ مِن فَضْلِهِ﴾. والحسد اعتراض على قسمة الله.","علاجه: أن تقاوم تمنّي زوال النعمة، وتدرّب نفسك على حب الخير للناس والإحسان إليهم.","ضدّه حب الخير للناس: «لا يؤمن أحدكم حتى يحبّ لأخيه ما يحبّ لنفسه» (متفق عليه)."]},{"id":"dunya","n":"حب الدنيا والشح","v":"﴿وَمَن يُوقَ شُحَّ نَفْسِهِ فَأُولَٰئِكَ هُمُ الْمُفْلِحُونَ﴾","q":["تحزن لفوات المال أكثر من حزنك لفوات الطاعة؟","تتردد كثيرًا قبل أن تتصدق؟","تشغلك أمور الرزق عن عبادتك؟"],"act":"تصدّق كل يوم ولو بقليل، وتذكّر الموت.","wird":["اللهم لا عيش إلا عيش الآخرة",33],"mh":"هل تصدّقت اليوم؟ وهل شغلتني الدنيا عن طاعة؟","learn":["حقيقته: أن يتعلّق القلب بالدنيا حتى يقدّمها على الآخرة، ويبخل بما وجب أو استُحبّ إنفاقه.","علاماته: الحزن لفوات المال أكثر من فوات الطاعة، والتردد في الصدقة، وطول الأمل.","أسبابه: نسيان الموت، والغفلة عن الآخرة، والخوف من الفقر.","خطره: ﴿وَمَا الْحَيَاةُ الدُّنْيَا إِلَّا مَتَاعُ الْغُرُورِ﴾","علاجه: الصدقة، وذكر الموت: «أكثروا ذكر هاذم اللذات» (رواه الترمذي)، والقناعة. والزهد لا يعني ترك العمل والكسب الحلال.","ضدّه الزهد والسخاء: أن تكون الدنيا في يدك لا في قلبك."]},{"id":"kibr","n":"الكبر","v":"«لا يدخل الجنة من كان في قلبه مثقال ذرة من كبر» (رواه مسلم)","q":["يصعب عليك قبول النصيحة ممن هو أصغر منك؟","ترى نفسك خيرًا من غيرك؟","يثقل عليك الاعتراف بخطئك أمام الناس؟"],"act":"اقبل نصيحة، واخدم من هو دونك، وابدأ بالسلام.","wird":["سبحان ربي الأعلى",33],"mh":"هل رددت حقًّا اليوم، أو تعاليت على أحد؟","learn":["حقيقته: قال ﷺ: «الكبر بَطَر الحق وغَمْط الناس» (رواه مسلم)، أي ردّ الحق واحتقار الناس.","علاماته: ردّ النصيحة، والتعالي على الناس، وصعوبة الاعتراف بالخطأ.","أسبابه: العجب بالعلم أو المال أو النسب أو المنصب، ونسيان أصل الإنسان ومصيره.","خطره: الكبر آخر ما يخرج من القلب، وهو الذي منع إبليس من السجود.","علاجه: التواضع وخدمة الناس وقبول الحق: «وما تواضع أحد لله إلا رفعه» (رواه مسلم).","ضدّه التواضع: أن تقبل الحق ممن جاء به، ولا ترى لنفسك فضلًا على أحد."]}];

const normAr=s=>String(s||'').toLowerCase().replace(/[ً-ٰٟـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي');
function allSlips(){const out=[];
  ORGANS.forEach(g=>(S.organs[g.id].slips||[]).forEach(s=>out.push({date:s.date,org:g.name,oid:g.id,reason:s.reason||''})));
  const P=prepState();Object.keys(P.log||{}).forEach(d=>PREP.forEach(x=>{if(P.log[d][x.id]==='fail')out.push({date:d,org:'المرحلة التمهيدية',oid:'prep',reason:((P.log[d].notes||{})[x.id])||''})}));
  return out.sort((a,b)=>a.date<b.date?1:-1)}
const slipCands=t=>[t,t.replace(/^(وال|بال|فال|كال|لل|ال)/,''),t.replace(/^[وفبل]/,''),t.replace(/^[وفبل]ال/,'')];
function slipCats(reason){const toks=normAr(reason).split(/[^\p{L}]+/u).filter(Boolean);
  return SLIP_CATS.filter(c=>c.w.some(w=>{const k=normAr(w).replace(/^ال/,'');return toks.some(t=>slipCands(t).some(x=>x===k||(k.length>=3&&x.startsWith(k))))}))}

function viewTahlil(){
  const L=allSlips();
  if(!L.length)return `<section><div class="box pad"><b>لا توجد زلّات مسجّلة بعد</b><p class="muted" style="margin:6px 0 0">كلما سجّلت زلّة في جارحة أو إخفاقًا في المرحلة التمهيدية مع سببها، يظهر لك هنا ما يتكرر في أسبابك، فتعرف موضع ضعفك وتسدّ بابه.</p></div></section>`;
  const withR=L.filter(s=>s.reason.trim()),cc={},ex={};
  withR.forEach(s=>{const cs=slipCats(s.reason);(cs.length?cs:[{id:'other',t:'أسباب أخرى'}]).forEach(c=>{cc[c.id]=(cc[c.id]||0)+1;(ex[c.id]=ex[c.id]||[]).push(s)})});
  const name=id=>(SLIP_CATS.find(c=>c.id===id)||{t:'أسباب أخرى'}).t;
  const cats=Object.keys(cc).sort((a,b)=>(a==='other')-(b==='other')||cc[b]-cc[a]);
  const max=Math.max(1,...Object.values(cc));
  const oc={};L.forEach(s=>oc[s.org]=(oc[s.org]||0)+1);const orgs=Object.keys(oc).sort((a,b)=>oc[b]-oc[a]);
  const wd=[0,0,0,0,0,0,0];L.forEach(s=>wd[new Date(s.date+'T12:00:00').getDay()]++);const wmax=Math.max(...wd),wi=wd.indexOf(wmax);
  const top=cats.find(c=>c!=='other');
  const bar=(label,n,m,cls)=>`<div class="tb-row"><span class="tb-l">${label}</span><span class="tb-bar"><i class="${cls||''}" style="width:${Math.round(n/m*100)}%"></i></span><b class="tb-n">${n}</b></div>`;
  return `<section><div class="box pad tb-sum"><b>${L.length}</b><span class="muted">زلّة مسجّلة، منها ${withR.length} مع سببها</span></div>
   ${top?`<div class="box pad tb-key"><span class="muted">أكثر ما يتكرر في أسبابك</span><b>${name(top)}</b><p class="muted" style="margin:4px 0 0">ابدأ من هنا: اجعل لهذا الباب خطة صغيرة واضحة، فإن سدّه يحفظ أكثر من جارحة.</p></div>`:''}</section>
   <section><div class="sh"><h2>أسباب الزلّات</h2></div><div class="box pad">${cats.map(c=>bar(name(c),cc[c],max,c==='other'?'o':'')).join('')}</div>
   <p class="meta">تُصنَّف الأسباب تلقائيًا من الكلمات التي كتبتها، وقد يدخل السبب الواحد في بابين.</p></section>
   <section><div class="sh"><h2>الجوارح الأكثر زللًا</h2></div><div class="box pad">${orgs.map(o=>bar(o,oc[o],oc[orgs[0]])).join('')}</div>
   ${wmax>1?`<p class="meta"><span>أكثر الأيام زللًا: يوم</span> <b>${WDAYS[wi]}</b></p>`:''}</section>
   <section><div class="sh"><h2>أمثلة من أسبابك</h2></div>${cats.slice(0,4).map(c=>`<details class="slips"><summary>${name(c)} <span>(${cc[c]})</span></summary><ol>${ex[c].slice(0,5).map(s=>`<li><div class="sl-h"><b>${fmtD(s.date)}</b><span class="pill p-tathir">${s.org}</span></div><p><span class="notr" dir="auto">${esc(s.reason)}</span></p></li>`).join('')}</ol></details>`).join('')}</section>`;
