const DAY=864e5;
function emptyMarks(){return{sabah:{},masa:{},dhikr:[],quran:[],khalwa:[],dhikrText:'',dhikrList:[]}}
const atH=(dateStr,h)=>{const d=new Date(dateStr+'T00:00:00');d.setMinutes(Math.round(h*60));return d.getTime()};
const nowStr=()=>ds(new Date());
/* the day of works starts at Fajr: before Fajr we are still in yesterday's day */
function dayKey(){const n=new Date(),h=n.getHours()+n.getMinutes()/60;let f=5;try{f=prayerTimes(n).fajr}catch(e){}return h<f?ds(new Date(n.getTime()-864e5)):ds(n)}
/* hours since the start of the current day of works (past midnight counts as 24+) */
const dH=()=>{const n=new Date(),h=n.getHours()+n.getMinutes()/60;return ds(n)!==TODAY?h+24:h};
const ptDay=()=>prayerTimes(new Date(TODAY+'T12:00:00'));
function period(){
  const now=new Date(),t=now.getTime(),today=ds(now),pt=prayerTimes(now);
  const fajr=atH(today,pt.fajr),magh=atH(today,pt.maghrib-0.25); // evening adhkar open 15 min before Maghrib
  if(t>=fajr&&t<magh)return{kind:'sabah',key:today,start:fajr,end:magh,endName:'المغرب'};
  if(t>=magh){const tm=addDays(today,1);return{kind:'masa',key:today,start:magh,end:atH(tm,prayerTimes(new Date(tm+'T12:00:00')).fajr),endName:'الفجر'}}
  const y=addDays(today,-1);return{kind:'masa',key:y,start:atH(y,prayerTimes(new Date(y+'T12:00:00')).maghrib-0.25),end:fajr,endName:'الفجر'};
}
const lastTs=a=>a.length?Math.max(...a):0;
function lights(){
  const M=S.marks,p=period(),t=Date.now();
  const halo=!!M[p.kind][p.key];
  const hq=lastTs(M.quran),hd=lastTs(M.dhikr),kh=M.khalwa.length?Math.max(...M.khalwa.map(k=>k.ts)):0;
  return{p,halo,head:t-hq<DAY,headEnd:hq+DAY,heart:t-hd<DAY,heartEnd:hd+DAY,body:t-kh<30*DAY,bodyEnd:kh+30*DAY,
    quranToday:M.quran.some(x=>ds(new Date(x))===nowStr()),dhikrToday:M.dhikr.some(x=>ds(new Date(x))===nowStr())};
}
const litCount=()=>{const l=lights();return[l.halo,l.heart,l.head,l.body].filter(Boolean).length};
const tHM=ts=>{const d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes())};
const dayLbl=ts=>{const s=ds(new Date(ts));return s===nowStr()?'اليوم':s===addDays(nowStr(),1)?'غدًا':fmtD(s)};
function syncWird(id,on,dateKey){const k=dateKey||nowStr();const L=S.log[k]||(S.log[k]={awrad:[],heart:null,note:''});
  L.awrad=on?[...new Set([...L.awrad,id])]:L.awrad.filter(x=>x!==id)}
let lightConfirm=null;

function figureSVG(l){
  const W=320,H=710;
  return `<svg class="figure" viewBox="-70 -45 460 800" role="img" aria-label="حالتك الروحية اليومية: ${[l.halo?'الهالة مضيئة':'الهالة مطفأة',l.head?'الرأس مستنير':'',l.heart?'القلب مستنير':'',l.body?'الجسد كله مستنير':''].filter(Boolean).join('، ')}">
   <defs>
    <mask id="bm" maskUnits="userSpaceOnUse" x="-70" y="-45" width="460" height="800"><image href="${BODY_MASK}" x="0" y="0" width="${W}" height="${H}"/></mask>
    <filter id="haloF" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="haloF2" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7"/></filter>
    <radialGradient id="gHeart"><stop offset="0" stop-color="#fff8dc"/><stop offset=".35" stop-color="#f6e3a8" stop-opacity=".9"/><stop offset="1" stop-color="#f6e3a8" stop-opacity="0"/></radialGradient>
    <radialGradient id="gHead"><stop offset="0" stop-color="#fffbe8"/><stop offset=".45" stop-color="#f6e3a8" stop-opacity=".85"/><stop offset="1" stop-color="#f6e3a8" stop-opacity="0"/></radialGradient>
    <radialGradient id="gBody" cx="50%" cy="35%" r="75%"><stop offset="0" stop-color="#fffaf0"/><stop offset=".55" stop-color="#f6e6b8"/><stop offset="1" stop-color="#e6cf92"/></radialGradient>
   </defs>
   ${l.halo||l.body?`<g class="halo"><g filter="url(#haloF)" opacity="${l.body?1:.9}"><rect x="-70" y="-45" width="460" height="800" fill="#ffe39a" mask="url(#bm)"/></g><g filter="url(#haloF2)" opacity=".85"><rect x="-70" y="-45" width="460" height="800" fill="#fff1c4" mask="url(#bm)"/></g></g>`:''}
   <g mask="url(#bm)">
    <rect x="0" y="0" width="${W}" height="${H}" fill="#6f8b94"/>
    ${l.body?`<rect class="bodylit" x="0" y="0" width="${W}" height="${H}" fill="url(#gBody)" opacity=".92"/>`:''}
    ${l.heart?`<ellipse class="pulse" cx="159" cy="246" rx="78" ry="118" fill="url(#gHeart)"/>`:''}
    ${l.head?`<circle class="pulse" cx="159" cy="62" r="80" fill="url(#gHead)"/>`:''}
   </g>
  </svg>`;
}
function lightRow(on,title,desc,status,actions){
  return `<div class="lrow${on?' on':''}"><i class="lamp" aria-hidden="true"></i><div class="t"><b>${title}</b><small>${desc}</small><span class="st">${status}</span>${actions?`<div class="btns">${actions}</div>`:''}</div></div>`;
}
function viewMuraqabat(){
  const l=lights(),n=litCount();
  const msg=n===4?'اكتمل نورك: الهالة والرأس والقلب والجسد كله.':n===0?'الصورة مطفأة. كل عمل تقوم به يضيء جزءًا منها.':`${n} من 4 أنوار مضيئة الآن.`;
  const chip=(on,name,until)=>`<span class="${on?'on':''}">${name}${on&&until?` · حتى ${until}`:''}</span>`;
  return `<section><div class="figure-box">${figureSVG(l)}<p class="fig-msg">${msg}</p>
   <div class="fig-legend">${chip(l.halo,'الهالة',`${l.p.endName}`)}${chip(l.head,'الرأس',tHM(l.headEnd))}${chip(l.heart,'القلب',tHM(l.heartEnd))}${chip(l.body,'الجسد كله',fmtD(ds(new Date(l.bodyEnd))))}</div></div></section>`;
}
function setLight(kind,on){
  const M=S.marks,p=period(),t=Date.now(),today=nowStr();
  if(kind==='halo'){if(on){M[p.kind][p.key]=t}else delete M[p.kind][p.key];syncWird(p.kind,on,p.key)}
  else{M[kind]=M[kind].filter(x=>ds(new Date(x))!==today);if(on)M[kind].push(t);if(kind==='quran')syncWird('quran',on)}
  save();render();
}
/* ---------- five prayers, one row ---------- */
const FIVE=[['fajr','الصبح'],['dhuhr','الظهر'],['asr','العصر'],['maghrib','المغرب'],['isha','العشاء']];
/* the day shown in «الأعمال»: today (null) or a past date the seeker reviews or corrects */
let aDate=null;
const aLog=()=>aDate?(S.log[aDate]||(S.log[aDate]={awrad:[],heart:null,note:''})):dayLog();
function aDateBar(){const D=aDate||TODAY,min=addDays(TODAY,-365);
  return `<div class="ad-bar"><button class="iconbtn sm" data-adate="-1" aria-label="اليوم السابق"${D<=min?' disabled':''}><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
   <label class="ad-in"><input type="date" id="aDateIn" value="${D}" max="${TODAY}" min="${min}"><span><b>${aDate?fmtD(D):'<span>اليوم</span> · '+fmtD(D)}</b><small>${aDate?WDAYS[new Date(D+'T12:00:00').getDay()]:'اضغط لاختيار يوم آخر'}</small></span></label>
   <button class="iconbtn sm" data-adate="1" aria-label="اليوم التالي"${aDate?'':' disabled'}><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button></div>
   ${aDate?`<div class="ad-note"><span>تراجع أعمال يوم مضى. ما تغيّره هنا يُحفظ في سجلّ ذلك اليوم.</span><button class="btn small ok" data-adate="0">العودة إلى اليوم</button></div>`:''}`}
const prLate=(L,D)=>{const pr=(L&&L.prayers)||[];if(D&&D<TODAY)return FIVE.map(f=>f[0]).filter(k=>!pr.includes(k));const pt=ptDay(),h=dH();return FIVE.filter(([k])=>!pr.includes(k)&&h>=pt[k]).map(f=>f[0])};

function viewSura(){

  const W=340,H=150,pl=32,pb=22,pt=10,bw=(W-pl-6)/14,y=v=>pt+(H-pt-pb)*(1-v);
  let svg=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="نسبة إتمام الأوراد في آخر 14 يومًا">`;
  [0,.5,1].forEach(v=>{svg+=`<line x1="${pl}" x2="${W-4}" y1="${y(v)}" y2="${y(v)}" stroke="var(--card-line)"/><text x="${pl-6}" y="${y(v)+4}" font-size="10" fill="var(--muted)" text-anchor="end">${v*100}%</text>`});
  vals.forEach((v,i)=>{const x=pl+4+i*bw,h=Math.max(2,(H-pt-pb)*v),isT=i===13;
    svg+=`<rect x="${x}" y="${y(v)-(h-(H-pt-pb)*v)}" width="${bw-6}" height="${h}" rx="3" fill="${isT?'var(--amber)':'var(--teal)'}"/>`;
    if(i%2===1||isT)svg+=`<text x="${x+(bw-6)/2}" y="${H-6}" font-size="9" fill="var(--muted)" text-anchor="middle">${isT?'اليوم':+days[i].slice(8)}</text>`});
  svg+='</svg>';
  const logged=days.filter(d=>S.log[d]&&S.log[d].awrad.length).length;
  const avg=Math.round(vals.reduce((a,b)=>a+b,0)/14*100);
  const dDays=new Set(S.marks.dhikr.map(x=>ds(new Date(x))).filter(d=>d>=days[0])).size;
  const weak=AWRAD.map(a=>({a,n:days.filter(d=>S.log[d]&&S.log[d].awrad.includes(a.id)).length})).sort((p,q)=>p.n-q.n)[0];

  return heartSection()+`<section><div class="stats"><div class="stat"><b>${avg}%</b><span>متوسط الأوراد</span></div><div class="stat"><b>${logged}</b><span>أيام عامرة</span></div><div class="stat"><b>${dDays}</b><span>أيام الذكر الشخصي</span></div></div>

const TQ={"ar":{"title":"الطريقة المحمدية","sub":"تعريف شامل بأصولها وأركانها وأبوابها ومسائلها العملية","note":"<b>تنبيه منهجي:</b> هذا عرض تعريفي جامع للطريقة المحمدية، يضم أصولها وأركانها ومجالاتها العملية. وفي المسائل الفقهية والعقدية المختلف فيها ينبغي الرجوع إلى أهل العلم المعتبرين، كما ينبغي التثبت من درجة الأحاديث والآثار قبل الاستدلال بها.","secs":[{"t":"أولاً: التعريف بالطريقة المحمدية ومقصدها العام","b":[["p","<b>الطريقة المحمدية</b> ليست اسماً لطريقة صوفية مؤسسة على أوراد خاصة أو انتساب إلى شيخ بعينه، بل هي اسم للمنهج الإسلامي الجامع الذي يقوم عليه نجاة المسلم وصلاحه: <b>عقيدة صحيحة، وعبادة موافقة للسنة، وأخلاق وسلوك منضبطان بالكتاب والسنة، مع اجتناب الغلو والتفريط والبدع</b>."],["p","والسيرة النبوية هي التطبيق العملي لهذا المنهج في حياة النبي ﷺ: عقائده وأقواله وأفعاله وأخلاقه وعبادته وتعامله مع الناس. والمقصود أن يعرض السالك عمله على هذه السيرة، فيعرف هل هو مصيب متبع أم مخطئ مبتدع؛ ولهذا يُعرض عمل كل سالك على هذا المنهج، حتى يتميز المصيب من المخطئ، والناجي من الهالك."],["p","ظهر هذا المنهج استجابةً لحال فريقين متقابلين:"],["ul",["<b>متنسكون جهال:</b> يكثرون من صور العبادة والرياضات، لكنهم يجهلون حدود الشرع، فيقعون في البدع والغلو.","<b>علماء أو متعلمون غافلون:</b> عندهم معرفة أو انتساب إلى العلم، لكنهم يفرطون في العمل، وتغلب عليهم الدنيا والهوى."]],["p","ويعيد هذا المنهج المسلم إلى <b>الوسط بين الإفراط والتفريط</b>، وإلى المرجعية الحاسمة: القرآن والسنة وفهم السلف، لا العادات، ولا الأذواق، ولا الدعاوى الباطنية، ولا مجرد كثرة العبادة."]]},{"t":"ثانياً: أركان الطريقة المحمدية الثلاثة","b":[["p","تقوم الطريقة المحمدية على ثلاثة أبواب كبرى، وهي أركان المنهج:"],["h","1. الاعتصام بالكتاب والسنة"],["p","القرآن أصل الهداية، والشفاء، والنور، والميزان الذي يرد إليه الاعتقاد والعبادة والسلوك. والسنة ليست أمراً زائداً يمكن الاستغناء عنه؛ فهي بيان القرآن، وفيها أوامر النبي ﷺ ونواهيه وتفصيلاته العملية."],["p","ويشمل الاعتصام:"],["ul",["تعظيم القرآن وتلاوته وفهمه والعمل به، لا الاقتصار على التلاوة الصوتية.","قبول السنة الصحيحة ولو لم توافق عادة الناس أو رأياً مذهبياً جزئياً.","اتباع سنة النبي ﷺ وسنة الخلفاء الراشدين وفهم الصحابة.","ردّ كل قول أو ذوق أو كشف أو عادة يخالف نصاً صحيحاً أو حكماً شرعياً ثابتاً.","الرجوع إلى العلماء الثقات عند الاشتباه، وعدم أخذ الدين من الجهلة أو أصحاب الدعاوى."]],["h","2. الاحتراز عن العادات السيئة والبدع المحدثة"],["p","لا يكفي أن يدعي الإنسان محبة السنة؛ بل يجب أن يترك ما يزاحمها من عادات فاسدة وبدع في الاعتقاد أو العبادة أو الأخلاق. ومن أصول المنهج أن البدعة قد تفسد السنة المقابلة لها، وأن الناس قد يستبدلون الهدي النبوي بمظاهر جديدة يظنونها قربة."],["p","لكن المنهج يفرّق بين:"],["ul",["<b>الإحداث اللغوي العام:</b> كل أمر جديد بعد الصدر الأول، سواء أكان عادة أم وسيلة نافعة.","<b>البدعة الشرعية المذمومة:</b> زيادة في الدين أو نقص منه، أو إنشاء اعتقاد أو عبادة بلا إذن من الشارع، وبخاصة إذا خالفت نصاً أو سنة ثابتة."]],["p","ومن أمثلة الوسائل الجديدة التي لا تكون بدعة مذمومة في ذاتها: المدارس، وتأليف الكتب، ووضع المنارات لمعرفة وقت الصلاة، وتنظيم الأدلة للرد على الملاحدة؛ لأنها وسائل تخدم مقصداً شرعياً ولا تعارض أصلاً."],["h","3. الاقتصاد في الأعمال والوسطية"],["p","العبادة ليست في المشقة لذاتها، ولا في تعذيب النفس، بل في موافقة الشرع وتحقيق العبودية. فالاقتصاد يعني:"],["ul",["أداء الفرائض والواجبات أولاً.","المحافظة على السنن من غير غلو.","مراعاة حق الجسد، والأهل، والزوج أو الزوجة، والأولاد، والناس.","قبول الرخص التي شرعها الله عند الحاجة.","عدم صيام الدهر أو قيام الليل كله أو ترك الزواج والطيبات على وجه يجعل سنة النبي ﷺ أقل شأناً.","عدم ترك العمل والكسب وخدمة الناس بحجة التفرغ للعبادة.","جعل العبادة دائمة مستقرة، لا حماساً مؤقتاً ينقطع بعد أيام."]]]},{"t":"ثالثاً: كيف يتحقق المسلم بالطريقة المحمدية؟","b":[["p","يمكن تحويل المنهج المحمدي إلى ميزان عملي من عشر خطوات:"],["ol",["<b>تصحيح الاعتقاد:</b> تعلم أصول التوحيد والإيمان والنبوة والآخرة والقدر من الكتاب والسنة.","<b>معرفة علم الحال:</b> تعلم ما يلزمك في الصلاة والطهارة والصوم والزكاة والمعاملات والأسرة والعمل.","<b>عرض العمل على النص:</b> اسأل عن دليل الاعتقاد أو العبادة أو السلوك، ولا تجعل الذوق أو المنام دليلاً مستقلاً.","<b>الرجوع إلى السنة الصحيحة:</b> لا يكفي وجود رواية في كتاب؛ بل يراعى ثبوتها وفهمها وجمع طرقها.","<b>فهم الصحابة والسلف:</b> لأنهم أدرى بمراد النص وبكيفية تطبيقه.","<b>فحص العاقبة:</b> هل يؤدي الفعل إلى ترك فرض، أو ظلم إنسان، أو إهلاك النفس، أو فساد الاعتقاد؟ إن كان كذلك فهو ليس طريقاً محمدياً.","<b>رفض الكشف المخالف:</b> الإلهام والرؤيا والكرامة قد تقع، لكنها لا تنشئ حكماً شرعياً، ولا تحل حراماً، ولا تحرم حلالاً.","<b>تحقيق التوازن:</b> اجمع بين العبادة والكسب، وبين الخلوة والخلطة، وبين الخوف والرجاء، وبين الأخذ بالأسباب والتوكل.","<b>مراقبة الثمرة:</b> علامة صحة الطريقة زيادة الإيمان والطاعة والتواضع وحسن الخلق والرحمة، لا العجب والكبر واحتقار الناس.","<b>المحاسبة المستمرة:</b> راجع القلب واللسان والجوارح، وعالج كل آفة بضدها وبالصحبة الصالحة والعلم والعمل."]],["p","<b>الخلاصة:</b> الطريقة المحمدية لا تتحقق بكثرة الأوراد أو الدعاوى، بل بمطابقة الظاهر والباطن للكتاب والسنة، وظهور ذلك في العقيدة والعبادة والأخلاق والحقوق."]]},{"t":"خريطة الطريقة التفصيلية","b":[["h","مدخل إلى الطريقة المحمدية"],["p","تجمع الطريقة المحمدية بين العقائد، والفقه، والزهد، والعبادة، والسلوك، وأمراض القلوب، والرد على البدع، ولذلك فهي منهج إصلاح شامل لا يقتصر على جانب واحد من حياة المسلم."],["p","ومن سمات هذا المنهج:"],["ul",["يبدأ غالباً بالآيات، ثم الأحاديث والآثار، ثم أقوال الفقهاء والسلف.","يشرح المصطلحات اللغوية والشرعية.","يراعي الخلاف الفقهي ويجمع بين النصوص وقواعد الاستدلال.","يحول الدليل إلى حكم عملي وسلوك قابل للتطبيق.","يوجه السالك إلى العمل والمحاسبة.","يرد الأقوال والدعاوى المخالفة بالأدلة والقواعد الشرعية."]],["p","وفي المسائل العقدية والفقهية التي وقع فيها خلاف بين العلماء، يلزم التفريق بين الأصول القطعية والمسائل الاجتهادية، وعدم تحويل الخلاف الفقهي إلى تبديع أو تكفير بغير علم."]]},{"t":"الباب الأول: الاتباع والوسطية","b":[["h","1. الاعتصام بالقرآن والسنة"],["p","يقرر المنهج أن القرآن حبل الله المتين، وشفاء ونور وهدى، وأن من جعله أمامه قاده إلى الجنة، ومن تركه وراء ظهره قاده إلى الهلاك. ثم يضم إلى القرآن السنة؛ لأن النبي ﷺ أوتي الكتاب ومثله معه، ولا يجوز الاقتصار على القرآن مع رفض بيان النبي."],["p","ويستشهد المنهج بالأحاديث التي تجعل خير الهدي هدي محمد ﷺ، وتحذر من محدثات الأمور، وتوجب اتباع سنة النبي والخلفاء الراشدين. فالمرجع عند الاختلاف ليس ما استحسنه الناس، ولا ما ادعاه شيخ أو صاحب كشف، بل الوحي وفهم السلف."],["h","2. معنى البدعة وأقسامها"],["p","يعرض المنهج للبدعة من جهتين:"],["ul",["<b>البدعة في الاعتقاد:</b> وهي أخطرها، مثل مخالفة أصول التوحيد أو إنكار ما ثبت من الدين بالضرورة أو تقديم الهوى والتأويل الباطل على النص.","<b>البدعة في العبادة:</b> إحداث هيئة أو عدد أو التزام تعبدي لا أصل له، وتشتد إذا صادم سنة مؤكدة.","<b>الإحداث في العادات والوسائل:</b> لا يكون ضلالة بمجرد كونه جديداً؛ بل ينظر في مقصده وموافقته للشرع. فالمدرسة والكتاب والمنارة وسائل لمقاصد صحيحة، وليست عبادات مستقلة."]],["p","ومن قواعد الباب:"],["ul",["إذا تردد أمر بين كونه سنة وبدعة فتركه أسلم، ما لم يؤد الترك إلى ترك واجب.","فعل البدعة قد يكون أشد ضرراً من ترك السنة، لأن البدعة توهم صاحبها أنه على الحق وتزاحم السنة.","لا يصح جعل كل ما لم يقع في الصدر الأول بدعة شرعية؛ بل ينظر في كونه عبادة مقصودة أو وسيلة مباحة.","الاجتهاد عذر في الفروع المحتملة، لكنه ليس عذراً في أصول الاعتقاد القطعية أو في مخالفة النص الثابت بعد العلم."]],["h","3. الرد على دعاوى التصوف الباطني"],["p","يناقش المنهج من يقول: إن للشريعة ظاهراً للعامة وباطناً خاصاً، أو إن أهل الكشف يستغنون عن الكتاب والسنة، أو يأخذون الأحكام من النبي ﷺ في المنام، أو يزعمون أن الكرامة دليل على صحة طريقهم."],["p","ويرد هذا الأصل بأن:"],["ul",["الإلهام ليس مصدراً مستقلاً للأحكام الشرعية.","الرؤيا لا تحل حراماً ولا تحرم حلالاً.","الكرامة لا تكون كرامة شرعية إذا صاحبتها مخالفة للكتاب والسنة؛ وقد تكون استدراجاً أو وهماً.","ميزان الولي هو حفظ الحدود، والالتزام بالأمر والنهي، والعلم والعمل، لا الخوارق والمظاهر.","من ادعى أن الباطن يبيح له مخالفة الظاهر فقد هدم الشريعة."]],["p","وينقل المنهج عن كبار مشايخ التصوف عبارات تؤكد هذا الأصل؛ فالجنيد يقول إن الطرق كلها مسدودة إلا على من اقتدى بأثر الرسول، والسري السقطي يجعل التصوف ألا ينقض الباطنُ الظاهرَ، وألا تحمل الكرامات على هتك محارم الله، وأبو يزيد يجعل حفظ الأمر والنهي معياراً لا مجرد الطيران في الهواء أو ظهور الخوارق."],["h","4. الاقتصاد في العبادة"],["p","يضرب المنهج أمثلة بالثلاثة الذين أراد أحدهم قيام الليل دائماً، والثاني صيام الدهر، والثالث ترك الزواج، فردّهم النبي ﷺ إلى سنته: يصوم ويفطر، ويقوم وينام، ويتزوج."],["p","ويشرح أن شدة الرياضة قد تكون علاجاً مؤقتاً لمرض قلبي، أو عادة لطبيعة بعض الصالحين، لكنها لا تعني أن طريقاً آخر أفضل من هدي النبي ﷺ. ولا يجوز أن تؤدي إلى:"],["ul",["ترك الفرائض.","إضاعة حقوق الأهل والبدن.","قطع الكسب الحلال مع الحاجة.","هلاك النفس أو الانقطاع عن الجماعة.","اعتقاد أن المشقة ذاتها أقرب إلى الله من السنة."]],["p","والكسب قد يكون فرضاً بقدر كفاية الإنسان ومن تلزمه نفقتهم، وقد يكون مستحباً إذا زاد ليعول قريباً أو يعين فقيراً. ومنفعة الكسب المتعدية قد تكون أفضل من نفل عبادة لا ينتفع به إلا صاحبه."]]},{"t":"الباب الثاني: الأمور المهمة في الشريعة المحمدية","b":[["p","هذا الباب هو أوسع أبواب المنهج، وفيه ثلاثة فصول كبرى:"],["ol",["تصحيح الاعتقاد على مذهب أهل السنة والجماعة.","العلوم المقصودة لغيرها.","التقوى ومجاريها وآفات القلب واللسان والجوارح."]],["h","الفصل الأول: تصحيح الاعتقاد"],["h","أ. التوحيد والصفات"],["p","يقرر المنهج تنزيه الله تعالى عن الجسم والجوهر والعرض والمكان والجهة والحدود والأعضاء والزمان، وأنه واحد لا يشبه شيئاً، قديم أزلي أبدي، موصوف بصفات الكمال."],["p","ويعرض مسائل الصفات والكلام والرؤية، وينقل تقريرات المتكلمين والفقهاء، مع مراعاة اختلاف المدارس العلمية في بعض مسائل العقيدة ونقل أقوال السلف وأهل الحديث."],["h","ب. القرآن والرؤية والقدر"],["p","من مسائل الاعتقاد التي يعرضها:"],["ul",["القرآن كلام الله غير مخلوق.","رؤية الله في الآخرة ثابتة عند أهل السنة، بلا إحاطة ولا تكييف ولا مكان.","أفعال العباد مخلوقة لله، وللعباد اختيار وكسب يستحقون عليهما المدح والذم؛ فالمنهج الوسط بين الجبرية والقدرية.","الاستطاعة معتبرة مع الفعل، ولا يكلف الله نفساً إلا وسعها.","الآجال والأرزاق مقدرة، والحرام رزق من جهة كونه واقعاً في تقدير الله، لا من جهة إباحته.","عذاب القبر ونعيمه، والبعث والميزان والكتاب والحوض والصراط والشفاعة والجنة والنار حق.","المعراج وقع للنبي ﷺ يقظة بجسده.","أشراط الساعة المذكورة في السنة حق."]],["h","ج. الإيمان والكبائر"],["p","يعرض الخلاف في تعريف الإيمان: هل هو التصديق والإقرار فقط، أم قول وعمل يزيد بالطاعة وينقص بالمعصية. ويقرر أن الخلاف في بعض صيغ المتكلمين لفظي في جانب، مع اتفاق أهل السنة على أن الله يريد من العباد القول والعمل، وأن الكبائر لا تخرج الموحد من الإسلام ولا توجب له الخلود في النار."],["p","كما يعرض مسألة قول المسلم: «أنا مؤمن إن شاء الله»، ويذكر أن من قصده الشك في أصل إيمانه فذلك خطر، أما إن قصده التواضع أو الخوف من سوء الخاتمة أو ردّ تزكية النفس فله وجه عند العلماء."],["p","ويقرر أن إيمان المقلد صحيح عند طائفة من أهل السنة، وإن كان ترك الاستدلال مع القدرة عليه تقصيراً أو إثماً عند بعضهم."],["h","د. النبوة والكرامات والصحابة"],["ul",["الأنبياء مبرؤون من الكذب والخيانة، وأفضلهم وخاتمهم محمد ﷺ.","الملائكة عباد مكرمون لا يعصون الله.","معجزات الأنبياء حق.","كرامات الأولياء ممكنة، لكنها لا ترفع الولي إلى درجة النبي ولا تسقط عنه الأمر والنهي.","أفضل الأولياء الصحابة، وعلى رأسهم أبو بكر ثم عمر ثم عثمان ثم علي، ثم سائر الصحابة، ويجب الإمساك عنهم إلا بخير.","محبة الصحابة وتعظيمهم من آثار محبة النبي ﷺ، وسبهم أو الانتقاص منهم من الانحراف."]],["h","هـ. الإمامة والمسائل الفقهية المتصلة بالعقيدة"],["p","يذكر المنهج حاجة المسلمين إلى إمام قادر على تنفيذ الأحكام، ولا يشترط عصمته أو كونه أفضل أهل زمانه، ولا يوجب عزله بمجرد الفسق والجور في تقريره الفقهي. ويذكر جواز الصلاة خلف البر والفاجر مع بقاء إنكار الفجور."],["p","كما يعالج مسائل مثل المسح على الخفين، ونبيذ الجر إذا لم يكن مسكراً، والانتفاع بالعبادات والدعاء والصدقة عن الميت، والسحر وإصابة العين، ومسألة إصابة المجتهد للحق أو خطئه؛ ويقرر أن الحق في نفس الأمر واحد، وأن المخطئ المعذور له أجر اجتهاده."],["h","و. الفرق والبدع"],["p","يعرض المنهج فرقاً ومقالات متعددة، منها الخوارج والمرجئة والقدرية والجبرية والمعتزلة والرافضة والكيسانية واليزيدية والنجارية والجهمية، ويرد ما يراه مخالفاً لأصول أهل السنة، خصوصاً:"],["ul",["تكفير المسلمين بالكبائر.","إنكار القدر أو جعل العبد خالق فعل نفسه.","نفي الصفات أو إثبات ما يلزم منه التشبيه.","القول بتناسخ الأرواح أو حلول الإله في الأئمة.","إسقاط الصلاة والصوم والزكاة بحجة طاعة شيخ أو إمام باطن.","تقديم الأولياء على الأنبياء أو تفضيلهم على النبي ﷺ."]],["p","وخلاصة المنهج للسالك: تحصيل اليقين بعقيدة أهل السنة، والحذر من المضلين والمشككين، وعدم قبول الدعاوى التي ترفع أصحابها فوق النصوص أو فوق مقام النبوة."]]},{"t":"الفصل الثاني: العلوم المقصودة لغيرها","b":[["p","يقسم المنهج العلوم إلى ثلاثة أنواع:"],["h","1. علوم فرض العين"],["p","هي ما يحتاجه كل مكلف لصحة دينه وحاله، مثل:"],["ul",["أحكام الطهارة والصلاة والصوم والزكاة والحج لمن وجبت عليه.","ما يلزم من أحكام البيع والإجارة والزواج والطلاق والعمل.","علم القلب: التوكل والخشية والرجاء والإنابة.","معرفة الكبر والرياء والحسد والبخل وما يلزم لعلاجها."]],["p","فالجهل بما لا تصح العبادة أو المعاملة إلا به ليس عذراً لمن قدر على التعلم."],["h","2. علوم فرض الكفاية"],["p","هي التي يكفي قيام بعض الأمة بها، مثل الفقه والتفسير والحديث وأصول الفقه وعلوم العربية والفرائض والحساب الذي يحتاجه القضاء والمواريث، وكذلك الطب وما تحتاجه الأمة من العلوم النافعة."],["h","3. العلوم المنهي عنها أو المذمومة"],["ul",["الخوض في علم الكلام والجدل بغير حاجة أو بغير قدرة، خصوصاً إذا أورث الشبهات.","التنجيم الذي يدعي معرفة الغيب أو تأثير النجوم.","السحر والنيرنجات والشعوذة، ولا يستثنى من تعلم أحوالها إلا ما يقصد به كشف الشر ودفعه.","المناظرة إذا كانت للمراء والظهور وكسر الخصم، وتجوز عند الحاجة بنية الإنصاف وإظهار الحق."]],["p","أما علم النجوم الذي يحتاجه المسلم لمعرفة المواقيت والقبلة فمباح أو نافع بقدر الحاجة، وما زاد إلى ادعاء الغيب فممنوع."],["h","الطب والأسباب والتوكل"],["p","يقسم المنهج الأسباب إلى:"],["ul",["<b>مقطوع بها:</b> كالماء للعطش والطعام للجوع؛ تركها عند خوف الهلاك قد يكون حراماً.","<b>مظنونة:</b> كالدواء والحجامة والفصد؛ الأخذ بها لا ينافي التوكل إذا اعتقد المسلم أن الله هو الشافي.","<b>موهومة:</b> كالأسباب الخرافية أو ما لا دليل عليه؛ ترك التعلق بها هو مقتضى التوكل."]],["p","ولا يعني التوكل ترك كل سبب، بل يعني ألا يعتقد القلب أن السبب مستقل بالتأثير عن الله."]]},{"t":"الفصل الثالث: التقوى","b":[["h","معنى التقوى وفضلها"],["p","التقوى من الوقاية؛ وهي أن يجعل العبد بينه وبين غضب الله وعقابه وقاية بطاعته وترك معصيته. ولها معنى عام: حفظ النفس من كل ما يضرها في الآخرة، ومعنى خاص: اجتناب ما يستحق العقوبة من قول أو فعل أو ترك."],["p","ولا تكتمل التقوى بمجرد ترك بعض المباحات أو التشدد في الطهارة، بل تشمل:"],["ul",["صحة الاعتقاد.","أداء الفرائض والواجبات.","ترك المحرمات والبدع.","إصلاح القلب واللسان والجوارح.","القيام بحقوق العباد والبهائم."]],["h","أصول إصلاح الأخلاق"],["p","يربط المنهج الأخلاق بثلاث قوى:"],["ul",["<b>العقل والنطق:</b> اعتداله حكمة، وإفراطه جربزة ومكر، وتفريطه بلادة.","<b>الغضب:</b> اعتداله شجاعة، وإفراطه تهور، وتفريطه جبن.","<b>الشهوة:</b> اعتدالها عفة، وإفراطها شره وفجور."]],["p","وطريقة علاج الخلق المذموم:"],["ol",["معرفة حقيقة المرض وأسبابه وغوائله.","محاسبة النفس والتفتيش عن علامات المرض.","إزالة السبب المؤدي إليه.","ممارسة الخلق المضاد حتى تصير الفضيلة ملكة.","قبول النصح من أهل الصدق.","تذكر نصوص الوعيد في الرذيلة ونصوص المدح في الفضيلة.","مجاهدة النفس بالتدرج، لا بالانقطاع المؤقت.","ملازمة أهل العلم والصلاح ومفارقة الصحبة المفسدة."]]]},{"t":"آفات القلب","b":[["p","يضم المنهج <b>ستين آفة قلبية</b>، ويشرح لكل آفة معناها وغوائلها وعلاجها. وفيما يلي القائمة كاملة مرتبة، مع إبقاء العناوين التي تتفرع عنها مباحث علاجية أو تطبيقات عملية:"],["h","أولاً: آفات الاعتقاد والنية والمعرفة"],["dl",[["1. الكفر بالله","ومن أنواعه الكفر الجهلي، والكفر الجحودي والعنادي، والكفر الحكمي؛ وهو أعظم المهلكات."],["2. الجهل","ومنه الجهل البسيط، وهو عدم العلم، والجهل المركب، وهو اعتقاد الباطل علماً وصواباً."],["3. حب الرياسة والجاه الدنيوي","طلب ملك قلوب الناس والتعلق بالمنزلة والشهرة، إلا ما قصد به نصرة الحق أو إصلاح الخلق دون رياء."],["4. خوف الذم والتعيير","ترك الحق أو كتمانه خشية كلام الناس وملامتهم."],["5. حب المدح والثناء","الفرح بثناء الناس وطلبه، وعلاجه تذكر أن النافع هو قبول الله لا إعجاب الخلق."],["6. اعتقاد البدعة","إنشاء اعتقاد أو عبادة لا أصل لها، أو تقديم العادات والأذواق على السنة."],["7. اتباع الهوى","جعل الرغبة الشخصية حاكمة على النص والحق، وعلاجه مجاهدة النفس واتباع الهدى."],["8. التقليد في العقائد","قبول الاعتقاد بلا دليل مع القدرة على النظر، مع التفريق بين ذلك وبين تقليد غير المجتهد للعالم في الأحكام العملية."],["9. الرياء","العمل لأجل رؤية الناس ومدحهم، ومنه الرياء الظاهر والخفي، وضده الإخلاص."],["10. الأمل وطول الأمل","تأخير التوبة والعمل اعتماداً على بقاء العمر، وعلاجه بذكر الموت وقصر الأمل."],["11. الطمع","تعلق القلب بما في أيدي الناس أو بما لا يملكه، وضده القناعة والتوكل."],["12. الكبر","رؤية النفس فوق الحق أو فوق الخلق، ومن علاجه قبول الحق والتواضع ومعرفة أصل الإنسان ونهايته."],["13. التمنق والتملق","التكلف في طلب رضا الناس ومدحهم والتزلف إليهم، بما يفسد الصدق والكرامة."],["14. العجب","إعجاب الإنسان بنفسه أو بعمله أو علمه ونسيان فضل الله عليه."]]],["h","ثانياً: آفات الحسد والغضب والعداوة"],["dl",[["15. الحسد","تمني زوال نعمة الغير، وعلاجه تذكر أن النعم قسمة الله، وتمني الخير للمحسود، والعمل بضد ما يدعو إليه الحسد."],["16. الحقد","بقاء العداوة في القلب وانتظار فرصة الانتقام، وعلاجه بالعفو وإزالة أسباب الغضب."],["17. الشماتة","الفرح بمصيبة المسلم، وعلاجها بالرحمة وتذكر تقلب الأحوال."],["18. الهجر والعداوة","قطع الصلة وإضمار البغضاء بغير حق، وضده الصلح والصفح وصلة الرحم."],["19. الجبن","ضعف القلب عن الحق أو عن دفع ما يجب دفعه، وضده الشجاعة المنضبطة بالحكمة."],["20. التهور","الإقدام بلا تثبت ولا تقدير للعواقب، وضده التثبت والإقدام المنضبط."],["21. الغدر","نقض العهد والميثاق بلا إعلام أو سبب شرعي، وضده حفظ العهد والوفاء به."],["22. الخيانة","ترك الأمانة في القول أو المال أو المشورة أو العمل، وضدها الأمانة."],["23. خُلْف الوعد","الوعد بنية عدم الوفاء أو ترك الوفاء بلا عذر، وضده إنجاز الوعد والإيفاء بالعهد."],["24. سوء الظن بالله وبالمؤمنين بمجرد الوهم أو الشك","ويحرم إذا أدى إلى اتهام المسلم أو الكلام فيه، أما الحذر المبني على قرائن معتبرة فليس من سوء الظن المحرم."],["25. التطير والطيرة","التشاؤم بالأشخاص والأيام والأصوات والأحداث، وضده الفأل الحسن الذي لا يتضمن ادعاء الغيب ولا حكماً على المستقبل."]]],["h","ثالثاً: آفات المال والدنيا والعمل"],["dl",[["26. البخل والتقتير","إمساك المال حيث يجب بذله شرعاً أو مروءة، ومن أشده منع النفس من الطعام واللباس والعلاج مع الحاجة."],["27. الإسراف والتبذير","بذل المال حيث يجب إمساكه، أو تجاوز الاعتدال في الطعام واللباس والصدقة وسائر النفقات."],["28. حب المال","تعلق القلب بالمال لذاته أو جعله غاية، مع أن المال وسيلة للقيام بالحقوق والإنفاق الحلال."],["29. حب الدنيا","إيثار الدنيا على الآخرة والاستغراق في متاعها ونسيان المصير."],["30. الحرص المذموم","شدة التعلق بالمال والجاه والمنافع، بحيث يورث الظلم أو ترك العبادة أو ذل النفس."],["31. السفه","خفة العقل وسوء التصرف وعدم وضع المال أو الكلام أو الفعل في موضعه."],["32. الكسل والبطالة","ترك العمل النافع والواجبات مع القدرة، والركون إلى الراحة وتعطيل الطاقات."],["33. العجلة","المبادرة قبل التثبت، وإصدار الحكم أو الفعل قبل تمام النظر."],["34. التأخير والتسويف","إرجاء التوبة والواجب والعمل النافع حتى يفوت وقته."],["35. الفظاظة وغلظة القلب","خشونة المعاملة وقلة الرحمة وعدم احتمال الناس، وضدها الحلم والرفق واللين."]]],["p","والوسط في المال هو السخاء بلا تبذير، والاقتصاد بلا بخل، والكسب الحلال بلا استغراق، والصدقة بلا تضييع حقوق النفس والأهل والدين. ويعالج الإسراف علاجاً علمياً بمعرفة غوائله، وعملياً بضبط النفقات، وقلعياً بإزالة أسبابه كالرياء والسفه وسوء الصحبة."],["h","رابعاً: آفات الهمة والرضا والعلاقات"],["dl",[["36. الوقاحة وذهاب الحياء","الجرأة على القبيح وعدم استقباح المعصية أو الاعتذار عن الخطأ."],["37. الجزع والشكوى","الاعتراض القلبي واللساني على البلاء بما ينافي الصبر، مع جواز الشكوى إلى الله وطلب العون منه."],["38. كفران النعمة","نسيان المنعم ونسبة النعمة إلى النفس أو الناس وحدهم، وعدم استعمالها في مرضاة الله."],["39. السخط لعدم حصول المراد","السخط والانفعال عند فوات ما تشتهيه النفس، وضده الرضا بقضاء الله مع بذل السبب المشروع."],["40. التعليق بغير الله","اعتماد القلب على مخلوق أو سبب أو وهم، مع الغفلة عن أن النفع والضر بيد الله، والواجب الأخذ بالأسباب مع التوكل."],["41. حب الفسقة والركون إلى الظلمة","محبتهم أو مداهنتهم أو الاعتماد عليهم في الظلم والباطل، مع التفريق بين إنكار فعلهم والعدل معهم."],["42. بغض العلماء والصالحين","كراهية أهل العلم والاستقامة بسبب الحسد أو التعصب أو مخالفة الهوى."],["43. الجرأة على الله والأمن من عذابه وسخطه","الإصرار على المعصية مع الشعور بالأمان من العقوبة."],["44. اليأس من رحمة الله","اعتقاد أن الذنب لا يغفر أو أن التوبة لا تنفع، وضده الجمع بين الخوف والرجاء."],["45. الحزن في أمر الدنيا","استيلاء الحزن على القلب بسبب فوات متاع زائل حتى يضعف عن الدين والواجب."],["46. الخوف في أمر الدنيا","الخوف المفرط من الفقر أو الناس أو المستقبل، بما يمنع الحق أو يوقع في الحرام."],["47. الغش والغل","عدم تمحيض النصيحة وإخفاء العيب أو التغرير بالغير، ويدخل فيه الغبن والخديعة والمكر؛ أما الخداع في الحرب أو دفع الظلم المستحق فله حكم مختلف."],["48. الفتنة","إيقاع الناس في الاضطراب والخصومة والاقتتال، أو حمل الكلام على غير مراده وإغراء الناس بالبغي والخروج والبلاء."],["49. المداهنة","ترك إنكار الباطل أو تزيينه طلباً لرضا الناس أو خوفاً على الجاه، بخلاف المداراة المباحة التي تحفظ الحق ولا تبرر الباطل."],["50. الأنس المفرط بالناس والوحشة من فراقهم","تعلق القلب بالخلق حتى يضعف تعلقه بالله، وضده صحبة صالحة مع استقلال القلب بالله."],["51. الطيش والخفة","قلة الرزانة وسرعة الانفعال والتصرف بلا حكمة."],["52. العناد ومكابرة الحق وإنكاره بعد العلم به","رد الحق لا لخفائه بل لمخالفة الهوى أو حفظ المكانة."],["53. التمرد والإباء","رفض الانقياد للحق والأمر المشروع بسبب الكبر أو حب الاستقلال."],["54. الصلف","التعاظم والتكبر وإظهار الرفعة واحتقار الناس."],["55. النفاق","إظهار الخير وإبطان الشر، أو اختلاف الظاهر والباطن، ويدخل فيه نفاق الاعتقاد ونفاق العمل."],["56. الجفاء والقسوة","قلة الرحمة وعدم التأثر بالموعظة أو آلام الناس، وضده الرفق والرحمة."],["57. البلادة والغباءة","ضعف الفهم وقلة الفطنة أو تعطيل العقل عن التعلم والنظر."],["58. الشره إلى الطعام والجماع","تجاوز حد الحاجة والانقياد للشهوة حتى تضعف العبادة والعفة والصحة."],["59. الخمود","ضعف الهمة والفتور عن الخير وترك المبادرة إلى الطاعات والمصالح."],["60. الإصرار على المعاصي والملاهي","تكرار الذنب وعدم التوبة، والاستمرار في اللهو وما يصد عن الواجبات ويضعف القلب."]]],["h","القاعدة الجامعة في علاج آفات القلب"],["p","يعالج كل مرض بمعرفة حقيقته وغوائله، ثم قطع أسبابه، وممارسة الخلق المضاد حتى يصير ملكة: فالكبر يعالج بالتواضع، والبخل بالسخاء، والجبن بالشجاعة، والغضب بالحلم، والحسد بالنصح والمحبة، والرياء بالإخلاص، وطول الأمل بذكر الموت، واليأس بحسن الظن بالله، والشره بالعفة والاعتدال. ثم يذكر المنهج أصول الفضائل، مثل الحكمة والشجاعة والعفة والعدل، ويبين أن الفضائل ملكات تظهر في المعاملة والإنفاق والصبر والصدق والقيام بالحقوق."]]},{"t":"آفات اللسان","b":[["p","يجعل المنهج اللسان من أخطر أبواب التقوى؛ لأن الكلمة قد تهدم عقيدة أو تظلم إنساناً أو تفسد علاقة أو تنشئ فتنة. ومن آفات اللسان التي يفصلها:"],["ul",["كلمة الكفر وما يقرب منها.","الخطأ والكذب والافتراء على الله ورسوله.","الوعد مع نية الخلف وتحديث كل ما يسمع.","التعريض المفسد.","الغيبة والنميمة والطعن والتعيير والسخرية والسب والفحش واللعن.","النياحة وإفشاء السر والخوض في الباطل.","الخصومة والجدال والمراء والتكلف في الكلام.","سؤال العوام عن دقائق تفتنهم أو تشوش عليهم.","طلب المال والجاه بالكلام المذل.","النفاق القولي والكلام ذو اللسانين.","الشفاعة السيئة والأمر بالمنكر والنهي عن المعروف.","غلظة الكلام وهتك الأعراض.","السؤال عن عيوب الناس والتفتيش عنها.","الكلام عند الأذان والإقامة، وفي الصلاة، وحال الخطبة، وفي الخلاء، وعند الجماع، وعند تلاوة القرآن، وفي المساجد بلا حاجة.","الدعاء على المسلم أو الدعاء للظالم.","قطع كلام الغير، ورد كلام التابع لمتبوعه بغير حق.","التناجي بين اثنين بحضور ثالث إذا أحزنه ذلك.","الكلام مع الأجنبية بلا حاجة.","الدلالة على طريق المعصية أو الإذن فيها."]],["p","وفي المقابل يذكر آفات السكوت: ترك السلام، وعدم ردّه، وترك التشميت، وترك النصيحة، وعدم إنقاذ المظلوم أو المستغيث مع القدرة، وعدم النهي عن المنكر عند تحقق شروطه. فالسكوت ليس فضيلة مطلقة؛ إنما الفضيلة أن يتكلم حيث يجب الكلام ويسكت حيث يجب السكوت."],["p","ومن الكلام المباح أو المستحب بشروط: المزاح إذا خلا من الكذب والترويع، والمدح إذا خلا من الغلو والرياء، والشعر إذا خلا من المحرم، والسجع والفصاحة إذا لم يكونا تكلفاً، والكلام في مصالح الدين والدنيا."]]},{"t":"آفات السمع والبصر واليد والبطن والفرج والرجل والبدن","b":[["h","آفات الأذن"],["ul",["استماع الغيبة والنميمة والكذب والباطل.","استماع الغناء والملاهي والألحان التي يذمها المنهج.","الاستماع إلى كلام يثير الشهوة أو الفتنة.","سماع القرآن أو الذكر على وجه يغير معناه أو يجعله لهواً ورقصاً.","ترك الاستماع الواجب للعلم والموعظة والنصيحة."]],["p","ويحذر المنهج من رقص الصوفية المصحوب بالصراخ والتغني والتخليط، ويقرر أن الذكر قياماً وقعوداً جائز إذا كان بأدب وسكون، بلا لحن يغير الكلمات ولا لهو."],["h","آفات العين"],["ul",["النظر إلى العورات.","النظر بشهوة إلى الأجنبية.","النظر إلى ما يثير الفتنة أو يعين على المعصية.","النظر إلى بيوت الناس أو أسرارهم."]],["p","ويذكر أعذاراً للحاجة، مثل تحمل الشهادة وأدائها، وحكم القاضي، والولادة للقابلة، والتحقق من العيب، والختان، والمداواة، وإرادة النكاح أو الشراء؛ والعبرة بقدر الحاجة دون تجاوز."],["h","آفات اليد"],["ul",["القتل والجرح والضرب بغير حق.","الغصب والسرقة والرشوة.","أخذ المال المغصوب أو إتلاف مال الغير.","إعانة الظالم أو الإمساك عن إصلاح المنكر عند القدرة.","التصوير الذي يراه المنهج داخلاً في المنع.","العبث بما يضر الإنسان أو الحيوان.","استعمال اليد في الأذى أو التعدي على الناس."]],["h","آفات البطن وآداب الطعام والشراب"],["ul",["إدخال الحرام إلى البطن.","الأكل فوق الحاجة والشبع المفرط.","أكل ما يضر البدن.","ترك الطعام والشراب حتى يضعف عن الفرائض أو الجماعة.","الإسراف في الطعام وإفساده."]],["p","ومن الآداب التي يذكرها: التسمية، الأكل باليمين، الأكل مما يلي الإنسان، عدم الأكل من وسط الطعام إذا كان لوناً واحداً، عدم النفخ في الشراب والتنفس في الإناء، إعطاء الأيمن، وعدم استعمال أواني الذهب والفضة للأكل والشرب بحسب التفصيل الفقهي."],["h","آفات الفرج"],["p","يفصل المنهج في الزنا واللواط وإتيان البهيمة، وإتيان الحائض أو النفساء على الوجه المحرم، والاستمتاع المحرم، والجماع مع الضرر أو قبل الاستبراء، وما يتصل بحفظ العورة والآداب في الخلوة وقضاء الحاجة."],["h","آفات الرجل"],["ul",["الذهاب إلى مجالس المعصية لفعلها أو مشاهدتها.","السفر أو الخروج بما يضر الوالدين أو يضيّع حقوقهما.","الدخول في أرض أو بيت الغير بغير إذن إلا لضرورة أو إذن عرفي.","المشي على القبور أو دخول الأماكن المقدسة بغير أدب.","تخطي رقاب الناس يوم الجمعة.","القعود عن الجمعة والجماعة والعلم والتعليم والحج والجهاد إذا تعين.","الدخول على السلطان والظالمين طلباً للدنيا أو إعانة على ظلمهم.","الدخول على الأهل بغتة بعد طول السفر."]],["h","الآفات العامة للبدن وحقوق الناس"],["p","يتوسع المنهج في الحقوق الاجتماعية والأسرية، ومنها:"],["ul",["عقوق الوالدين، مع التنبيه إلى أنه لا طاعة لمخلوق في معصية الخالق، وأن بر الوالدين وخدمتهما واجب حتى مع كفرهما ما لم يخش المسلم على دينه.","قطع الرحم؛ وأقل الصلة السلام أو إرسال السلام، وتزيد بالزيارة والإعانة والإهداء.","إيذاء الزوجة أو الزوج، وعدم رعاية الحقوق المتبادلة.","إضاعة الأولاد ومن تلزم نفقتهم، وعدم تعليمهم وتأديبهم.","ظلم الخدم أو تكليفهم فوق الطاقة، وترك إطعامهم وكسوتهم وتعليمهم ما يلزمهم.","أذى الجار، وترك مساعدته أو عيادته أو مواساته.","اختيار الصحبة السيئة؛ فالمرء يتأثر بخليله.","الجلوس في الطريق بغير مراعاة حق الطريق، أو بين الظل والشمس، أو في وسط الحلقة بغير إذن.","التثاؤب بلا تغطية الفم، والانحناء في السلام، وإقامة شخص من مجلسه بلا حق.","السحر والتمائم والتكهن والوشم والنمص والتفلج والتشبه بين الرجال والنساء.","نتف الشيب أو تغيير الهيئة على وجه الرياء، وإعفاء اللحية وقص الشارب بحسب ما يقرره المنهج.","سفر المرأة بلا محرم بحسب التفصيلات والروايات التي يعرضها.","ترك الصلاة أو الجمعة أو الصيام أو الحج أو الجهاد عند الوجوب، والفرار من الزحف.","الربا والاحتكار والعينة والغش والشراء من المكره والتصرف في مال الغير بلا رضا.","اقتناء الكلب بلا حاجة معتبرة، وإشعال الشموع على القبور وبناء المساجد عليها، واتخاذ القبور مواضع لهو أو طقوس.","الترف واللباس للكبر، وإطالة الثوب خيلاء، والتبذير في الزينة."]]]},{"t":"الباب الثالث: أمور يظن أنها من التقوى والورع","b":[["p","هذا الباب من أهم أبواب الطريقة المحمدية؛ لأنه يبين أن بعض الناس يتركون السنن والواجبات أو يعطلون حياتهم بسبب ورع ظاهري ووسوسة لا أصل لها."],["h","الفصل الأول: الدقة في الطهارة والنجاسة"],["h","أ. صور الغلو"],["ul",["الإفراط في عدد الغسلات.","الحكم بنجاسة الماء أو الثوب بمجرد الشك.","إعادة الوضوء والصلاة مرات كثيرة.","التفتيش المبالغ فيه عن النجاسة.","ترك الجماعة أو تأخير الصلاة بسبب احتمالات وهمية.","إنفاق الماء وإضاعة الوقت باسم الورع.","سؤال الناس باستمرار عن طهارة الأشياء مع قيام الأصل على الطهارة."]],["h","ب. القواعد الفقهية"],["ul",["الأصل في الأشياء الطهارة والإباحة حتى يثبت العكس.","اليقين لا يزول بالشك.","الماء طهور ما لم يتغير لونه أو طعمه أو ريحه بالنجاسة، مع عرض تفصيلات المذاهب.","يجوز استعمال آنية أهل الكتاب ما لم تعلم نجاستها.","تجوز الصلاة في النعلين إذا تحققت الطهارة.","لا يترك ظاهر الحال إلى الوهم."]],["p","ويعرض المنهج أقوال الظاهرية والمالكية والشافعية والحنفية في الماء والنجاسة، ويذكر تفاصيل مسائل الآبار والأواني والخبز والطعام المختلط بالنجاسة والخف والغسل، ليقرر أن الفقه لا يبنى على الوسواس."],["h","ج. علاج الوسوسة"],["ul",["تعلم أحكام الطهارة من عالم موثوق.","الأخذ بالرخصة والسعة عند اشتداد الوسوسة حتى تزول.","عدم إعادة الصلاة والوضوء لمجرد الشك.","الاستمرار في الجماعة والذكر والتلاوة.","نضح الماء على البدن بعد الوضوء أحياناً لدفع توهم البلل النجس.","ترك الاسترسال مع الوهم، والانتقال إلى العمل التالي.","تذكر أن السلف لم يكونوا يتكلفون هذه الدقائق الوهمية."]],["h","الفصل الثاني: التورع عن طعام الأوقاف وبيت المال"],["p","يناقش المنهج الورع في الأموال المختلطة، خصوصاً طعام الأوقاف وبيت المال، ويقرر أن الحكم لا يبنى على الشك العام، بل على العلم بوجود الحرام في العين المعينة. فلا يترك المسلم حقوقاً ومصالح مباحة لمجرد توهم، كما لا يتناول مالاً ثبت غصبه أو سرقته أو خيانته."],["p","والميزان هو:"],["ul",["معرفة مصدر المال بقدر الاستطاعة.","العمل بفتوى معتبرة تراعي الواقع.","ترك الحرام المتيقن.","عدم تحويل الورع إلى تعطيل للمعاش أو اتهام للناس بلا بينة."]],["h","الفصل الثالث: بدع يظنها الناس قربات"],["p","يختم المنهج بالتحذير من أمور مبتدعة يظنها الناس عبادات، خصوصاً ما يتعلق بالقبور والأوقاف والقراءة للأموات على هيئات لم يثبت أصلها عنده، وبناء مظاهر دينية لا دليل عليها، واتخاذ طقوس جماعية أو ألحان أو رقصات باسم الذكر."],["p","والقاعدة الجامعة في هذا الباب: <b>ليس كل ما قصد به فاعله الخير يكون قربة؛ القربة ما شرعه الله ورسوله، وما لم يشرع لا يصير عبادة بمجرد حسن النية.</b>"]]},{"t":"ملامح المنهج العلاجي في الطريقة المحمدية","b":[["p","يعالج المنهج أمراض الدين والنفس والجوارح بخطة متكررة:"],["ol",["<b>التعريف:</b> بيان معنى المرض أو الفعل، لغوياً وشرعياً.","<b>بيان الغوائل:</b> شرح ما يترتب عليه في القلب والدين والدنيا والآخرة.","<b>ذكر الضد:</b> بيان أن ضد الكبر تواضع، وضد الحسد نصيحة ومحبة، وضد البخل سخاء، وضد العجلة تثبت.","<b>الاستدلال:</b> إيراد الآيات والأحاديث والآثار وأقوال الفقهاء.","<b>التشخيص:</b> معرفة أسباب المرض، كالجهل والرياء وسوء الصحبة وضعف اليقين.","<b>العلاج العلمي:</b> التعلم والتفكر ومعرفة النصوص.","<b>العلاج العملي:</b> إلزام النفس بأفعال الفضيلة حتى تصير عادة.","<b>العلاج القلعي:</b> قطع الأسباب والبيئات التي تعيد المرض.","<b>المحاسبة:</b> مراجعة النية والعمل والنتائج.","<b>الصحبة:</b> ملازمة العلماء والصالحين ومفارقة أهل الأهواء.","<b>التدرج:</b> عدم الانتقال إلى غلو جديد باسم علاج الغلو القديم.","<b>الاستمرار:</b> العبرة بالدوام والموافقة للسنة لا بالاندفاع العابر."]]]},{"t":"خلاصة مركزة للطريقة المحمدية","b":[["p","يمكن تلخيص المنهج كله في هذه الصيغة:"],["p","<b>اعرف التوحيد، وتعلم الحكم، واتبع النص، واقتد بالنبي ﷺ، واترك البدعة والهوى، واعبد الله باعتدال، واحفظ قلبك ولسانك وجوارحك، وأدِّ حقوق الناس، ولا تجعل الورع الوهمي يقطعك عن الفرائض والحياة النافعة.</b>"],["p","وعلامات صدق السالك في هذه الطريقة:"],["ul",["أن يكون اعتقاده صحيحاً غير قائم على الخرافة.","أن تكون عبادته موافقة للسنة لا للمبالغة الشخصية.","أن يتواضع ولا يغتر بكرامة أو كشف أو كثرة أتباع.","أن يحفظ الفرائض وحقوق الوالدين والزوج والأولاد والجيران.","أن يأكل ويشرب ويلبس من الحلال بلا إسراف ولا بخل.","أن يراقب لسانه وسمعه وبصره ويده وبطنه وفرجه ورجله.","أن يطلب العلم الذي يحتاجه، ويتجنب الجدل والعلوم المفضية إلى الشبهات.","أن يأخذ بالأسباب مع توكل القلب على الله.","أن يفرق بين التقوى الحقيقية والوسوسة، وبين الورع المشروع والتشدد المبتدع.","أن تكون ثمرة طريقه رحمة وصدقاً وأمانة وحسن خلق ونفعاً للناس."]]]},{"t":"خاتمة","b":[["p","الطريقة المحمدية في جوهرها مشروع إصلاح شامل: يبدأ من العقيدة، ويمر بالعلم والعبادة والتزكية، ثم يصل إلى تفاصيل الكلام والطعام والبيع والأسرة والجوار والحقوق العامة. ولذلك فـ«الطريقة المحمدية» ليست مظهراً روحياً منفصلاً عن الشريعة، بل هي <b>إعادة بناء حياة المسلم كلها على الاقتداء بالنبي ﷺ، مع الجمع بين صحة الاعتقاد وصحة العمل وصحة الخلق</b>."],["p","والميزان الذي يتكرر في جميع أبواب الطريقة هو: <b>كتاب الله، وسنة رسوله، وفهم السلف، والعلم بالفقه، وترك الغلو والتفريط، وتحقيق التقوى في القلب والجوارح والحقوق.</b>"]]}]},"en":{"title":"The Muhammadan Path","sub":"A comprehensive introduction to its foundations, pillars, chapters and practical questions","note":"<b>Methodological note:</b> This is a comprehensive introductory overview of the Muhammadan Path, covering its foundations, pillars and practical fields. In disputed matters of jurisprudence and creed, one should refer to recognized scholars, and one should verify the authenticity of hadiths and reports before using them as evidence.","secs":[{"t":"First: Defining the Muhammadan Path and its overall aim","b":[["p","<b>The Muhammadan Path</b> is not the name of a Sufi order founded on special litanies or on affiliation to a particular shaykh. It is the name of the comprehensive Islamic method on which the Muslim's salvation and righteousness rest: <b>sound creed, worship in accordance with the Sunnah, and morals and conduct governed by the Book and the Sunnah, while avoiding excess, negligence and innovations</b>."],["p","The Prophetic biography is the practical application of this method in the life of the Prophet ﷺ: his beliefs, words, deeds, character, worship and dealings with people. The aim is for the seeker to measure his own practice against this biography, so that he knows whether he is right and following, or mistaken and innovating. That is why every seeker's practice is measured against this method, so that the right is distinguished from the mistaken, and the saved from the ruined."],["p","This method arose in response to the condition of two opposite groups:"],["ul",["<b>Ignorant devotees:</b> they multiply forms of worship and spiritual exercises, but are ignorant of the limits of the Sacred Law, and so fall into innovation and excess.","<b>Heedless scholars or students:</b> they have knowledge or a claim to learning, but they neglect practice, and worldly life and desire overcome them."]],["p","This method brings the Muslim back to <b>the middle way between excess and negligence</b>, and to the decisive reference: the Qur'an, the Sunnah and the understanding of the Salaf — not customs, personal tastes, esoteric claims, or mere abundance of worship."]]},{"t":"Second: The three pillars of the Muhammadan Path","b":[["p","The Muhammadan Path rests on three great chapters, which are the pillars of the method:"],["h","1. Holding fast to the Book and the Sunnah"],["p","The Qur'an is the source of guidance, healing and light, and the scale to which creed, worship and conduct are referred. The Sunnah is not an extra that can be dispensed with; it is the explanation of the Qur'an, and contains the commands and prohibitions of the Prophet ﷺ and their practical details."],["p","Holding fast includes:"],["ul",["Revering the Qur'an, reciting it, understanding it and acting upon it — not limiting oneself to vocal recitation.","Accepting the authentic Sunnah even if it does not agree with people's customs or a particular school opinion.","Following the Sunnah of the Prophet ﷺ, the Sunnah of the Rightly Guided Caliphs, and the understanding of the Companions.","Rejecting every opinion, taste, unveiling or custom that contradicts an authentic text or an established ruling of the Sacred Law.","Referring to trustworthy scholars when matters are unclear, and not taking religion from the ignorant or from people of empty claims."]],["h","2. Guarding against bad customs and newly invented innovations"],["p","It is not enough for a person to claim love of the Sunnah; he must abandon whatever crowds it out of corrupt customs and innovations in creed, worship or morals. Among the principles of the method is that an innovation may spoil the Sunnah corresponding to it, and that people may replace the Prophetic guidance with new appearances they think are acts of devotion."],["p","But the method distinguishes between:"],["ul",["<b>General linguistic novelty:</b> anything new after the first generation, whether a custom or a beneficial means.","<b>Blameworthy innovation in the Sacred Law:</b> adding to or subtracting from the religion, or creating a belief or act of worship without permission from the Lawgiver, especially when it contradicts a text or an established Sunnah."]],["p","Examples of new means that are not blameworthy innovations in themselves: schools, writing books, building minarets to make known the prayer times, and organizing proofs to refute atheists — because they are means serving a legitimate aim and do not contradict any principle."],["h","3. Moderation in deeds and the middle way"],["p","Worship does not lie in hardship for its own sake, nor in tormenting the self, but in conforming to the Sacred Law and realizing servanthood. Moderation means:"],["ul",["Performing the obligations and duties first.","Keeping up the Sunnahs without excess.","Respecting the rights of the body, the family, the spouse, the children and people.","Accepting the concessions God has legislated when needed.","Not fasting perpetually, praying all night or abandoning marriage and good things in a way that makes the Sunnah of the Prophet ﷺ seem lesser.","Not abandoning work, earning and serving people under the pretext of devoting oneself to worship.","Making worship constant and stable, not a temporary enthusiasm that stops after a few days."]]]},{"t":"Third: How does a Muslim realize the Muhammadan Path?","b":[["p","The Muhammadan method can be turned into a practical scale of ten steps:"],["ol",["<b>Correcting creed:</b> learn the foundations of monotheism, faith, prophethood, the Hereafter and divine decree from the Book and the Sunnah.","<b>Knowing the knowledge of one's state:</b> learn what you need for prayer, purification, fasting, zakat, transactions, family and work.","<b>Measuring practice against the text:</b> ask for the evidence of a belief, act of worship or behaviour, and do not make taste or a dream an independent proof.","<b>Returning to the authentic Sunnah:</b> the existence of a narration in a book is not enough; its authenticity, understanding and the gathering of its chains must be considered.","<b>The understanding of the Companions and the Salaf:</b> because they knew best what the text intended and how to apply it.","<b>Examining the outcome:</b> does the act lead to abandoning an obligation, wronging a person, destroying oneself, or corrupting creed? If so, it is not a Muhammadan path.","<b>Rejecting contrary unveiling:</b> inspiration, dreams and miracles of the saints may occur, but they do not establish a legal ruling, make the forbidden lawful, or forbid the lawful.","<b>Achieving balance:</b> combine worship and earning, solitude and company, fear and hope, taking means and reliance on God.","<b>Watching the fruit:</b> the sign of a sound path is increase in faith, obedience, humility, good character and mercy — not self-admiration, arrogance and contempt for people.","<b>Continuous self-accounting:</b> review the heart, the tongue and the limbs, and treat every ailment with its opposite, with righteous company, knowledge and practice."]],["p","<b>In sum:</b> the Muhammadan Path is not realized through many litanies or claims, but through conformity of the outward and inward to the Book and the Sunnah, visible in creed, worship, morals and the rights of others."]]},{"t":"Detailed map of the Path","b":[["h","Introduction to the Muhammadan Path"],["p","The Muhammadan Path brings together creed, jurisprudence, asceticism, worship, conduct, diseases of the heart and the refutation of innovations; it is therefore a comprehensive method of reform, not limited to one aspect of the Muslim's life."],["p","Among the features of this method:"],["ul",["It usually begins with verses, then hadiths and reports, then the sayings of the jurists and the Salaf.","It explains linguistic and legal terms.","It takes juristic disagreement into account and reconciles texts with the rules of inference.","It turns evidence into a practical ruling and an applicable behaviour.","It directs the seeker to practice and self-accounting.","It refutes contrary opinions and claims with evidence and legal principles."]],["p","In matters of creed and jurisprudence on which scholars disagree, one must distinguish between definitive foundations and matters of independent reasoning, and not turn juristic disagreement into accusations of innovation or unbelief without knowledge."]]},{"t":"Chapter One: Following and the middle way","b":[["h","1. Holding fast to the Qur'an and the Sunnah"],["p","The method affirms that the Qur'an is the firm rope of God, a healing, a light and a guidance; whoever puts it before him, it leads him to Paradise, and whoever casts it behind his back, it leads him to ruin. It then joins the Sunnah to the Qur'an, because the Prophet ﷺ was given the Book and its like with it, and it is not permissible to limit oneself to the Qur'an while rejecting the Prophet's explanation."],["p","The method cites the hadiths stating that the best guidance is the guidance of Muhammad ﷺ, warning against newly invented matters, and obliging adherence to the Sunnah of the Prophet and the Rightly Guided Caliphs. So the reference in disagreement is not what people consider good, nor what a shaykh or a person of unveiling claims, but revelation and the understanding of the Salaf."],["h","2. The meaning of innovation and its types"],["p","The method treats innovation from two angles:"],["ul",["<b>Innovation in creed:</b> the most dangerous kind, such as contradicting the foundations of monotheism, denying what is necessarily known of the religion, or putting desire and false interpretation before the text.","<b>Innovation in worship:</b> inventing a form, number or devotional commitment that has no basis, which becomes graver when it clashes with an emphasized Sunnah.","<b>Novelty in customs and means:</b> it is not misguidance merely because it is new; rather its aim and its conformity to the Sacred Law are examined. Schools, books and minarets are means to sound aims, not independent acts of worship."]],["p","Among the rules of this chapter:"],["ul",["If a matter wavers between being a Sunnah and an innovation, leaving it is safer, unless leaving it leads to abandoning an obligation.","Committing an innovation may be more harmful than leaving a Sunnah, because innovation makes its doer imagine he is upon the truth and it crowds out the Sunnah.","It is not correct to consider everything that did not occur in the first generation a legal innovation; rather one examines whether it is an intended act of worship or a permissible means.","Independent reasoning is an excuse in branch matters open to interpretation, but it is not an excuse in definitive foundations of creed or in contradicting an established text after knowing it."]],["h","3. Refuting the claims of esoteric Sufism"],["p","The method discusses those who say that the Sacred Law has an outward meaning for the common people and a special inward meaning, or that the people of unveiling can dispense with the Book and the Sunnah, or that they take rulings from the Prophet ﷺ in dreams, or who claim that miracles prove their path is sound."],["p","It refutes this principle by stating that:"],["ul",["Inspiration is not an independent source of legal rulings.","A dream does not make the forbidden lawful nor forbid the lawful.","A miracle is not a legitimate miracle if accompanied by contradiction of the Book and the Sunnah; it may be a gradual lure to ruin or an illusion.","The measure of a saint is keeping the limits, adhering to commands and prohibitions, knowledge and practice — not wonders and appearances.","Whoever claims that the inward permits him to contradict the outward has demolished the Sacred Law."]],["p","The method quotes great Sufi masters confirming this principle: al-Junayd says that all paths are blocked except for the one who follows the footsteps of the Messenger; al-Sari al-Saqati defines Sufism as the inward not breaking the outward, and miracles not leading one to violate what God has made sacred; and Abu Yazid makes keeping commands and prohibitions the criterion, not merely flying in the air or the appearance of wonders."],["h","4. Moderation in worship"],["p","The method gives the example of the three men: one wanted to pray all night always, the second to fast perpetually, and the third to abandon marriage. The Prophet ﷺ brought them back to his Sunnah: he fasts and breaks his fast, prays and sleeps, and marries."],["p","It explains that severe spiritual exercise may be a temporary treatment for a disease of the heart, or a habit suited to the nature of some righteous people, but it does not mean that another path is better than the guidance of the Prophet ﷺ. It must not lead to:"],["ul",["Abandoning obligations.","Neglecting the rights of family and body.","Cutting off lawful earning when it is needed.","Destroying oneself or withdrawing from the community.","Believing that hardship itself brings one closer to God than the Sunnah."]],["p","Earning may be obligatory to the extent of a person's sufficiency and that of those he must support, and recommended when it exceeds that in order to support a relative or help a poor person. The far-reaching benefit of earning may be better than a supererogatory act of worship that benefits only its doer."]]},{"t":"Chapter Two: The important matters in the Muhammadan Sacred Law","b":[["p","This chapter is the widest of the method, containing three major sections:"],["ol",["Correcting creed according to the way of Ahl al-Sunnah wa al-Jama'ah.","Sciences sought for the sake of something else.","God-consciousness (taqwa), its channels, and the ailments of the heart, tongue and limbs."]],["h","Section One: Correcting creed"],["h","A. Monotheism and the divine attributes"],["p","The method affirms that God Most High is transcendent above body, substance, accident, place, direction, limits, organs and time; that He is One and resembles nothing; eternal without beginning and without end; described with attributes of perfection."],["p","It presents questions of the attributes, divine speech and the beatific vision, quoting the positions of theologians and jurists, while taking into account the differences between scholarly schools in some matters of creed and quoting the sayings of the Salaf and the people of hadith."],["h","B. The Qur'an, the vision of God and divine decree"],["p","Among the matters of creed it presents:"],["ul",["The Qur'an is the uncreated speech of God.","The vision of God in the Hereafter is established according to Ahl al-Sunnah, without encompassing, modality or place.","The deeds of servants are created by God, and servants have choice and acquisition for which they deserve praise and blame; the method is the middle way between the Jabriyya (fatalists) and the Qadariyya (deniers of decree).","Capability is considered together with the act, and God does not burden a soul beyond its capacity.","Life-spans and provisions are decreed; the unlawful is \"provision\" in the sense that it occurs within God's decree, not in the sense of being permitted.","The punishment and bliss of the grave, the resurrection, the Scale, the Book of deeds, the Pond, the Bridge, intercession, Paradise and Hell are true.","The Ascension (Mi'raj) happened to the Prophet ﷺ while awake, in body.","The signs of the Hour mentioned in the Sunnah are true."]],["h","C. Faith and major sins"],["p","It presents the disagreement over the definition of faith: is it only assent and affirmation, or word and deed that increases with obedience and decreases with disobedience? It affirms that the disagreement in some theologians' formulations is partly verbal, while Ahl al-Sunnah agree that God wants word and deed from His servants, and that major sins do not take the monotheist out of Islam nor make him deserve eternity in Hell."],["p","It also presents the question of a Muslim saying \"I am a believer, God willing\", noting that if he intends doubt in the very basis of his faith, that is dangerous; but if he intends humility, fear of a bad ending, or refraining from self-praise, it has a basis according to scholars."],["p","It affirms that the faith of the imitator is valid according to a group of Ahl al-Sunnah, although abandoning reasoning while able to do it is a shortcoming or a sin according to some of them."],["h","D. Prophethood, saintly miracles and the Companions"],["ul",["The prophets are free from lying and betrayal; the best and last of them is Muhammad ﷺ.","The angels are honoured servants who do not disobey God.","The miracles of the prophets are true.","The miracles of saints are possible, but they do not raise the saint to the rank of a prophet nor exempt him from commands and prohibitions.","The best of the saints are the Companions, foremost Abu Bakr, then Umar, then Uthman, then Ali, then the rest of the Companions; one must speak of them only with good.","Loving and honouring the Companions is a fruit of love for the Prophet ﷺ, and insulting or belittling them is deviation."]],["h","E. Leadership (Imamate) and juristic questions linked to creed"],["p","The method mentions the Muslims' need for a leader able to implement rulings; his infallibility or being the best of his time is not a condition, and in its juristic position his removal is not required merely for sinfulness and injustice. It mentions the permissibility of praying behind the righteous and the sinful while still disapproving of sin."],["p","It also treats questions such as wiping over leather socks, jar-nabidh if not intoxicating, the deceased benefiting from acts of worship, supplication and charity on his behalf, magic and the evil eye, and whether the mujtahid hits the truth or errs; it affirms that the truth in reality is one, and that the excused mistaken one is rewarded for his effort."],["h","F. Sects and innovations"],["p","The method presents many sects and doctrines, including the Khawarij, the Murji'a, the Qadariyya, the Jabriyya, the Mu'tazila, the Rafida, the Kaysaniyya, the Yazidiyya, the Najjariyya and the Jahmiyya, and refutes what it sees as contrary to the foundations of Ahl al-Sunnah, especially:"],["ul",["Declaring Muslims unbelievers for major sins.","Denying divine decree or making the servant the creator of his own acts.","Denying the attributes or affirming what entails anthropomorphism.","Belief in reincarnation of souls or the indwelling of God in the imams.","Dropping prayer, fasting and zakat on the pretext of obeying a shaykh or a hidden imam.","Placing saints above prophets or preferring them to the Prophet ﷺ."]],["p","The method's summary for the seeker: attaining certainty in the creed of Ahl al-Sunnah, being wary of those who mislead and sow doubt, and not accepting claims that raise their makers above the texts or above the station of prophethood."]]},{"t":"Section Two: Sciences sought for the sake of something else","b":[["p","The method divides sciences into three types:"],["h","1. Sciences that are an individual obligation"],["p","These are what every accountable person needs for the soundness of his religion and state, such as:"],["ul",["The rulings of purification, prayer, fasting, zakat, and Hajj for whoever it is obligatory upon.","The necessary rulings of sale, hire, marriage, divorce and work.","Knowledge of the heart: reliance on God, awe, hope and turning back to Him.","Knowing arrogance, showing off, envy and miserliness, and what is needed to treat them."]],["p","Ignorance of what worship or transactions cannot be valid without is no excuse for one able to learn."],["h","2. Sciences that are a communal obligation"],["p","These are sciences for which it suffices that part of the community undertakes them, such as jurisprudence, exegesis, hadith, legal theory, the Arabic sciences, inheritance law, the arithmetic needed for judgeship and inheritance, as well as medicine and the beneficial sciences the community needs."],["h","3. Forbidden or blameworthy sciences"],["ul",["Delving into theology and dialectic without need or ability, especially if it produces doubts.","Astrology that claims knowledge of the unseen or the influence of the stars.","Magic, sorcery and charlatanry; learning about them is only exempted when the aim is to expose and repel evil.","Debate when it is for wrangling, showing off and defeating the opponent; it is permitted when needed with the intention of fairness and making the truth manifest."]],["p","As for the astronomy a Muslim needs to know prayer times and the qibla, it is permissible or beneficial as needed; going beyond that to claim knowledge of the unseen is forbidden."],["h","Medicine, means and reliance on God"],["p","The method divides means into:"],["ul",["<b>Certain:</b> like water for thirst and food for hunger; abandoning them when fearing death may be forbidden.","<b>Probable:</b> like medicine, cupping and bloodletting; taking them does not contradict reliance on God if the Muslim believes that God is the Healer.","<b>Imaginary:</b> like superstitious means or what has no evidence; abandoning attachment to them is what reliance on God requires."]],["p","Reliance on God does not mean abandoning every means; it means the heart does not believe that the means has an effect independent of God."]]},{"t":"Section Three: God-consciousness (Taqwa)","b":[["h","The meaning and merit of taqwa"],["p","Taqwa comes from \"protection\": the servant placing a protection between himself and God's anger and punishment by obeying Him and leaving disobedience. It has a general meaning — guarding oneself from all that harms one in the Hereafter — and a specific meaning — avoiding any word, deed or omission that deserves punishment."],["p","Taqwa is not completed merely by leaving some permissible things or by strictness in purification; rather it includes:"],["ul",["Sound creed.","Performing obligations and duties.","Leaving the forbidden and innovations.","Reforming the heart, the tongue and the limbs.","Fulfilling the rights of people and animals."]],["h","Foundations of reforming character"],["p","The method links character to three faculties:"],["ul",["<b>Reason and speech:</b> its balance is wisdom, its excess is cunning and trickery, and its deficiency is dullness.","<b>Anger:</b> its balance is courage, its excess is recklessness, and its deficiency is cowardice.","<b>Desire:</b> its balance is chastity, and its excess is greed and debauchery."]],["p","The way to treat a blameworthy trait:"],["ol",["Knowing the reality of the disease, its causes and its harms.","Self-accounting and searching for the signs of the disease.","Removing the cause that leads to it.","Practising the opposite trait until the virtue becomes a settled disposition.","Accepting advice from truthful people.","Remembering the texts of warning about the vice and the texts of praise for the virtue.","Striving against the self gradually, not with temporary bursts.","Keeping company with people of knowledge and righteousness and leaving corrupting company."]]]},{"t":"Ailments of the heart","b":[["p","The method includes <b>sixty ailments of the heart</b>, explaining for each its meaning, its harms and its cure. Below is the complete ordered list, keeping the headings from which treatment discussions or practical applications branch out:"],["h","First: Ailments of belief, intention and knowledge"],["dl",[["1. Disbelief in God","Its types include disbelief of ignorance, disbelief of denial and obstinacy, and disbelief by legal judgement; it is the greatest of destroyers."],["2. Ignorance","It includes simple ignorance, which is lack of knowledge, and compound ignorance, which is believing falsehood to be knowledge and truth."],["3. Love of leadership and worldly status","Seeking to own people's hearts and being attached to rank and fame, except what is intended to support the truth or reform people without showing off."],["4. Fear of blame and reproach","Leaving or concealing the truth for fear of people's talk and reproach."],["5. Love of praise and acclaim","Rejoicing in and seeking people's praise; its cure is remembering that what benefits is God's acceptance, not people's admiration."],["6. Holding innovated beliefs","Creating a belief or act of worship that has no basis, or putting customs and tastes before the Sunnah."],["7. Following desire","Making personal wishes judge over the text and the truth; its cure is striving against the self and following guidance."],["8. Blind imitation in creed","Accepting a belief without evidence while able to reflect — distinguishing this from a non-mujtahid following a scholar in practical rulings."],["9. Showing off (riya')","Acting to be seen and praised by people; it includes open and hidden showing off, and its opposite is sincerity."],["10. Hope and long hope","Delaying repentance and deeds relying on a long life; its cure is remembering death and shortening hope."],["11. Greed","Attachment of the heart to what is in people's hands or to what it does not own; its opposite is contentment and reliance on God."],["12. Arrogance","Seeing oneself above the truth or above people; part of its cure is accepting the truth, humility, and knowing man's origin and end."],["13. Flattery and fawning","Affectation in seeking people's approval and praise and ingratiating oneself with them, in a way that corrupts truthfulness and dignity."],["14. Self-admiration ('ujb)","A person admiring himself, his deeds or his knowledge and forgetting God's favour upon him."]]],["h","Second: Ailments of envy, anger and enmity"],["dl",[["15. Envy","Wishing for another's blessing to cease; its cure is remembering that blessings are God's apportionment, wishing good for the envied, and acting contrary to what envy calls for."],["16. Rancour","Enmity remaining in the heart awaiting a chance for revenge; its cure is pardon and removing the causes of anger."],["17. Gloating","Rejoicing at a Muslim's misfortune; its cure is mercy and remembering how conditions change."],["18. Shunning and enmity","Cutting ties and harbouring hatred without right; its opposite is reconciliation, forgiveness and keeping family ties."],["19. Cowardice","Weakness of the heart in upholding the truth or repelling what must be repelled; its opposite is courage governed by wisdom."],["20. Recklessness","Rushing in without verification or weighing consequences; its opposite is verification and disciplined boldness."],["21. Treachery","Breaking a covenant or pledge without notice or legal reason; its opposite is keeping and fulfilling covenants."],["22. Betrayal of trust","Failing in trust in speech, money, counsel or work; its opposite is trustworthiness."],["23. Breaking promises","Promising with the intention of not fulfilling, or not fulfilling without excuse; its opposite is keeping promises and fulfilling pledges."],["24. Thinking ill of God and of believers on mere illusion or doubt","It is forbidden when it leads to accusing a Muslim or speaking about him; caution built on reliable indications is not forbidden suspicion."],["25. Superstitious pessimism (tiyara)","Seeing bad omens in people, days, sounds and events; its opposite is good optimism that involves no claim to the unseen nor a judgement on the future."]]],["h","Third: Ailments of wealth, the world and work"],["dl",[["26. Miserliness and stinginess","Withholding wealth where it must be spent by the Sacred Law or by decency; among its worst forms is depriving oneself of food, clothing and treatment when needed."],["27. Extravagance and wastefulness","Spending wealth where it should be withheld, or exceeding moderation in food, clothing, charity and other expenses."],["28. Love of wealth","Attachment of the heart to wealth for its own sake or making it a goal, whereas wealth is a means for fulfilling rights and lawful spending."],["29. Love of the world","Preferring this world to the Hereafter, being immersed in its enjoyments and forgetting one's destiny."],["30. Blameworthy covetousness","Intense attachment to wealth, status and benefits, such that it produces injustice, abandonment of worship or self-abasement."],["31. Foolishness","Lightness of mind, poor conduct, and failing to put wealth, speech or action in their proper place."],["32. Laziness and idleness","Leaving beneficial work and duties while able, inclining to rest and wasting one's energies."],["33. Haste","Acting before verifying, and issuing judgement or action before full consideration."],["34. Delay and procrastination","Postponing repentance, duty and beneficial work until its time passes."],["35. Harshness and hardness of heart","Rough dealing, little mercy and inability to bear with people; its opposite is forbearance, gentleness and kindness."]]],["p","The middle way in wealth is generosity without waste, thrift without miserliness, lawful earning without immersion, and charity without neglecting the rights of oneself, one's family and one's religion. Extravagance is treated through knowledge — knowing its harms; through practice — controlling expenses; and by uprooting — removing its causes such as showing off, foolishness and bad company."],["h","Fourth: Ailments of resolve, contentment and relationships"],["dl",[["36. Impudence and loss of modesty","Boldness in what is ugly, not finding sin repugnant, and not apologizing for mistakes."],["37. Impatience and complaining","Objecting in heart and tongue to affliction in a way that contradicts patience — while complaining to God and seeking His help is permitted."],["38. Ingratitude for blessings","Forgetting the Giver, attributing the blessing to oneself or to people alone, and not using it in what pleases God."],["39. Discontent at not obtaining what one wants","Resentment and agitation when what the self desires is missed; its opposite is contentment with God's decree while taking lawful means."],["40. Attachment to other than God","The heart relying on a creature, a means or an illusion, forgetting that benefit and harm are in God's hand; what is required is taking means with reliance on God."],["41. Loving the corrupt and leaning towards oppressors","Loving them, compromising with them or relying on them in injustice and falsehood — distinguishing between disapproving of their deeds and being just with them."],["42. Hatred of scholars and the righteous","Disliking people of knowledge and uprightness out of envy, partisanship or because they oppose one's desires."],["43. Audacity towards God and feeling safe from His punishment and anger","Persisting in sin while feeling safe from punishment."],["44. Despair of God's mercy","Believing that a sin will not be forgiven or that repentance is of no use; its opposite is combining fear and hope."],["45. Grief over worldly matters","Grief overwhelming the heart over a missed passing enjoyment until it becomes too weak for religion and duty."],["46. Fear in worldly matters","Excessive fear of poverty, people or the future, in a way that prevents the truth or leads into the forbidden."],["47. Deceit and malice","Not giving sincere advice, hiding defects or misleading others; it includes cheating, deception and scheming — while deception in war or in repelling deserved injustice has a different ruling."],["48. Sedition (fitna)","Throwing people into turmoil, dispute and fighting, or twisting words from their meaning and inciting people to aggression, rebellion and calamity."],["49. Compromising the truth (mudahana)","Not disapproving of falsehood, or embellishing it, to please people or out of fear for one's status — unlike permissible tact (mudarah), which preserves the truth and does not justify falsehood."],["50. Excessive intimacy with people and loneliness at parting from them","The heart's attachment to people until its attachment to God weakens; its opposite is righteous company with the heart independent through God."],["51. Rashness and frivolity","Lack of composure, quick agitation and acting without wisdom."],["52. Obstinacy, arrogance against the truth and denying it after knowing it","Rejecting the truth not because it is hidden, but because it opposes desire or to protect one's standing."],["53. Rebellion and refusal","Refusing to submit to the truth and to lawful command out of arrogance or love of independence."],["54. Haughtiness","Self-aggrandizement, arrogance, displaying superiority and despising people."],["55. Hypocrisy","Showing good and hiding evil, or a difference between the outward and the inward; it includes hypocrisy of belief and hypocrisy of action."],["56. Coarseness and cruelty","Little mercy and not being moved by admonition or by people's pain; its opposite is gentleness and mercy."],["57. Dullness and stupidity","Weak understanding, little perceptiveness, or disabling the mind from learning and reflection."],["58. Gluttony for food and intercourse","Exceeding the limit of need and submitting to desire until worship, chastity and health weaken."],["59. Lethargy","Weak resolve, slackness in good, and failing to hasten to acts of obedience and to what is beneficial."],["60. Persisting in sins and idle amusements","Repeating sin without repentance, and continuing in amusement and what diverts from duties and weakens the heart."]]],["h","The comprehensive rule for treating the ailments of the heart"],["p","Every disease is treated by knowing its reality and harms, then cutting off its causes, and practising the opposite trait until it becomes a settled disposition: arrogance is treated with humility, miserliness with generosity, cowardice with courage, anger with forbearance, envy with sincere goodwill and love, showing off with sincerity, long hope with remembrance of death, despair with thinking well of God, and gluttony with chastity and moderation. The method then mentions the foundations of the virtues, such as wisdom, courage, chastity and justice, and shows that virtues are settled dispositions that appear in dealings, spending, patience, truthfulness and fulfilling rights."]]},{"t":"Ailments of the tongue","b":[["p","The method makes the tongue one of the most dangerous gates of taqwa, because a word may demolish a creed, wrong a person, spoil a relationship or start a sedition. Among the ailments of the tongue it details:"],["ul",["Words of disbelief and what comes close to them.","Error, lying and fabricating against God and His Messenger.","Promising with the intention of breaking it, and relating everything one hears.","Corrupting insinuation.","Backbiting, tale-bearing, defamation, reproach, mockery, insult, obscenity and cursing.","Wailing over the dead, divulging secrets and indulging in falsehood.","Quarrelling, disputation, wrangling and affectation in speech.","Asking common people about subtleties that confuse or trouble them.","Seeking wealth and status with humiliating speech.","Verbal hypocrisy and two-faced speech.","Evil intercession, enjoining wrong and forbidding right.","Harsh speech and violating people's honour.","Asking about people's faults and searching them out.","Talking during the adhan and iqama, in prayer, during the sermon, in the toilet, during intercourse, during Qur'an recitation, and in mosques without need.","Supplicating against a Muslim or supplicating for an oppressor.","Interrupting others, and a follower answering back his superior without right.","Two conversing privately in the presence of a third if it saddens him.","Speaking with a non-mahram woman without need.","Guiding to the way of sin or permitting it."]],["p","In contrast, it mentions the ailments of silence: not giving the greeting of peace, not returning it, not responding to one who sneezes, not giving advice, not rescuing the wronged or the one calling for help when able, and not forbidding wrong when its conditions are met. Silence is not an absolute virtue; the virtue is to speak where speech is required and be silent where silence is required."],["p","Among speech that is permissible or recommended under conditions: jesting free of lying and frightening, praise free of exaggeration and showing off, poetry free of the forbidden, rhymed prose and eloquence when not affected, and speech about the interests of religion and the world."]]},{"t":"Ailments of hearing, sight, hand, stomach, private parts, foot and body","b":[["h","Ailments of the ear"],["ul",["Listening to backbiting, tale-bearing, lies and falsehood.","Listening to singing, amusements and melodies that the method censures.","Listening to speech that arouses desire or sedition.","Listening to the Qur'an or dhikr in a way that alters its meaning or makes it amusement and dancing.","Neglecting obligatory listening to knowledge, admonition and advice."]],["p","The method warns against Sufi dancing accompanied by shouting, singing and confusion, and affirms that dhikr standing and sitting is permissible when done with courtesy and calm, without melody that alters the words and without amusement."],["h","Ailments of the eye"],["ul",["Looking at the private parts ('awrah).","Looking with desire at a non-mahram woman.","Looking at what arouses temptation or aids sin.","Looking into people's homes or secrets."]],["p","It mentions exceptions for need, such as bearing and giving testimony, a judge's ruling, a midwife at birth, verifying a defect, circumcision, medical treatment, and intending marriage or purchase; the criterion is the extent of need without exceeding it."],["h","Ailments of the hand"],["ul",["Killing, wounding and striking without right.","Usurpation, theft and bribery.","Taking usurped wealth or destroying another's property.","Helping an oppressor, or refraining from correcting wrong when able.","Image-making that the method considers included in the prohibition.","Tampering with what harms a person or an animal.","Using the hand to harm or transgress against people."]],["h","Ailments of the stomach and etiquette of eating and drinking"],
