name: تذكيرات المرشد
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-save firebase-admin@12
      - run: node scripts/remind.mjs
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
