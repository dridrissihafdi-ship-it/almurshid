# Copies the app to the hosting over SFTP after every upload to GitHub.
# Needs repository secrets: SFTP_HOST, SFTP_USER, SFTP_PASS, SFTP_DIR (and optionally SFTP_PORT).
name: deploy-sftp
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: deploy-sftp
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.SFTP_HOST }}
      USER: ${{ secrets.SFTP_USER }}
      LFTP_PASSWORD: ${{ secrets.SFTP_PASS }}
      DIR:  ${{ secrets.SFTP_DIR }}
      PORT: ${{ secrets.SFTP_PORT }}
    steps:
      - uses: actions/checkout@v4
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Check secrets
        run: |
          # tidy values pasted with spaces or line breaks
          trim(){ printf '%s' "$1" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          HOST=$(trim "$HOST"); USER=$(trim "$USER"); DIR=$(trim "$DIR")
          PORT=$(printf '%s' "$PORT" | sed 'y/٠١٢٣٤٥٦٧٨٩۰۱۲۳۴۵۶۷۸۹/01234567890123456789/' | tr -cd '0-9'); [ -n "$PORT" ] || PORT=22
          PW=$(printf '%s' "$LFTP_PASSWORD" | tr -d '\r\n'); echo "::add-mask::$PW"
          { echo "HOST=$HOST"; echo "USER=$USER"; echo "DIR=$DIR"; echo "PORT=$PORT"; echo "LFTP_PASSWORD=$PW"; } >> "$GITHUB_ENV"
          echo "password length: ${#PW}"
          for v in HOST USER LFTP_PASSWORD DIR; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret for $v"; exit 1; fi
          done
          echo "port digits: ${#PORT}, dir starts with: ${DIR:0:1}"
      - name: Test connection
        run: |
          cat > /tmp/test.lftp <<LFTP
          set sftp:auto-confirm yes
          open --env-password -u "$USER" -p "${PORT:-22}" "sftp://$HOST"
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 20
          set net:reconnect-interval-base 5
          pwd
          cd "$DIR"
          cls -1
          bye
          LFTP
          lftp -f /tmp/test.lftp
      - name: Upload over SFTP
        run: |
          # index.html and sw.js are uploaded last, under a temporary name, then renamed:
          # the site never serves a half-uploaded page (that left the app on a blank screen while the upload ran)
          cat > /tmp/up.lftp <<LFTP
          set sftp:auto-confirm yes
          open --env-password -u "$USER" -p "${PORT:-22}" "sftp://$HOST"
          set cmd:fail-exit yes
          set net:max-retries 4
          set net:timeout 60
          set net:reconnect-interval-base 5
          cd "$DIR"
          mirror -R --ignore-time --parallel=3 --verbose=1 --exclude-glob .git/ --exclude-glob .github/ --exclude-glob scripts/ --exclude-glob node_modules/ --exclude-glob *.md --exclude-glob *.zip --exclude "^index\.html$" --exclude "^sw\.js$" ./ ./
          put index.html -o index.html.new
          put sw.js -o sw.js.new
          set cmd:fail-exit no
          rm -f index.html.old sw.js.old
          mv index.html index.html.old
          mv index.html.new index.html
          mv sw.js sw.js.old
          mv sw.js.new sw.js
          rm -f index.html.old sw.js.old
          set cmd:fail-exit yes
          cls -l index.html sw.js
          bye
          LFTP
          lftp -f /tmp/up.lftp
